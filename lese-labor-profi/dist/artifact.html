id":"rs-rede-01","typ":"zuordnen","stufe":1,"kompetenz":"zeichen","frage":"Welches Satzzeichen fehlt am Ende? Ordne jeden Satz zu.","gruppen":["Punkt","Fragezeichen","Ausrufezeichen"],"elemente":[{"t":"Wie heißt dein Hund","g":1},{"t":"Wann fährt der Bus ab","g":1},{"t":"Hast du deine Brotzeit dabei","g":1},{"t":"Mein Bruder ist acht Jahre alt","g":0},{"t":"Der Bus fährt um halb acht ab","g":0},{"t":"Unsere Schule hat einen großen Pausenhof","g":0},{"t":"Au, das tut weh","g":2},{"t":"Hurra, wir haben gewonnen","g":2}],"tipp":"Lies jeden Satz laut. Fragst du etwas, erzählst du ruhig etwas oder rufst du etwas aus?","erklaerung":"Fragesätze beginnen oft mit einem Fragewort oder dem Verb und bekommen ein Fragezeichen. Aussagesätze bekommen einen Punkt, Ausrufe wie „Au“ oder „Hurra“ ein Ausrufezeichen."},{"id":"rs-rede-02","typ":"markieren","stufe":1,"kompetenz":"zeichen","frage":"Tippe alle Wörter des Begleitsatzes an.","teile":[{"t":"Oma","ziel":true},{"t":"fragt","ziel":true},{"t":":","fix":true},{"t":"„","fix":true},{"t":"Wer"},{"t":"möchte"},{"t":"noch"},{"t":"ein"},{"t":"Stück"},{"t":"Kuchen"},{"t":"?","fix":true},{"t":"“","fix":true}],"tipp":"Der Begleitsatz steht nicht in den Anführungszeichen. Er verrät, wer spricht.","erklaerung":"„Oma fragt“ ist der Begleitsatz, denn er sagt, wer spricht. Weil er vorn steht, folgt ein Doppelpunkt."},{"id":"rs-rede-03","typ":"single","stufe":1,"kompetenz":"zeichen","frage":"Welcher Satz ist richtig geschrieben?","optionen":[{"text":"Lena sagt: „Ich komme gleich.“","richtig":true},{"text":"Lena sagt, „Ich komme gleich.“","richtig":false},{"text":"Lena sagt: „Ich komme gleich“.","richtig":false},{"text":"Lena sagt: “Ich komme gleich.„","richtig":false}],"tipp":"Achte auf drei Dinge: das Zeichen nach dem Begleitsatz, die Form der Anführungszeichen und die Stelle des Punktes.","erklaerung":"Steht der Begleitsatz vorn, folgt ein Doppelpunkt. Die Anführungszeichen stehen am Anfang unten („) und am Ende oben (“). Der Punkt steht innerhalb der Anführungszeichen."},{"id":"rs-rede-04","typ":"luecke","stufe":2,"kompetenz":"zeichen","frage":"Wähle die richtigen Satzzeichen aus.","teile":[{"t":"„Heute fahren wir ins Freibad"},{"wahl":["“,",".“,","“."],"loesung":0},{"t":" sagt Papa. Mia fragt"},{"wahl":[":",",","."],"loesung":0},{"t":" „Darf Aylin auch mitkommen"},{"wahl":["?“","“?","?“."],"loesung":0}],"tipp":"Wo steht der Begleitsatz – vor oder nach der wörtlichen Rede? Denk daran, was mit dem Punkt passiert und dass Fragezeichen stehen bleiben.","erklaerung":"Begleitsatz hinten: erst das Anführungszeichen, dann ein Komma, kein Punkt. Begleitsatz vorn: Doppelpunkt. Das Fragezeichen steht vor dem schließenden Anführungszeichen, danach kommt kein Punkt mehr."},{"id":"rs-rede-05","typ":"multi","stufe":2,"kompetenz":"zeichen","frage":"Welche Sätze sind richtig geschrieben?","optionen":[{"text":"„Ich habe Durst“, sagt Ben.","richtig":true},{"text":"„Hast du Durst?“, fragt Oma.","richtig":true},{"text":"„Trink etwas!“, ruft Papa.","richtig":true},{"text":"„Ich habe Durst.“, sagt Ben.","richtig":false},{"text":"„Hast du Durst“? fragt Oma.","richtig":false},{"text":"„Ich habe Durst“ sagt Ben.","richtig":false}],"tipp":"In allen Sätzen steht der Begleitsatz hinten. Prüfe Schritt für Schritt: das Zeichen in der Rede, das schließende Anführungszeichen und das Komma.","erklaerung":"Steht der Begleitsatz hinten, folgt nach dem Anführungszeichen immer ein Komma. Ein Punkt in der Rede fällt weg, Frage- und Ausrufezeichen bleiben in den Anführungszeichen."},{"id":"rs-rede-06","typ":"eingabe","stufe":2,"kompetenz":"zeichen","frage":"Hier fehlt ein Satzzeichen. Schreibe seinen Namen auf.","vorgabe":"Paul flüstert ___ „Das Baby schläft.“","loesungen":["Doppelpunkt","der Doppelpunkt","ein Doppelpunkt",":"],"tipp":"Der Begleitsatz steht vor der wörtlichen Rede. Welches Zeichen kündigt an, dass gleich jemand spricht?","erklaerung":"Steht der Begleitsatz vorn, folgt ein <b>Doppelpunkt<\/b>: Paul flüstert: „Das Baby schläft.“"},{"id":"rs-rede-07","typ":"luecke","stufe":3,"kompetenz":"zeichen","frage":"Wähle die richtigen Satzzeichen aus.","teile":[{"t":"„Wann beginnt der Film"},{"wahl":["?“,","?“","“?,"],"loesung":0},{"t":" fragt Felix. „Um halb vier"},{"wahl":["“,",".“,","“."],"loesung":0},{"t":" antwortet Amira. „Beeil dich"},{"wahl":["!“,","!“","“!,"],"loesung":0},{"t":" ruft sie."}],"tipp":"In allen drei Sätzen steht der Begleitsatz hinten. Überlege bei jeder Lücke: Bleibt das Zeichen der Rede stehen oder fällt es weg? Und was folgt nach dem Anführungszeichen?","erklaerung":"Frage- und Ausrufezeichen bleiben in den Anführungszeichen, der Punkt fällt weg. Danach folgt immer ein Komma: <b>Film?“, fragt<\/b> – <b>vier“, antwortet<\/b> – <b>dich!“, ruft<\/b>."},{"id":"rs-rede-08","typ":"markieren","stufe":3,"kompetenz":"zeichen","frage":"Leyla und Ben haben ihr Gespräch aufgeschrieben. Zwei Satzzeichen sind falsch. Tippe sie an.","teile":[{"t":"„"},{"t":"Ich habe meinen Schlüssel verloren","fix":true},{"t":".","ziel":true},{"t":"“"},{"t":","},{"t":"sagt Leyla","fix":true},{"t":"."},{"t":"Ben fragt","fix":true},{"t":",","ziel":true},{"t":"„"},{"t":"Wo hast du ihn zuletzt gesehen","fix":true},{"t":"?"},{"t":"“"}],"tipp":"Prüfe die beiden Sätze einzeln: Steht der Begleitsatz vorn oder hinten? Welche Zeichen gehören dann an welche Stelle?","erklaerung":"Im ersten Satz steht der Begleitsatz hinten, deshalb fällt der Punkt in der Rede weg. Im zweiten Satz steht er vorn, deshalb gehört nach „Ben fragt“ ein Doppelpunkt statt eines Kommas."}]}],"diktate":[{"id":"dk-merk","titel":"Merkwörter-Diktat","woerter":[{"wort":"Vogel","satz":"Der Vogel baut ein Nest."},{"wort":"vier","satz":"Unsere Katze hat vier Pfoten."},{"wort":"verlieren","satz":"Ich will das Spiel nicht verlieren."},{"wort":"Zahl","satz":"Schreibe die Zahl an die Tafel."},{"wort":"Uhr","satz":"Meine Uhr tickt ganz leise."},{"wort":"Boot","satz":"Wir fahren mit dem Boot über den See."},{"wort":"Meer","satz":"Im Urlaub baden wir im Meer."},{"wort":"Zoo","satz":"Am Sonntag gehen wir in den Zoo."},{"wort":"Biene","satz":"Die Biene fliegt von Blüte zu Blüte."},{"wort":"Tiger","satz":"Der Tiger hat schwarze Streifen."}]},{"id":"dk-doppel","titel":"Diktat: Doppelte Mitlaute, ck und tz","woerter":[{"wort":"Sonne","satz":"Die Sonne scheint hell."},{"wort":"Ball","satz":"Der Ball fliegt ins Tor."},{"wort":"kommen","satz":"Morgen kommen meine Großeltern."},{"wort":"schnell","satz":"Mein Hund rennt sehr schnell."},{"wort":"Brücke","satz":"Wir gehen über die Brücke."},{"wort":"Zucker","satz":"Opa nimmt Zucker in den Tee."},{"wort":"Glück","satz":"Ich wünsche dir viel Glück."},{"wort":"Katze","satz":"Die Katze schläft auf dem Sofa."},{"wort":"Platz","satz":"Ist dieser Platz noch frei?"},{"wort":"sitzen","satz":"Wir sitzen alle am Tisch."}]},{"id":"dk-s","titel":"Diktat: s, ss oder ß","woerter":[{"wort":"Straße","satz":"Wir gehen am Zebrastreifen über die Straße."},{"wort":"Fuß","satz":"Ich gehe zu Fuß zur Schule."},{"wort":"groß","satz":"Der Elefant ist sehr groß."},{"wort":"draußen","satz":"Heute spielen wir draußen."},{"wort":"heißen","satz":"Wie heißen deine Freunde?"},{"wort":"Wasser","satz":"Bitte gib mir ein Glas Wasser."},{"wort":"Fluss","satz":"Im Fluss schwimmen Fische."},{"wort":"essen","satz":"Mittags essen wir Nudeln."},{"wort":"Hose","satz":"Meine Hose hat ein Loch."},{"wort":"Gras","satz":"Die Kühe fressen Gras."}]},{"id":"dk-mix","titel":"Profi-Diktat: alles gemischt","woerter":[{"wort":"vielleicht","satz":"Morgen regnet es vielleicht."},{"wort":"Fahrrad","satz":"Ich fahre mit dem Fahrrad zur Schule."},{"wort":"Spiegel","satz":"Im Spiegel sehe ich mich."},{"wort":"Schnee","satz":"Im Winter fällt viel Schnee."},{"wort":"Wolke","satz":"Am Himmel zieht eine dunkle Wolke vorbei."},{"wort":"plötzlich","satz":"Da klingelt plötzlich das Telefon."},{"wort":"Kerze","satz":"Auf dem Kuchen brennt eine Kerze."},{"wort":"Schlüssel","satz":"Ich habe meinen Schlüssel vergessen."},{"wort":"fleißig","satz":"Die Bienen arbeiten fleißig."},{"wort":"Familie","satz":"Meine Familie fährt in den Urlaub."}]}]},"grammatik":{"themen":[{"id":"gr-nomen","titel":"Nomen, Artikel und Pronomen","kurz":"Namenwörter erkennen, Begleiter wählen, Fürwörter einsetzen","kompetenz":"wortarten","wissen":{"merksatz":"<b>Nomen<\/b> (Namenwörter) sind Wörter für Menschen, Tiere, Pflanzen und Dinge – aber auch für Gefühle und Gedanken wie <i>Angst<\/i>, <i>Traum<\/i> oder <i>Hoffnung<\/i>. Nomen schreibt man immer groß. Vor dem Nomen steht oft ein <b>Artikel<\/b> (Begleiter). Ein <b>Personalpronomen<\/b> (persönliches Fürwort) kann ein Nomen ersetzen.","punkte":["Nomen-Probe: Passt <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> davor? Dann ist es ein Nomen: <i>die Angst, der Traum, die Hoffnung<\/i>.","Jedes Nomen hat ein Geschlecht: männlich (<i>der<\/i> Tisch), weiblich (<i>die<\/i> Lampe) oder sächlich (<i>das<\/i> Bett).","Bestimmte Artikel sind <i>der, die, das<\/i>. Unbestimmte Artikel sind <i>ein, eine<\/i>.","Die meisten Nomen haben eine Einzahl und eine Mehrzahl: <i>das Buch – die Bücher<\/i>. In der Mehrzahl heißt der bestimmte Artikel bei <i>Wer oder was?<\/i> immer <i>die<\/i>: <i>die Bücher, die Bäume<\/i>.","Personalpronomen sind <i>ich, du, er, sie, es, wir, ihr, sie<\/i>. Sie ersetzen Nomen, damit sich Wörter nicht dauernd wiederholen: <i>Der Hund bellt. Er hat Hunger.<\/i>"],"beispiele":["die Angst, der Traum, die Hoffnung","das Buch – die Bücher","ein Igel – der Igel","Lena und Tom → sie","Das Fahrrad ist neu. → Es ist neu."]},"items":[{"id":"gr-nomen-01","typ":"markieren","stufe":1,"kompetenz":"wortarten","frage":"Tippe alle Nomen an.","teile":[{"t":"Im"},{"t":"Herbst","ziel":true},{"t":"sammelt"},{"t":"der"},{"t":"Igel","ziel":true},{"t":"trockene"},{"t":"Blätter","ziel":true},{"t":"für"},{"t":"sein"},{"t":"Nest","ziel":true},{"t":".","fix":true}],"tipp":"Das erste Wort im Satz schreibt man immer groß. Prüfe deshalb bei jedem Wort, ob du <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> davorsetzen kannst.","erklaerung":"<i>Herbst<\/i>, <i>Igel<\/i>, <i>Blätter<\/i> und <i>Nest<\/i> sind Nomen: der Herbst, der Igel, die Blätter, das Nest. <i>Im<\/i> ist nur groß, weil es am Satzanfang steht."},{"id":"gr-nomen-02","typ":"zuordnen","stufe":1,"kompetenz":"wortarten","frage":"Welcher Artikel passt? Ordne jedes Nomen zu.","gruppen":["der","die","das"],"elemente":[{"t":"Löffel","g":0},{"t":"Gabel","g":1},{"t":"Messer","g":2},{"t":"Mut","g":0},{"t":"Freude","g":1},{"t":"Glück","g":2},{"t":"Mädchen","g":2}],"tipp":"Sprich jedes Nomen leise mit <i>der<\/i>, <i>die<\/i> und <i>das<\/i>. Was klingt richtig?","erklaerung":"Es heißt: der Löffel, der Mut – die Gabel, die Freude – das Messer, das Glück, das Mädchen. Auch Gefühle wie Mut und Freude haben einen Artikel."},{"id":"gr-nomen-03","typ":"luecke","stufe":1,"kompetenz":"wortarten","frage":"Wähle den passenden Artikel.","teile":[{"t":"Im Tierpark sieht Ben "},{"wahl":["ein","eine","einen"],"loesung":0},{"t":" Zebra. "},{"wahl":["Der","Die","Das"],"loesung":2},{"t":" Zebra frisst Heu. Daneben steht "},{"wahl":["ein","eine","einen"],"loesung":1},{"t":" Giraffe."}],"tipp":"Überlege zuerst: Heißt es <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> Zebra? Und wie ist es bei der Giraffe?","erklaerung":"Es heißt <i>das Zebra<\/i>, also <i>ein Zebra<\/i>, und <i>die Giraffe<\/i>, also <i>eine Giraffe<\/i>. <i>Das<\/i> ist ein bestimmter Artikel, <i>ein<\/i> und <i>eine<\/i> sind unbestimmte Artikel."},{"id":"gr-nomen-04","typ":"markieren","stufe":2,"kompetenz":"wortarten","frage":"Tippe nur die Nomen an, die etwas bezeichnen, das man <b>nicht<\/b> anfassen kann.","teile":[{"t":"Voller"},{"t":"Stolz","ziel":true},{"t":"und"},{"t":"mit"},{"t":"viel"},{"t":"Mut","ziel":true},{"t":"springt"},{"t":"Hannah"},{"t":"vom"},{"t":"Dreimeterbrett"},{"t":"ins"},{"t":"Becken"},{"t":".","fix":true}],"tipp":"Suche zuerst alle Nomen. Frage dann bei jedem: Kann ich das mit meinen Händen berühren?","erklaerung":"<i>Stolz<\/i> und <i>Mut<\/i> sind Gefühle. Man kann sie nicht anfassen, trotzdem sind es Nomen: der Stolz, der Mut. <i>Hannah<\/i>, <i>Dreimeterbrett<\/i> und <i>Becken<\/i> sind Nomen für eine Person und für Dinge, die man anfassen kann."},{"id":"gr-nomen-05","typ":"matrix","stufe":2,"kompetenz":"wortarten","frage":"Lies jede Aussage. Ist sie richtig oder falsch?","aussagen":[{"text":"Die Mehrzahl von <i>die Maus<\/i> heißt <i>die Mäuse<\/i>.","richtig":true},{"text":"<i>Ein<\/i> und <i>eine<\/i> sind bestimmte Artikel.","richtig":false},{"text":"Beim Wort <i>der Koffer<\/i> sieht das Nomen in der Mehrzahl genauso aus wie in der Einzahl: <i>die Koffer<\/i>.","richtig":true},{"text":"Weil es <i>der Baum<\/i> heißt, sagt man in der Mehrzahl: <i>Im Wald stehen der Bäume.<\/i>","richtig":false}],"tipp":"Bilde die Mehrzahl laut: <i>eine Maus – zwei …<\/i>, <i>ein Koffer – zwei …<\/i>. Setze dann <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> vor die Mehrzahl und hör genau hin.","erklaerung":"Richtig: die Maus – die Mäuse, der Koffer – die Koffer. Falsch: <i>ein<\/i> und <i>eine<\/i> sind unbestimmte Artikel. In der Mehrzahl heißt der bestimmte Artikel bei <i>Wer oder was?<\/i> immer <i>die<\/i>: <i>Im Wald stehen die Bäume.<\/i>"},{"id":"gr-nomen-06","typ":"luecke","stufe":2,"kompetenz":"wortarten","frage":"Welches Personalpronomen ersetzt das Nomen richtig?","teile":[{"t":"Paul und Mia bauen ein Floß. "},{"wahl":["Sie","Er","Es"],"loesung":0},{"t":" sammeln dafür dicke Äste. Nach zwei Stunden ist das Floß fertig, aber "},{"wahl":["es","er","sie"],"loesung":0},{"t":" wackelt noch ein bisschen. Mia findet einen langen Stock. "},{"wahl":["Er","Sie","Es"],"loesung":0},{"t":" ist genau richtig für den Mast."}],"tipp":"Frage dich bei jeder Lücke: Wer oder was ist gemeint? Ist es eine Person oder sind es mehrere? Heißt das Nomen <i>der<\/i>, <i>die<\/i> oder <i>das<\/i>?","erklaerung":"<i>Paul und Mia<\/i> sind zwei Personen, also <i>sie<\/i>. <i>Das Floß<\/i> wird zu <i>es<\/i>, <i>der Stock<\/i> wird zu <i>er<\/i>. Das Pronomen passt zum Geschlecht des Nomens: der → er, die → sie, das → es."},{"id":"gr-nomen-07","typ":"multi","stufe":3,"kompetenz":"wortarten","frage":"Hier stehen alle Wörter in Großbuchstaben. So verrät dir die Schreibung nicht, welche Wörter Nomen sind. Welche Wörter sind Nomen?","optionen":[{"text":"FREUDE","richtig":true},{"text":"FRÖHLICH","richtig":false},{"text":"MUT","richtig":true},{"text":"MUTIG","richtig":false},{"text":"IDEE","richtig":true},{"text":"WÜTEND","richtig":false}],"tipp":"Mach die Nomen-Probe: Kannst du <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> davorsetzen? Probiere auch, ob das Wort in den Satz <i>Ich bin sehr …<\/i> passt.","erklaerung":"Nomen sind <i>die Freude<\/i>, <i>der Mut<\/i> und <i>die Idee<\/i>. Man kann sie nicht anfassen, aber sie haben einen Artikel. <i>Fröhlich<\/i>, <i>mutig<\/i> und <i>wütend<\/i> sind Adjektive: Sie sagen, wie jemand ist."},{"id":"gr-nomen-08","typ":"eingabe","stufe":3,"kompetenz":"wortarten","frage":"Ersetze die fett gedruckten Wörter durch ein Personalpronomen. Tippe nur das Pronomen ein.","vorgabe":"Heute haben <b>Emir und ich<\/b> ein Fußballturnier. → Heute haben ___ ein Fußballturnier.","loesungen":["wir"],"tipp":"Zähle: Wie viele Personen sind gemeint? Und gehört die Person, die spricht, selbst dazu?","erklaerung":"<i>Emir und ich<\/i> sind zwei Personen, und wer spricht, gehört selbst dazu. Dafür steht das Personalpronomen <i>wir<\/i>."}]},{"id":"gr-verben","titel":"Verben","kurz":"Grundform, Personalform, Wortstamm und Personalendungen","kompetenz":"wortarten","wissen":{"merksatz":"<b>Verben<\/b> (Tunwörter) sagen, was jemand tut oder was geschieht: <i>lachen, rennen, regnen<\/i>. Im Wörterbuch steht die <b>Grundform<\/b> (Infinitiv): <i>spielen<\/i>. Im Satz steht die <b>Personalform<\/b>, die zur Person passt: <i>du spielst<\/i>.","punkte":["Ein Verb besteht aus dem <b>Wortstamm<\/b> und der <b>Endung<\/b>: <i>spiel-en, spiel-st, spiel-t<\/i>. Der Wortstamm bleibt meistens gleich, die Endung wechselt. Manchmal heißt die Endung der Grundform nur <i>-n<\/i>: <i>kletter-n – du kletter-st<\/i>.","Personalendungen: ich spiel<b>e<\/b>, du spiel<b>st<\/b>, er/sie/es spiel<b>t<\/b>, wir spiel<b>en<\/b>, ihr spiel<b>t<\/b>, sie spiel<b>en<\/b>.","Bei manchen Verben ändert sich bei <i>du<\/i> und <i>er/sie/es<\/i> der Selbstlaut im Wortstamm: <i>schlafen – du schläfst<\/i>, <i>helfen – sie hilft<\/i>.","Bei <i>ihr<\/i> bleibt der Selbstlaut wie in der Grundform: <i>ihr schlaft, ihr helft<\/i>.","Endet der Wortstamm auf <i>s<\/i>, <i>ß<\/i> oder <i>z<\/i>, hängt man bei <i>du<\/i> nur <i>-t<\/i> an: <i>du reist, du heißt, du sitzt<\/i>."],"beispiele":["spielen – ich spiele – du spielst","schlafen – er schläft","helfen – du hilfst","malen → Wortstamm: mal"]},"items":[{"id":"gr-verben-01","typ":"markieren","stufe":1,"kompetenz":"wortarten","frage":"Tippe alle Verben an.","teile":[{"t":"Am"},{"t":"Nachmittag"},{"t":"füttert","ziel":true},{"t":"Elif"},{"t":"die"},{"t":"Hasen"},{"t":",","fix":true},{"t":"dann"},{"t":"holt","ziel":true},{"t":"sie"},{"t":"ihren"},{"t":"Ball"},{"t":"und"},{"t":"spielt","ziel":true},{"t":"mit"},{"t":"Luca"},{"t":".","fix":true}],"tipp":"Verben sagen, was jemand tut. Frage: Was macht Elif alles?","erklaerung":"<i>füttert<\/i>, <i>holt<\/i> und <i>spielt<\/i> sagen, was Elif tut. Es sind Verben in der Personalform. Ihre Grundformen heißen <i>füttern<\/i>, <i>holen<\/i> und <i>spielen<\/i>."},{"id":"gr-verben-02","typ":"zuordnen","stufe":1,"kompetenz":"wortarten","frage":"Grundform oder Personalform? Ordne zu.","gruppen":["Grundform","Personalform"],"elemente":[{"t":"schwimmen","g":0},{"t":"du schwimmst","g":1},{"t":"lachen","g":0},{"t":"sie lacht","g":1},{"t":"springen","g":0},{"t":"ich springe","g":1},{"t":"ihr malt","g":1},{"t":"erzählen","g":0}],"tipp":"Die Grundform steht so im Wörterbuch und endet meist auf <i>-en<\/i>. Die Personalform passt zu einer Person wie <i>ich<\/i>, <i>du<\/i> oder <i>sie<\/i>.","erklaerung":"Grundformen sind <i>schwimmen<\/i>, <i>lachen<\/i>, <i>springen<\/i> und <i>erzählen<\/i>. Bei <i>du schwimmst<\/i>, <i>sie lacht<\/i>, <i>ich springe<\/i> und <i>ihr malt<\/i> passt das Verb zur Person: Das sind Personalformen."},{"id":"gr-verben-03","typ":"luecke","stufe":1,"kompetenz":"wortarten","frage":"Welche Personalendung passt?","teile":[{"t":"Ich spiel"},{"wahl":["e","st","t","en"],"loesung":0},{"t":" Flöte. Du spiel"},{"wahl":["e","st","t","en"],"loesung":1},{"t":" Gitarre. Wir spiel"},{"wahl":["e","st","t","en"],"loesung":3},{"t":" zusammen im Schulorchester. Ihr hör"},{"wahl":["e","st","t","en"],"loesung":2},{"t":" uns zu."}],"tipp":"Schau genau, wer etwas tut: <i>ich<\/i>, <i>du<\/i>, <i>wir<\/i> oder <i>ihr<\/i>? Jede Person hat ihre eigene Endung.","erklaerung":"Es heißt: ich spiel<b>e<\/b>, du spiel<b>st<\/b>, wir spiel<b>en<\/b>, ihr hör<b>t<\/b>. Der Wortstamm bleibt hier gleich, nur die Endung passt sich der Person an."},{"id":"gr-verben-04","typ":"multi","stufe":2,"kompetenz":"wortarten","frage":"Bei welchen Verben ändert sich in der du-Form der Selbstlaut im Wortstamm?","optionen":[{"text":"lesen","richtig":true},{"text":"fahren","richtig":true},{"text":"geben","richtig":true},{"text":"kaufen","richtig":false},{"text":"gehen","richtig":false},{"text":"malen","richtig":false}],"tipp":"Bilde zu jedem Verb die du-Form und sprich sie laut. Klingt der Selbstlaut noch so wie in der Grundform?","erklaerung":"<i>lesen – du liest<\/i>, <i>fahren – du fährst<\/i>, <i>geben – du gibst<\/i>: Hier wechselt der Selbstlaut. Bei <i>du kaufst<\/i>, <i>du gehst<\/i> und <i>du malst<\/i> bleibt er gleich."},{"id":"gr-verben-05","typ":"luecke","stufe":2,"kompetenz":"wortarten","frage":"Wähle die richtige Verbform.","teile":[{"t":"Mama, "},{"wahl":["liest","lest","lesst"],"loesung":0},{"t":" du mir etwas vor? Papa "},{"wahl":["fahrt","fährt","fährst"],"loesung":1},{"t":" heute mit dem Bus zur Arbeit. Sofia "},{"wahl":["gebt","gibst","gibt"],"loesung":2},{"t":" mir ihren Radiergummi."}],"tipp":"Wer tut hier jeweils etwas: <i>du<\/i>, <i>er<\/i> oder <i>sie<\/i>? Denke daran, dass sich bei manchen Verben der Selbstlaut im Wortstamm ändert.","erklaerung":"Richtig ist: du <b>liest<\/b>, Papa (er) <b>fährt<\/b>, Sofia (sie) <b>gibt<\/b>. <i>lest<\/i>, <i>fahrt<\/i> und <i>gebt<\/i> passen zu <i>ihr<\/i>, <i>fährst<\/i> und <i>gibst<\/i> passen zu <i>du<\/i>."},{"id":"gr-verben-06","typ":"eingabe","stufe":2,"kompetenz":"wortarten","frage":"Setze das Verb in der passenden Personalform ein. Der Satz steht in der Gegenwart.","vorgabe":"sehen → Felix ___ am Himmel einen Regenbogen.","loesungen":["sieht"],"tipp":"Felix ist eine Person, also <i>er<\/i>. Prüfe, ob sich bei <i>sehen<\/i> der Selbstlaut im Wortstamm ändert.","erklaerung":"Bei <i>sehen<\/i> wird in der er-Form aus dem <i>e<\/i> ein <i>ie<\/i>: Felix <b>sieht<\/b>. Das <i>h<\/i> aus dem Wortstamm bleibt erhalten."},{"id":"gr-verben-07","typ":"single","stufe":3,"kompetenz":"wortarten","frage":"Was ist der Wortstamm in <i>du wanderst<\/i>?","optionen":[{"text":"wander","richtig":true},{"text":"wand","richtig":false},{"text":"wanderst","richtig":false},{"text":"wandern","richtig":false}],"tipp":"Nimm die Personalendung weg. Welche Endung gehört zu <i>du<\/i>? Vergleiche auch mit <i>ich wandere<\/i> und <i>er wandert<\/i>.","erklaerung":"Bei <i>du<\/i> ist die Endung <i>-st<\/i>. Was übrig bleibt, ist der Wortstamm <i>wander<\/i>. Er steckt auch in <i>er wandert<\/i> und <i>wir wandern<\/i>."},{"id":"gr-verben-08","typ":"single","stufe":3,"kompetenz":"wortarten","frage":"In welchem Satz passt die Verbform zur Person?","optionen":[{"text":"Du trägst die schwere Kiste.","richtig":true},{"text":"Er tragt die schwere Kiste.","richtig":false},{"text":"Ihr trägt die schwere Kiste.","richtig":false},{"text":"Du tragst die schwere Kiste.","richtig":false}],"tipp":"Bilde zuerst die Formen von <i>fahren<\/i> mit <i>du<\/i>, <i>er<\/i> und <i>ihr<\/i>. <i>tragen<\/i> verhält sich genauso.","erklaerung":"Richtig ist <i>du trägst<\/i>. Außerdem heißt es <i>er trägt<\/i> und <i>ihr tragt<\/i>: Bei <i>ihr<\/i> bleibt das <i>a<\/i> aus der Grundform."}]},{"id":"gr-adjektive","titel":"Adjektive","kurz":"Eigenschaften beschreiben, steigern und vergleichen","kompetenz":"wortarten","wissen":{"merksatz":"<b>Adjektive<\/b> (Wiewörter) sagen, wie jemand oder etwas ist: <i>groß, leise, mutig<\/i>. Adjektive schreibt man klein. Die meisten Adjektive kann man <b>steigern<\/b>: <i>schnell – schneller – am schnellsten<\/i>.","punkte":["Adjektiv-Probe: Passt das Wort zwischen Artikel und Nomen? <i>der … Hund<\/i> → <i>der freche Hund<\/i>.","Es gibt drei Stufen: Grundstufe <i>klein<\/i>, Vergleichsstufe <i>kleiner<\/i>, Höchststufe <i>am kleinsten<\/i>. Oft kommt ein Umlaut dazu: <i>jung – jünger – am jüngsten<\/i>.","Manche Adjektive werden unregelmäßig gesteigert: <i>gut – besser – am besten<\/i> und <i>viel – mehr – am meisten<\/i>.","Vergleichen: Sind zwei gleich, sagt man <i>wie<\/i>: <i>so groß wie<\/i>. Sind sie verschieden, sagt man <i>als<\/i>: <i>größer als<\/i>.","Die Nachsilben <i>-ig, -lich, -isch<\/i> und <i>-bar<\/i> zeigen oft ein Adjektiv an: <i>lustig, ehrlich, neidisch, essbar<\/i>."],"beispiele":["leise – leiser – am leisesten","gut – besser – am besten","viel – mehr – am meisten","Mia ist so alt wie Ben.","Ben ist größer als Mia.","der Durst → durstig"]},"items":[{"id":"gr-adjektive-01","typ":"markieren","stufe":1,"kompetenz":"wortarten","frage":"Tippe alle Adjektive an.","teile":[{"t":"Auf"},{"t":"der"},{"t":"bunten","ziel":true},{"t":"Wiese"},{"t":"sitzt"},{"t":"der"},{"t":"kleine","ziel":true},{"t":"Hase"},{"t":"mit"},{"t":"langen","ziel":true},{"t":"Ohren"},{"t":".","fix":true}],"tipp":"Adjektive sagen, wie etwas ist. Frage: Wie ist die Wiese? Wie ist der Hase? Wie sind seine Ohren?","erklaerung":"<i>bunten<\/i>, <i>kleine<\/i> und <i>langen<\/i> beschreiben, wie die Wiese, der Hase und die Ohren sind. Es sind Adjektive. Sie stehen hier jeweils direkt vor einem Nomen."},{"id":"gr-adjektive-02","typ":"zuordnen","stufe":1,"kompetenz":"wortarten","frage":"In welcher Stufe steht das Adjektiv? Ordne zu.","gruppen":["Grundstufe","Vergleichsstufe","Höchststufe"],"elemente":[{"t":"leise","g":0},{"t":"kalt","g":0},{"t":"gut","g":0},{"t":"wärmer","g":1},{"t":"besser","g":1},{"t":"älter","g":1},{"t":"am schnellsten","g":2},{"t":"am meisten","g":2}],"tipp":"Die Vergleichsstufe endet meist auf <i>-er<\/i>. Vor der Höchststufe steht <i>am<\/i>.","erklaerung":"Grundstufe: leise, kalt, gut. Vergleichsstufe: wärmer, besser, älter. Höchststufe: am schnellsten, am meisten. <i>besser<\/i> und <i>am meisten<\/i> sind unregelmäßig gesteigert."},{"id":"gr-adjektive-03","typ":"luecke","stufe":1,"kompetenz":"wortarten","frage":"Welche Stufe passt in den Satz?","teile":[{"t":"Der Bleistift ist lang. Das Lineal ist "},{"wahl":["lang","länger","am längsten"],"loesung":1},{"t":" als der Bleistift. Das Maßband ist von allen drei Sachen "},{"wahl":["lang","länger","am längsten"],"loesung":2},{"t":"."}],"tipp":"Achte auf die Wörter nach der Lücke: Steht dort <i>als<\/i>? Oder werden alle drei Sachen miteinander verglichen?","erklaerung":"Mit <i>als<\/i> vergleicht man zwei Dinge: <i>länger als<\/i> ist die Vergleichsstufe. Ist etwas von allen am längsten, braucht man die Höchststufe: <i>am längsten<\/i>."},{"id":"gr-adjektive-04","typ":"luecke","stufe":2,"kompetenz":"wortarten","frage":"Mit welcher Nachsilbe wird daraus ein Adjektiv? Wähle aus.","teile":[{"t":"Am Morgen war es noch sonn"},{"wahl":["ig","lich","isch","bar"],"loesung":0},{"t":", doch am Nachmittag wurde es stürm"},{"wahl":["ig","lich","isch","bar"],"loesung":2},{"t":". Unser Bergführer war sehr freund"},{"wahl":["ig","lich","isch","bar"],"loesung":1},{"t":". Er zeigte uns eine Quelle. Das Wasser dort ist trink"},{"wahl":["ig","lich","isch","bar"],"loesung":3},{"t":"."}],"tipp":"Sprich jedes Wort mit allen vier Nachsilben leise vor dich hin. Nur eine Möglichkeit ergibt ein echtes Wort.","erklaerung":"Es heißt <i>sonnig<\/i>, <i>stürmisch<\/i>, <i>freundlich<\/i> und <i>trinkbar<\/i>. Die Nachsilben machen aus <i>Sonne<\/i>, <i>Sturm<\/i>, <i>Freund<\/i> und <i>trinken<\/i> Adjektive."},{"id":"gr-adjektive-05","typ":"eingabe","stufe":2,"kompetenz":"wortarten","frage":"Setze das Adjektiv in der Vergleichsstufe ein.","vorgabe":"gut → Heute ist mein Bild viel ___ als gestern.","loesungen":["besser"],"tipp":"Achtung: <i>gut<\/i> wird unregelmäßig gesteigert. Hänge also nicht einfach <i>-er<\/i> an.","erklaerung":"Die Steigerung heißt <i>gut – besser – am besten<\/i>. Vor <i>als<\/i> steht die Vergleichsstufe: <i>besser als gestern<\/i>."},{"id":"gr-adjektive-06","typ":"matrix","stufe":2,"kompetenz":"wortarten","frage":"Ist der Vergleich richtig gebildet? Achte auf <i>als<\/i> und <i>wie<\/i>.","aussagen":[{"text":"Die Katze ist schneller als die Schildkröte.","richtig":true},{"text":"Mein Rucksack ist so schwer als deiner.","richtig":false},{"text":"Heute ist es kälter wie gestern.","richtig":false},{"text":"Der Kuchen schmeckt so gut wie bei Oma.","richtig":true}],"tipp":"Prüfe zuerst: Sind die beiden Dinge gleich oder verschieden? Schau dann, ob das Adjektiv in der Grundstufe oder in der Vergleichsstufe steht.","erklaerung":"Bei Gleichheit sagt man <i>so … wie<\/i>: so schwer wie, so gut wie. Bei einem Unterschied sagt man <i>als<\/i>: schneller als, kälter als. Falsch sind also <i>so schwer als<\/i> und <i>kälter wie<\/i>."},{"id":"gr-adjektive-07","typ":"multi","stufe":3,"kompetenz":"wortarten","frage":"Welche Steigerungen sind richtig?","optionen":[{"text":"gut – besser – am besten","richtig":true},{"text":"viel – mehr – am meisten","richtig":true},{"text":"alt – älter – am ältesten","richtig":true},{"text":"viel – mehr – am mehrsten","richtig":false},{"text":"gut – guter – am gutesten","richtig":false},{"text":"groß – größer – am größesten","richtig":false}],"tipp":"Sprich jede Reihe laut. Achte besonders auf die Höchststufe mit <i>am<\/i>.","erklaerung":"Richtig sind <i>gut – besser – am besten<\/i>, <i>viel – mehr – am meisten<\/i> und <i>alt – älter – am ältesten<\/i>. Falsch sind <i>am mehrsten<\/i>, <i>guter<\/i> und <i>am größesten<\/i>. Richtig heißt es <i>am meisten<\/i>, <i>besser<\/i> und <i>am größten<\/i>."},{"id":"gr-adjektive-08","typ":"markieren","stufe":3,"kompetenz":"wortarten","frage":"Tippe alle Adjektive an. Achtung: Nicht jedes Wort, das auf <i>-ig<\/i> endet, ist ein Adjektiv!","teile":[{"t":"Zum"},{"t":"Frühstück"},{"t":"isst"},{"t":"der"},{"t":"König"},{"t":"frisches","ziel":true},{"t":"Brot"},{"t":"mit"},{"t":"süßem","ziel":true},{"t":"Honig"},{"t":"und"},{"t":"ist"},{"t":"danach"},{"t":"sehr"},{"t":"fröhlich","ziel":true},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort: Sagt es, wie jemand oder etwas ist? Passt es zwischen Artikel und Nomen, zum Beispiel <i>der … König<\/i>?","erklaerung":"<i>frisches<\/i>, <i>süßem<\/i> und <i>fröhlich<\/i> sagen, wie das Brot, der Honig und der König sind. <i>König<\/i> und <i>Honig<\/i> enden zwar auf <i>-ig<\/i>, sind aber Nomen. <i>sehr<\/i> verstärkt nur ein Adjektiv, ist aber selbst kein Adjektiv."}]},{"id":"gr-wortbildung","titel":"Wortbausteine und Wortfamilien","kurz":"Zusammengesetzte Nomen, Wortfamilien, Wortfelder, Vor- und Nachsilben","kompetenz":"wortbildung","wissen":{"merksatz":"Aus <b>Wortbausteinen<\/b> entstehen neue Wörter. Ein <b>zusammengesetztes Nomen<\/b> besteht aus <b>Bestimmungswort<\/b> und <b>Grundwort<\/b>. Das Grundwort steht hinten und bestimmt den Artikel: <i>das Haus + die Tür = die Haustür<\/i>. Wörter mit demselben Wortstamm bilden eine <b>Wortfamilie<\/b>.","punkte":["Das Bestimmungswort erklärt das Grundwort genauer: Eine <i>Haustür<\/i> ist eine Tür <b>am Haus<\/b>, ein <i>Türschloss<\/i> ist ein Schloss <b>an der Tür<\/b>.","Eine <b>Wortfamilie<\/b> hat einen gemeinsamen Wortstamm: <i>spielen, der Spieler, der Spielplatz, verspielt<\/i>. Manchmal ändert sich dabei ein Selbstlaut: <i>fahren – die Fähre<\/i>.","Zu einem <b>Wortfeld<\/b> gehören Wörter mit ähnlicher Bedeutung, aber verschiedenem Wortstamm: <i>sagen – flüstern, rufen, fragen<\/i>; <i>gehen – schleichen, rennen, bummeln<\/i>.","<b>Vorsilben<\/b> (Präfixe) stehen vorn und verändern die Bedeutung: <i>kaufen – verkaufen<\/i>, <i>decken – entdecken<\/i>, <i>freundlich – unfreundlich<\/i>.","<b>Nachsilben<\/b> (Suffixe) stehen hinten. Mit <i>-ung, -heit, -keit<\/i> und <i>-nis<\/i> entstehen Nomen: <i>die Hoffnung, die Freiheit, die Ehrlichkeit, das Ergebnis<\/i>.","Bei Verben fällt die Endung der Grundform weg: <i>wohnen → die Wohnung<\/i>, <i>erleben → das Erlebnis<\/i>. Nach <i>-ig<\/i>, <i>-lich<\/i> und <i>-bar<\/i> steht meist <i>-keit<\/i>: <i>die Fröhlichkeit<\/i>, <i>die Dankbarkeit<\/i>."],"beispiele":["der Apfel + der Saft = der Apfelsaft","das Haus + die Tür = die Haustür","Wortfamilie: spielen, Spieler, Spielplatz","Wortfeld sagen: flüstern, rufen, fragen","Vorsilbe: kaufen → verkaufen","Nachsilbe: frei → die Freiheit"]},"items":[{"id":"gr-wortbildung-01","typ":"markieren","stufe":1,"kompetenz":"wortbildung","frage":"Tippe alle zusammengesetzten Nomen an.","teile":[{"t":"Am"},{"t":"Wandertag","ziel":true},{"t":"packt"},{"t":"Noah"},{"t":"eine"},{"t":"Wasserflasche","ziel":true},{"t":",","fix":true},{"t":"einen"},{"t":"Apfel"},{"t":"und"},{"t":"seine"},{"t":"Regenjacke","ziel":true},{"t":"in"},{"t":"die"},{"t":"Tasche"},{"t":".","fix":true}],"tipp":"Suche zuerst alle Nomen. Prüfe dann bei jedem: Stecken darin zwei Wörter, so wie in <i>Schnee + Mann<\/i>?","erklaerung":"<i>Wandertag<\/i> (wandern + Tag), <i>Wasserflasche<\/i> (Wasser + Flasche) und <i>Regenjacke<\/i> (Regen + Jacke) sind zusammengesetzt. <i>Apfel<\/i>, <i>Tasche<\/i> und <i>Noah<\/i> kann man nicht zerlegen."},{"id":"gr-wortbildung-02","typ":"luecke","stufe":1,"kompetenz":"wortbildung","frage":"Welcher Artikel passt zum zusammengesetzten Nomen?","teile":[{"t":"Bei Oma blüht "},{"wahl":["der","die","das"],"loesung":0},{"t":" Kirschbaum. "},{"wahl":["Der","Die","Das"],"loesung":1},{"t":" Gartentür steht offen. "},{"wahl":["Der","Die","Das"],"loesung":2},{"t":" Vogelhaus hängt am Zaun."}],"tipp":"Zerlege jedes Nomen in seine zwei Teile. Welcher der beiden Teile bestimmt den Artikel?","erklaerung":"Der Artikel richtet sich nach dem Grundwort, also nach dem hinteren Wort: <i>der Baum → der Kirschbaum<\/i>, <i>die Tür → die Gartentür<\/i>, <i>das Haus → das Vogelhaus<\/i>."},{"id":"gr-wortbildung-03","typ":"zuordnen","stufe":1,"kompetenz":"wortbildung","frage":"Zu welchem Wortfeld gehört das Verb? Ordne zu.","gruppen":["Wortfeld sagen","Wortfeld gehen"],"elemente":[{"t":"brüllen","g":0},{"t":"murmeln","g":0},{"t":"antworten","g":0},{"t":"erzählen","g":0},{"t":"schlendern","g":1},{"t":"wandern","g":1},{"t":"stapfen","g":1},{"t":"eilen","g":1}],"tipp":"Stell dir vor, wie jemand das macht: Braucht er dafür vor allem den Mund oder die Beine?","erklaerung":"<i>brüllen, murmeln, antworten<\/i> und <i>erzählen<\/i> sind verschiedene Arten zu sprechen. <i>schlendern, wandern, stapfen<\/i> und <i>eilen<\/i> sind verschiedene Arten, sich zu Fuß fortzubewegen."},{"id":"gr-wortbildung-04","typ":"single","stufe":2,"kompetenz":"wortbildung","frage":"Was ist eine <i>Topfblume<\/i>?","optionen":[{"text":"eine Blume, die in einem Topf wächst","richtig":true},{"text":"ein Topf, in den man Blumen pflanzt","richtig":false},{"text":"ein Topf mit einem bunten Blumenmuster","richtig":false},{"text":"ein Topf, der wie eine Blume aussieht","richtig":false}],"tipp":"Welches Wort steht hinten? Das Grundwort sagt dir, was für ein Ding gemeint ist.","erklaerung":"Das Grundwort steht hinten: <i>Blume<\/i>. Eine Topfblume ist also eine Blume, und das Bestimmungswort <i>Topf<\/i> sagt, wo sie wächst. Ein Topf für Blumen heißt umgekehrt <i>Blumentopf<\/i>."},{"id":"gr-wortbildung-05","typ":"multi","stufe":2,"kompetenz":"wortbildung","frage":"Welche Wörter gehören zur Wortfamilie <i>fahren<\/i>?","optionen":[{"text":"der Beifahrer","richtig":true},{"text":"die Abfahrt","richtig":true},{"text":"das Fahrrad","richtig":true},{"text":"die Farbe","richtig":false},{"text":"die Fahne","richtig":false},{"text":"der Pfarrer","richtig":false}],"tipp":"Suche in jedem Wort den Wortstamm <i>fahr<\/i>. Klingt ein Wort nur ähnlich, gehört es nicht dazu.","erklaerung":"In <i>Beifahrer<\/i>, <i>Abfahrt<\/i> und <i>Fahrrad<\/i> steckt der Wortstamm <i>fahr<\/i>. <i>Farbe<\/i>, <i>Fahne<\/i> und <i>Pfarrer<\/i> klingen nur ähnlich, mit <i>fahren<\/i> haben sie nichts zu tun."},{"id":"gr-wortbildung-06","typ":"luecke","stufe":2,"kompetenz":"wortbildung","frage":"Welche Vorsilbe passt? Wähle aus.","teile":[{"t":"Gestern ist Amiras Katze aus dem Garten "},{"wahl":["ver","ent","be"],"loesung":1},{"t":"laufen. Bei der Suche im Nebel haben sich Amira und ihr Bruder fast selbst "},{"wahl":["ver","ent","be"],"loesung":0},{"t":"laufen. Am Abend saß die Katze vor der Tür und wartete "},{"wahl":["un","ver","ent"],"loesung":0},{"t":"geduldig auf ihr Futter."}],"tipp":"Lies den ganzen Satz mit jeder Vorsilbe. Welches Wort gibt es wirklich, und welches passt zum Sinn?","erklaerung":"Die Katze ist <i>entlaufen<\/i>: Sie ist weggelaufen. Amira und ihr Bruder hätten sich fast <i>verlaufen<\/i>: Sie hätten beinahe den Weg nicht mehr gefunden. <i>Ungeduldig<\/i> bedeutet „nicht geduldig“ – die Vorsilbe verändert die Bedeutung."},{"id":"gr-wortbildung-07","typ":"matrix","stufe":3,"kompetenz":"wortbildung","frage":"Lies jede Aussage genau. Ist sie richtig oder falsch?","aussagen":[{"text":"Es heißt <i>die Apfelsaftflasche<\/i>, weil das Grundwort <i>die Flasche<\/i> ist.","richtig":true},{"text":"Bei <i>Haustür<\/i> ist <i>Haus<\/i> das Grundwort.","richtig":false},{"text":"<i>murmeln<\/i>, <i>schreien<\/i> und <i>fragen<\/i> gehören zu einer Wortfamilie.","richtig":false},{"text":"<i>backen<\/i>, <i>der Bäcker<\/i> und <i>das Gebäck<\/i> gehören zu einer Wortfamilie.","richtig":true}],"tipp":"Bei einer Wortfamilie steckt in allen Wörtern derselbe Wortstamm. Bei einem Wortfeld haben die Wörter nur eine ähnliche Bedeutung. Und: Wo steht das Grundwort?","erklaerung":"Das Grundwort steht immer hinten: bei <i>Apfelsaftflasche<\/i> ist es <i>Flasche<\/i>, bei <i>Haustür<\/i> ist es <i>Tür<\/i>. <i>murmeln, schreien, fragen<\/i> sind ein Wortfeld, weil sie Ähnliches bedeuten. In <i>backen, Bäcker, Gebäck<\/i> steckt derselbe Wortstamm <i>back<\/i>, manchmal mit <i>ä<\/i>."},{"id":"gr-wortbildung-08","typ":"zuordnen","stufe":3,"kompetenz":"wortbildung","frage":"Mit welcher Nachsilbe wird aus dem Wort ein Nomen? Ordne zu.","gruppen":["-heit","-keit","-ung","-nis"],"elemente":[{"t":"frech","g":0},{"t":"krank","g":0},{"t":"freundlich","g":1},{"t":"dankbar","g":1},{"t":"üben","g":2},{"t":"wandern","g":2},{"t":"erlauben","g":3},{"t":"geheim","g":3}],"tipp":"Hänge jede Nachsilbe probeweise an und sprich das neue Wort laut. Bei Verben lässt du vorher die Endung der Grundform weg. Nur eine Nachsilbe ergibt ein echtes Nomen.","erklaerung":"Es heißt: die Frechheit, die Krankheit – die Freundlichkeit, die Dankbarkeit – die Übung, die Wanderung – die Erlaubnis, das Geheimnis. Nach <i>-lich<\/i> und <i>-bar<\/i> steht <i>-keit<\/i>. Alle neuen Wörter sind Nomen und werden großgeschrieben."}]},{"id":"gr-zeiten","titel":"Zeitformen","kurz":"Präsens, Präteritum, Perfekt und Futur","kompetenz":"zeitformen","wissen":{"merksatz":"Die <b>Zeitform<\/b> erkennst du an der Verbform. Sie zeigt dir meistens, <b>wann<\/b> etwas passiert: jetzt, früher oder später.","punkte":["<b>Präsens<\/b> (Gegenwart): Es passiert jetzt oder immer wieder. Beispiel: <i>Lena liest.<\/i> Mit einem Signalwort kann man im Präsens auch über die Zukunft sprechen: <i>Am Freitag spielen wir Theater.<\/i>","<b>Präteritum<\/b> (1. Vergangenheit): Es ist vorbei. Man benutzt es vor allem in geschriebenen Texten wie Erzählungen. Beispiel: <i>Lena las.<\/i>","<b>Perfekt<\/b> (2. Vergangenheit): Es ist vorbei. Man benutzt es vor allem beim mündlichen Erzählen. Es besteht aus einer Form von <i>haben<\/i> oder <i>sein<\/i> und dem <b>Partizip<\/b>. Das Partizip ist eine Verbform wie <i>gelesen<\/i>, <i>gespielt<\/i> oder <i>gerannt<\/i>. Beispiele: <i>Lena hat gelesen. Lena ist gerannt.<\/i>","<b>Futur<\/b> (Zukunft): Es passiert später. Es besteht aus einer Form von <i>werden<\/i> und der Grundform. Beispiel: <i>Lena wird lesen.<\/i>","<b>Schwache Verben<\/b> bekommen im Präteritum <i>-te<\/i>: <i>spielen – spielte – hat gespielt<\/i>. <b>Starke Verben<\/b> ändern im Präteritum ihren Vokal: <i>gehen – ging – ist gegangen<\/i>. Manche Verben machen beides: <i>rennen – rannte – ist gerannt<\/i>, <i>kennen – kannte – hat gekannt<\/i>.","Signalwörter wie <i>gestern<\/i>, <i>jetzt<\/i> oder <i>morgen<\/i> verraten dir, <b>wann<\/b> etwas passiert. Welche Zeitform ein Satz hat, erkennst du aber immer an der Verbform."],"beispiele":["Präsens: ich spiele, er geht","Präteritum: ich spielte, er ging","Perfekt: ich habe gespielt, er ist gegangen","Futur: ich werde spielen, er wird gehen","schreiben – schrieb – hat geschrieben"]},"items":[{"id":"gr-zeiten-01","typ":"single","stufe":1,"kompetenz":"zeitformen","frage":"In welcher Zeitform steht dieser Satz?","vorgabe":"Sofia hat im Freibad einen Kopfsprung gemacht.","optionen":[{"text":"Präsens","richtig":false},{"text":"Präteritum","richtig":false},{"text":"Perfekt","richtig":true},{"text":"Futur","richtig":false}],"tipp":"Schau dir das Verb genau an. Besteht es aus einem Teil oder aus zwei Teilen? Steckt eine Form von <i>haben<\/i>, <i>sein<\/i> oder <i>werden<\/i> darin?","erklaerung":"Das Prädikat <i>hat … gemacht<\/i> besteht aus einer Form von <i>haben<\/i> und dem Partizip. Das ist das Perfekt."},{"id":"gr-zeiten-02","typ":"zuordnen","stufe":1,"kompetenz":"zeitformen","frage":"Signalwörter verraten dir die Zeit. Sortiere sie.","gruppen":["Vergangenheit","Gegenwart","Zukunft"],"elemente":[{"t":"gestern","g":0},{"t":"letzte Woche","g":0},{"t":"vor zwei Tagen","g":0},{"t":"jetzt","g":1},{"t":"im Moment","g":1},{"t":"morgen","g":2},{"t":"übermorgen","g":2},{"t":"nächsten Sommer","g":2}],"tipp":"Frage dich bei jedem Wort: Ist das schon vorbei, passiert es gerade oder kommt es erst noch?","erklaerung":"<i>Gestern<\/i>, <i>letzte Woche<\/i> und <i>vor zwei Tagen<\/i> sind vorbei. <i>Jetzt<\/i> und <i>im Moment<\/i> bedeuten, dass etwas gerade passiert. <i>Morgen<\/i>, <i>übermorgen<\/i> und <i>nächsten Sommer<\/i> liegen in der Zukunft."},{"id":"gr-zeiten-03","typ":"luecke","stufe":1,"kompetenz":"zeitformen","frage":"Achte auf die Signalwörter. Wähle die passende Verbform.","teile":[{"t":"Letzten Sommer "},{"wahl":["schwamm","schwimmt","schwimmte"],"loesung":0},{"t":" Leyla im Badesee. Jetzt "},{"wahl":["schwamm","schwimmt","schwomm"],"loesung":1},{"t":" sie im Hallenbad. Nächstes Jahr "},{"wahl":["hat","wurde","wird"],"loesung":2},{"t":" sie den Freischwimmer machen."}],"tipp":"Suche zuerst die Signalwörter. Sagen sie dir: vorbei, jetzt oder später? Prüfe auch, ob es die Verbform wirklich gibt.","erklaerung":"<i>Letzten Sommer<\/i> → Präteritum: <i>schwamm<\/i> (die Formen „schwimmte“ und „schwomm“ gibt es nicht). <i>Jetzt<\/i> → Präsens: <i>schwimmt<\/i>. <i>Nächstes Jahr<\/i> → Futur mit <i>werden<\/i>: <i>wird … machen<\/i>."},{"id":"gr-zeiten-04","typ":"eingabe","stufe":2,"kompetenz":"zeitformen","frage":"Setze das Verb <i>finden<\/i> ins Präteritum und tippe es ein.","vorgabe":"Beim Wandertag ___ Ben eine Vogelfeder.","loesungen":["fand"],"tipp":"Sprich den Satz mit <i>gestern<\/i>: „Gestern … Ben eine Feder.“ Achtung: <i>finden<\/i> ist ein starkes Verb und bekommt im Präteritum kein <i>-te<\/i>.","erklaerung":"Das Verb <i>finden<\/i> ist stark: <i>finden – fand – hat gefunden<\/i>. Im Präteritum heißt es also <i>fand<\/i>, nicht „findete“."},{"id":"gr-zeiten-05","typ":"multi","stufe":2,"kompetenz":"zeitformen","frage":"In welche Sätze gehört <i>ist<\/i>? Die anderen brauchen <i>hat<\/i>.","optionen":[{"text":"Der Apfel ___ vom Baum gefallen.","richtig":true},{"text":"Amira ___ ein spannendes Buch gelesen.","richtig":false},{"text":"Ben ___ den Gartenzaun gestrichen.","richtig":false},{"text":"Der Zug ___ pünktlich angekommen.","richtig":true},{"text":"Die Katze ___ ihre Milch getrunken.","richtig":false},{"text":"Das Baby ___ endlich eingeschlafen.","richtig":true}],"tipp":"Sprich jeden Satz einmal mit <i>ist<\/i> und einmal mit <i>hat<\/i>. Verben, die eine Bewegung zu einem anderen Ort oder eine Veränderung ausdrücken, bilden das Perfekt oft mit <i>sein<\/i>.","erklaerung":"Die Verben <i>fallen<\/i>, <i>ankommen<\/i> und <i>einschlafen<\/i> bilden das Perfekt mit <i>sein<\/i>. Sie drücken eine Bewegung oder eine Veränderung aus. Die Verben <i>lesen<\/i>, <i>streichen<\/i> und <i>trinken<\/i> bilden es mit <i>haben<\/i>."},{"id":"gr-zeiten-06","typ":"markieren","stufe":2,"kompetenz":"zeitformen","frage":"Markiere alle Verben, die im Präteritum stehen.","teile":[{"t":"Am Samstag"},{"t":"besuchte","ziel":true},{"t":"Hannah"},{"t":"den Christkindlmarkt"},{"t":".","fix":true},{"t":"Es"},{"t":"war","ziel":true},{"t":"sehr voll"},{"t":".","fix":true},{"t":"Sie"},{"t":"trank","ziel":true},{"t":"einen Kinderpunsch"},{"t":".","fix":true},{"t":"Heute"},{"t":"erzählt"},{"t":"sie"},{"t":"Luca"},{"t":"davon"},{"t":":","fix":true},{"t":"„","fix":true},{"t":"Ich"},{"t":"habe"},{"t":"eine Krippe"},{"t":"gesehen"},{"t":"!“","fix":true}],"tipp":"Suche zuerst alle Verben. Prüfe dann bei jedem: Steht es allein und erzählt es von etwas, das schon vorbei ist?","erklaerung":"Die Formen <i>besuchte<\/i>, <i>war<\/i> und <i>trank<\/i> stehen im Präteritum. Die Form <i>erzählt<\/i> ist Präsens. Mit <i>habe … gesehen<\/i> spricht Hannah im Perfekt – so erzählt man meistens mündlich."},{"id":"gr-zeiten-07","typ":"matrix","stufe":3,"kompetenz":"zeitformen","frage":"Stimmt die Zeitform? Entscheide bei jedem Satz.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Der Satz „Der Wind wehte die ganze Nacht“ steht im Perfekt.","richtig":false},{"text":"Der Satz „Morgen fährt Emir ins Schullandheim“ steht im Präsens.","richtig":true},{"text":"Der Satz „Die Kinder werden im Zelt schlafen“ steht im Futur.","richtig":true},{"text":"Der Satz „Wir sind gestern lange wach geblieben“ steht im Präteritum.","richtig":false}],"tipp":"Achte nur auf die Verbform, nicht auf Wörter wie <i>morgen<\/i> oder <i>gestern<\/i>. Aus wie vielen Teilen besteht das Prädikat, und welche Teile sind es?","erklaerung":"Die Form <i>wehte<\/i> ist Präteritum. Die Form <i>fährt<\/i> ist Präsens – zusammen mit <i>morgen<\/i> spricht sie über die Zukunft. Dagegen ist <i>werden … schlafen<\/i> Futur und <i>sind … geblieben<\/i> Perfekt."},{"id":"gr-zeiten-08","typ":"single","stufe":3,"kompetenz":"zeitformen","frage":"In welcher Reihe sind alle drei Verbformen richtig?","optionen":[{"text":"bringen – bringte – hat gebracht","richtig":false},{"text":"schwimmen – schwomm – ist geschwommen","richtig":false},{"text":"denken – dachte – hat gedenkt","richtig":false},{"text":"trinken – trank – hat getrunken","richtig":true}],"tipp":"Prüfe jede Form mit einem kleinen Satz: „Heute …“ – „Gestern …“ – „Ich habe …“ oder „Ich bin …“. In drei Reihen steckt je ein Fehler.","erklaerung":"Nur <i>trinken – trank – hat getrunken<\/i> stimmt ganz. Richtig heißt es: <i>bringen – brachte<\/i>, <i>schwimmen – schwamm<\/i> und <i>denken – hat gedacht<\/i>."}]},{"id":"gr-satzglieder","titel":"Satzglieder","kurz":"Umstellprobe, Subjekt und Prädikat","kompetenz":"satzglieder","wissen":{"merksatz":"Stelle einen Satz um, ohne dass er seinen Sinn verliert. Wörter, die dabei immer zusammenbleiben, bilden ein <b>Satzglied<\/b>.","punkte":["Ein Satzglied kann aus einem Wort oder aus mehreren Wörtern bestehen: <i>Mia<\/i> oder <i>meine beste Freundin Mia<\/i>.","Das <b>Prädikat<\/b> (Satzkern) sagt, was jemand tut oder was geschieht. Im Aussagesatz steht das Prädikat (oder sein erster Teil) immer als zweites Satzglied.","Das Prädikat kann aus zwei Teilen bestehen. Sie bilden eine Klammer um andere Satzglieder: <i>Ben <b>ruft<\/b> seine Oma <b>an<\/b>.<\/i> <i>Lena <b>hat<\/b> ein Bild <b>gemalt<\/b>.<\/i>","Das <b>Subjekt<\/b> (Satzgegenstand) findest du mit der Frage <i>Wer oder was …?<\/i> und dem Prädikat: <i>Wer oder was bellt?<\/i> → <i>der Hund<\/i>.","Subjekt und Prädikat passen immer zusammen: <i>Der Hund bellt.<\/i> – <i>Die Hunde bellen.<\/i>"],"beispiele":["Der Hausmeister | repariert | heute | die Schaukel.","Heute | repariert | der Hausmeister | die Schaukel.","Die Schaukel | repariert | der Hausmeister | heute.","Wer oder was repariert? → der Hausmeister","zweiteilige Prädikate: ruft … an, hat … gemalt"]},"items":[{"id":"gr-satzglieder-01","typ":"markieren","stufe":1,"kompetenz":"satzglieder","frage":"Markiere das Subjekt.","teile":[{"t":"Im Herbst"},{"t":"sammelt"},{"t":"der kleine Igel","ziel":true},{"t":"Laub"},{"t":"für sein Nest"},{"t":".","fix":true}],"tipp":"Stelle die Frage <i>Wer oder was …?<\/i> und setze das Prädikat ein.","erklaerung":"<i>Wer oder was sammelt Laub?<\/i> – <i>der kleine Igel<\/i>. Das Subjekt steht hier nicht am Anfang, sondern nach dem Prädikat."},{"id":"gr-satzglieder-02","typ":"eingabe","stufe":1,"kompetenz":"satzglieder","frage":"Wie viele Satzglieder hat dieser Satz? Mach die Umstellprobe und tippe die Zahl ein.","vorgabe":"Meine große Schwester backt am Wochenende einen Apfelkuchen.","loesungen":["4","vier","Vier"],"tipp":"Stelle den Satz mehrmals um. Beginne zum Beispiel mit <i>Am Wochenende …<\/i>. Zähle dann die Wortgruppen, die immer zusammenbleiben.","erklaerung":"<i>Meine große Schwester | backt | am Wochenende | einen Apfelkuchen<\/i>: Das sind 4 Satzglieder. Probe: <i>Einen Apfelkuchen backt meine große Schwester am Wochenende.<\/i>"},{"id":"gr-satzglieder-03","typ":"luecke","stufe":1,"kompetenz":"satzglieder","frage":"Subjekt und Prädikat müssen zusammenpassen. Wähle die richtige Verbform.","teile":[{"t":"In der Pause "},{"wahl":["spielen","spielt","spielst"],"loesung":0},{"t":" die Kinder Fangen. Der Hausmeister "},{"wahl":["schaut","schauen","schaust"],"loesung":0},{"t":" ihnen dabei zu."}],"tipp":"Suche zuerst das Subjekt. Steht es in der Einzahl oder in der Mehrzahl?","erklaerung":"Das Subjekt <i>die Kinder<\/i> steht in der Mehrzahl, also <i>spielen<\/i>. Das Subjekt <i>der Hausmeister<\/i> steht in der Einzahl, also <i>schaut … zu<\/i>."},{"id":"gr-satzglieder-04","typ":"markieren","stufe":2,"kompetenz":"satzglieder","frage":"Markiere in beiden Sätzen alle Teile des Prädikats.","teile":[{"t":"Lena"},{"t":"hat","ziel":true},{"t":"in der Pause"},{"t":"ein Pferd"},{"t":"gemalt","ziel":true},{"t":".","fix":true},{"t":"Danach"},{"t":"räumt","ziel":true},{"t":"sie"},{"t":"ihre Stifte"},{"t":"auf","ziel":true},{"t":".","fix":true}],"tipp":"Ein Prädikat kann aus zwei Teilen bestehen. Der zweite Teil steht dann oft ganz am Ende des Satzes.","erklaerung":"Im ersten Satz heißt das Prädikat <i>hat … gemalt<\/i>, im zweiten <i>räumt … auf<\/i>. Die beiden Teile bilden jeweils eine Klammer um die anderen Satzglieder."},{"id":"gr-satzglieder-05","typ":"multi","stufe":2,"kompetenz":"satzglieder","frage":"Emir hat mit diesem Satz die Umstellprobe gemacht. Welche Wortgruppen sind vollständige Satzglieder?","vorgabe":"Die Kinder der 4b besuchen am Freitag das Naturkundemuseum. → Am Freitag besuchen die Kinder der 4b das Naturkundemuseum. → Das Naturkundemuseum besuchen die Kinder der 4b am Freitag.","optionen":[{"text":"die Kinder","richtig":false},{"text":"die Kinder der 4b","richtig":true},{"text":"am Freitag das Naturkundemuseum","richtig":false},{"text":"am Freitag","richtig":true},{"text":"der 4b","richtig":false},{"text":"das Naturkundemuseum","richtig":true}],"tipp":"Prüfe jede Wortgruppe: Bleibt sie in allen drei Sätzen genau so zusammen? Fehlt ihr etwas, das immer dabeisteht?","erklaerung":"Die Wortgruppen <i>die Kinder der 4b<\/i>, <i>am Freitag<\/i> und <i>das Naturkundemuseum<\/i> bleiben beim Umstellen immer zusammen. Dagegen sind <i>die Kinder<\/i> und <i>der 4b<\/i> nur Teile eines Satzglieds. Im zweiten Satz werden <i>am Freitag<\/i> und <i>das Naturkundemuseum<\/i> getrennt – es sind also zwei Satzglieder."},{"id":"gr-satzglieder-06","typ":"zuordnen","stufe":2,"kompetenz":"satzglieder","frage":"Ordne die Teile des Satzes richtig zu.","vorgabe":"Morgen früh holt Opa Franz die Kinder mit dem Traktor ab.","gruppen":["Subjekt","Prädikat","anderes Satzglied"],"elemente":[{"t":"Morgen früh","g":2},{"t":"holt","g":1},{"t":"Opa Franz","g":0},{"t":"die Kinder","g":2},{"t":"mit dem Traktor","g":2},{"t":"ab","g":1}],"tipp":"Frage: <i>Wer oder was holt ab?<\/i> Achte darauf, ob <i>holt<\/i> zu einer Person oder zu mehreren passt.","erklaerung":"Das Prädikat ist zweiteilig: <i>holt … ab<\/i>. <i>Wer holt ab?<\/i> – <i>Opa Franz<\/i>, denn <i>holt<\/i> passt nur zur Einzahl. <i>Morgen früh<\/i>, <i>die Kinder<\/i> und <i>mit dem Traktor<\/i> sind weitere Satzglieder."},{"id":"gr-satzglieder-07","typ":"single","stufe":3,"kompetenz":"satzglieder","frage":"Was ist das Subjekt dieses Satzes?","vorgabe":"Dem kleinen Luca gefallen die bunten Herbstblätter besonders gut.","optionen":[{"text":"Dem kleinen Luca","richtig":false},{"text":"die bunten Herbstblätter","richtig":true},{"text":"besonders gut","richtig":false},{"text":"Der Satz hat kein Subjekt.","richtig":false}],"tipp":"Frage genau: <i>Wer oder was gefällt …?<\/i> Prüfe auch, ob die Verbform <i>gefallen<\/i> zur Einzahl oder zur Mehrzahl passt.","erklaerung":"<i>Wer oder was gefällt Luca?<\/i> – <i>die bunten Herbstblätter<\/i>. Die Verbform <i>gefallen<\/i> steht in der Mehrzahl und passt zu ihnen. Nach <i>dem kleinen Luca<\/i> fragt man mit <i>Wem?<\/i> – das ist kein Subjekt."},{"id":"gr-satzglieder-08","typ":"matrix","stufe":3,"kompetenz":"satzglieder","frage":"Lies den Satz. Stimmen die Aussagen?","vorgabe":"Gestern Nachmittag hat Opa mit Felix einen Drachen gebaut.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Das Prädikat besteht aus zwei Teilen: <i>hat<\/i> und <i>gebaut<\/i>.","richtig":true},{"text":"Die Wörter <i>Gestern Nachmittag<\/i> bilden zusammen ein Satzglied.","richtig":true},{"text":"Das Subjekt ist <i>Felix<\/i>.","richtig":false},{"text":"Die Wörter <i>einen Drachen gebaut<\/i> bilden zusammen ein Satzglied.","richtig":false}],"tipp":"Mach die Umstellprobe: Beginne den Satz mit <i>Opa<\/i> oder mit <i>Einen Drachen<\/i>. Was bleibt zusammen, was wandert an eine andere Stelle?","erklaerung":"Das Prädikat <i>hat … gebaut<\/i> ist zweiteilig, und <i>Gestern Nachmittag<\/i> bleibt beim Umstellen zusammen. <i>Wer hat gebaut?<\/i> – <i>Opa<\/i>, nicht Felix. Das Wort <i>gebaut<\/i> gehört zum Prädikat, nicht zu <i>einen Drachen<\/i>."}]},{"id":"gr-objekte","titel":"Objekte, Orts- und Zeitangaben","kurz":"Wem? Wen oder was? Wo? Wann?","kompetenz":"satzglieder","wissen":{"merksatz":"Die richtige Frage verrät dir das Satzglied: <i>Wem?<\/i> → Dativobjekt, <i>Wen oder was?<\/i> → Akkusativobjekt, <i>Wo? Wohin? Woher?<\/i> → Ortsangabe, <i>Wann? Wie lange? Seit wann? Wie oft?<\/i> → Zeitangabe.","punkte":["Das <b>Dativobjekt<\/b> erfragst du mit <i>Wem?<\/i> Beispiel: Emir schenkt <i>seiner Schwester<\/i> ein Buch.","Das <b>Akkusativobjekt<\/b> erfragst du mit <i>Wen oder was?<\/i> Beispiel: Emir schenkt seiner Schwester <i>ein Buch<\/i>.","Die <b>Ortsangabe<\/b> erfragst du mit <i>Wo?<\/i>, <i>Wohin?<\/i> oder <i>Woher?<\/i> Beispiel: Wir treffen uns <i>am Brunnen<\/i>.","Die <b>Zeitangabe<\/b> erfragst du mit <i>Wann?<\/i>, <i>Wie lange?<\/i>, <i>Seit wann?<\/i> oder <i>Wie oft?<\/i> Beispiel: <i>Am Freitag<\/i> ist Wandertag.","Das Prädikat bestimmt, welches Objekt ein Satz braucht: <i>Ben folgt seinem Hund.<\/i> (Wem?) – <i>Ben sucht seinen Hund.<\/i> (Wen?) Orts- und Zeitangaben kannst du meist ergänzen oder weglassen."],"beispiele":["Die Lehrerin gibt <i>dem Jungen<\/i> ein Heft. → Wem? Dativobjekt","Mia füttert <i>die Katze<\/i>. → Wen oder was? Akkusativobjekt","Die Katze schläft <i>im Körbchen<\/i>. → Wo? Ortsangabe","Wir fahren <i>ins Schullandheim<\/i>. → Wohin? Ortsangabe","Wir bleiben <i>drei Tage<\/i>. → Wie lange? Zeitangabe"]},"items":[{"id":"gr-objekte-01","typ":"multi","stufe":1,"kompetenz":"satzglieder","frage":"Welche Wortgruppen sind Zeitangaben?","optionen":[{"text":"am Freitag","richtig":true},{"text":"im Schwimmbad","richtig":false},{"text":"drei Stunden lang","richtig":true},{"text":"seinem Bruder","richtig":false},{"text":"unter dem Bett","richtig":false},{"text":"nach dem Frühstück","richtig":true}],"tipp":"Probiere bei jeder Wortgruppe die Fragen <i>Wann?<\/i> und <i>Wie lange?<\/i> aus.","erklaerung":"Die Wortgruppen <i>am Freitag<\/i> und <i>nach dem Frühstück<\/i> sagen, wann etwas passiert. Die Wortgruppe <i>drei Stunden lang<\/i> sagt, wie lange es dauert. Dagegen sind <i>im Schwimmbad<\/i> und <i>unter dem Bett<\/i> Ortsangaben, und <i>seinem Bruder<\/i> ist ein Dativobjekt."},{"id":"gr-objekte-02","typ":"single","stufe":1,"kompetenz":"satzglieder","frage":"Welches Satzglied ist fett gedruckt?","vorgabe":"Aylin hilft <b>ihrem Opa<\/b> im Garten.","optionen":[{"text":"Akkusativobjekt","richtig":false},{"text":"Subjekt","richtig":false},{"text":"Dativobjekt","richtig":true},{"text":"Ortsangabe","richtig":false}],"tipp":"Bilde eine Frage nach dem fett gedruckten Satzglied. Beginnt sie mit <i>Wer<\/i>, <i>Wem<\/i>, <i>Wen<\/i> oder <i>Wo<\/i>?","erklaerung":"Du fragst: <i>Wem hilft Aylin im Garten?<\/i> – <i>ihrem Opa<\/i>. Mit <i>Wem?<\/i> fragt man nach dem Dativobjekt."},{"id":"gr-objekte-03","typ":"markieren","stufe":1,"kompetenz":"satzglieder","frage":"Markiere die Ortsangabe.","teile":[{"t":"Nach dem Unterricht"},{"t":"spielen"},{"t":"die Kinder"},{"t":"auf dem Bolzplatz","ziel":true},{"t":"Fußball"},{"t":".","fix":true}],"tipp":"Welche Wortgruppe antwortet auf die Frage <i>Wo?<\/i>","erklaerung":"<i>Wo spielen die Kinder Fußball?<\/i> – <i>auf dem Bolzplatz<\/i>. <i>Nach dem Unterricht<\/i> ist eine Zeitangabe (Wann?)."},{"id":"gr-objekte-04","typ":"zuordnen","stufe":2,"kompetenz":"satzglieder","frage":"Sortiere die Satzglieder aus den beiden Sätzen.","vorgabe":"Am Sonntag schenkt Leyla ihrem Bruder im Garten einen Fußball. Nach dem Spiel bringt Papa den Kindern Limonade auf die Terrasse.","gruppen":["Dativobjekt","Akkusativobjekt","Ortsangabe","Zeitangabe"],"elemente":[{"t":"Am Sonntag","g":3},{"t":"ihrem Bruder","g":0},{"t":"im Garten","g":2},{"t":"einen Fußball","g":1},{"t":"Nach dem Spiel","g":3},{"t":"den Kindern","g":0},{"t":"Limonade","g":1},{"t":"auf die Terrasse","g":2}],"tipp":"Stelle zu jedem Satzglied eine Frage mit dem Prädikat: <i>Wem …?<\/i>, <i>Wen oder was …?<\/i>, <i>Wo oder wohin …?<\/i> oder <i>Wann …?<\/i>","erklaerung":"<i>Wem?<\/i> – ihrem Bruder, den Kindern. <i>Wen oder was?<\/i> – einen Fußball, Limonade. <i>Wo oder wohin?<\/i> – im Garten, auf die Terrasse. <i>Wann?<\/i> – am Sonntag, nach dem Spiel. Achtung: <i>den Kindern<\/i> antwortet auf <i>Wem?<\/i>, obwohl <i>den<\/i> davorsteht."},{"id":"gr-objekte-05","typ":"luecke","stufe":2,"kompetenz":"satzglieder","frage":"Das Prädikat bestimmt, welches Objekt folgt. Wähle die richtige Form.","teile":[{"t":"Am Samstag gratuliert Mateo "},{"wahl":["seinen","seinem"],"loesung":1},{"t":" Opa zum Geburtstag. Danach fährt er mit dem Bus in die Stadt und dankt beim Aussteigen "},{"wahl":["dem","den"],"loesung":0},{"t":" Busfahrer. Dort besucht er "},{"wahl":["seiner","seine"],"loesung":1},{"t":" Tante."}],"tipp":"Bilde mit jedem Prädikat eine Frage. Klingt sie mit <i>Wem<\/i> oder mit <i>Wen<\/i> richtig?","erklaerung":"Die Verben <i>gratulieren<\/i> und <i>danken<\/i> brauchen ein Dativobjekt (Wem?): <i>seinem Opa<\/i>, <i>dem Busfahrer<\/i>. Das Verb <i>besuchen<\/i> braucht ein Akkusativobjekt (Wen?): <i>seine Tante<\/i>."},{"id":"gr-objekte-06","typ":"single","stufe":2,"kompetenz":"satzglieder","frage":"Hannah will den Satz um eine <b>Zeitangabe<\/b> erweitern. Welcher Satz passt?","vorgabe":"Die Kinder bauen eine Sandburg.","optionen":[{"text":"Die Kinder bauen am Nachmittag eine Sandburg.","richtig":true},{"text":"Die Kinder bauen am Badesee eine Sandburg.","richtig":false},{"text":"Die Kinder bauen ihrem Vater eine Sandburg.","richtig":false},{"text":"Die fröhlichen Kinder bauen eine Sandburg.","richtig":false}],"tipp":"Finde in jedem Satz das neue Wort oder die neue Wortgruppe. Mit welcher Frage kannst du danach fragen?","erklaerung":"Die Wortgruppe <i>am Nachmittag<\/i> antwortet auf die Frage <i>Wann?<\/i> – das ist eine Zeitangabe. Dagegen ist <i>am Badesee<\/i> eine Ortsangabe und <i>ihrem Vater<\/i> ein Dativobjekt. Das Adjektiv <i>fröhlichen<\/i> gehört zum Subjekt und ist kein eigenes Satzglied."},{"id":"gr-objekte-07","typ":"markieren","stufe":3,"kompetenz":"satzglieder","frage":"Markiere alle Zeitangaben.","teile":[{"t":"Seit Montag","ziel":true},{"t":"übt"},{"t":"Mia"},{"t":"jeden Nachmittag","ziel":true},{"t":"im Kinderzimmer"},{"t":"Flöte"},{"t":".","fix":true}],"tipp":"Frage bei jedem Satzglied: <i>Wann?<\/i>, <i>Seit wann?<\/i> oder <i>Wie oft?<\/i> Lass dich nicht von der Form der Wörter täuschen.","erklaerung":"<i>Seit Montag<\/i> antwortet auf <i>Seit wann?<\/i>, <i>jeden Nachmittag<\/i> auf <i>Wann?<\/i> oder <i>Wie oft?<\/i> – beides sind Zeitangaben. Dagegen ist <i>im Kinderzimmer<\/i> eine Ortsangabe und <i>Flöte<\/i> ein Akkusativobjekt (Was übt Mia?)."},{"id":"gr-objekte-08","typ":"matrix","stufe":3,"kompetenz":"satzglieder","frage":"Lies den Satz. Stimmen die Aussagen?","vorgabe":"Emir besucht am Sonntag in Mühlbach seine Oma.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Die Wortgruppe „in Mühlbach“ ist eine Zeitangabe.","richtig":false},{"text":"Ohne „seine Oma“ ist der Satz immer noch vollständig.","richtig":false},{"text":"Die Wortgruppe „seine Oma“ ist ein Akkusativobjekt.","richtig":true},{"text":"Ohne „am Sonntag“ ist der Satz immer noch vollständig.","richtig":true}],"tipp":"Lass das Satzglied in Gedanken weg und lies den Rest laut. Klingt der Satz fertig, oder fehlt etwas, das <i>besucht<\/i> unbedingt braucht?","erklaerung":"Die Wortgruppe <i>in Mühlbach<\/i> ist eine Ortsangabe (Wo?). <i>Wen besucht Emir?<\/i> – <i>seine Oma<\/i>: ein Akkusativobjekt, das <i>besuchen<\/i> unbedingt braucht. Zeit- und Ortsangaben wie <i>am Sonntag<\/i> kannst du weglassen."}]},{"id":"gr-faelle","titel":"Die vier Fälle","kurz":"Nominativ, Genitiv, Dativ und Akkusativ","kompetenz":"faelle","wissen":{"merksatz":"Jedes Nomen steht in einem der vier Fälle. Die Fallfrage verrät dir den Fall – und der Artikel zeigt ihn oft an.","punkte":["<b>1. Fall – Nominativ<\/b>: <i>Wer oder was<\/i> bellt? → <i>Der Hund<\/i> bellt.","<b>2. Fall – Genitiv<\/b>: <i>Wessen<\/i> Napf ist das? → Das ist der Napf <i>des Hundes<\/i>.","<b>3. Fall – Dativ<\/b>: <i>Wem<\/i> gebe ich Futter? → Ich gebe <i>dem Hund<\/i> Futter.","<b>4. Fall – Akkusativ<\/b>: <i>Wen oder was<\/i> streichle ich? → Ich streichle <i>den Hund<\/i>.","Je nach Fall verändern sich der Artikel (Begleiter), manchmal das Nomen und auch das Adjektiv: <i>der große Hund – des großen Hundes – dem großen Hund – den großen Hund<\/i>.","Auch nach <i>ein<\/i> ändert sich das Adjektiv: <i>ein großer Hund – eines großen Hundes – einem großen Hund – einen großen Hund<\/i>."],"beispiele":["der Hund – des Hundes – dem Hund – den Hund","die Katze – der Katze – der Katze – die Katze","das Pferd – des Pferdes – dem Pferd – das Pferd","die Hunde – der Hunde – den Hunden – die Hunde"]},"items":[{"id":"gr-faelle-01","typ":"zuordnen","stufe":1,"kompetenz":"faelle","frage":"In welchem Fall stehen die Wortgruppen? Sortiere sie.","gruppen":["Nominativ","Genitiv","Dativ","Akkusativ"],"elemente":[{"t":"der Apfel","g":0},{"t":"der Zug","g":0},{"t":"des Baumes","g":1},{"t":"des Vaters","g":1},{"t":"dem Lehrer","g":2},{"t":"dem Freund","g":2},{"t":"den Ball","g":3},{"t":"den Igel","g":3}],"tipp":"Alle Nomen sind männlich. Achte genau auf den Artikel und auf die Endung des Nomens.","erklaerung":"Bei männlichen Nomen zeigt der Artikel den Fall: <i>der<\/i> → Nominativ, <i>des<\/i> (und <i>-es<\/i> oder <i>-s<\/i> am Nomen) → Genitiv, <i>dem<\/i> → Dativ, <i>den<\/i> → Akkusativ."},{"id":"gr-faelle-02","typ":"single","stufe":1,"kompetenz":"faelle","frage":"In welchem Fall steht das fett gedruckte Satzglied?","vorgabe":"Elif streichelt <b>das Pony<\/b>.","optionen":[{"text":"Nominativ","richtig":false},{"text":"Genitiv","richtig":false},{"text":"Dativ","richtig":false},{"text":"Akkusativ","richtig":true}],"tipp":"Stelle die passende Fallfrage mit dem Prädikat: <i>Wer oder was …?<\/i>, <i>Wessen …?<\/i>, <i>Wem …?<\/i> oder <i>Wen oder was …?<\/i>","erklaerung":"<i>Wen oder was streichelt Elif?<\/i> – <i>das Pony<\/i>. Das ist der Akkusativ. Bei sächlichen Nomen heißt der Artikel im Nominativ und im Akkusativ gleich: <i>das<\/i>."},{"id":"gr-faelle-03","typ":"luecke","stufe":1,"kompetenz":"faelle","frage":"Wähle den richtigen Artikel.","teile":[{"t":"Im Streichelzoo gebe ich "},{"wahl":["den","dem","des"],"loesung":1},{"t":" Esel eine Karotte. Das Fell "},{"wahl":["dem","den","des"],"loesung":2},{"t":" Esels ist ganz struppig. Zum Abschied streichle ich "},{"wahl":["den","dem","des"],"loesung":0},{"t":" Esel noch einmal."}],"tipp":"Stelle zu jeder Lücke die passende Fallfrage. Achte auch auf die Endung von <i>Esel<\/i>.","erklaerung":"<i>Wem gebe ich eine Karotte?<\/i> – <i>dem Esel<\/i> (Dativ). <i>Wessen Fell?<\/i> – das Fell <i>des Esels<\/i> (Genitiv). <i>Wen streichle ich?<\/i> – <i>den Esel<\/i> (Akkusativ)."},{"id":"gr-faelle-04","typ":"markieren","stufe":2,"kompetenz":"faelle","frage":"Markiere alle Wortgruppen, die im Dativ stehen.","teile":[{"t":"Heute"},{"t":"zeigt"},{"t":"Paul"},{"t":"seinem Freund","ziel":true},{"t":"den neuen Fußball"},{"t":".","fix":true},{"t":"Später"},{"t":"bringt"},{"t":"er"},{"t":"der Nachbarin","ziel":true},{"t":"einen Blumenstrauß"},{"t":".","fix":true}],"tipp":"Stelle zu jedem Satz die Fallfrage für den Dativ. Verlass dich nicht nur auf den Artikel.","erklaerung":"<i>Wem zeigt Paul den Fußball?<\/i> – <i>seinem Freund<\/i>. <i>Wem bringt er einen Blumenstrauß?<\/i> – <i>der Nachbarin<\/i>. Beide stehen im Dativ. Die Wortgruppen <i>den neuen Fußball<\/i> und <i>einen Blumenstrauß<\/i> stehen im Akkusativ."},{"id":"gr-faelle-05","typ":"luecke","stufe":2,"kompetenz":"faelle","frage":"Auch Adjektive verändern sich. Wähle die richtige Form.","teile":[{"t":"Ein "},{"wahl":["kleiner","kleinen","kleines"],"loesung":0},{"t":" Igel sucht im Laub nach Futter. Die Stacheln des "},{"wahl":["kleinen","kleines","kleiner"],"loesung":0},{"t":" Igels sind spitz. Lena stellt dem "},{"wahl":["durstigen","durstiger","durstiges"],"loesung":0},{"t":" Igel eine Schale Wasser hin."}],"tipp":"Bestimme zuerst den Fall: <i>Wer oder was sucht?<\/i> – <i>Wessen Stacheln?<\/i> – <i>Wem stellt Lena Wasser hin?<\/i> Sprich dann die Wortgruppe leise mit jeder Form.","erklaerung":"Nominativ: <i>ein kleiner Igel<\/i>. Genitiv: <i>des kleinen Igels<\/i>. Dativ: <i>dem durstigen Igel<\/i>. Nach <i>des<\/i> und <i>dem<\/i> endet das Adjektiv auf <i>-en<\/i>."},{"id":"gr-faelle-06","typ":"eingabe","stufe":2,"kompetenz":"faelle","frage":"Setze <i>der Fuchs<\/i> in den Genitiv. Tippe Artikel und Nomen ein.","vorgabe":"Der Schwanz ___ ist lang und buschig.","loesungen":["des Fuchses"],"tipp":"Frage: <i>Wessen Schwanz?<\/i> Im Genitiv ändert sich der Artikel, und das Nomen bekommt eine Endung.","erklaerung":"Genitiv (Wessen?): <i>des Fuchses<\/i>. Weil <i>Fuchs<\/i> auf <i>s<\/i> endet, bekommt es im Genitiv die Endung <i>-es<\/i>."},{"id":"gr-faelle-07","typ":"matrix","stufe":3,"kompetenz":"faelle","frage":"Bestimme die Fälle. Stimmen die Aussagen?","vorgabe":"Die Tochter des Bäckers bringt den Gästen den Kuchen.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Die Wortgruppe „den Gästen“ steht im Akkusativ.","richtig":false},{"text":"Die Wortgruppe „des Bäckers“ steht im Genitiv.","richtig":true},{"text":"Die Wortgruppe „Die Tochter“ steht im Nominativ.","richtig":true},{"text":"Die Wortgruppe „den Kuchen“ steht im Akkusativ.","richtig":true}],"tipp":"Verlass dich nicht nur auf den Artikel. Stelle zu jeder Wortgruppe die Fallfrage und achte auch auf das Ende des Nomens.","erklaerung":"<i>Wem bringt sie den Kuchen?<\/i> – <i>den Gästen<\/i> (Dativ, Mehrzahl). <i>Wessen Tochter?<\/i> – <i>des Bäckers<\/i> (Genitiv). <i>Die Tochter<\/i> ist das Subjekt und steht im Nominativ, <i>den Kuchen<\/i> antwortet auf <i>Wen oder was?<\/i> (Akkusativ)."},{"id":"gr-faelle-08","typ":"multi","stufe":3,"kompetenz":"faelle","frage":"In welchen Sätzen steht <i>der Katze<\/i> im Dativ?","optionen":[{"text":"Oskar gibt der Katze frisches Wasser.","richtig":true},{"text":"Das Fell der Katze ist ganz weich.","richtig":false},{"text":"Der Katze gefällt das neue Kissen.","richtig":true},{"text":"Die Ohren der Katze sind spitz.","richtig":false},{"text":"Lena winkt der Katze zu.","richtig":true},{"text":"Der Napf der Katze ist leer.","richtig":false}],"tipp":"Ersetze <i>der Katze<\/i> in Gedanken durch <i>dem Kater<\/i> oder durch <i>des Katers<\/i>. Welche Form passt in den Satz?","erklaerung":"Bei <i>geben<\/i>, <i>gefallen<\/i> und <i>zuwinken<\/i> fragst du <i>Wem?<\/i> – dort steht <i>der Katze<\/i> im Dativ (<i>dem Kater<\/i>). Bei <i>Fell<\/i>, <i>Ohren<\/i> und <i>Napf<\/i> fragst du <i>Wessen?<\/i> – dort ist es Genitiv (<i>des Katers<\/i>)."}]}]},"schreiben":{"themen":[],"auftraege":[]},"tempo":{"saetze":[{"t":"Im Frühling blühen auf vielen Wiesen bunte Blumen.","r":true},{"t":"Ein Radiergummi macht Bleistiftstriche auf dem Papier dicker und dunkler.","r":false},{"t":"Ein Specht klopft mit seinem Schnabel Löcher in Baumstämme.","r":true},{"t":"In der Pause essen viele Kinder ihre Brotzeit.","r":true},{"t":"Eine reife Zitrone schmeckt genauso süß wie Honig.","r":false},{"t":"Ein Eichhörnchen sammelt im Herbst Nüsse für den Winter.","r":true},{"t":"In jeder Woche kommt der Montag direkt nach dem Dienstag.","r":false},{"t":"Mit ihrem langen Hals kommt die Giraffe an hohe Blätter heran.","r":true},{"t":"Ein Elefant ist viel kleiner als eine Maus.","r":false},{"t":"Mit einem Lineal kann man gerade Linien zeichnen.","r":true},{"t":"Am hellsten scheint die Sonne mitten in der Nacht.","r":false},{"t":"Ein Schneemann schmilzt, wenn es draußen sehr warm wird.","r":true},{"t":"Enten schwimmen gern auf Teichen und Seen herum.","r":true},{"t":"Eine Brille hilft manchen Menschen, besser zu sehen.","r":true},{"t":"Zum Schwimmen im Freibad zieht man einen dicken Wintermantel an.","r":false},{"t":"Bei einem Gewitter kann man Blitze sehen und Donner hören.","r":true},{"t":"Unser Mund hilft uns beim Essen, Trinken und Sprechen.","r":true},{"t":"Regentropfen fallen von der Erde nach oben in die Wolken.","r":false},{"t":"Ein Fußball hat Ecken und Kanten wie ein Würfel.","r":false},{"t":"Ein Kaninchen kann mit seinen Hinterbeinen weit springen.","r":true},{"t":"Wenn Bananen reif sind, wird ihre Schale meistens blau.","r":false},{"t":"Ein Kissen aus Federn ist härter als ein Stein.","r":false},{"t":"Ein neugeborenes Baby ist größer als seine Mutter.","r":false},{"t":"Ein Fisch hat keine Beine, sondern Flossen zum Schwimmen.","r":true},{"t":"Wir Menschen sehen mit den Ohren und hören mit den Augen.","r":false},{"t":"Viele Marienkäfer sind rot und haben schwarze Punkte.","r":true},{"t":"Eine Ameise kann ein ganzes Haus auf dem Rücken tragen.","r":false},{"t":"Auf den Herbst folgt im Jahreslauf immer der Winter.","r":true},{"t":"Im Sommer ist es meistens kälter als im Winter.","r":false},{"t":"Ein Wal ist das kleinste Tier im Meer.","r":false},{"t":"Ein Meter ist länger als ein Zentimeter, aber kürzer als ein Kilometer.","r":true},{"t":"Ein Hund kann mit seiner feinen Nase viel besser riechen als ein Mensch.","r":true},{"t":"Kühe stehen tagsüber oft auf der Weide und fressen dort Gras und Kräuter.","r":true},{"t":"Je öfter man das Lesen übt, desto schlechter und langsamer kann man lesen.","r":false},{"t":"Im eisigen Januar ist das Wasser im See am wärmsten und lädt zum Baden ein.","r":false},{"t":"Ein Igel hält im Sommer einen langen Winterschlaf, weil es dann so heiß ist.","r":false},{"t":"Wenn heute Mittwoch ist, dann ist morgen Donnerstag, und gestern war Freitag.","r":false},{"t":"Im Sommer sind die Tage länger als im Winter, deshalb ist es abends lange hell.","r":true},{"t":"Ein Eiswürfel, den man in der warmen Hand hält, wird mit der Zeit immer größer.","r":false},{"t":"Wirft man einen Ball hoch in die Luft, fällt er kurz danach wieder auf den Boden.","r":true},{"t":"Wenn heute Freitag ist, dann ist morgen Samstag, und übermorgen ist schon Sonntag.","r":true},{"t":"Nudeln werden vor dem Essen in der Gefriertruhe gekocht, bis sie schön weich sind.","r":false},{"t":"In der Bücherei kann man sich Bücher ausleihen und sie später wieder zurückbringen.","r":true},{"t":"Eine Katze, die sich wohlfühlt, bellt so laut wie ein großer Schäferhund im Garten.","r":false},{"t":"Für ihr Nest sammeln viele Vögel kleine Zweige, Moos, Gras und manchmal auch Federn.","r":true},{"t":"Weil Igel nachts auf Futtersuche gehen, sieht man sie tagsüber nur selten im Garten.","r":true},{"t":"Ein ganzes Jahr dauert zwar länger als ein Monat, aber kürzer als eine einzige Woche.","r":false},{"t":"Wenn es draußen dunkel wird, schalten viele Menschen in ihren Wohnungen das Licht an.","r":true},{"t":"Eine Schildkröte ist das schnellste Tier der Welt und überholt mühelos jedes Rennauto.","r":false},{"t":"Wenn man im Winter die Fenster lange weit offen lässt, wird es im Zimmer immer wärmer.","r":false},{"t":"Ein Korken schwimmt auf dem Wasser, ein Kieselstein dagegen sinkt sofort auf den Grund.","r":true},{"t":"Wer sich auf dem Pausenhof das Knie aufschürft, bekommt oft ein Pflaster auf die Wunde.","r":true},{"t":"Wer abends spät ins Bett geht und früh aufstehen muss, ist am nächsten Morgen oft müde.","r":true},{"t":"Wer seine Hausaufgaben vergessen hat, bekommt dafür in der Schule immer eine Belohnung.","r":false},{"t":"Wenn man im Dunkeln eine Taschenlampe einschaltet, wird es ringsherum noch viel dunkler.","r":false},{"t":"Nach dem Sportunterricht haben viele Kinder Durst und trinken gern einen Schluck Wasser.","r":true},{"t":"Ein Kind, das zehn Jahre alt ist, ist älter als ein Kind, das schon zwölf Jahre alt ist.","r":false},{"t":"Damit Milch im Sommer länger frisch bleibt, stellt man sie am besten in die warme Sonne.","r":false},{"t":"Im Winter ziehen viele Menschen kurze Hosen und Sandalen an, weil es draußen so kalt ist.","r":false},{"t":"Ein Thermometer zeigt an, wie warm oder kalt es ist, und eine Waage zeigt das Gewicht an.","r":true},{"t":"Ein Regenwurm hat ein buntes Federkleid und singt morgens laut auf den Dächern der Stadt.","r":false},{"t":"Weil Pflanzen Wasser zum Wachsen brauchen, gießt man Blumen an heißen Tagen besonders oft.","r":true},{"t":"Kinder, die morgens viel zu lange schlafen, kommen deshalb besonders früh in der Schule an.","r":false},{"t":"Je weiter man sich von einer lauten Blaskapelle entfernt, desto leiser hört man ihre Musik.","r":true},{"t":"Wer krank ist und hohes Fieber hat, sollte im Bett bleiben, sich ausruhen und viel trinken.","r":true},{"t":"Das Wasser im Topf fängt erst an zu kochen, wenn man die Herdplatte ganz ausgeschaltet hat.","r":false},{"t":"Weil es im Kino ganz still sein soll, unterhalten sich alle Zuschauer während des Films laut.","r":false},{"t":"Weil Schnee aus gefrorenem Wasser besteht, wird er zu Wasser, wenn die Sonne ihn lange wärmt.","r":true},{"t":"Auf einem Kalender kann man nachsehen, an welchem Wochentag man in diesem Jahr Geburtstag hat.","r":true},{"t":"Nachdem man sich die Hände gründlich mit Seife gewaschen hat, sind sie schmutziger als vorher.","r":false},{"t":"Bevor man über die Straße geht, schaut man nach links, nach rechts und noch einmal nach links.","r":true},{"t":"Ein Fahrradhelm schützt den Kopf nur dann gut, wenn e <script>
(function(){'use strict';
/* ---- 01-grundlagen.js ---- */
/* ===== Grundlagen: Hilfsfunktionen, Module, Inhaltsregister ===== */

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
/** Text mit erlaubtem Inline-Markup <b> und <i>. */
const rich = (s) => esc(s).replace(/&lt;(\/?)(b|i)&gt;/g, '<$1$2>');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((x, y) => x + y, 0);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const icon = (name, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;

function heute(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function datumLesbar(ts) {
  try {
    return new Date(ts).toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch (e) { return heute(new Date(ts)); }
}
function zeitLesbar(sek) {
  sek = Math.max(0, Math.round(sek));
  const m = Math.floor(sek / 60), s = sek % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}
/** Kleiner deterministischer Zufallsgenerator (für Tagesmission). */
function rng(seedStr) {
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h = (Math.imul(h, 1103515245) + 12345) >>> 0; return h / 4294967296; };
}

  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

}
/** Permutation 0..n-1, die nicht die Identität ist (wenn möglich). */
function permutation(n, nieIdentisch = false) {
  const basis = Array.from({ length: n }, (_, i) => i);
  let p = mische(basis);
  if (nieIdentisch && n > 1) {
    let tries = 0;
    while (p.every((v, i) => v === i) && tries++ < 10) p = mische(basis);
  }
  return p;
}
function plural(n, ein, mehr) { return `${n} ${n === 1 ? ein : mehr}`; }

/* ---------- Module ---------- */
const MODULE = [

  { id: 'rechtschreibung', titel: 'Rechtschreib-Labor', kurz: 'Strategien: mitsprechen, nachdenken, merken – plus Diktat', farbe: 'var(--m-rechtschreibung)', icon: 'rechtschreibung', gruppeName: 'Thema' },

];
const MODUL = Object.fromEntries(MODULE.map((m) => [m.id, m]));

const KOMPETENZEN = {

const TYP_HINWEIS = {

  multi: 'Wähle alle richtigen Antworten aus. Es sind mehrere richtig.',

/* ---------- Inhaltsregister ---------- */
const REG = { items: {}, gruppen: {}, module: {} };
function baueRegister() {
  for (const m of MODULE) REG.module[m.id] = { gruppen: [], items: [] };
  const neueGruppe = (modul, art, daten, titel, extra = {}) => {
    const g = { id: daten.id, modul, art, titel, daten, items: [], ...extra };
    REG.gruppen[g.id] = g;
    REG.module[modul].gruppen.push(g.id);
    for (const it of daten.items || []) {
      if (!it || !it.id || REG.items[it.id]) continue;
      REG.items[it.id] = { it, modul, gruppe: g.id };
      g.items.push(it.id);
      REG.module[modul].items.push(it.id);

    return g;

  const faelle = (INHALT.digital || []).slice().sort((a, b) => (a.nummer || 0) - (b.nummer || 0));
  for (const f of faelle) neueGruppe('digital', 'fall', f, f.titel);
