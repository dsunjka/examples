<script>window.LL_INHALT={"digital":[{"id":"fall1","nummer":1,"titel":"Ein Igel am helllichten Tag","quellenart":"Suchmaschine","einleitung":"Heute ist Mittwoch, der 4. November 2026. Am Nachmittag entdeckt Elif (9) im Garten einen kleinen Igel, der im Hellen herumläuft. Ihr Papa zieht dicke Handschuhe an und wiegt den Igel vorsichtig auf der Küchenwaage: 380 g. Auf Papas Tablet sucht Elif mit der Suchmaschine „Suchfuchs“ heraus, was die beiden jetzt tun sollen.","rahmen":"browser","app":{"name":"Suchfuchs","symbol":"🦊","farbe":"orange"},"startseite":"start","seiten":[{"id":"start","titel":"Igel tagsüber im Garten – Suchfuchs","adresse":"www.suchfuchs.de/suche?q=igel+tagsueber+im+garten","farbe":"orange","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🦊 Suchfuchs<\/div><\/div><div class=\"s-suchfeld\">Igel tagsüber im Garten<\/div><div class=\"s-filter\"><a class=\"aktiv\" data-ziel=\"start\">Alle<\/a><a data-extern>Bilder<\/a><a data-extern>Videos<\/a><a data-extern>Lexikon<\/a><a data-extern>Karten<\/a><\/div><p class=\"s-anzahl\">Ungefähr 18.400 Ergebnisse<\/p><div class=\"s-treffer s-anzeige\"><span class=\"s-anzeige-label\">Anzeige<\/span><div class=\"s-url\">www.stachelglueck-shop.de<\/div><a class=\"s-titel\" data-extern>Stachelglück Igel-Müsli – rettet jeden schwachen Igel!<\/a><p class=\"s-text\">Mit Apfel, Rosinen und Nüssen! Macht jeden Igel in nur 3 Tagen kugelrund. Tierärzte sind begeistert! Jetzt 3 Dosen kaufen, 1 Dose gratis!<\/p><\/div><div class=\"s-treffer s-anzeige\"><span class=\"s-anzeige-label\">Anzeige<\/span><div class=\"s-url\">www.igelparadies-shop.de<\/div><a class=\"s-titel\" data-extern>Igelparadies: Igelhaus „Stachelburg“ – nur heute 50 % billiger!<\/a><p class=\"s-text\">Ohne ein gutes Igelhaus übersteht kein Igel den Winter! Jetzt bestellen und Igel retten. Gratis-Futterschale dazu!<\/p><\/div><div class=\"s-treffer\"><div class=\"s-url\">www.gartenplausch-forum.de › tiere › igel-im-garten<\/div><a class=\"s-titel\" data-ziel=\"forum\">Igel im Garten – was füttern??? | Gartenplausch-Forum<\/a><p class=\"s-text\">Hallo Leute, bei mir läuft seit gestern ein kleiner Igel herum, sogar mittags. Ich habe ihm ein Schälchen Milch und ein paar Apfelstücke hingestellt …<\/p><div class=\"s-info\">Forum · 14.09.2011 · 3 Antworten<\/div><\/div><div class=\"s-treffer\"><div class=\"s-url\">www.igelhilfe-holunderau.de › igel-gefunden<\/div><a class=\"s-titel\" data-ziel=\"hilfe\">Igel gefunden – was tun? | Igelhilfe Holunderau e. V.<\/a><p class=\"s-text\">Läuft ein Igel im Spätherbst am Tag herum, ist er oft krank oder zu leicht. Wir pflegen solche Igel in unserer Station und erklären, was du tun kannst …<\/p><div class=\"s-info\">Igelstation · aktualisiert am 15.10.2026<\/div><\/div><div class=\"s-treffer\"><div class=\"s-url\">www.zappelclip-video.de › tiertimo<\/div><a class=\"s-titel\" data-extern>IGEL GERETTET!!! 😱 Was dann passiert, glaubt ihr nie …<\/a><p class=\"s-text\">▶ 6:12 · Kanal „TierTimo“ · 1,2 Mio. Aufrufe<\/p><div class=\"s-info\">Video · vor 3 Jahren<\/div><\/div><div class=\"s-treffer\"><div class=\"s-url\">www.wissensbaum-lexikon.de › tiere › igel<\/div><a class=\"s-titel\" data-ziel=\"lexikon\">Igel – Wissensbaum, das Kinderlexikon<\/a><p class=\"s-text\">Igel sind kleine Säugetiere mit Tausenden von Stacheln. Sie sind nachtaktiv und halten einen langen Winterschlaf …<\/p><div class=\"s-info\">Kinderlexikon · 2025<\/div><\/div>"},{"id":"hilfe","titel":"Igel gefunden – was tun? | Igelhilfe Holunderau","adresse":"www.igelhilfe-holunderau.de/igel-gefunden","farbe":"gruen","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🦔 Igelhilfe Holunderau e. V.<\/div><div class=\"w-menue\"><a data-ziel=\"station\">Start<\/a><a class=\"aktiv\" data-ziel=\"hilfe\">Igel gefunden?<\/a><a data-extern>Über uns<\/a><a data-ziel=\"kontakt\">Kontakt<\/a><\/div><\/div><div class=\"w-inhalt\"><h1>Igel gefunden – was tun?<\/h1><p class=\"w-datum\">Aktualisiert am 15. Oktober 2026<\/p><p>Die meisten Igel brauchen keine Hilfe. Igel sind nachtaktiv: Tagsüber schlafen sie in einem Nest aus Laub. Von etwa November bis März halten sie Winterschlaf. Vorher müssen sie sich ein dickes Fettpolster anfressen.<\/p><h2>Braucht der Igel Hilfe?<\/h2><table class=\"w-tabelle\"><thead><tr><th>Das beobachtest du<\/th><th>Das tust du<\/th><\/tr><\/thead><tbody><tr><td>Der Igel ist verletzt, blutet oder humpelt.<\/td><td>Notfall! Sofort anrufen.<\/td><\/tr><tr><td>Der Igel läuft im Spätherbst oder Winter am Tag herum oder torkelt.<\/td><td>Er ist wahrscheinlich krank. Sichern und anrufen.<\/td><\/tr><tr><td>Ein junger Igel wiegt im November weniger als 500 g.<\/td><td>Er ist zu leicht für den Winterschlaf. Sichern und anrufen.<\/td><\/tr><tr><td>Der Igel wiegt im November 500 g oder mehr, ist munter und nur nachts unterwegs.<\/td><td>Er ist gesund. Lass ihn in Ruhe!<\/td><\/tr><\/tbody><\/table><p class=\"w-klein\">Du erreichst uns gerade nicht? Außerhalb unserer Telefonzeiten hilft dir ein Tierarzt weiter (siehe „Kontakt“).<\/p><h2>Erste Hilfe – so hilfst du richtig<\/h2><ol><li>Hol einen Erwachsenen dazu.<\/li><li>Zieh dicke Handschuhe an.<\/li><li>Setz den Igel in einen hohen Karton mit Zeitungspapier und einem alten Handtuch.<\/li><li>Stell den Karton in einen ruhigen, warmen Raum.<\/li><li>Biete ihm ein flaches Schälchen Wasser und etwas Katzenfutter an.<\/li><li>Wasch dir danach gründlich die Hände.<\/li><li>Ruf uns an! Wir sagen dir, wie es weitergeht.<\/li><\/ol><div class=\"w-kasten w-kasten--warnung\"><strong>Bitte niemals füttern:<\/strong><ul><li>Milch – davon bekommen Igel schlimmen Durchfall<\/li><li>Obst und Rosinen<\/li><li>Nüsse und Brot<\/li><\/ul><p>Igel fressen vor allem Käfer, Raupen und Regenwürmer.<\/p><\/div><\/div><div class=\"w-fuss\"><a data-extern>Impressum<\/a> · <a data-extern>Datenschutz<\/a> · © 2026 Igelhilfe Holunderau e. V.<\/div>"},{"id":"station","titel":"Igelhilfe Holunderau e. V.","adresse":"www.igelhilfe-holunderau.de","farbe":"gruen","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🦔 Igelhilfe Holunderau e. V.<\/div><div class=\"w-menue\"><a class=\"aktiv\" data-ziel=\"station\">Start<\/a><a data-ziel=\"hilfe\">Igel gefunden?<\/a><a data-extern>Über uns<\/a><a data-ziel=\"kontakt\">Kontakt<\/a><\/div><\/div><div class=\"w-inhalt\"><h1>Willkommen bei der Igelhilfe!<\/h1><div class=\"w-bild\"><span>🦔<\/span><small>Foto: Igel „Krümel“ in unserer Station<\/small><\/div><p>Wir sind ein Verein von Igelfreunden aus Holunderau. Seit 2009 kümmern wir uns um kranke, verletzte und zu leichte Igel. Im Frühling lassen wir sie wieder frei.<\/p><div class=\"w-kasten w-kasten--warnung\"><strong>Herbst 2026: Unsere Station ist fast voll!<\/strong> Bitte bring keinen Igel vorbei, ohne vorher anzurufen.<br>Igel-Telefon: 0123 456789<\/div><div class=\"w-karte\"><h3>Termin<\/h3><p>Igel-Nachmittag für Kinder: Samstag, 14. November 2026, 14 bis 16 Uhr<\/p><\/div><a class=\"w-knopf\" data-ziel=\"hilfe\">Igel gefunden? Hier erfährst du, was zu tun ist.<\/a><\/div><div class=\"w-fuss\"><a data-extern>Impressum<\/a> · <a data-extern>Datenschutz<\/a> · © 2026 Igelhilfe Holunderau e. V.<\/div>"},{"id":"kontakt","titel":"Kontakt | Igelhilfe Holunderau","adresse":"www.igelhilfe-holunderau.de/kontakt","farbe":"gruen","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🦔 Igelhilfe Holunderau e. V.<\/div><div class=\"w-menue\"><a data-ziel=\"station\">Start<\/a><a data-ziel=\"hilfe\">Igel gefunden?<\/a><a data-extern>Über uns<\/a><a class=\"aktiv\" data-ziel=\"kontakt\">Kontakt<\/a><\/div><\/div><div class=\"w-inhalt\"><h1>Kontakt<\/h1><div class=\"w-kasten w-kasten--info\"><strong>Igel-Telefon: 0123 456789<\/strong><\/div><h2>Telefonzeiten<\/h2><table class=\"w-tabelle\"><thead><tr><th>Tag<\/th><th>Uhrzeit<\/th><\/tr><\/thead><tbody><tr><td>Montag bis Freitag<\/td><td>9 bis 12 Uhr und 15 bis 18 Uhr<\/td><\/tr><tr><td>Samstag und Sonntag<\/td><td>10 bis 12 Uhr<\/td><\/tr><\/tbody><\/table><p>Außerhalb dieser Zeiten hilft dir die Tierarztpraxis Dr. Lehner weiter: 0123 654321.<\/p><p><strong>Bitte bring keinen Igel vorbei, ohne vorher anzurufen!<\/strong><\/p><h2>Adresse<\/h2><p>Igelstation Holunderau<br>Am Mühlbach 7<br>E-Mail: info@igelhilfe-holunderau.de<\/p><\/div><div class=\"w-fuss\"><a data-extern>Impressum<\/a> · <a data-extern>Datenschutz<\/a> · © 2026 Igelhilfe Holunderau e. V.<\/div>"},{"id":"forum","titel":"Igel im Garten – was füttern??? | Gartenplausch-Forum","adresse":"www.gartenplausch-forum.de/tiere/igel-im-garten","farbe":"grau","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🌻 Gartenplausch-Forum<\/div><div class=\"w-menue\"><a class=\"aktiv\" data-ziel=\"forum\">Forum<\/a><a data-extern>Gartentipps<\/a><a data-extern>Anmelden<\/a><\/div><\/div><div class=\"w-inhalt\"><p class=\"w-klein\">Forum › Tiere im Garten › Igel<\/p><h1>Igel im Garten – was füttern???<\/h1><div class=\"w-karte\"><p><span class=\"w-autor\">Gartenzwerg_Rudi<\/span> · <span class=\"w-datum\">14.09.2011, 21:47 Uhr<\/span><\/p><p>Hallo Leute, bei mir läuft seit gestern ein kleiner Igel herum, sogar mittags. Ich habe ihm ein Schälchen Milch und ein paar Apfelstücke hingestellt. Die Milch hat er sofort ausgeschlabbert!!! 😊 Mein Tipp an alle: Stellt Igeln Milch und Obst hin, das lieben sie!<\/p><\/div><div class=\"w-karte\"><p><span class=\"w-autor\">Wiesenfee<\/span> · <span class=\"w-datum\">15.09.2011, 8:12 Uhr<\/span><\/p><p>Bitte keine Milch! Davon bekommen Igel Durchfall. Gib ihm lieber ein flaches Schälchen Wasser und etwas Katzenfutter. Ruf am besten auch eine Igelstation an.<\/p><\/div><details><summary>2 weitere Antworten anzeigen<\/summary><div class=\"w-karte\"><p><span class=\"w-autor\">Sonnenblume_88<\/span> · <span class=\"w-datum\">15.09.2011, 19:30 Uhr<\/span><\/p><p>Ach was, Igel sind Wildtiere. Die kommen immer allein klar. Lass ihn einfach laufen!<\/p><\/div><div class=\"w-karte\"><p><span class=\"w-autor\">Kaktus_Karl<\/span> · <span class=\"w-datum\">16.09.2011, 10:05 Uhr<\/span><\/p><p>Ein Igel, der am Tag herumläuft, ist oft krank. Setz ihn in einen hohen Karton mit Zeitungspapier und ruf eine Igelstation an.<\/p><\/div><\/details><\/div><div class=\"w-fuss\"><a data-extern>Forenregeln<\/a> · <a data-extern>Datenschutz<\/a><\/div>"},{"id":"lexikon","titel":"Igel – Wissensbaum","adresse":"www.wissensbaum-lexikon.de/tiere/igel","farbe":"blau","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🌳 Wissensbaum – das Kinderlexikon<\/div><div class=\"w-menue\"><a class=\"aktiv\" data-ziel=\"lexikon\">Tiere<\/a><a data-extern>Pflanzen<\/a><a data-extern>Technik<\/a><a data-extern>Geschichte<\/a><\/div><\/div><div class=\"w-inhalt\"><h1>Igel<\/h1><p class=\"w-datum\">Zuletzt bearbeitet: 3. März 2025<\/p><div class=\"w-bild\"><span>🦔<\/span><small>Foto: Igel im Herbstlaub<\/small><\/div><p>Igel sind kleine Säugetiere. Auf dem Rücken tragen sie 6000 bis 8000 Stacheln. Bei Gefahr rollen sie sich zu einer Stachelkugel zusammen.<\/p><p>Igel sind nachtaktiv. Erst in der Dämmerung gehen sie auf Futtersuche. Sie fressen vor allem Käfer, Raupen, Regenwürmer und Schnecken. Dabei schmatzen und schnaufen sie oft laut.<\/p><p>Im Herbst fressen sich Igel ein Fettpolster an. Von etwa November bis März halten sie Winterschlaf in einem Nest aus Laub. Ihr Körper kühlt dann stark ab, und ihr Herz schlägt ganz langsam.<\/p><h2>Steckbrief<\/h2><table class=\"w-tabelle\"><tbody><tr><th>Länge<\/th><td>20 bis 30 cm<\/td><\/tr><tr><th>Gewicht (erwachsen)<\/th><td>800 bis 1500 g<\/td><\/tr><tr><th>Lebensraum<\/th><td>Gärten, Parks, Hecken, Waldränder<\/td><\/tr><tr><th>Feinde<\/th><td>Uhu, Dachs, Fuchs<\/td><\/tr><\/tbody><\/table><\/div><div class=\"w-fuss\"><a data-extern>Impressum<\/a> · <a data-extern>Datenschutz<\/a> · Wissensbaum – Wissen für Kinder<\/div>"}],"items":[{"id":"d1-1","typ":"multi","stufe":2,"kompetenz":"bewerten","frage":"Elif sieht sich die Trefferliste genau an. Welche Aussagen über die Treffer stimmen?","optionen":[{"text":"„Stachelglück“ und „Igelparadies“ haben bezahlt, damit ihre Treffer ganz oben stehen.","richtig":true},{"text":"Der Forumsbeitrag ist schon 15 Jahre alt. Sein Rat könnte veraltet oder falsch sein.","richtig":true},{"text":"Die Seite der Igelhilfe ist aktuell und kommt von Leuten, die selbst Igel pflegen.","richtig":true},{"text":"„Stachelglück“ ist glaubwürdig, denn in der Anzeige steht, dass Tierärzte begeistert sind.","richtig":false},{"text":"Das Video wurde über eine Million Mal angeschaut. Darum kann Elif ihm sicher vertrauen.","richtig":false},{"text":"Das Kinderlexikon ist von 2025. Darum ist es zu alt, um ihm noch zu vertrauen.","richtig":false}],"tipp":"Achte auf das Wort „Anzeige“ und auf die Datumsangaben. Frag dich bei jedem Treffer: Wer hat das geschrieben – und warum?","tippSeite":"start","erklaerung":"„Anzeige“ bedeutet: Die Firmen haben für den Platz bezahlt und wollen etwas verkaufen. Der Forumsbeitrag ist von 2011, die Seite der Igelhilfe dagegen vom Oktober 2026 und von Fachleuten. Viele Aufrufe oder Werbesprüche beweisen nichts, und ein Lexikon von 2025 ist nicht veraltet."},{"id":"d1-2","typ":"multi","stufe":2,"kompetenz":"finden","frage":"Woran erkennst du laut der Igelhilfe, dass ein Igel Hilfe braucht?","optionen":[{"text":"Er läuft im Spätherbst mitten am Tag herum.","richtig":true},{"text":"Er wiegt im November weniger als 500 g.","richtig":true},{"text":"Er humpelt oder torkelt beim Laufen.","richtig":true},{"text":"Er wiegt im November 500 g oder mehr.","richtig":false},{"text":"Er schläft tagsüber in einem Nest aus Laub.","richtig":false},{"text":"Er frisst sich im Herbst ein Fettpolster an.","richtig":false}],"tipp":"Öffne den Treffer der Igelhilfe. Lies in der Tabelle genau die Zeilen, in denen steht, dass du anrufen sollst. Achte dabei genau auf das Gewicht und die Tageszeit.","tippSeite":"hilfe","erklaerung":"Laut Tabelle sollst du anrufen, wenn ein Igel humpelt, torkelt, im Spätherbst am Tag herumläuft oder im November weniger als 500 g wiegt. Mit 500 g oder mehr ist er schwer genug. Tagsüber im Laubnest schlafen und sich im Herbst ein Fettpolster anfressen ist ganz normal."},{"id":"d1-3","typ":"luecke","stufe":2,"kompetenz":"navigieren","frage":"Elif will die Igelhilfe anrufen. Finde über das Menü der Igelhilfe heraus, wann dort jemand ans Telefon geht. Ergänze dann die Sätze.","teile":[{"t":"Die Telefonzeiten stehen unter dem Menüpunkt "},{"wahl":["„Start“","„Igel gefunden?“","„Über uns“","„Kontakt“"],"loesung":3},{"t":". Heute ist Mittwoch. Am Nachmittag kann Elif die Igelhilfe ab "},{"wahl":["10 Uhr","12 Uhr","15 Uhr","18 Uhr"],"loesung":2},{"t":" erreichen. Wenn sie erst um 19 Uhr anruft, bekommt sie Hilfe unter der Nummer "},{"wahl":["0123 456789","0123 645321","0123 654321","0123 654312"],"loesung":2},{"t":"."}],"tipp":"Tippe auf der Website der Igelhilfe die Menüpunkte an und suche nach Uhrzeiten. Überlege dann, in welche Zeile der Tabelle der Mittwoch gehört. Lies auch den Satz unter der Tabelle und vergleiche die Nummern Ziffer für Ziffer.","tippSeite":"station","erklaerung":"Die Telefonzeiten stehen unter „Kontakt“. Mittwoch gehört zu „Montag bis Freitag“: Am Nachmittag geht ab 15 Uhr jemand ans Telefon, aber nur bis 18 Uhr. Danach hilft die Tierarztpraxis Dr. Lehner unter 0123 654321 weiter."},{"id":"d1-4","typ":"matrix","stufe":3,"kompetenz":"verknuepfen","frage":"Im Gartenplausch-Forum geben vier Leute einen Rat. Vergleiche jeden Rat mit den Tipps der Igelhilfe. Passt der Rat zu dem, was die Igelhilfe für Elifs Igel empfiehlt?","spalten":["passt","passt nicht"],"aussagen":[{"text":"Der Rat von „Gartenzwerg_Rudi“","richtig":false},{"text":"Der Rat von „Wiesenfee“","richtig":true},{"text":"Der Rat von „Sonnenblume_88“","richtig":false},{"text":"Der Rat von „Kaktus_Karl“","richtig":true}],"tipp":"Öffne den Forumsbeitrag und tippe auf „2 weitere Antworten anzeigen“. Vergleiche jeden Rat mit den Tipps auf der Seite der Igelhilfe. Denk an das Gewicht von Elifs Igel und an die Tageszeit.","tippSeite":"forum","erklaerung":"Wiesenfee (Wasser, Katzenfutter, Igelstation anrufen) und Kaktus_Karl (Karton, Igelstation anrufen) raten dasselbe wie die Igelhilfe. Milch und Obst (Gartenzwerg_Rudi) schaden Igeln. Elifs Igel läuft am Tag herum und wiegt nur 380 g, darum passt „einfach laufen lassen“ (Sonnenblume_88) nicht."}]},{"id":"fall2","nummer":2,"titel":"Ausflug ins Staunwerk","quellenart":"Website","einleitung":"Die Klasse 4b (24 Kinder, alle 9 oder 10 Jahre alt) möchte mit ihren zwei Lehrkräften, Frau Yilmaz und Herrn Brandl, das Mitmach-Museum „Staunwerk“ in Talbrunn besuchen. Der Ausflug soll an einem Tag in der Schulwoche vom 23. bis 27. November 2026 stattfinden. Heute ist Dienstag, der 10. November 2026. Hilf Frau Yilmaz, auf der Website des Museums alles Wichtige herauszufinden.","rahmen":"browser","startseite":"start","seiten":[{"id":"start","titel":"Staunwerk Talbrunn – Startseite","adresse":"www.staunwerk-talbrunn.de","farbe":"tuerkis","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🔬 Staunwerk Talbrunn<\/div><small class=\"w-klein\">Mitmach-Museum für Naturwissenschaften<\/small><\/div><div class=\"w-menue\"><a data-ziel=\"start\" class=\"aktiv\">Start<\/a><a data-ziel=\"preise\">Öffnungszeiten &amp; Preise<\/a><a data-ziel=\"labore\">Mitmach-Labore<\/a><a data-ziel=\"anfahrt\">Anfahrt<\/a><a data-ziel=\"fragen\">Häufige Fragen<\/a><\/div><div class=\"w-inhalt\"><h1>Willkommen im Staunwerk!<\/h1><p>Auf drei Stockwerken warten über 120 Mitmach-Stationen auf euch: Lasst einen Tornado aus Nebel entstehen oder legt euch auf ein Nagelbett!<\/p><div class=\"w-bild\"><span>🌪️<\/span><small>Foto: Die Nebel-Tornado-Station im ersten Stock<\/small><\/div><div class=\"w-spalten\"><div><h2>Neuigkeiten<\/h2><div class=\"w-karte\"><time class=\"w-datum\">3. November 2026<\/time><h3>Umbau im Farben-Labor<\/h3><p>Vom 23. bis 25. November bekommt unser Farben-Labor neue Tische und Waschbecken. An diesen Tagen finden dort keine Termine statt. Ab Donnerstag, 26. November, könnt ihr wieder mitforschen!<\/p><\/div><div class=\"w-karte\"><time class=\"w-datum\">28. Oktober 2026<\/time><h3><span class=\"w-marke\">NEU<\/span> Das Riesen-Kaleidoskop<\/h3><p>Im ersten Stock steht jetzt ein Kaleidoskop, in das ihr hineinklettern könnt.<\/p><\/div><\/div><div><div class=\"w-karte\"><h2>Mit der Klasse ins Staunwerk<\/h2><p>Ihr plant einen Klassenausflug? Dann bucht ein Mitmach-Labor dazu!<\/p><a class=\"w-knopf\" data-ziel=\"labore\">Zu den Mitmach-Laboren<\/a><\/div><div class=\"w-werbung\"><span class=\"w-werbung-label\">Anzeige<\/span><strong>Sternhafer Knusper-Rakete 🚀<\/strong><p>Der Pausen-Riegel für echte Forscher! Jetzt neu mit Schoko-Sternen.<\/p><a class=\"w-knopf\" data-extern>Jetzt probieren<\/a><\/div><\/div><\/div><\/div><div class=\"w-fuss\"><a data-ziel=\"kontakt\">Kontakt &amp; Impressum<\/a> · <a data-extern>Datenschutz<\/a> · <small>© 2026 Staunwerk Talbrunn<\/small><\/div>"},{"id":"preise","titel":"Öffnungszeiten & Preise","adresse":"www.staunwerk-talbrunn.de/besuch/preise","farbe":"tuerkis","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🔬 Staunwerk Talbrunn<\/div><small class=\"w-klein\">Mitmach-Museum für Naturwissenschaften<\/small><\/div><div class=\"w-menue\"><a data-ziel=\"start\">Start<\/a><a data-ziel=\"preise\" class=\"aktiv\">Öffnungszeiten &amp; Preise<\/a><a data-ziel=\"labore\">Mitmach-Labore<\/a><a data-ziel=\"anfahrt\">Anfahrt<\/a><a data-ziel=\"fragen\">Häufige Fragen<\/a><\/div><div class=\"w-inhalt\"><h1>Öffnungszeiten &amp; Preise<\/h1><h2>Öffnungszeiten<\/h2><table class=\"w-tabelle\"><thead><tr><th>Tag<\/th><th>Geöffnet<\/th><\/tr><\/thead><tbody><tr><td>Montag<\/td><td>Ruhetag – geschlossen<\/td><\/tr><tr><td>Dienstag bis Freitag<\/td><td>9:00–17:00 Uhr<\/td><\/tr><tr><td>Samstag, Sonntag und Feiertage<\/td><td>10:00–18:00 Uhr<\/td><\/tr><\/tbody><\/table><p><strong>Letzter Einlass:<\/strong> immer eine Stunde vor Schließung.<\/p><div class=\"w-kasten w-kasten--info\"><strong>Ferien und Feiertage:<\/strong> In den bayerischen Schulferien ist täglich von 10:00 bis 18:00 Uhr geöffnet – auch montags. Am 24., 25. und 31. Dezember bleibt das Staunwerk geschlossen.<\/div><h2>Eintrittspreise<\/h2><table class=\"w-tabelle\"><thead><tr><th>Eintritt<\/th><th>Preis<\/th><\/tr><\/thead><tbody><tr><td>Erwachsene<\/td><td>9,00 €<\/td><\/tr><tr><td>Kinder und Jugendliche (6 bis 17 Jahre)<\/td><td>5,50 €<\/td><\/tr><tr><td>Kinder unter 6 Jahren<\/td><td>frei<\/td><\/tr><tr><td>Ermäßigt (Studierende, Menschen mit Behinderung)<\/td><td>6,50 €<\/td><\/tr><tr><td>Schulklassen ab 10 Kindern, pro Kind<\/td><td>4,00 €<\/td><\/tr><\/tbody><\/table><div class=\"w-kasten w-kasten--tipp\"><strong>Für Schulklassen:<\/strong> Zwei Begleitpersonen pro Klasse haben freien Eintritt. Jede weitere Begleitperson zahlt 5,00 €. Die Mitmach-Labore kosten zusätzlich zum Eintritt.<\/div><p class=\"w-klein\">Stand der Preise: 1. September 2026<\/p><\/div><div class=\"w-fuss\"><a data-ziel=\"kontakt\">Kontakt &amp; Impressum<\/a> · <a data-extern>Datenschutz<\/a> · <small>© 2026 Staunwerk Talbrunn<\/small><\/div>"},{"id":"labore","titel":"Mitmach-Labore","adresse":"www.staunwerk-talbrunn.de/mitmach-labore","farbe":"tuerkis","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🔬 Staunwerk Talbrunn<\/div><small class=\"w-klein\">Mitmach-Museum für Naturwissenschaften<\/small><\/div><div class=\"w-menue\"><a data-ziel=\"start\">Start<\/a><a data-ziel=\"preise\">Öffnungszeiten &amp; Preise<\/a><a data-ziel=\"labore\" class=\"aktiv\">Mitmach-Labore<\/a><a data-ziel=\"anfahrt\">Anfahrt<\/a><a data-ziel=\"fragen\">Häufige Fragen<\/a><\/div><div class=\"w-inhalt\"><h1>Mitmach-Labore für Schulklassen<\/h1><p>In unseren Laboren forscht ihr mit echten Geräten.<\/p><div class=\"w-kasten w-kasten--info\"><strong>So bucht ihr ein Labor:<\/strong> Ein Labor wird immer für die ganze Klasse gebucht. Die Klasse kann dafür nicht geteilt werden. Alle Begleitpersonen der Klasse nehmen am Labor teil. Lehrkräfte melden ihre Klasse telefonisch beim Besucherservice an. Die Telefonnummer steht unter <a data-ziel=\"kontakt\">Kontakt &amp; Impressum<\/a>. Der Laborpreis kommt zum Eintritt dazu.<\/div><div class=\"w-karte\"><h2>⚡ Strom-Detektive<\/h2><p>Wie kommt der Strom in die Lampe? Ihr baut eigene Stromkreise und testet, welche Dinge Strom leiten.<\/p><dl><dt>Alter<\/dt><dd>8 bis 11 Jahre<\/dd><dt>Termine<\/dt><dd>dienstags und donnerstags, 9:30 Uhr<\/dd><dt>Dauer<\/dt><dd>90 Minuten<\/dd><dt>Gruppe<\/dt><dd>höchstens 28 Kinder<\/dd><dt>Preis<\/dt><dd>3,00 € pro Kind<\/dd><dt>Anmeldung<\/dt><dd>spätestens 7 Tage vorher<\/dd><\/dl><\/div><div class=\"w-karte\"><h2>🚀 Raketen-Werkstatt<\/h2><p>Warum fliegt eine Rakete? Ihr lasst Luftballon-Raketen an einer Schnur sausen und lernt den Rückstoß kennen.<\/p><dl><dt>Alter<\/dt><dd>9 bis 12 Jahre<\/dd><dt>Termine<\/dt><dd>mittwochs und freitags, 10:00 Uhr<\/dd><dt>Dauer<\/dt><dd>2 Stunden<\/dd><dt>Gruppe<\/dt><dd>höchstens 25 Personen (Kinder und Begleitpersonen zusammen)<\/dd><dt>Preis<\/dt><dd>4,00 € pro Kind<\/dd><dt>Anmeldung<\/dt><dd>spätestens 7 Tage vorher<\/dd><\/dl><\/div><div class=\"w-kasten w-kasten--tipp\"><strong>Für Nachwuchs-Forscher:<\/strong> Das Strom-Set „Blitzbox“ für zu Hause gibt es in unserem Museumsshop – jetzt nur 19,99 € statt 24,99 €! Schnell zugreifen!<\/div><div class=\"w-karte\"><h2>🎨 Farben-Labor<\/h2><p>Steckt in einem schwarzen Filzstift nur Schwarz? Ihr trennt Farben mit Wasser und Filterpapier und lasst Rotkohlsaft die Farbe wechseln.<\/p><dl><dt>Alter<\/dt><dd>7 bis 10 Jahre<\/dd><dt>Termine<\/dt><dd>dienstags bis freitags, 11:00 Uhr<\/dd><dt>Dauer<\/dt><dd>60 Minuten<\/dd><dt>Gruppe<\/dt><dd>höchstens 30 Kinder<\/dd><dt>Preis<\/dt><dd>2,50 € pro Kind<\/dd><dt>Anmeldung<\/dt><dd>spätestens 2 Wochen vorher<\/dd><\/dl><\/div><div class=\"w-karte\"><h2>🔍 Mikroskop-Safari<\/h2><p>Was lebt in einem Tropfen Teichwasser? Mit echten Mikroskopen entdeckt ihr winzige Lebewesen.<\/p><dl><dt>Alter<\/dt><dd>ab 11 Jahren<\/dd><dt>Termine<\/dt><dd>dienstags bis freitags, 13:00 Uhr<\/dd><dt>Dauer<\/dt><dd>90 Minuten<\/dd><dt>Gruppe<\/dt><dd>höchstens 30 Kinder<\/dd><dt>Preis<\/dt><dd>3,50 € pro Kind<\/dd><dt>Anmeldung<\/dt><dd>spätestens 14 Tage vorher<\/dd><\/dl><\/div><\/div><div class=\"w-fuss\"><a data-ziel=\"kontakt\">Kontakt &amp; Impressum<\/a> · <a data-extern>Datenschutz<\/a> · <small>© 2026 Staunwerk Talbrunn<\/small><\/div>"},{"id":"anfahrt","titel":"Anfahrt","adresse":"www.staunwerk-talbrunn.de/anfahrt","farbe":"tuerkis","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🔬 Staunwerk Talbrunn<\/div><small class=\"w-klein\">Mitmach-Museum für Naturwissenschaften<\/small><\/div><div class=\"w-menue\"><a data-ziel=\"start\">Start<\/a><a data-ziel=\"preise\">Öffnungszeiten &amp; Preise<\/a><a data-ziel=\"labore\">Mitmach-Labore<\/a><a data-ziel=\"anfahrt\" class=\"aktiv\">Anfahrt<\/a><a data-ziel=\"fragen\">Häufige Fragen<\/a><\/div><div class=\"w-inhalt\"><h1>Anfahrt<\/h1><p>Das Staunwerk liegt am Rand des Stadtparks.<\/p><div class=\"w-bild\"><span>🗺️<\/span><small>Lageplan: Staunwerk am Stadtpark<\/small><\/div><h2>🚋 Mit der Tram<\/h2><p>Die Tram-Linie 4 (Richtung Rosenhügel) hält an der Haltestelle „Stadtpark/Staunwerk“. Vom Hauptbahnhof dauert die Fahrt 12 Minuten. Von der Haltestelle sind es 3 Minuten zu Fuß bis zum Eingang.<\/p><h2>🚌 Mit dem Bus<\/h2><p>Die Buslinien 27 und 31 halten an der Haltestelle „Museumsplatz“. Von dort geht ihr 8 Minuten zu Fuß durch den Stadtpark.<\/p><div class=\"w-kasten w-kasten--warnung\"><strong>Achtung Baustelle:<\/strong> Vom 2. bis 30. November hält die Buslinie 31 nicht am Museumsplatz. Bitte nehmt in dieser Zeit die Linie 27 oder die Tram 4.<\/div><\/div><div class=\"w-fuss\"><a data-ziel=\"kontakt\">Kontakt &amp; Impressum<\/a> · <a data-extern>Datenschutz<\/a> · <small>© 2026 Staunwerk Talbrunn<\/small><\/div>"},{"id":"fragen","titel":"Häufige Fragen","adresse":"www.staunwerk-talbrunn.de/fragen","farbe":"tuerkis","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🔬 Staunwerk Talbrunn<\/div><small class=\"w-klein\">Mitmach-Museum für Naturwissenschaften<\/small><\/div><div class=\"w-menue\"><a data-ziel=\"start\">Start<\/a><a data-ziel=\"preise\">Öffnungszeiten &amp; Preise<\/a><a data-ziel=\"labore\">Mitmach-Labore<\/a><a data-ziel=\"anfahrt\">Anfahrt<\/a><a data-ziel=\"fragen\" class=\"aktiv\">Häufige Fragen<\/a><\/div><div class=\"w-inhalt\"><h1>Häufige Fragen<\/h1><p>Tippt auf eine Frage, um die Antwort zu lesen.<\/p><details><summary>Wo dürfen wir unsere mitgebrachte Brotzeit essen?<\/summary><p>Eure Brotzeit dürft ihr nur im Picknickraum im Erdgeschoss essen. In der Ausstellung und in den Laboren sind Essen und Trinken nicht erlaubt. Im Museumscafé dürft ihr nur essen und trinken, was ihr im Café gekauft habt.<\/p><\/details><details><summary>Wohin mit Jacken und Rucksäcken?<\/summary><p>In der Garderobe im Erdgeschoss gibt es Schließfächer. Dafür braucht ihr eine 1-€-Münze, die ihr beim Aufschließen zurückbekommt. Schulklassen bekommen außerdem kostenlos einen Garderobenwagen.<\/p><\/details><details><summary>Darf man im Museum fotografieren?<\/summary><p>In der Ausstellung dürft ihr fotografieren und filmen – bitte ohne Blitz. In den Mitmach-Laboren ist Fotografieren nicht erlaubt, damit sich alle ganz auf ihre Versuche konzentrieren können.<\/p><\/details><\/div><div class=\"w-fuss\"><a data-ziel=\"kontakt\">Kontakt &amp; Impressum<\/a> · <a data-extern>Datenschutz<\/a> · <small>© 2026 Staunwerk Talbrunn<\/small><\/div>"},{"id":"kontakt","titel":"Kontakt & Impressum","adresse":"www.staunwerk-talbrunn.de/kontakt","farbe":"tuerkis","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🔬 Staunwerk Talbrunn<\/div><small class=\"w-klein\">Mitmach-Museum für Naturwissenschaften<\/small><\/div><div class=\"w-menue\"><a data-ziel=\"start\">Start<\/a><a data-ziel=\"preise\">Öffnungszeiten &amp; Preise<\/a><a data-ziel=\"labore\">Mitmach-Labore<\/a><a data-ziel=\"anfahrt\">Anfahrt<\/a><a data-ziel=\"fragen\">Häufige Fragen<\/a><\/div><div class=\"w-inhalt\"><h1>Kontakt &amp; Impressum<\/h1><div class=\"w-karte\"><h2>Besucherservice<\/h2><p>Anmeldungen für Schulklassen und Mitmach-Labore<\/p><p>Telefon: 01234 56 78 90<br>Dienstag bis Freitag, 8:00–12:00 Uhr<\/p><p>E-Mail: besuch@staunwerk-talbrunn.de<\/p><\/div><h2>Impressum<\/h2><p>Staunwerk Talbrunn – Mitmach-Museum für Naturwissenschaften<br>Am Stadtpark 5<br>85999 Talbrunn<\/p><p>Leitung: Dr. Miriam Hofstetter<\/p><\/div><div class=\"w-fuss\"><a data-ziel=\"kontakt\">Kontakt &amp; Impressum<\/a> · <a data-extern>Datenschutz<\/a> · <small>© 2026 Staunwerk Talbrunn<\/small><\/div>"}],"items":[{"id":"d2-1","typ":"single","stufe":2,"kompetenz":"navigieren","frage":"Herr Brandl fragt: „Dürfen die Kinder in den Mitmach-Laboren fotografieren?“ Wo findet Frau Yilmaz die Antwort auf der Website, und wie lautet sie?","optionen":[{"text":"Auf der Seite „Häufige Fragen“ nach dem Aufklappen: In den Laboren ist Fotografieren nicht erlaubt.","richtig":true},{"text":"Auf der Seite „Häufige Fragen“ nach dem Aufklappen: In den Laboren darf man ohne Blitz fotografieren.","richtig":false},{"text":"Auf der Seite „Mitmach-Labore“ im Kasten zum Buchen: In den Laboren ist Fotografieren nicht erlaubt.","richtig":false},{"text":"Auf der Seite „Öffnungszeiten & Preise“ im Kasten „Für Schulklassen“: Man darf ohne Blitz fotografieren.","richtig":false}],"tipp":"Öffne die Seiten, die in den Antworten genannt werden, und suche nach dem Wort „fotografieren“. Manche Texte erscheinen erst, wenn du etwas antippst.","erklaerung":"Die Antwort steht unter „Häufige Fragen“ und erscheint erst, wenn du die Frage zum Fotografieren antippst. Dort steht: In der Ausstellung darf man ohne Blitz fotografieren, in den Mitmach-Laboren aber gar nicht."},{"id":"d2-2","typ":"multi","stufe":2,"kompetenz":"finden","tippSeite":"preise","frage":"Frau Yilmaz liest die Seite „Öffnungszeiten & Preise“. Welche Aussagen stimmen für den Ausflug der Klasse 4b?","optionen":[{"text":"Am Montag, 23. November, ist das Museum geschlossen.","richtig":true},{"text":"Am Dienstag, 24. November, öffnet das Museum erst um 10:00 Uhr.","richtig":false},{"text":"Für alle 24 Kinder zusammen kostet der Eintritt 96,00 €.","richtig":true},{"text":"Am Freitag, 27. November, ist der letzte Einlass um 17:00 Uhr.","richtig":false},{"text":"Frau Yilmaz und Herr Brandl haben beide freien Eintritt.","richtig":true},{"text":"Ein Mitmach-Labor ist im Eintrittspreis schon enthalten.","richtig":false}],"tipp":"Such in der Preistabelle die Zeile, die zu einer ganzen Schulklasse passt, und rechne für alle Kinder. Lies auch die Hinweise unter den Tabellen und in den farbigen Kästen genau.","erklaerung":"Montags ist Ruhetag (die Ferienregel gilt in einer Schulwoche nicht), und zwei Begleitpersonen pro Klasse haben freien Eintritt. Die Kinder zahlen den Schulklassenpreis: 24 × 4,00 € = 96,00 €. Dienstags bis freitags öffnet das Museum aber schon um 9:00 Uhr, der letzte Einlass ist eine Stunde vor Schließung (16:00 Uhr), und die Labore kosten extra."},{"id":"d2-3","typ":"multi","stufe":3,"kompetenz":"verknuepfen","tippSeite":"labore","frage":"Frau Yilmaz will die Klasse heute Vormittag für ein Mitmach-Labor anmelden. Welche Angebote passen für die Klasse 4b?","optionen":[{"text":"„Strom-Detektive“ am Dienstag, 24. November","richtig":true},{"text":"„Strom-Detektive“ am Mittwoch, 25. November","richtig":false},{"text":"„Farben-Labor“ am Mittwoch, 25. November","richtig":false},{"text":"„Farben-Labor“ am Freitag, 27. November","richtig":true},{"text":"„Raketen-Werkstatt“ am Freitag, 27. November","richtig":false},{"text":"„Mikroskop-Safari“ am Donnerstag, 26. November","richtig":false}],"tipp":"Prüfe jedes Angebot der Reihe nach: Alter, Wochentag, Gruppengröße und Anmeldefrist. Lies auch den Kasten „So bucht ihr ein Labor“ genau. Schau außerdem, ob die Website an anderer Stelle Neuigkeiten zu den Laboren meldet.","erklaerung":"Passend sind die Strom-Detektive am Dienstag und das Farben-Labor am Freitag – beide Anmeldefristen schafft Frau Yilmaz heute noch. Die Strom-Detektive gibt es nicht mittwochs, im Farben-Labor finden laut Startseite bis 25. November wegen Umbau keine Termine statt, die Mikroskop-Safari ist erst ab 11 Jahren, und in der Raketen-Werkstatt wären es mit beiden Lehrkräften 26 Personen statt höchstens 25."},{"id":"d2-4","typ":"matrix","stufe":2,"kompetenz":"bewerten","tippSeite":"labore","frage":"Auf der Website stehen verschiedene Kästen, Meldungen und Hinweise. Entscheide in jeder Zeile: Ist das eine Information oder Werbung?","spalten":["Information","Werbung"],"aussagen":[{"text":"Der Kasten „Sternhafer Knusper-Rakete“ auf der Startseite","richtig":false},{"text":"Die Meldung „Umbau im Farben-Labor“ auf der Startseite","richtig":true},{"text":"Der Kasten zum Strom-Set „Blitzbox“ auf der Seite „Mitmach-Labore“","richtig":false},{"text":"Der Hinweis zur Buslinie 31 auf der Seite „Anfahrt“","richtig":true}],"tipp":"Frag dich in jeder Zeile: Will dir der Text etwas verkaufen oder nur etwas mitteilen? Werbung ist nicht immer mit „Anzeige“ beschriftet.","erklaerung":"Werbung will, dass du etwas kaufst. Der Riegel-Kasten ist als „Anzeige“ gekennzeichnet, und der Blitzbox-Kasten wirbt mit einem Sonderpreis für ein Produkt aus dem Museumsshop – auch ohne das Wort „Anzeige“. Die Umbau-Meldung und der Baustellen-Hinweis teilen nur etwas mit."}]},{"id":"fall3","nummer":3,"titel":"Aufregung im Klassenchat","quellenart":"Messenger und soziales Netzwerk","einleitung":"Heute ist Mittwoch, der 20. Januar 2027. Du gehst in die Klasse 4c der Grundschule Hollerbach am Moos. Am Nachmittag schaust du in den Klassenchat in der App „Plapperpost“ – dort ist viel los. Finde heraus, welche Nachrichten stimmen und welche riskant sind.","rahmen":"app","app":{"name":"Plapperpost","symbol":"💬","farbe":"tuerkis"},"startseite":"chat","seiten":[{"id":"chat","titel":"Klasse 4c 🦊","html":"<div class=\"c-gruppe\"><a data-ziel=\"info\"><strong>Klasse 4c 🦊<\/strong><\/a><small>24 Mitglieder · Tippe auf den Namen für die Gruppeninfo<\/small><\/div><div class=\"c-verlauf\"><div class=\"c-hinweis\">Gestern<\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Elif<\/span><span class=\"c-text\">Alles Gute zum Geburtstag, Luca! 🎂🎉<\/span><span class=\"c-zeit\">16:10<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Hannah<\/span><span class=\"c-text\">Von mir auch!!! 🥳<\/span><span class=\"c-zeit\">16:12<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Luca<\/span><span class=\"c-text\">Danke euch! 😊 Morgen bringe ich Muffins für alle mit.<\/span><span class=\"c-zeit\">16:31<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Mia<\/span><small>↪ Weitergeleitet<\/small><span class=\"c-text\">‼️ Schick diese Nachricht an 10 Leute, sonst hast du eine Woche lang nur Pech! 😱 Wer sie weiterschickt, hat morgen Glück. 🍀 NICHT ignorieren!!! ‼️<\/span><span class=\"c-zeit\">19:41<\/span><\/div><div class=\"c-hinweis\">Heute<\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Aylin<\/span><span class=\"c-text\">Hausaufgaben für morgen: Mathebuch Seite 54, Nummer 3 und 4 ✏️ Und morgen haben wir Schwimmen – denkt an die Schwimmsachen! 🏊<\/span><span class=\"c-zeit\">13:20<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Jonas<\/span><span class=\"c-text\">Danke! Muss man Nummer 5 auch machen?<\/span><span class=\"c-zeit\">13:22<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Aylin<\/span><span class=\"c-text\">Nein, Nummer 5 ist freiwillig.<\/span><span class=\"c-zeit\">13:23<\/span><\/div><div class=\"c-nachricht c-ich\"><span class=\"c-text\">Danke, Aylin! 👍<\/span><span class=\"c-zeit\">13:25<\/span><\/div><div class=\"c-hinweis\">15:47 · „Gratis-Juwelen 💎“ ist über den Einladungslink beigetreten<\/div><div class=\"c-nachricht\"><span class=\"c-absender\"><a data-ziel=\"profil\">Gratis-Juwelen 💎<\/a><\/span><small>~ nicht in deinen Kontakten<\/small><span class=\"c-text\">Hallo, Funkelfestung-Fans! 🎁 Nur heute gibt es 5.000 Juwelen GRATIS! Tippe auf den Link, gib deinen Spielernamen und dein Passwort ein – fertig! 👉 <a data-extern>JUWELEN JETZT HOLEN<\/a><\/span><span class=\"c-zeit\">15:48<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Paul<\/span><span class=\"c-text\">Wer kommt am Samstag um 14 Uhr mit zum Schlittenberg? ☃️ Holt mich ab: Birkenstraße 12, Klingel „Huber“. Oder ruft mich an: 0123 4567890<\/span><span class=\"c-zeit\">16:02<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Ben<\/span><span class=\"c-text\">LEUTE!!! ❄️ Morgen fällt die Schule wegen Glatteis aus!!! Hat mein Cousin gesagt. Der hat es auf Flitzclip gesehen 👉 <a data-ziel=\"clip\">Video ansehen<\/a><\/span><span class=\"c-zeit\">16:20<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Sofia<\/span><span class=\"c-text\">Echt jetzt?? 😮 Und was ist mit Schwimmen?<\/span><span class=\"c-zeit\">16:22<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Ben<\/span><span class=\"c-text\">Fällt alles aus! Ganz sicher!!! 🎉<\/span><span class=\"c-zeit\">16:23<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Emir<\/span><span class=\"c-text\">Woher weiß dein Cousin das? Der geht doch gar nicht auf unsere Schule. 🤔<\/span><span class=\"c-zeit\">16:25<\/span><\/div><div class=\"c-nachricht\"><span class=\"c-absender\">Mia<\/span><span class=\"c-text\">Juhu, dann schlafe ich morgen aus! 😴<\/span><span class=\"c-zeit\">16:27<\/span><\/div><\/div>"},{"id":"info","titel":"Gruppeninfo","html":"<div class=\"c-gruppe\"><strong>Klasse 4c 🦊<\/strong><small>Gruppe · 24 Mitglieder<\/small><\/div><h3>Beschreibung<\/h3><p>Unser Klassenchat für Hausaufgaben, Termine und Fragen. Gruppe erstellt von Lena am 21.09.2026 – mit Erlaubnis unserer Eltern.<\/p><p>🔗 Schul-Website: <a data-ziel=\"schule\">www.gs-hollerbach-moos.de/aktuelles<\/a><\/p><h3>Unsere Chat-Regeln<\/h3><p class=\"w-klein\">Beschlossen im Klassenrat am 25.09.2026<\/p><ol><li>Wir schreiben freundlich und beleidigen niemanden.<\/li><li>Adressen, Telefonnummern und Passwörter schreiben wir nie in die Gruppe.<\/li><li>Kettenbriefe leiten wir nicht weiter.<\/li><li>Wichtige Schul-Infos prüfen wir auf der Schul-Website.<\/li><li>Von 20:00 bis 7:00 Uhr ist Chat-Pause.<\/li><li>Den Einladungslink geben wir nicht weiter. Neue Mitglieder fügen nur Lena oder Emir hinzu.<\/li><\/ol><h3>Einstellungen<\/h3><div class=\"a-zeile\"><span>Beitritt über Einladungslink<\/span><strong>aktiv<\/strong><\/div><div class=\"a-zeile\"><span>Mitglieder hinzufügen<\/span><strong>nur Admins<\/strong><\/div><h3>24 Mitglieder<\/h3><ul><li>Du<\/li><li>Lena <small>· Gruppen-Admin<\/small><\/li><li>Emir <small>· Gruppen-Admin<\/small><\/li><li>Aylin<\/li><li>Ben<\/li><li>Elif<\/li><li>Felix<\/li><li>Hannah<\/li><li>Jonas<\/li><li>Luca<\/li><li>Mia<\/li><li>Paul<\/li><li>Sofia<\/li><li>Gratis-Juwelen 💎 <small>· heute über Einladungslink beigetreten<\/small><\/li><\/ul><details><summary>Alle anzeigen (10 weitere)<\/summary><p>Leyla, Noah, Amira, Mateo, Ida, Leon, Lina, Tim, Clara, Jakob<\/p><\/details>"},{"id":"profil","titel":"Kontaktinfo","html":"<div class=\"c-gruppe\"><strong>Kontaktinfo<\/strong><small>Plapperpost<\/small><\/div><div class=\"w-kasten w-kasten--warnung\">⚠️ Dieser Kontakt ist nicht in deinem Adressbuch.<\/div><div class=\"w-bild\"><span>💎<\/span><small>Profilbild<\/small><\/div><h2>Gratis-Juwelen 💎<\/h2><p class=\"w-klein\">Status: „Gratis-Juwelen für ALLE Funkelfestung-Fans!!! 🎁🎁🎁“<\/p><div class=\"a-zeile\"><span>Bei Plapperpost seit<\/span><strong>19. Januar 2027<\/strong><\/div><div class=\"a-zeile\"><span>Telefonnummer<\/span><strong>verborgen<\/strong><\/div><div class=\"a-zeile\"><span>Gemeinsame Gruppen<\/span><strong>Klasse 4c 🦊<\/strong><\/div><p><span class=\"w-knopf\">🚫 Blockieren<\/span> <span class=\"w-knopf\">⚠️ Melden<\/span><\/p>"},{"id":"clip","titel":"Beitrag von @eisprinz_max","rahmen":"app","app":{"name":"Flitzclip","symbol":"🎬","farbe":"rot"},"farbe":"rot","html":"<div class=\"p-beitrag\"><div class=\"p-kopf\"><span class=\"p-avatar\">🧊<\/span><span class=\"p-name\">Eis-Prinz Max<\/span><span><span class=\"p-konto\">@eisprinz_max<\/span><span class=\"p-zeit\">13. Januar 2026<\/span><\/span><\/div><p class=\"p-text\">❗❗ ACHTUNG: MORGEN SCHULFREI wegen Glatteis!!! ❄️🧊 Alle Schulen bleiben zu! Teilt das, damit es jeder erfährt!!! #schulfrei #glatteis<\/p><div class=\"p-bild\"><span>❄️<\/span><small>Video (0:14): Schneeflocken vor einem Fenster<\/small><\/div><div class=\"p-leiste\"><span>❤️ 48.300<\/span><span>💬 2.140<\/span><span>↪ 9.870-mal geteilt<\/span><\/div><details><summary>Kommentare anzeigen<\/summary><div class=\"p-kommentar\"><span class=\"p-name\">lilly.lacht<\/span><p class=\"p-text\">Juhu, endlich ausschlafen!!! 😴<\/p><\/div><div class=\"p-kommentar\"><span class=\"p-name\">tom_kickt<\/span><p class=\"p-text\">Welche Schulen denn? Woher weißt du das?<\/p><\/div><div class=\"p-kommentar\"><span class=\"p-name\">papa_von_zwei<\/span><p class=\"p-text\">Bei uns war ganz normal Schule. Bitte so etwas nicht ohne Quelle teilen!<\/p><\/div><div class=\"p-kommentar\"><span class=\"p-name\">snowboard_sam<\/span><p class=\"p-text\">Ob die Schule ausfällt, steht immer auf der Website eurer Schule. 👍<\/p><\/div><\/details><\/div>"},{"id":"schule","titel":"Aktuelles – Grundschule Hollerbach am Moos","rahmen":"browser","adresse":"www.gs-hollerbach-moos.de/aktuelles","farbe":"gruen","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🌳 Grundschule Hollerbach am Moos<\/div><div class=\"w-menue\"><a class=\"aktiv\" data-ziel=\"schule\">Aktuelles<\/a><a data-ziel=\"termine\">Termine<\/a><a data-extern>Unsere Schule<\/a><a data-extern>Kontakt<\/a><\/div><\/div><div class=\"w-inhalt\"><h1>Aktuelles<\/h1><div class=\"w-karte\"><p class=\"w-datum\"><time datetime=\"2027-01-20\">Mittwoch, 20. Januar 2027, 14:30 Uhr<\/time><\/p><h3>Winterwetter: Unterricht am Donnerstag findet statt<\/h3><p>Liebe Eltern, liebe Schülerinnen und Schüler,<\/p><p>für die Nacht ist Glätte angekündigt. Der Unterricht findet am <b>Donnerstag, 21. Januar 2027<\/b>, trotzdem ganz normal nach Stundenplan statt. Bitte planen Sie für den Schulweg mehr Zeit ein. Die Kinder sollten feste Winterschuhe tragen.<\/p><p><b>Ausnahme:<\/b> Der Schwimmunterricht der 4. Klassen fällt am Donnerstag aus, weil das Busunternehmen die Fahrt zum Hallenbad wegen der angekündigten Glätte abgesagt hat. Die Klassen 4a, 4b und 4c haben stattdessen Unterricht im Klassenzimmer. Die Schwimmsachen bleiben bitte zu Hause. Das Schwimmen wird am Donnerstag, 28. Januar 2027, nachgeholt.<\/p><p>Ob der Unterricht wegen Glatteis ausfällt, entscheidet das Landratsamt. Fällt er aus, informieren wir Sie sofort hier unter „Aktuelles“ und über die Eltern-App „Schulpost-Eule“.<\/p><p class=\"w-autor\">Barbara Lindner, Rektorin<\/p><\/div><div class=\"w-kasten w-kasten--info\">ℹ️ Verlässliche Infos zum Unterrichtsausfall gibt es hier, in der Eltern-App „Schulpost-Eule“ und beim Landratsamt – nicht in Klassenchats oder sozialen Netzwerken.<\/div><div class=\"w-karte\"><p class=\"w-datum\"><time datetime=\"2027-01-15\">Freitag, 15. Januar 2027<\/time><\/p><h3>Vorlesewettbewerb der 4. Klassen<\/h3><p>Am Montag, 25. Januar, lesen die besten Vorleserinnen und Vorleser der 4. Klassen in der Aula vor. Beginn ist um 8:15 Uhr. Wir drücken allen die Daumen!<\/p><\/div><div class=\"w-karte\"><p class=\"w-datum\"><time datetime=\"2027-01-12\">Dienstag, 12. Januar 2027<\/time><\/p><h3>Neue Schach-AG<\/h3><p>Ab sofort gibt es eine Schach-AG für die 3. und 4. Klassen: jeden Dienstag von 13:15 bis 14:00 Uhr in Raum 12. Anmeldung im Sekretariat.<\/p><\/div><\/div><div class=\"w-fuss\"><span>Grundschule Hollerbach am Moos · Schulweg 3<\/span><span>Sekretariat: Mo–Fr 7:30–12:30 Uhr<\/span><a data-extern>Impressum<\/a><a data-extern>Datenschutz<\/a><\/div>"},{"id":"termine","titel":"Termine – Grundschule Hollerbach am Moos","rahmen":"browser","adresse":"www.gs-hollerbach-moos.de/termine","farbe":"gruen","html":"<div class=\"w-kopf\"><div class=\"w-logo\">🌳 Grundschule Hollerbach am Moos<\/div><div class=\"w-menue\"><a data-ziel=\"schule\">Aktuelles<\/a><a class=\"aktiv\" data-ziel=\"termine\">Termine<\/a><a data-extern>Unsere Schule<\/a><a data-extern>Kontakt<\/a><\/div><\/div><div class=\"w-inhalt\"><h1>Termine<\/h1><p class=\"w-klein\">Stand: 20. Januar 2027<\/p><table class=\"w-tabelle\"><thead><tr><th>Datum<\/th><th>Termin<\/th><th>Für wen?<\/th><\/tr><\/thead><tbody><tr><td>Mo., 25.01.2027<\/td><td>Vorlesewettbewerb, Aula, 8:15 Uhr<\/td><td>4. Klassen<\/td><\/tr><tr><td>Do., 28.01.2027<\/td><td>Schwimmen (Nachholtermin)<\/td><td>4a, 4b, 4c<\/td><\/tr><tr><td>Fr., 05.02.2027<\/td><td>Faschingsfeier, Unterrichtsende 11:20 Uhr<\/td><td>alle Klassen<\/td><\/tr><tr><td>08.02.–12.02.2027<\/td><td>Faschingsferien<\/td><td>alle Klassen<\/td><\/tr><\/tbody><\/table><\/div><div class=\"w-fuss\"><span>Grundschule Hollerbach am Moos · Schulweg 3<\/span><span>Sekretariat: Mo–Fr 7:30–12:30 Uhr<\/span><a data-extern>Impressum<\/a><a data-extern>Datenschutz<\/a><\/div>"}],"items":[{"id":"d3-1","typ":"matrix","stufe":2,"kompetenz":"finden","frage":"Lies den Klassenchat und die Gruppeninfo. Stimmen die Aussagen?","spalten":["richtig","falsch"],"aussagen":[{"text":"Neue Mitglieder dürfen nur Lena und Aylin hinzufügen.","richtig":false},{"text":"Die Chat-Regeln hat die Klasse im Klassenrat beschlossen.","richtig":true},{"text":"„Gratis-Juwelen“ wurde von Lena zur Gruppe hinzugefügt.","richtig":false},{"text":"In Mathe ist Nummer 5 auf Seite 54 freiwillig.","richtig":true}],"tipp":"Die Chat-Regeln und die Mitgliederliste stehen in der Gruppeninfo. Lies dort und im Verlauf genau nach. Achte auf die Namen und darauf, wie jemand in die Gruppe gekommen ist.","tippSeite":"info","erklaerung":"In der Gruppeninfo steht: Neue Mitglieder fügen nur Lena oder Emir hinzu, und die Regeln wurden im Klassenrat beschlossen. „Gratis-Juwelen“ ist selbst über den Einladungslink beigetreten. Laut Aylin ist Nummer 5 freiwillig."},{"id":"d3-2","typ":"single","stufe":2,"kompetenz":"navigieren","frage":"Du willst Bens Nachricht mit der Website deiner Schule vergleichen. Wo findest du einen Link, der dich zur Schul-Website führt?","optionen":[{"text":"in der Gruppeninfo – sie öffnet sich über den Namen „Klasse 4c“","richtig":true},{"text":"in Bens Glatteis-Nachricht – hinter dem Link „Video ansehen“","richtig":false},{"text":"im Profil von „Gratis-Juwelen“ – es öffnet sich über den Namen","richtig":false},{"text":"in den Kommentaren unter dem Glatteis-Video auf Flitzclip","richtig":false}],"tipp":"Probiere die Möglichkeiten aus und schau, wohin du wirklich kommst. Achte darauf, ob oben eine Adresse der Schule erscheint.","erklaerung":"Tippst du oben auf „Klasse 4c“, öffnet sich die Gruppeninfo. In der Beschreibung steht der Link zur Schul-Website. Bens Link führt nur zu einem Video auf Flitzclip."},{"id":"d3-3","typ":"multi","stufe":3,"kompetenz":"verknuepfen","frage":"Vergleiche die Nachrichten von Ben und Aylin mit der Schul-Website. Welche Aussagen stimmen?","optionen":[{"text":"Die Kinder der 4c müssen morgen in die Schule kommen.","richtig":true},{"text":"Das Schwimmen, an das Aylin erinnert, fällt morgen aus.","richtig":true},{"text":"Morgen fällt die Schule aus, weil die Busfahrt zum Hallenbad abgesagt ist.","richtig":false},{"text":"Das Schwimmen wird am Freitag, 22. Januar, nachgeholt.","richtig":false},{"text":"Einen Unterrichtsausfall gibt die Schule im Klassenchat bekannt.","richtig":false},{"text":"Bens Nachricht stimmt, denn auch die Schule warnt vor Glätte.","richtig":false}],"tipp":"Lies auf der Schul-Website die neueste Nachricht unter „Aktuelles“ genau. Unterscheide: Was gilt für alle Kinder, und was gilt nur für die 4. Klassen?","tippSeite":"schule","erklaerung":"Laut Schul-Website findet der Unterricht morgen nach Stundenplan statt – Ben irrt sich. Nur das Schwimmen der 4. Klassen fällt aus, weil die Busfahrt zum Hallenbad abgesagt ist. Es wird am Donnerstag, 28. Januar, nachgeholt."},{"id":"d3-4","typ":"multi","stufe":3,"kompetenz":"bewerten","frage":"Nicht jede Nachricht im Chat ist harmlos. Welche Aussagen stimmen?","optionen":[{"text":"Paul hat mit seiner Nachricht gegen eine eurer Chat-Regeln verstoßen.","richtig":true},{"text":"„Gratis-Juwelen“ ist ein unbekannter Kontakt und fragt nach deinem Passwort.","richtig":true},{"text":"Der Flitzclip-Beitrag ist vom 13. Januar 2026 und gilt nicht für morgen.","richtig":true},{"text":"Paul hat seine Adresse geschrieben, bevor „Gratis-Juwelen“ in die Gruppe kam.","richtig":false},{"text":"„Gratis-Juwelen“ ist schon seit letztem Jahr bei Plapperpost angemeldet.","richtig":false},{"text":"Die Kommentare unter dem Flitzclip-Beitrag bestätigen den Schulausfall.","richtig":false}],"tipp":"Prüfe Absender, Uhrzeit und Datum: Öffne das Profil des unbekannten Kontakts, achte auf die Uhrzeiten im Chat und schau dir den Flitzclip-Beitrag mit den Kommentaren an. Lies auch eure Chat-Regeln in der Gruppeninfo.","tippSeite":"profil","erklaerung":"Paul hat Adresse und Telefonnummer in die Gruppe geschrieben – das verbietet Regel 2, und „Gratis-Juwelen“ war da schon seit 15:47 Uhr in der Gruppe. Dieser unbekannte Kontakt ist erst seit gestern bei Plapperpost und will mit der Frage nach dem Passwort Daten stehlen. Der Flitzclip-Beitrag ist über ein Jahr alt, und in den Kommentaren schreibt ein Vater sogar, dass ganz normal Schule war."}]},{"id":"fall4","nummer":4,"titel":"Post für Mateo","quellenart":"E-Mail","einleitung":"Heute ist Donnerstag, der 19. November 2026. Mateo (10) schwimmt beim SV Wasserflöhe Hollerstadt und hat ein Kinder-Mailkonto bei „Flinkpost Kids“. Seine Eltern können seine Mails mitlesen. Hilf Mateo, sich auf den Herbstpokal vorzubereiten und gefährliche Mails zu erkennen.","rahmen":"app","app":{"name":"Flinkpost Kids","symbol":"✉️","farbe":"tuerkis"},"startseite":"start","seiten":[{"id":"start","titel":"Posteingang","html":"<h1>📥 Posteingang<\/h1><p class=\"w-klein\">Postfach von Mateo · mateo.k@flinkpost-kids.de · 2 ungelesene Mails<\/p><div class=\"w-kasten w-kasten--info\"><p>👀 Kinder-Postfach: Deine Eltern können deine Mails mitlesen. Wenn dir eine Mail komisch vorkommt, zeig sie ihnen.<\/p><\/div><p class=\"w-klein\"><b>Fett<\/b> = ungelesen · 📎 = mit Anhang<\/p><div class=\"m-liste\"><a class=\"m-eintrag m-neu\" data-ziel=\"mail-gewinn\"><span class=\"m-von\">Flinkpost Gewinn-Team<\/span><span class=\"m-datum\">Heute, 7:12 Uhr<\/span><span class=\"m-betreff\">HERZLICHEN GLÜKWUNSCH!!! Du hast gewonnen 🎉<\/span><span class=\"m-vorschau\">Hallo lieber Flinkpost-Nutzer, Herzlichen Glükwunsch!!! Deine Mailadresse wurde …<\/span><\/a><a class=\"m-eintrag m-neu\" data-ziel=\"mail-aenderung\"><span class=\"m-von\">Sabine Albrecht (SV Wasserflöhe)<\/span><span class=\"m-datum\">Gestern, 18:30 Uhr<\/span><span class=\"m-betreff\">Wichtig: Änderung beim Herbstpokal<\/span><span class=\"m-vorschau\">Hallo Mateo, liebe Eltern, leider gibt es eine wichtige Änderung …<\/span><\/a><a class=\"m-eintrag\" data-ziel=\"mail-buecherei\"><span class=\"m-von\">Stadtbücherei Hollerstadt<\/span><span class=\"m-datum\">Di., 17. Nov.<\/span><span class=\"m-betreff\">Erinnerung: Rückgabe bald fällig<\/span><span class=\"m-vorschau\">Hallo Mateo, bald ist die Leihfrist für dieses Buch zu Ende …<\/span><\/a><a class=\"m-eintrag\" data-ziel=\"mail-oma\"><span class=\"m-von\">Oma Rosi<\/span><span class=\"m-datum\">So., 15. Nov.<\/span><span class=\"m-betreff\">Wir kommen zum Zuschauen!<\/span><span class=\"m-vorschau\">Lieber Mateo, Mama hat mir erzählt, dass du beim Herbstpokal …<\/span><\/a><a class=\"m-eintrag\" data-ziel=\"mail-einladung\"><span class=\"m-von\">Sabine Albrecht (SV Wasserflöhe)<\/span><span class=\"m-datum\">Mo., 9. Nov.<\/span><span class=\"m-betreff\">📎 Einladung zum Herbstpokal<\/span><span class=\"m-vorschau\">Hallo Mateo, super, du bist für unseren Herbstpokal gemeldet! …<\/span><\/a><\/div><div class=\"w-kasten w-kasten--tipp\"><p>🛡️ <b>Sicher-Tipp:<\/b> Das Flinkpost-Team schreibt dir nur von der Adresse <b>team@flinkpost-kids.de<\/b>. Es fragt dich nie nach deinem Passwort.<\/p><\/div><div class=\"w-fuss\"><span>Flinkpost Kids – das Postfach für Kinder<\/span><span>Hilfe<\/span><span>Datenschutz<\/span><span>Impressum<\/span><\/div>"},{"id":"mail-gewinn","titel":"Du hast gewonnen 🎉","html":"<div class=\"m-warnung\">⚠️ Von diesem Absender hast du noch nie eine Mail bekommen.<\/div><div class=\"m-mail\"><dl class=\"m-kopfzeilen\"><dt>Von<\/dt><dd>Flinkpost Gewinn-Team<details><summary>Adresse anzeigen<\/summary>gewinner@flinkpost-preise-sofort.xyz<\/details><\/dd><dt>An<\/dt><dd>mateo.k@flinkpost-kids.de<\/dd><dt>Datum<\/dt><dd>Donnerstag, 19. November 2026, 7:12 Uhr<\/dd><dt>Betreff<\/dt><dd>HERZLICHEN GLÜKWUNSCH!!! Du hast gewonnen 🎉<\/dd><\/dl><div class=\"m-text\"><p>Hallo lieber Flinkpost-Nutzer,<\/p><p>Herzlichen Glükwunsch!!! Deine Mailadresse wurde unter allen Nutzern ausgelost. Du hast ein <b>nagelneues Tablet<\/b> gewonnen!<\/p><p>Damit wir dir das Paket schiken können, musst du nur noch dein <b>Passwort<\/b> und deine <b>Adresse<\/b> eingeben.<\/p><p><b>ACHTUNG: Dein Gewinn verfällt in 24 Stunden!!! Beeil dich!<\/b><\/p><p><a class=\"w-knopf\" data-extern>👉 GEWINN JETZT ABHOLEN<\/a><\/p><p>Dein Flinkpost Gewinn-Team<\/p><\/div><\/div>"},{"id":"mail-aenderung","titel":"Wichtig: Änderung beim Herbstpokal","html":"<div class=\"m-mail\"><dl class=\"m-kopfzeilen\"><dt>Von<\/dt><dd>Sabine Albrecht (SV Wasserflöhe)<details><summary>Adresse anzeigen<\/summary>training@sv-wasserfloehe-hollerstadt.de<\/details><\/dd><dt>An<\/dt><dd>mateo.k@flinkpost-kids.de<\/dd><dt>Datum<\/dt><dd>Mittwoch, 18. November 2026, 18:30 Uhr<\/dd><dt>Betreff<\/dt><dd>Wichtig: Änderung beim Herbstpokal<\/dd><\/dl><div class=\"m-text\"><p>Hallo Mateo, liebe Eltern,<\/p><p>leider gibt es eine wichtige Änderung: Im Hallenbad Hollerstadt ist die Heizung kaputt und das Wasser ist viel zu kalt. Der Herbstpokal findet deshalb im <b>Sportbad Talbrunn<\/b> statt (Lindenallee 12, Talbrunn).<\/p><p>Der Tag bleibt gleich: Samstag, 28. November 2026.<\/p><p>Weil die Fahrt nach Talbrunn länger dauert, verschieben sich <b>alle Uhrzeiten im Zeitplan um 30 Minuten nach hinten<\/b>, also auf später. Aus 9:00 Uhr wird zum Beispiel 9:30 Uhr. Das gilt auch für das Einschwimmen und für die Siegerehrung, die jetzt um 14:30 Uhr beginnt.<\/p><p>Den Zeitplan und die Packliste findet ihr weiterhin im Anhang meiner Einladung vom 9. November. Die Packliste bleibt genau gleich.<\/p><p>Sportliche Grüße<br>Sabine Albrecht<br>Trainerin, SV Wasserflöhe Hollerstadt e. V.<\/p><\/div><p><a data-ziel=\"mail-einladung\">Ursprüngliche Nachricht anzeigen<\/a><\/p><\/div>"},{"id":"mail-buecherei","titel":"Erinnerung: Rückgabe bald fällig","html":"<div class=\"m-mail\"><dl class=\"m-kopfzeilen\"><dt>Von<\/dt><dd>Stadtbücherei Hollerstadt<details><summary>Adresse anzeigen<\/summary>ausleihe@buecherei-hollerstadt.de<\/details><\/dd><dt>An<\/dt><dd>mateo.k@flinkpost-kids.de<\/dd><dt>Datum<\/dt><dd>Dienstag, 17. November 2026, 9:00 Uhr<\/dd><dt>Betreff<\/dt><dd>Erinnerung: Rückgabe bald fällig<\/dd><\/dl><div class=\"m-text\"><p>Hallo Mateo,<\/p><p>bald ist die Leihfrist für dieses Buch zu Ende:<\/p><p><b>„Das Geheimnis der Leuchtturminsel“<\/b><br>Rückgabe bis: <b>Dienstag, 24. November 2026<\/b><\/p><p>Du kannst das Buch einmal um vier Wochen verlängern, wenn es niemand vorbestellt hat.<\/p><p><a class=\"w-knopf\" data-extern>Jetzt verlängern<\/a><\/p><details><summary>Alle Ausleihen anzeigen (3)<\/summary><table class=\"w-tabelle\"><thead><tr><th>Titel<\/th><th>Rückgabe bis<\/th><\/tr><\/thead><tbody><tr><td>Das Geheimnis der Leuchtturminsel (Buch)<\/td><td>24. November 2026<\/td><\/tr><tr><td>Alles über Wale (Sachbuch)<\/td><td>8. Dezember 2026<\/td><\/tr><tr><td>Kapitän Krabbe und der Sturm (Hörbuch)<\/td><td>8. Dezember 2026<\/td><\/tr><\/tbody><\/table><\/details><p>Bücher und Hörbücher kannst du auch rund um die Uhr in den Rückgabekasten neben dem Eingang werfen.<\/p><p>Öffnungszeiten: Dienstag bis Freitag 10–18 Uhr, Samstag 10–13 Uhr<\/p><p>Deine Stadtbücherei Hollerstadt<\/p><\/div><p class=\"w-klein\">Diese Mail wurde automatisch verschickt. Bitte antworte nicht auf diese Mail.<\/p><\/div>"},{"id":"mail-oma","titel":"Wir kommen zum Zuschauen!","html":"<div class=\"m-mail\"><dl class=\"m-kopfzeilen\"><dt>Von<\/dt><dd>Oma Rosi<details><summary>Adresse anzeigen<\/summary>rosi.huber@hollerpost.de<\/details><\/dd><dt>An<\/dt><dd>mateo.k@flinkpost-kids.de<\/dd><dt>Datum<\/dt><dd>Sonntag, 15. November 2026, 16:20 Uhr<\/dd><dt>Betreff<\/dt><dd>Wir kommen zum Zuschauen!<\/dd><\/dl><div class=\"m-text\"><p>Lieber Mateo,<\/p><p>Mama hat mir erzählt, dass du beim Herbstpokal am 28. November mitschwimmst. Opa und ich kommen zum Zuschauen! 🏊<\/p><p>Wir möchten pünktlich da sein, wenn dein Wettkampf beginnt. Schreibst du mir bitte, um wie viel Uhr das ist? Opa hat sich den Weg zum Hallenbad Hollerstadt schon herausgesucht.<\/p><p>Heute habe ich Apfelstrudel gebacken. Ein großes Stück habe ich für dich eingefroren. 🍎<\/p><p>Viele Bussis<br>deine Oma Rosi und Opa Heinz<\/p><\/div><\/div>"},{"id":"mail-einladung","titel":"Einladung zum Herbstpokal","html":"<div class=\"m-mail\"><dl class=\"m-kopfzeilen\"><dt>Von<\/dt><dd>Sabine Albrecht (SV Wasserflöhe)<details><summary>Adresse anzeigen<\/summary>training@sv-wasserfloehe-hollerstadt.de<\/details><\/dd><dt>An<\/dt><dd>mateo.k@flinkpost-kids.de<\/dd><dt>Datum<\/dt><dd>Montag, 9. November 2026, 17:05 Uhr<\/dd><dt>Betreff<\/dt><dd>Einladung zum Herbstpokal<\/dd><\/dl><div class=\"m-text\"><p>Hallo Mateo,<\/p><p>super, du bist für unseren Herbstpokal gemeldet! Er findet am <b>Samstag, 28. November 2026<\/b>, im Hallenbad Hollerstadt (Am Weiherfeld 3) statt.<\/p><p>Du schwimmst mit deinem <b>Jahrgang 2016<\/b> über 50 m Brust und 50 m Freistil.<\/p><p>Im Anhang findest du den Zeitplan für alle Gruppen und die Packliste. Bitte schau dir beides mit deinen Eltern an.<\/p><p>Kannst du nicht mitmachen? Dann gib mir bitte bis Freitag, 20. November, Bescheid.<\/p><p>Ich freue mich auf dich!<br>Sabine Albrecht<br>Trainerin, SV Wasserflöhe Hollerstadt e. V.<\/p><\/div><a class=\"m-anhang\" data-ziel=\"anhang\">📎 Herbstpokal_2026.pdf <small>(PDF, 120 KB)<\/small><\/a><\/div>"},{"id":"anhang","titel":"Anhang: Herbstpokal_2026.pdf","farbe":"rot","html":"<div class=\"w-kasten w-kasten--info\"><p>📎 Anhang aus der Mail „Einladung zum Herbstpokal“ vom 9. November 2026<\/p><\/div><h1>🏊 Herbstpokal 2026<\/h1><p><b>SV Wasserflöhe Hollerstadt e. V.<\/b><br>Samstag, 28. November 2026<br>Hallenbad Hollerstadt, Am Weiherfeld 3<\/p><h2>Zeitplan<\/h2><table class=\"w-tabelle\"><thead><tr><th>Gruppe<\/th><th>Jahrgänge<\/th><th>Einschwimmen<\/th><th>Wettkampfbeginn<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>2017 und jünger<\/td><td>8:30 Uhr<\/td><td>9:00 Uhr<\/td><\/tr><tr><td>B<\/td><td>2015 und 2016<\/td><td>10:00 Uhr<\/td><td>10:30 Uhr<\/td><\/tr><tr><td>C<\/td><td>2013 und 2014<\/td><td>11:30 Uhr<\/td><td>12:00 Uhr<\/td><\/tr><\/tbody><\/table><p>Jede Gruppe schwimmt zuerst 50 m Brust und danach 50 m Freistil. Die <b>Siegerehrung<\/b> für alle Gruppen beginnt um 14:00 Uhr.<\/p><p class=\"w-klein\">Eltern, Großeltern und Freunde sind herzlich willkommen. Der Eintritt ist frei.<\/p><h2>Packliste<\/h2><div class=\"w-spalten\"><div class=\"w-karte\"><h3>✅ Unbedingt mitbringen<\/h3><ul><li>Badehose oder Badeanzug<\/li><li>Badekappe (ohne Kappe darf niemand starten)<\/li><li>Handtuch<\/li><li>Badeschlappen<\/li><li>rotes Vereins-T-Shirt für die Siegerehrung<\/li><\/ul><\/div><div class=\"w-karte\"><h3>👍 Gern mitbringen<\/h3><ul><li>Schwimmbrille<\/li><li>Brotzeit und etwas zu trinken<\/li><li>warmer Pulli für die Wartezeit<\/li><\/ul><\/div><div class=\"w-karte\"><h3>🚫 Bitte zu Hause lassen<\/h3><ul><li>Uhren und Schmuck<\/li><li>Getränke in Glasflaschen<\/li><\/ul><\/div><\/div><p class=\"w-klein\">Fragen? Schreibt uns: training@sv-wasserfloehe-hollerstadt.de<\/p>"}],"items":[{"id":"d4-1","typ":"matrix","stufe":2,"kompetenz":"navigieren","frage":"Was passiert, wenn du in Mateos Postfach etwas antippst? Probiere es aus.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"In der Mail „Einladung zum Herbstpokal“ tippst du auf „📎 Herbstpokal_2026.pdf“. Dann siehst du den Zeitplan und die Packliste.","richtig":true},{"text":"In der Mail „Wichtig: Änderung beim Herbstpokal“ tippst du auf „Ursprüngliche Nachricht anzeigen“. Dann siehst du sofort die Packliste.","richtig":false},{"text":"In der Gewinnspiel-Mail tippst du neben „Von“ auf „Adresse anzeigen“. Dann siehst du, von welcher Mailadresse die Mail kommt.","richtig":true},{"text":"In der Mail der Stadtbücherei tippst du auf „Alle Ausleihen anzeigen“. Dann öffnet sich die Internetseite der Bücherei.","richtig":false}],"tipp":"Öffne die genannten Mails und tippe die Stellen wirklich an. Achte darauf, ob eine neue Seite erscheint oder ob nur etwas aufklappt.","erklaerung":"Der Anhang zeigt Zeitplan und Packliste, und „Adresse anzeigen“ klappt die Absenderadresse auf. „Ursprüngliche Nachricht anzeigen“ führt nur zur Einladung – die Packliste steckt erst in ihrem Anhang. „Alle Ausleihen anzeigen“ klappt eine Liste in der Mail auf und öffnet keine Internetseite."},{"id":"d4-2","typ":"multi","stufe":2,"kompetenz":"finden","frage":"Mateo packt seine Sporttasche für den Herbstpokal. Was muss er laut Packliste <b>unbedingt<\/b> mitbringen?","optionen":[{"text":"eine Badekappe","richtig":true},{"text":"Badeschlappen","richtig":true},{"text":"das rote Vereins-T-Shirt","richtig":true},{"text":"eine Schwimmbrille","richtig":false},{"text":"eine Brotzeit und etwas zu trinken","richtig":false},{"text":"eine Armbanduhr","richtig":false}],"tipp":"Die Packliste steckt im Anhang der Einladung. Sie hat drei Kästen – nur einer passt zu „unbedingt“.","tippSeite":"anhang","erklaerung":"Im Kasten „Unbedingt mitbringen“ stehen Badekappe, Badeschlappen und das rote Vereins-T-Shirt. Schwimmbrille und Brotzeit sind nur „gern mitbringen“, und Uhren soll Mateo sogar zu Hause lassen."},{"id":"d4-3","typ":"single","stufe":3,"kompetenz":"verknuepfen","frage":"Oma möchte pünktlich da sein, wenn Mateos Wettkampf beginnt. Was soll Mateo ihr antworten?","optionen":[{"text":"Um 11:00 Uhr im Sportbad Talbrunn","richtig":true},{"text":"Um 10:30 Uhr im Sportbad Talbrunn","richtig":false},{"text":"Um 11:00 Uhr im Hallenbad Hollerstadt","richtig":false},{"text":"Um 10:30 Uhr im Hallenbad Hollerstadt","richtig":false}],"tipp":"Suche Mateos Jahrgang in der Einladung und dann seine Gruppe im Zeitplan. Lies danach die neueste Mail des Vereins ganz genau.","tippSeite":"mail-aenderung","erklaerung":"Mateo hat Jahrgang 2016 und schwimmt deshalb in Gruppe B. Laut Zeitplan beginnt ihr Wettkampf um 10:30 Uhr. Die neuere Mail verlegt den Wettkampf ins Sportbad Talbrunn und verschiebt alle Zeiten um 30 Minuten – also 11:00 Uhr in Talbrunn."},{"id":"d4-4","typ":"multi","stufe":3,"kompetenz":"bewerten","frage":"Mateo zeigt seinen Eltern die Gewinnspiel-Mail. Welche Aussagen über diese Mail sind richtig?","optionen":[{"text":"Die echte Absenderadresse gehört nicht zum Flinkpost-Team.","richtig":true},{"text":"Die Mail will Mateos Passwort und seine Adresse haben.","richtig":true},{"text":"Die Mail setzt Mateo unter Druck, schnell zu handeln.","richtig":true},{"text":"Die Mail ist echt, weil „Flinkpost“ im Absendernamen steht.","richtig":false},{"text":"Die Mail beginnt mit einer Anrede, in der Mateos Name steht.","richtig":false},{"text":"In der Mail sind alle Wörter richtig geschrieben.","richtig":false}],"tipp":"Prüfe jede Aussage an der Mail selbst: Lies sie Wort für Wort und tippe auf „Adresse anzeigen“. Vergleiche die Adresse mit dem Sicher-Tipp im Posteingang.","tippSeite":"mail-gewinn","erklaerung":"Die Adresse ist nicht team@flinkpost-kids.de, die Mail will Passwort und Adresse und macht mit „24 Stunden“ Druck – typische Zeichen für Betrug. Auch die Anrede „lieber Flinkpost-Nutzer“ ohne Mateos Namen und Fehler wie „Glükwunsch“ und „schiken“ sind Warnzeichen. Ein bekannter Name im Absender beweist nichts – am besten zeigt Mateo die Mail seinen Eltern und löscht sie."}]},{"id":"fall5","nummer":5,"titel":"Wandertag zum Wildpark","quellenart":"Apps","einleitung":"Heute ist Dienstag, der 13. Oktober 2026. Die Klasse 4a macht am Donnerstag, dem 15. Oktober, einen Wandertag zum Wildpark Fuchsbühl. Dort beginnt um 9:00 Uhr eine Führung, deshalb muss die Klasse vor 9:00 Uhr an der Haltestelle „Fuchsbühl, Wildpark“ direkt am Eingang ankommen. Prüfe mit der Wetter-App Wolkenblick und der Fahrplan-App Linienflitzer, ob alles klappt.","rahmen":"app","app":{"name":"Wolkenblick","symbol":"🌦️","farbe":"blau"},"startseite":"start","seiten":[{"id":"start","titel":"5-Tage-Vorhersage","app":{"name":"Wolkenblick","symbol":"🌦️","farbe":"blau"},"farbe":"blau","html":"<div class=\"a-reiter\"><a class=\"aktiv\" data-ziel=\"start\">5 Tage<\/a><a data-ziel=\"heute\">Heute<\/a><a data-ziel=\"morgen\">Morgen<\/a><a data-ziel=\"uebermorgen\">Übermorgen<\/a><a data-ziel=\"warnung\">⚠️ Warnungen<\/a><\/div><div class=\"a-kachel\"><div class=\"a-zeile\"><strong>📍 Fuchsbühl<\/strong><span class=\"w-klein\">Aktualisiert: heute, 6:50 Uhr<\/span><\/div><div class=\"a-zeile\"><span class=\"a-symbol\">⛅<\/span><span class=\"a-gross\">7 °C<\/span><span>Jetzt: wolkig, schwacher Wind<\/span><\/div><\/div><div class=\"w-kasten w-kasten--warnung\"><p><strong>⚠️ Warnung vor Sturmböen<\/strong> am Mittwoch, 14. Oktober. Auch Busse und Bahnen können betroffen sein.<\/p><p><a data-ziel=\"warnung\">Warnung lesen ›<\/a> · <a data-ziel=\"fahrplan\">🚌 Verbindungen prüfen in Linienflitzer ›<\/a><\/p><\/div><h2>Vorhersage für 5 Tage<\/h2><div class=\"a-zeile\"><span><b>Di, 13.10.<\/b> Heute<\/span><span class= au"},"farbe":"blau","html":"<div class=\"a-reiter\"><a data-ziel=\"start\">5 Tage<\/a><a data-ziel=\"heute\">Heute<\/a><a data-ziel=\"morgen\">Morgen<\/a><a class=\"aktiv\" data-ziel=\"uebermorgen\">Übermorgen<\/a><a data-ziel=\"warnung\">⚠️ Warnungen<\/a><\/div><h2>Donnerstag, 15. Oktober<\/h2><p class=\"w-klein\">📍 Fuchsbühl · Aktualisiert: heute, 6:50 Uhr<\/p><p>🌡️ 13° / 4° · 💧 bis 20 %<\/p><div class=\"a-raster\"><div class=\"a-zelle\"><b>7 Uhr<\/b><br>☁️<br>5 °C<br>💧 10 %<\/div><div class=\"a-zelle\"><b>8 Uhr<\/b><br>⛅<br>6 °C<br>💧 10 %<\/div><div class=\"a-zelle\"><b>9 Uhr<\/b><br>⛅<br>7 °C<br>💧 10 %<\/div><div class=\"a-zelle\"><b>10 Uhr<\/b><br>🌤️<br>9 °C<br>💧 5 %<\/div><div class=\"a-zelle\"><b>11 Uhr<\/b><br>🌤️<br>10 °C<br>💧 5 %<\/div><div class=\"a-zelle\"><b>12 Uhr<\/b><br>☀️<br>11 °C<br>💧 5 %<\/div><div class=\"a-zelle\"><b>13 Uhr<\/b><br>🌤️<br>12 °C<br>💧 10 %<\/div><div class=\"a-zelle\"><b>14 Uhr<\/b><br>⛅<br>13 °C<br>💧 15 %<\/div><div class=\"a-zelle\"><b>15 Uhr<\/b><br>🌦️<br>12 °C<br>💧 20 %<\/div><div class=\"a-zelle\"><b>16 Uhr<\/b><br>🌦️<br>11 °C<br>💧 20 %<\/div><\/div><div class=\"w-kasten w-kasten--tipp\"><p>🧥 Morgens ist es noch kühl. Ab dem Vormittag wird es freundlich, am Nachmittag sind einzelne Schauer möglich.<\/p><\/div>"},{"id":"warnung","titel":"Warnungen","app":{"name":"Wolkenblick","symbol":"🌦️","farbe":"blau"},"farbe":"blau","html":"<div class=\"a-reiter\"><a data-ziel=\"start\">5 Tage<\/a><a data-ziel=\"heute\">Heute<\/a><a data-ziel=\"morgen\">Morgen<\/a><a data-ziel=\"uebermorgen\">Übermorgen<\/a><a class=\"aktiv\" data-ziel=\"warnung\">⚠️ Warnungen<\/a><\/div><div class=\"w-kasten w-kasten--warnung\"><h2>⚠️ Warnung vor Sturmböen<\/h2><p><b>Gültig:<\/b> Mittwoch, 14. Oktober, 10:00 bis 22:00 Uhr<br><b>Gebiet:<\/b> Fuchsbühl und Umgebung<\/p><\/div><p>Am Mittwoch zieht ein kräftiges Tief über das Land. Es gibt Sturmböen bis 80 km/h und viel Regen. Äste können abbrechen.<\/p><h3>Das rät der Wetterdienst<\/h3><ul><li>Meide am Mittwoch Wälder und Parks.<\/li><li>Räume lose Dinge auf Balkon und Terrasse weg.<\/li><li>Busse und Bahnen können Verspätung haben oder ausfallen.<\/li><\/ul><h3>Ausblick<\/h3><p>In der Nacht zum Donnerstag lässt der Wind nach. Am Donnerstag wird es freundlich und meist trocken. Auf Waldwegen können noch Äste liegen.<\/p><p class=\"w-klein\">Aktualisiert: heute, 5:40 Uhr · Quelle: Wetterdienst Wolkenblick<\/p><a class=\"w-knopf\" data-ziel=\"fahrplan\">🚌 Verbindungen prüfen in Linienflitzer<\/a>"},{"id":"fahrplan","titel":"Verbindungen","app":{"name":"Linienflitzer","symbol":"🚌","farbe":"gruen"},"farbe":"gruen","html":"<div class=\"a-reiter\"><a class=\"aktiv\" data-ziel=\"fahrplan\">Verbindungen<\/a><a data-ziel=\"stoerungen\">⚠️ Störungen<\/a><\/div><div class=\"a-kachel\"><div class=\"a-zeile\"><span>Von<\/span><strong>Sonnhofen, Bahnhof<\/strong><\/div><div class=\"a-zeile\"><span>Nach<\/span><strong>Fuchsbühl, Wildpark<\/strong><\/div><div class=\"a-zeile\"><span>Wann<\/span><strong>Do, 15.10.2026 · Abfahrt ab 7:00<\/strong><\/div><\/div><div class=\"a-fahrt\"><div class=\"a-zeile\"><strong>7:05 → 8:10<\/strong><span>1 Std. 5 Min. · 1 Umstieg<\/span><\/div><div>🚆 RB 12 › 🚌 Bus 7<\/div><small class=\"w-klein\">Umstieg in Talheim, Bahnhof: an 7:25, Bus 7 ab 7:40<\/small><span class=\"a-hinweis\">⚠️ Meldung zu RB 12<\/span><\/div><div class=\"a-fahrt\"><div class=\"a-zeile\"><strong>7:15 → 8:10<\/strong><span>55 Min. · direkt<\/span><\/div><div>🚌 Bus 34<\/div><span class=\"a-hinweis\">⚠️ Meldung zu Bus 34<\/span><\/div><div class=\"a-fahrt\"><div class=\"a-zeile\"><strong>7:35 → 8:40<\/strong><span>1 Std. 5 Min. · 1 Umstieg<\/span><\/div><div>🚆 RB 12 › 🚌 Bus 7<\/div><small class=\"w-klein\">Umstieg in Talheim, Bahnhof: an 7:55, Bus 7 ab 8:10<\/small><span class=\"a-hinweis\">⚠️ Meldung zu RB 12<\/span><\/div><div class=\"a-fahrt\"><div class=\"a-zeile\"><strong>7:45 → 8:40<\/strong><span>55 Min. · direkt<\/span><\/div><div>🚌 Bus 34<\/div><span class=\"a-hinweis\">⚠️ Meldung zu Bus 34<\/span><\/div><div class=\"a-fahrt\"><div class=\"a-zeile\"><strong>8:05 → 9:10<\/strong><span>1 Std. 5 Min. · 1 Umstieg<\/span><\/div><div>🚆 RB 12 › 🚌 Bus 7<\/div><small class=\"w-klein\">Umstieg in Talheim, Bahnhof: an 8:25, Bus 7 ab 8:40<\/small><span class=\"a-hinweis\">⚠️ Meldung zu RB 12<\/span><\/div><p class=\"w-klein\">Alle Zeiten laut Fahrplan. Verspätungen und Ausfälle sind hier nicht eingerechnet. Bei „⚠️ Meldung“ findest du mehr Infos im Reiter „⚠️ Störungen“.<\/p><a class=\"w-knopf\" data-ziel=\"start\">🌦️ Zurück zu Wolkenblick<\/a>"},{"id":"stoerungen","titel":"Störungen","app":{"name":"Linienflitzer","symbol":"🚌","farbe":"gruen"},"farbe":"gruen","html":"<div class=\"a-reiter\"><a data-ziel=\"fahrplan\">Verbindungen<\/a><a class=\"aktiv\" data-ziel=\"stoerungen\">⚠️ Störungen<\/a><\/div><h2>Aktuelle Meldungen<\/h2><p class=\"w-klein\">Stand: heute, 7:20 Uhr<\/p><div class=\"a-kachel\"><h3>🚆 RB 12 Sonnhofen – Talheim<\/h3><p><b>Donnerstag, 15. Oktober:<\/b> Wegen Bauarbeiten an den Gleisen fahren bis 7:30 Uhr keine Züge zwischen Sonnhofen und Talheim. Alle Züge, die in Sonnhofen vor 7:30 Uhr abfahren, fallen aus. Danach fahren die Züge wieder nach Fahrplan.<\/p><\/div><div class=\"a-kachel\"><h3>🚌 Bus 34<\/h3><p><b>12. bis 23. Oktober:<\/b> Umleitung wegen einer Baustelle in Kreuzbach. Alle Fahrten dauern etwa 12 Minuten länger. Die Haltestelle „Kreuzbach, Kirche“ entfällt.<\/p><p><b>Donnerstag, 15. Oktober:<\/b> Die Fahrt um 7:45 Uhr ab „Sonnhofen, Bahnhof“ fällt aus.<\/p><\/div><div class=\"a-kachel\"><h3>🚌 Bus 7<\/h3><p><b>Freitag, 16. Oktober:<\/b> Wegen des Herbstfests hält Bus 7 nicht an der Haltestelle „Fuchsbühl, Wildpark“. Bitte steige an der Haltestelle „Fuchsbühl, Ortsmitte“ aus.<\/p><\/div><div class=\"a-kachel\"><h3>Alle Linien<\/h3><p><b>Mittwoch, 14. Oktober:<\/b> Wegen der Sturmwarnung kann es zu Verspätungen und Ausfällen kommen. Prüfe vor der Fahrt deine Verbindung.<\/p><\/div><a class=\"w-knopf\" data-ziel=\"start\">🌦️ Zurück zu Wolkenblick<\/a>"}],"items":[{"id":"d5-1","typ":"single","stufe":2,"kompetenz":"finden","frage":"Die Klasse will am Wandertag um 9 Uhr im Wildpark losgehen. Was sagt die Wetter-App für diese Uhrzeit voraus?","optionen":[{"text":"7 °C und 10 % Regenwahrscheinlichkeit","richtig":true},{"text":"13 °C und 20 % Regenwahrscheinlichkeit","richtig":false},{"text":"10 °C und 80 % Regenwahrscheinlichkeit","richtig":false},{"text":"9 °C und 5 % Regenwahrscheinlichkeit","richtig":false}],"tipp":"Welcher Tag ist heute, welcher Tag ist der Wandertag? Öffne die Stundenwerte für den richtigen Tag und suche genau das Feld für 9 Uhr.","tippSeite":"uebermorgen","erklaerung":"Heute ist Dienstag, der Wandertag ist am Donnerstag – also übermorgen. Im Reiter „Übermorgen“ stehen für 9 Uhr 7 °C und 10 % Regenwahrscheinlichkeit. Die 13 °C sind der Höchstwert für den ganzen Tag."},{"id":"d5-2","typ":"single","stufe":2,"kompetenz":"navigieren","frage":"Bei manchen Verbindungen am Donnerstag steht „⚠️ Meldung zu RB 12“. Finde diese Meldung in der Fahrplan-App. Was steht darin?","optionen":[{"text":"Wegen Bauarbeiten am Gleis fallen einige Züge aus.","richtig":true},{"text":"Wegen der Sturmwarnung haben alle Züge Verspätung.","richtig":false},{"text":"Wegen des Herbstfests hält der Zug nicht am Wildpark.","richtig":false},{"text":"Wegen einer Baustelle fährt der Zug einen Umweg.","richtig":false}],"tipp":"Lies die kleine Schrift unter den Verbindungen. Dort steht, wo du die Meldung findest. Achte dann genau auf die Linie und auf den Tag.","tippSeite":"fahrplan","erklaerung":"Im Reiter „Störungen“ steht bei der RB 12: Am Donnerstag fahren wegen Bauarbeiten an den Gleisen bis 7:30 Uhr keine Züge. Sturm, Herbstfest und Umleitung stehen auch dort, gehören aber zu einem anderen Tag oder zu einem Bus."},{"id":"d5-3","typ":"multi","stufe":3,"kompetenz":"verknuepfen","frage":"Mit welchen Verbindungen kommt die Klasse am Donnerstag vor 9:00 Uhr am Wildpark an? Beachte alle Hinweise und Meldungen in der Fahrplan-App.","optionen":[{"text":"Abfahrt 7:05 Uhr mit RB 12 und Bus 7","richtig":false},{"text":"Abfahrt 7:15 Uhr mit Bus 34","richtig":true},{"text":"Abfahrt 7:35 Uhr mit RB 12 und Bus 7","richtig":true},{"text":"Abfahrt 7:45 Uhr mit Bus 34","richtig":false},{"text":"Abfahrt 8:05 Uhr mit RB 12 und Bus 7","richtig":false}],"tipp":"Öffne den Reiter „Störungen“ und lies jede Meldung genau: Für welchen Tag und bis zu welcher Uhrzeit gilt sie? Rechne längere Fahrzeiten zur Ankunftszeit dazu.","tippSeite":"stoerungen","erklaerung":"Bus 34 um 7:15 Uhr braucht wegen der Umleitung etwa 12 Minuten länger und ist trotzdem gegen 8:22 Uhr da. Der Zug um 7:35 Uhr fährt nach dem Ende der Bauarbeiten, damit ist die Klasse um 8:40 Uhr da. Der Zug um 7:05 Uhr und Bus 34 um 7:45 Uhr fallen aus, und mit der Verbindung um 8:05 Uhr wäre die Klasse erst um 9:10 Uhr da."},{"id":"d5-4","typ":"multi","stufe":3,"kompetenz":"bewerten","frage":"Schau dir die Startseite der Wetter-App genau an. Welche Aussagen stimmen?","optionen":[{"text":"Der Kasten „Wolkenblick Premium“ ist Werbung: Die App will dir etwas verkaufen.","richtig":true},{"text":"Die Vorhersage für Samstag ist unsicherer als die für Donnerstag.","richtig":true},{"text":"Die Meldung „Goldener Oktober“ ist alt und sagt nichts über den Wandertag.","richtig":true},{"text":"Die 5-Tage-Vorhersage ist veraltet, weil sie schon am 5. Oktober erstellt wurde.","richtig":false},{"text":"Wolkenblick Premium kostet nach der Testzeit 2,99 € im Jahr.","richtig":false},{"text":"Laut Startseite gilt die Warnung vor Sturmböen auch noch am Donnerstag.","richtig":false}],"tipp":"Prüfe jede Aussage einzeln. Achte auf das Wort „Werbung“, auf alle Datumsangaben und auf die kleine Schrift unter der Vorhersage. Lies auch Preise und Warnungen Wort für Wort.","tippSeite":"start","erklaerung":"Der Premium-Kasten ist als Werbung gekennzeichnet und kostet nach der Testzeit 2,99 € im Monat, nicht im Jahr. Laut der kleinen Schrift ist die Vorhersage für Samstag unsicherer, weil Samstag weiter in der Zukunft liegt. Die Meldung vom 5. Oktober ist veraltet, die Vorhersage selbst ist von heute, 6:50 Uhr, und die Sturmwarnung gilt nur für Mittwoch."}]}],"lesen":[{"id":"l-fledermaus","titel":"Jäger der Nacht","textsorte":"Sachtext","einleitung":"Ein Sachtext darüber, wie Fledermäuse jagen, wo sie wohnen und warum sie unseren Schutz brauchen.","text":{"titel":"Jäger der Nacht","untertitel":"Wie Fledermäuse leben und warum sie Hilfe brauchen","absaetze":["An Sommerabenden huschen in der Dämmerung oft dunkle Schatten lautlos über Gärten. Das sind keine Vögel, sondern Fledermäuse. Sie sind die einzigen Säugetiere, die wirklich fliegen können. Ihre Flügel sind aus dünner Haut, die zwischen den langen Fingern, den Armen und den Beinen gespannt ist. In Deutschland leben etwa 25 Fledermausarten.","## Jagen mit den Ohren","Bei der nächtlichen Jagd verlassen sich Fledermäuse vor allem auf ihre Ohren. Im Flug stoßen sie ständig kurze, sehr hohe Rufe aus. Die meisten dieser Töne sind so hoch, dass Menschen sie nicht hören können. Man nennt sie Ultraschall. Treffen die Rufe auf einen Ast oder eine Mücke, wird der Schall zurückgeworfen. An diesem Echo erkennt die Fledermaus, wo etwas ist, wie groß es ist und ob es sich bewegt. Das nennt man <b>Echoortung<\/b>. Blind sind sie übrigens nicht, doch im Dunkeln helfen ihnen die Augen wenig.","Unsere Fledermäuse fressen vor allem Insekten, etwa Mücken, Nachtfalter und Käfer. Viele schnappen ihre Beute direkt in der Luft. Die Zwergfledermaus wiegt nur etwa fünf Gramm. Trotzdem kann sie in einer Nacht mehrere Hundert Mücken fangen.","## Vom Dachboden in die Höhle","Tagsüber schlafen Fledermäuse in einem Versteck, dem Quartier. Dort hängen sie meist kopfüber und halten sich mit den Fußkrallen fest. Im Sommer wohnen sie gern auf warmen Dachböden, in Baumhöhlen oder in engen Spalten hinter Fensterläden. Die Weibchen bilden dann große Gruppen, die man Wochenstuben nennt. Dort bekommt jedes Weibchen meist nur ein Junges im Jahr.","Im Winter gibt es kaum Insekten. Deshalb fressen sich Fledermäuse im Spätsommer und Herbst ein Fettpolster an. Dann suchen sie ein frostfreies Winterquartier, etwa eine Höhle, einen alten Gang in einem Bergwerk oder einen kühlen Keller. Dort halten sie Winterschlaf. Ihr Körper kühlt stark ab, und das Herz schlägt nur noch ganz langsam. So sparen sie Energie. Jedes Aufwachen kostet sie viel von ihrem Fettvorrat. Wird eine Fledermaus zu oft gestört, reicht der Vorrat nicht bis zum Frühling.","## Fledermäuse brauchen Hilfe","Viele Fledermausarten sind selten geworden. Alte Bäume mit Höhlen werden gefällt. Wenn Häuser repariert werden, verschließt man oft die kleinen Löcher, durch die Fledermäuse auf den Dachboden fliegen. Außerdem gibt es weniger Insekten als früher. Deshalb stehen alle Fledermäuse in Deutschland unter strengem Schutz. Jeder kann helfen: Wer einen Fledermauskasten aufhängt, schenkt den Tieren ein Quartier. Ein Garten mit vielen Blüten lockt Nachtfalter an – und damit Futter für die Jäger der Nacht."]},"items":[{"id":"l-fledermaus-1","typ":"multi","stufe":1,"kompetenz":"entnehmen","frage":"Lies Absatz 2. Was erkennt eine Fledermaus am Echo ihrer Rufe?","optionen":[{"text":"wo sich etwas befindet","richtig":true},{"text":"wie groß es ist","richtig":true},{"text":"ob es sich bewegt","richtig":true},{"text":"welche Farbe es hat","richtig":false},{"text":"wie es riecht","richtig":false},{"text":"wie schwer es ist","richtig":false}],"tipp":"Suche in Absatz 2 den Satz, in dem das Wort „Echo“ vorkommt. Prüfe dann jede Antwort einzeln.","erklaerung":"Im Text steht: An diesem Echo erkennt die Fledermaus, wo etwas ist, wie groß es ist und ob es sich bewegt. Farbe, Geruch und Gewicht werden nicht genannt."},{"id":"l-fledermaus-2","typ":"zuordnen","stufe":2,"kompetenz":"entnehmen","frage":"Wo wohnen Fledermäuse laut Text im Sommer und wo im Winter? Ordne zu.","gruppen":["Sommerquartier","Winterquartier"],"elemente":[{"t":"war
