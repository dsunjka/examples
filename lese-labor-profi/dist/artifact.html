mer Dachboden","g":0},{"t":"Baumhöhle","g":0},{"t":"Spalte hinter einem Fensterladen","g":0},{"t":"Höhle","g":1},{"t":"alter Gang in einem Bergwerk","g":1},{"t":"kühler Keller","g":1}],"tipp":"Absatz 4 erzählt vom Sommer, Absatz 5 vom Winter. Lies die Orte dort Wort für Wort.","erklaerung":"Im Sommer wohnen Fledermäuse auf warmen Dachböden, in Baumhöhlen und in Spalten hinter Fensterläden. Für den Winterschlaf suchen sie einen frostfreien Ort: eine Höhle, einen alten Gang in einem Bergwerk oder einen kühlen Keller."},{"id":"l-fledermaus-3","typ":"single","stufe":3,"kompetenz":"schliessen","frage":"In Absatz 1 huschen die Fledermäuse lautlos über die Gärten. Dabei rufen sie im Flug ständig. Wie passt das zusammen?","optionen":[{"text":"Ihre Rufe sind zu hoch für menschliche Ohren.","richtig":true},{"text":"Ihre Rufe sind leiser als das Summen einer Mücke.","richtig":false},{"text":"Ihre Rufe gehen im Rauschen der Bäume unter.","richtig":false},{"text":"Die weiche Flughaut dämpft alle ihre Rufe.","richtig":false}],"tipp":"Lies in Absatz 2 nach, was über die Rufe der Fledermäuse steht. Wer kann sie hören und wer nicht?","erklaerung":"Fledermäuse rufen mit Ultraschall. Die meisten dieser Töne sind so hoch, dass Menschen sie nicht hören können. Für uns wirken die Tiere deshalb lautlos."},{"id":"l-fledermaus-4","typ":"matrix","stufe":3,"kompetenz":"schliessen","frage":"Was kannst du aus dem Text schließen? Entscheide bei jeder Aussage.","spalten":["richtig","falsch"],"aussagen":[{"text":"Eine Wiese mit vielen Blüten kann Fledermäusen helfen, satt zu werden.","richtig":true},{"text":"Wer eine Fledermaus im Winterschlaf weckt, um sie anzuschauen, schadet ihr.","richtig":true},{"text":"Im Winter jagen Fledermäuse in kühlen Kellern nach Mücken.","richtig":false},{"text":"Ein Fledermauskasten ist für die Tiere vor allem ein Futterplatz.","richtig":false}],"tipp":"Diese Sätze stehen so nicht im Text. Überlege bei jedem: Passt er zu dem, was du über Futter, Winterschlaf und Quartiere gelesen hast?","erklaerung":"Blüten locken Nachtfalter an, also gibt es dort Futter, und jedes Aufwachen im Winterschlaf kostet wertvolles Fett. Im Winter jagen Fledermäuse aber nicht, und ein Fledermauskasten ist ein Quartier, kein Futterplatz."},{"id":"l-fledermaus-5","typ":"single","stufe":2,"kompetenz":"reflektieren","frage":"Lies den letzten Absatz. Was soll er bei den Lesern vor allem bewirken?","optionen":[{"text":"Die Leser sollen selbst etwas für Fledermäuse tun.","richtig":true},{"text":"Die Leser sollen erfahren, warum es weniger Insekten gibt.","richtig":false},{"text":"Die Leser sollen lernen, wie man einen Fledermauskasten baut.","richtig":false},{"text":"Die Leser sollen erfahren, wie viele Fledermausarten es gibt.","richtig":false}],"tipp":"Lies die letzten beiden Sätze des Absatzes genau. An wen richten sie sich, und was schlagen sie vor?","erklaerung":"Der Absatz erklärt, warum Fledermäuse selten geworden sind, und zeigt dann, was jeder tun kann: einen Fledermauskasten aufhängen oder einen Garten mit vielen Blüten anlegen. Die Leser sollen also selbst helfen."}]},{"id":"l-schullandheim","titel":"Das Licht zwischen den Bäumen","textsorte":"Erzählung","einleitung":"Paul ist mit seiner Klasse im Schullandheim – und dann steht auch noch eine Nachtwanderung an.","text":{"titel":"Das Licht zwischen den Bäumen","untertitel":"Eine Geschichte aus dem Schullandheim","absaetze":["Am ersten Abend im Schullandheim Moosgrund lag Paul lange wach. Durch das gekippte Fenster hörte er die Tannen rauschen, und irgendwo rief ein Käuzchen. Die anderen Jungen in Zimmer 4 schliefen schon. Paul drückte sein Gesicht ins Kissen. Es roch fremd, gar nicht nach zu Hause. Er dachte an Mama, an seinen Hund Bruno und an sein eigenes Bett. Am liebsten wäre er sofort heimgefahren.","Beim Abendessen am nächsten Tag klopfte Frau Huber an ihr Glas. „Heute machen wir eine Nachtwanderung!“, verkündete sie. „Unser Weg führt durch den Wald und wieder zurück zum Haus. Unterwegs hängen fünf Laternen. An jeder findet ihr einen Buchstaben. Jedes Zweierteam bringt mir am Ende das Lösungswort.“ Die Klasse jubelte. Nur Paul wurde ganz still und schob seinen Teller weg. Im Dunkeln durch den Wald? Schon bei dem Gedanken daran wurde ihm mulmig.","Ausgerechnet mit Aylin sollte er gehen. Aylin kletterte im Sportunterricht immer bis unter die Hallendecke und erzählte gern, dass sie vor nichts Angst habe. „Na los, das wird lustig!“, rief sie und lief voraus. Paul bekam die Taschenlampe. Er knipste sie an und stapfte hinter Aylin her.","Die ersten drei Laternen fanden die beiden schnell. Doch auf dem Weg zur vierten flackerte die Taschenlampe plötzlich und ging aus. Um sie herum war es stockdunkel. Pauls Herz klopfte bis zum Hals, und seine Beine fühlten sich an wie Pudding. Da schob sich eine Hand in seine. Aylins Finger zitterten.","„Paul?“, flüsterte Aylin. „Ich habe Angst im Dunkeln. Das habe ich noch nie jemandem erzählt.“ Paul staunte. Die mutige Aylin fürchtete sich auch? Auf einmal fühlte er sich nicht mehr so allein. Er musste an seinen Opa denken. Der hatte einmal zu ihm gesagt: „Wenn du nicht weiterweißt, bleib stehen, atme tief durch und schau dich in Ruhe um.“","„Wir bleiben erst mal stehen“, sagte Paul leise. Gemeinsam atmeten sie dreimal tief ein und aus. Langsam gewöhnten sich ihre Augen an die Dunkelheit. Zwischen den Stämmen schimmerte ein gelbes Licht. „Da vorne!“, rief Paul. Hand in Hand tasteten sie sich vorwärts. Das Licht war die vierte Laterne! „Gut gemacht, Paul“, flüsterte Aylin erleichtert. Von der Laterne aus sahen sie schon die hellen Fenster des Schullandheims, und am Gartentor leuchtete die fünfte Laterne.","„Richtig!“, lobte Frau Huber, als die beiden ihr das Lösungswort nannten. Es hieß MUTIG. Aylin zwinkerte Paul zu, und Paul spürte, wie er vor Stolz ein bisschen größer wurde. Nur die beiden wussten, wie gut dieses Wort zu ihrem Abend passte. In dieser Nacht schlief Paul sofort ein. An das fremde Kissen dachte er kein einziges Mal."]},"items":[{"id":"l-schullandheim-1","typ":"matrix","stufe":2,"kompetenz":"entnehmen","frage":"Was steht in der Geschichte? Entscheide bei jeder Aussage.","spalten":["richtig","falsch"],"aussagen":[{"text":"An jeder Laterne finden die Kinder einen Buchstaben.","richtig":true},{"text":"Paul und Aylin finden alle fünf Laternen ohne Schwierigkeiten.","richtig":false},{"text":"Das gelbe Licht zwischen den Bäumen ist ein Fenster des Schullandheims.","richtig":false},{"text":"Die fünfte Laterne hängt am Gartentor.","richtig":true}],"tipp":"Suche zu jeder Aussage die passende Stelle. Die Absätze 2, 4 und 6 helfen dir.","erklaerung":"An jeder Laterne gibt es einen Buchstaben, und die fünfte hängt am Gartentor. Das gelbe Licht war aber die vierte Laterne, und als die Taschenlampe ausging, wurde es schwierig."},{"id":"l-schullandheim-2","typ":"reihenfolge","stufe":3,"kompetenz":"entnehmen","frage":"Bringe die Ereignisse in die richtige Reihenfolge.","reihe":["Frau Huber kündigt beim Abendessen die Nachtwanderung an.","Paul und Aylin finden die ersten drei Laternen.","Die Taschenlampe flackert und geht aus.","Aylin gibt zu, dass sie Angst im Dunkeln hat.","Paul denkt an den Rat seines Opas.","Die beiden entdecken die vierte Laterne."],"tipp":"Gehe die Geschichte Absatz für Absatz durch und suche jedes Ereignis im Text.","erklaerung":"Erst kündigt Frau Huber die Wanderung an, dann finden die beiden drei Laternen. Danach geht die Lampe aus, Aylin gesteht ihre Angst, Paul erinnert sich an Opas Rat – und so entdecken sie die vierte Laterne."},{"id":"l-schullandheim-3","typ":"multi","stufe":2,"kompetenz":"schliessen","frage":"Lies Absatz 1. Wie fühlt sich Paul am ersten Abend?","optionen":[{"text":"Er hat Heimweh.","richtig":true},{"text":"Er fühlt sich fremd und unwohl.","richtig":true},{"text":"Er freut sich auf die Nachtwanderung.","richtig":false},{"text":"Er ist stolz auf sich.","richtig":false},{"text":"Er ist wütend auf die anderen Jungen.","richtig":false},{"text":"Er ist so müde, dass er gleich einschläft.","richtig":false}],"tipp":"Das Gefühl wird nicht direkt genannt. Achte darauf, woran Paul denkt und was er sich wünscht.","erklaerung":"Paul denkt an Mama, Bruno und sein Bett und möchte am liebsten heimfahren: Er hat Heimweh. Das Kissen riecht fremd, deshalb fühlt er sich unwohl."},{"id":"l-schullandheim-4","typ":"markieren","stufe":2,"kompetenz":"schliessen","frage":"Lies diese Stelle aus Absatz 4. Tippe die Satzteile an, die zeigen, wie Pauls Körper auf die Angst reagiert.","teile":[{"t":"Um sie herum war es stockdunkel"},{"t":".","fix":true},{"t":"Pauls Herz klopfte bis zum Hals","ziel":true},{"t":",","fix":true},{"t":"und","fix":true},{"t":"seine Beine fühlten sich an wie Pudding","ziel":true},{"t":".","fix":true},{"t":"Da schob sich eine Hand in seine"},{"t":".","fix":true},{"t":"Aylins Finger zitterten"},{"t":".","fix":true}],"tipp":"Achte genau darauf, wessen Körper beschrieben wird.","erklaerung":"Ein Herz, das bis zum Hals klopft, und Beine wie Pudding sind Zeichen für große Angst. Die zitternden Finger gehören Aylin, nicht Paul."},{"id":"l-schullandheim-5","typ":"single","stufe":3,"kompetenz":"reflektieren","frage":"Am Anfang riecht Pauls Kissen fremd. Im letzten Satz kommt das Kissen noch einmal vor. Was will die Geschichte damit zeigen?","optionen":[{"text":"Pauls Heimweh ist verschwunden.","richtig":true},{"text":"Paul ist nach der Wanderung erschöpft.","richtig":false},{"text":"Paul fühlt sich noch immer fremd.","richtig":false},{"text":"Paul hat ein neues Kissen bekommen.","richtig":false}],"tipp":"Überlege, warum Paul am ersten Abend an das Kissen gedacht hat. Was hat sich bis zum Schluss verändert?","erklaerung":"Am Anfang erinnert das fremde Kissen Paul daran, dass er nicht zu Hause ist. Am Ende denkt er gar nicht mehr daran – sein Heimweh ist verschwunden."}]},{"id":"l-gedicht","titel":"Novembernebel","textsorte":"Gedicht","einleitung":"Ein Gedicht über einen nebligen Tag im November – achte auf die sprachlichen Bilder.","text":{"titel":"Novembernebel","autor":"Lese-Labor-Team","strophen":[["Am Morgen schleicht auf leisen Sohlen","der Nebel durch das Dorf, ganz sacht.","Er hat die Farben weggestohlen","und aus dem Tag ein Grau gemacht."],["Die Bäume sind wie graue Riesen,","die stumm am Rand des Weges stehn.","Kein Vogel singt mehr auf den Wiesen,","man kann die eigne Hand kaum sehn."],["Doch mittags scheint die Sonne wieder","ganz schüchtern durch das graue Tuch.","Die Amsel schüttelt ihr Gefieder","und wagt den ersten Liedversuch."],["Am Abend ist der Nebel fort,","die Sterne funkeln hell und klar.","Doch morgen liegt er wieder dort,","wo er auch heute Morgen war."]]},"items":[{"id":"l-gedicht-1","typ":"matrix","stufe":1,"kompetenz":"entnehmen","frage":"Was steht im Gedicht? Entscheide bei jeder Aussage.","spalten":["steht im Gedicht","steht nicht im Gedicht"],"aussagen":[{"text":"Der Nebel schleicht durch das Dorf.","richtig":true},{"text":"Der Nebel hat dem Tag die Farben genommen.","richtig":true},{"text":"Am Mittag ist der Nebel schon ganz verschwunden.","richtig":false},{"text":"Am Abend fängt es an zu regnen.","richtig":false}],"tipp":"Suche zu jeder Aussage den passenden Vers. Manche Aussagen sagen dasselbe mit anderen Worten. Findest du keinen passenden Vers, steht es nicht im Gedicht.","erklaerung":"Der Nebel schleicht durch das Dorf (Vers 1 und 2) und hat die Farben weggestohlen (Vers 3). Dass er schon mittags ganz weg ist, steht nirgends – erst in Vers 13 heißt es: „Am Abend ist der Nebel fort.“ Von Regen ist keine Rede."},{"id":"l-gedicht-2","typ":"multi","stufe":2,"kompetenz":"entnehmen","frage":"Lies Strophe 2. Was erfährst du dort über den Nebeltag?","optionen":[{"text":"Die Bäume sehen aus wie graue Riesen.","richtig":true},{"text":"Auf den Wiesen singt kein Vogel mehr.","richtig":true},{"text":"Im dichten Nebel sieht man kaum etwas.","richtig":true},{"text":"Die Bäume verlieren ihre letzten Blätter.","richtig":false},{"text":"Die Bäume stehen mitten auf dem Weg.","richtig":false},{"text":"Ein kalter Wind pfeift über den Weg.","richtig":false}],"tipp":"Strophe 2 hat vier Verse. Vergleiche jede Antwort genau mit diesen Versen. Manche Antworten sagen es mit anderen Worten.","erklaerung":"In Strophe 2 sehen die Bäume aus wie graue Riesen, kein Vogel singt, und man kann die eigene Hand kaum sehen. Die Bäume stehen aber am Rand des Weges, nicht mitten darauf. Von Blättern oder Wind steht dort nichts."},{"id":"l-gedicht-3","typ":"single","stufe":2,"kompetenz":"schliessen","frage":"In Vers 10 scheint die Sonne „durch das graue Tuch“. Was ist mit dem grauen Tuch gemeint?","optionen":[{"text":"der Nebel, der über dem Dorf liegt","richtig":true},{"text":"ein Vorhang vor dem Fenster","richtig":false},{"text":"das dunkle Gefieder der Amsel","richtig":false},{"text":"ein Tuch, das an der Wäscheleine hängt","richtig":false}],"tipp":"Ein Tuch kann etwas zudecken. Was deckt an diesem Tag alles zu?","erklaerung":"Der Nebel liegt grau über dem Dorf und verdeckt alles wie ein Tuch. Die Sonne scheint also durch den Nebel. So ein sprachliches Bild nennt man Metapher."},{"id":"l-gedicht-4","typ":"zuordnen","stufe":3,"kompetenz":"schliessen","frage":"Das Gedicht beschreibt einen ganzen Tag. Ordne zu: Wann passiert was?","gruppen":["am Morgen","am Mittag","am Abend"],"elemente":[{"t":"Der Nebel schleicht durch das Dorf.","g":0},{"t":"Kein Vogel singt auf den Wiesen.","g":0},{"t":"Die Sonne scheint wieder.","g":1},{"t":"Die Amsel schüttelt ihr Gefieder.","g":1},{"t":"Der Nebel ist fort.","g":2},{"t":"Die Sterne funkeln hell und klar.","g":2}],"tipp":"Suche in den Strophen nach Zeitangaben. Hat eine Strophe keine eigene Zeitangabe, dann überlege: Was passiert davor und was danach?","erklaerung":"Strophe 1 beginnt mit „Am Morgen“, Strophe 3 mit „mittags“ und Strophe 4 mit „Am Abend“. Strophe 2 gehört noch zum Morgen: Da singt kein Vogel – erst mittags wagt die Amsel ihr erstes Lied."},{"id":"l-gedicht-5","typ":"single","stufe":2,"kompetenz":"reflektieren","frage":"Welches Reimschema haben die Strophen dieses Gedichts?","optionen":[{"text":"Kreuzreim (abab)","richtig":true},{"text":"Paarreim (aabb)","richtig":false},{"text":"umarmender Reim (abba)","richtig":false},{"text":"kein festes Reimschema","richtig":false}],"tipp":"Schreibe hinter jeden Vers einer Strophe einen Buchstaben. Verse, die sich reimen, bekommen den gleichen Buchstaben.","erklaerung":"In jeder Strophe reimt sich Vers 1 auf Vers 3 und Vers 2 auf Vers 4, zum Beispiel „Sohlen – weggestohlen“ und „sacht – gemacht“. Das ist ein Kreuzreim (abab)."}]},{"id":"l-schulweg","titel":"Unterwegs zur Schule","textsorte":"Sachtext mit Tabelle","einleitung":"Die Klasse 4a hat herausgefunden, wie die Kinder ihrer Schule morgens zum Unterricht kommen – lies den Bericht und schau dir die Tabelle genau an.","text":{"titel":"So kommen wir zur Schule","untertitel":"Eine Umfrage der Klasse 4a","autor":"Aylin und Mateo, Klasse 4a der Grundschule am Lindenbach in Lindenbrunn","absaetze":["Wie kommen die Kinder unserer Schule morgens zum Unterricht? Das wollten wir, die Klasse 4a, im Mai genau wissen. Deshalb haben wir alle 120 Kinder unserer Schule befragt. Jedes Kind durfte nur ein Verkehrsmittel nennen: das, mit dem es meistens kommt. Außerdem hat jedes Kind gesagt, wie viele Minuten sein Schulweg ungefähr dauert. In der Tabelle steht für jedes Verkehrsmittel, wie lange ein Kind damit ungefähr unterwegs ist.","Die größte Gruppe der Kinder geht zu Fuß. Viele von ihnen wohnen nur wenige Straßen von der Schule entfernt. Wer zu Fuß geht, Fahrrad fährt oder Tretroller fährt, bewegt sich schon vor dem Unterricht an der frischen Luft.","Mit dem Fahrrad dürfen an unserer Schule nur Kinder kommen, die die Radfahrprüfung bestanden haben. Diese Prüfung machen bei uns alle Kinder in der 4. Klasse. Die Kinder mit dem Tretroller gehen dagegen fast alle in die 1. oder 2. Klasse.","Die Kinder, die mit dem Schulbus fahren, wohnen in den Dörfern Erlenried und Fuchsbühl. Diese liegen mehrere Kilometer von der Schule entfernt. Auf seinem Weg hält der Schulbus an sieben Haltestellen.","Am schnellsten in der Schule sind die Kinder, die mit dem Auto gebracht werden. Trotzdem ist dieses „Elterntaxi“ ein Problem. Unser Hausmeister, Herr Kofler, hat an einem Morgen gezählt, wie viele Autos zwischen 7:40 Uhr und 8:00 Uhr vor dem Schultor gehalten haben. Es waren 15 Autos. Manche halten auf dem Gehweg oder an der Bushaltestelle. Dann wird es für die Kinder, die zu Fuß kommen, eng und gefährlich.","Deshalb starten wir nach den Pfingstferien unser Projekt „Laufbus“. Dabei gehen Kinder morgens gemeinsam zur Schule, wie bei einem Bus mit festen Haltestellen. Ein Erwachsener begleitet die Gruppe. Unser Ziel: Mindestens die Hälfte der Kinder, die jetzt mit dem Auto kommen, soll bald mit dem Laufbus kommen."],"tabelle":{"titel":"Umfrage der Klasse 4a: So kommen die Kinder zur Schule","kopf":["Verkehrsmittel","Anzahl der Kinder","Ungefähre Dauer des Schulwegs"],"zeilen":[["zu Fuß","52","12 Minuten"],["Fahrrad","16","9 Minuten"],["Tretroller","14","8 Minuten"],["Schulbus","20","18 Minuten"],["Auto („Elterntaxi“)","18","7 Minuten"]]}},"items":[{"id":"l-schulweg-1","typ":"matrix","stufe":3,"kompetenz":"entnehmen","frage":"Stimmen die Aussagen? Nutze den Text und die Tabelle.","spalten":["richtig","falsch"],"aussagen":[{"text":"Mit dem Tretroller kommen mehr Kinder als mit dem Schulbus.","richtig":false},{"text":"Die Fahrradkinder sind laut Tabelle länger unterwegs als die Kinder mit dem Tretroller.","richtig":true},{"text":"Herr Kofler hat an einem Morgen 18 Autos vor dem Schultor gezählt.","richtig":false},{"text":"Mit dem Laufbus sollen bald mindestens 9 Kinder kommen, die jetzt mit dem Auto gebracht werden.","richtig":true}],"tipp":"Für manche Aussagen brauchst du die Tabelle, für andere den Text. Bei einer Aussage musst du Text und Tabelle verbinden und rechnen.","erklaerung":"Mit dem Tretroller kommen 14 Kinder, mit dem Bus 20. Fahrradkinder brauchen ungefähr 9 Minuten, Rollerkinder ungefähr 8. Herr Kofler hat 15 Autos gezählt, nicht 18. Und 18 : 2 = 9, also sollen mindestens 9 Auto-Kinder mit dem Laufbus kommen."},{"id":"l-schulweg-2","typ":"eingabe","stufe":3,"kompetenz":"entnehmen","frage":"Im Text steht, welche Kinder sich schon vor dem Unterricht an der frischen Luft bewegen. Wie viele Kinder sind das laut Umfrage? Rechne mit der Tabelle.","vorgabe":"Tippe nur die Zahl ein.","loesungen":["82","82 Kinder"],"tipp":"Suche in Absatz 2 die drei Arten, wie sich Kinder auf dem Schulweg selbst bewegen. Zähle dann die passenden Zahlen aus der Tabelle zusammen.","erklaerung":"Laut Absatz 2 bewegen sich die Kinder, die zu Fuß gehen, Fahrrad fahren oder Tretroller fahren. Das sind 52 + 16 + 14 = 82 Kinder."},{"id":"l-schulweg-3","typ":"single","stufe":2,"kompetenz":"schliessen","frage":"In welche Klasse gehen die Kinder, die mit dem Fahrrad zur Schule kommen? Wähle die Antwort mit der passenden Begründung.","optionen":[{"text":"Sie gehen alle in die 4. Klasse, denn erst dort machen die Kinder die Radfahrprüfung.","richtig":true},{"text":"Sie gehen alle in die 4. Klasse, denn diese Kinder wohnen am weitesten von der Schule weg.","richtig":false},{"text":"Sie gehen in die 3. und 4. Klasse, denn die Kinder der 1. und 2. Klasse fahren Tretroller.","richtig":false},{"text":"Das kann man nicht wissen, denn im Text steht nirgends, in welche Klasse sie gehen.","richtig":false}],"tipp":"Lies Absatz 3. Was braucht ein Kind, damit es mit dem Fahrrad kommen darf? Und in welcher Klasse bekommt es das?","erklaerung":"Mit dem Rad dürfen nur Kinder kommen, die die Radfahrprüfung bestanden haben. Diese Prüfung machen die Kinder erst in der 4. Klasse. Also gehen alle Fahrradkinder in die 4. Klasse, auch wenn das nicht wörtlich im Text steht."},{"id":"l-schulweg-4","typ":"multi","stufe":2,"kompetenz":"schliessen","frage":"Die Buskinder fahren mit einem Fahrzeug. Trotzdem brauchen sie laut Tabelle länger als die Kinder, die zu Fuß gehen. Welche Gründe kannst du aus dem Text erschließen?","optionen":[{"text":"Sie wohnen in Dörfern, die mehrere Kilometer entfernt liegen.","richtig":true},{"text":"Der Schulbus hält auf seinem Weg an sieben Haltestellen.","richtig":true},{"text":"Der Schulbus steht jeden Morgen lange im Stau.","richtig":false},{"text":"Sie müssen zu Hause erst weit zur Haltestelle laufen.","richtig":false},{"text":"Der Busfahrer fährt besonders langsam, weil Kinder mitfahren.","richtig":false}],"tipp":"Vergleiche zuerst in der Tabelle die Zeiten. Lies dann Absatz 4 genau: Was erfährst du dort über den Weg der Buskinder?","erklaerung":"In Absatz 4 steht, dass die Buskinder mehrere Kilometer entfernt wohnen und der Bus an sieben Haltestellen hält. Von Stau, langen Fußwegen oder einem langsamen Fahrer steht nichts im Text."},{"id":"l-schulweg-5","typ":"single","stufe":1,"kompetenz":"reflektieren","frage":"Die Klasse hat ihre Ergebnisse zusätzlich in einer Tabelle dargestellt. Wozu ist die Tabelle vor allem gut?","optionen":[{"text":"Man kann die Zahlen schnell finden und gut miteinander vergleichen.","richtig":true},{"text":"Man erfährt, warum die Kinder ihr Verkehrsmittel gewählt haben.","richtig":false},{"text":"Man sieht, wie weit jedes Kind von der Schule entfernt wohnt.","richtig":false},{"text":"Man erfährt, wie gefährlich jedes Verkehrsmittel für Kinder ist.","richtig":false}],"tipp":"Schau dir die Spalten der Tabelle an. Welche Angaben stehen dort – und welche findest du dort gar nicht?","erklaerung":"In der Tabelle stehen nur Zahlen: die Anzahl der Kinder und die ungefähre Dauer des Schulwegs. So findest du sie schnell und kannst sie vergleichen. Gründe, Entfernungen oder Gefahren stehen nicht darin."}]},{"id":"l-experiment","titel":"Das schwimmende Ei","textsorte":"Anleitung","einleitung":"Mit dieser Anleitung bringst du ein rohes Ei zum Schwimmen und erfährst, warum das klappt.","text":{"titel":"Kann ein Ei schwimmen?","untertitel":"Ein Experiment für zu Hause oder für die Schule","autor":"Forscherkarte Nr. 7 aus der Forscherecke","absaetze":["Ein Stein geht im Wasser unter, ein Stück Holz schwimmt. Aber was macht ein rohes Ei? Mit diesem Experiment findest du heraus, wie du ein Ei zum Schwimmen bringst. Du brauchst dafür etwa 20 Minuten.","## Material","Du brauchst ein frisches, rohes Ei, ein großes, durchsichtiges Glas (mindestens 500 Milliliter), einen Messbecher, Leitungswasser, Speisesalz, einen Esslöffel und ein Geschirrtuch.","## Sicherheitshinweis","Auf rohen Eiern können Keime sein. Wasche dir deshalb nach dem Experiment gründlich die Hände. Trinke das Salzwasser nicht, denn so viel Salz schadet deinem Körper. Iss das Ei danach nicht.","## So gehst du vor","Schritt 1: Stelle das Glas auf das Geschirrtuch. Miss 250 Milliliter Leitungswasser ab und gieße es ins Glas.","Schritt 2: Lege das Ei mit dem Esslöffel vorsichtig ins Wasser. Beobachte genau, wo das Ei bleibt.","Schritt 3: Hole das Ei mit dem Löffel wieder heraus und lege es auf das Geschirrtuch.","Schritt 4: Gib einen Esslöffel Salz ins Wasser und rühre so lange um, bis sich das Salz aufgelöst hat. Mach das noch dreimal, bis insgesamt vier Löffel Salz im Wasser sind.","Schritt 5: Lege das Ei wieder mit dem Löffel ins Glas. Was passiert jetzt?","Schritt 6 (für Profis): Halte den Esslöffel knapp über das Wasser, und zwar so, dass seine runde Rückseite nach oben zeigt. Gieße langsam Leitungswasser auf den Löffel, bis das Glas fast voll ist.","## Was du beobachtest","Im Leitungswasser sinkt das Ei auf den Boden. Im Salzwasser steigt es nach oben und schwimmt. Nach Schritt 6 schwebt das Ei im Glas, ohne den Boden zu berühren: Unter ihm ist Salzwasser, über ihm Leitungswasser.","## Warum ist das so?","Ob etwas schwimmt oder sinkt, hängt davon ab, ob es schwerer oder leichter ist als die gleiche Menge Wasser. Ein frisches Ei ist etwas schwerer als gleich viel Leitungswasser. Darum sinkt es. Löst sich Salz im Wasser auf, wird das Wasser schwerer, ohne dass es viel mehr wird. Jetzt ist gleich viel Salzwasser schwerer als das Ei. Deshalb trägt das Salzwasser das Ei. Das leichtere Leitungswasser bleibt oben, wenn man es vorsichtig darübergießt. Darum schwebt das Ei genau an der Grenze zwischen dem Salzwasser unten und dem Leitungswasser oben.","Übrigens: Ein altes Ei kann sogar im Leitungswasser schwimmen. In seinem Inneren hat sich mit der Zeit eine größere Luftblase gebildet."]},"items":[{"id":"l-experiment-1","typ":"reihenfolge","stufe":2,"kompetenz":"entnehmen","frage":"Bringe die Arbeitsschritte in die richtige Reihenfolge.","reihe":["Leitungswasser abmessen und ins Glas gießen","Das Ei ins Leitungswasser legen","Das Ei wieder herausholen","Vier Löffel Salz einrühren","Das Ei ins Salzwasser legen","Leitungswasser langsam über den Löffel gießen"],"tipp":"Lies die Schritte 1 bis 6 noch einmal. Achte darauf, wann das Ei im Glas liegt und wann nicht.","erklaerung":"Zuerst kommt Leitungswasser ins Glas. Dann wird das Ei getestet und wieder herausgeholt. Erst danach wird das Salz eingerührt und das Ei zurückgelegt. Zum Schluss wird vorsichtig Leitungswasser darübergegossen."},{"id":"l-experiment-2","typ":"matrix","stufe":1,"kompetenz":"entnehmen","frage":"Stimmen die Aussagen? Lies die Anleitung genau.","spalten":["richtig","falsch"],"aussagen":[{"text":"Für das Experiment brauchst du etwa 20 Minuten.","richtig":true},{"text":"Du sollst für das Experiment ein gekochtes Ei verwenden.","richtig":false},{"text":"Du schüttest das ganze Salz auf einmal ins Wasser.","richtig":false},{"text":"Nach dem Experiment sollst du dir die Hände waschen.","richtig":true}],"tipp":"Schau im ersten Absatz, in der Materialliste, im Sicherheitshinweis und in Schritt 4 nach.","erklaerung":"Das Experiment dauert etwa 20 Minuten, und danach sollst du dir die Hände waschen. Das Ei ist roh, nicht gekocht. Das Salz rührst du Löffel für Löffel ein."},{"id":"l-experiment-3","typ":"single","stufe":2,"kompetenz":"schliessen","frage":"Paul nimmt für das Experiment ein sehr altes Ei. Warum klappt sein Experiment nicht richtig?","optionen":[{"text":"Sein Ei schwimmt schon im Leitungswasser. So sieht er nicht, was das Salz bewirkt.","richtig":true},{"text":"Sein Ei ist viel zu schwer. Deshalb sinkt es auch im Salzwasser wieder nach unten.","richtig":false},{"text":"Sein Ei saugt das Salz auf. Deshalb wird das Wasser im Glas gar nicht schwerer.","richtig":false},{"text":"Sein Ei hat gar keine Luftblase. Deshalb kann das Salzwasser es nicht tragen.","richtig":false}],"tipp":"Lies den Absatz, der mit „Übrigens“ beginnt. Überlege dann, was mit Pauls Ei schon in Schritt 2 passiert.","erklaerung":"Ein altes Ei hat eine größere Luftblase und kann schon im Leitungswasser schwimmen. Dann gibt es keinen Unterschied zum Salzwasser, und Paul kann nicht sehen, dass das Salz das Ei zum Schwimmen bringt."},{"id":"l-experiment-4","typ":"multi","stufe":3,"kompetenz":"schliessen","frage":"Was kannst du aus der Anleitung schließen? Nutze vor allem den Abschnitt „Warum ist das so?“.","optionen":[{"text":"Ohne Schritt 4 würde das Ei auch in Schritt 5 am Boden liegen bleiben.","richtig":true},{"text":"Durch das Salz verändert sich das Wasser, nicht das Ei.","richtig":true},{"text":"Je mehr Leitungswasser im Glas ist, desto besser schwimmt das Ei.","richtig":false},{"text":"Das Salz macht das Ei leichter, deshalb steigt es nach oben.","richtig":false},{"text":"Ein frisches Ei sinkt, weil in ihm eine große Luftblase ist.","richtig":false}],"tipp":"Lies den Abschnitt „Warum ist das so?“ und den Absatz mit „Übrigens“ noch einmal. Schau dir auch die Schritte 3 bis 5 an. Prüfe dann jede Aussage einzeln.","erklaerung":"Das Salz macht das Wasser schwerer, das Ei bleibt gleich. Ohne das Salz aus Schritt 4 wäre im Glas nur Leitungswasser, und darin sinkt ein frisches Ei. Wie viel Wasser im Glas ist, spielt keine Rolle, und eine große Luftblase hat nur ein altes Ei."},{"id":"l-experiment-5","typ":"single","stufe":2,"kompetenz":"reflektieren","frage":"In den Schritten beginnen viele Sätze mit „Lege …“, „Gib …“ oder „Gieße …“. Warum sind die Schritte so geschrieben?","optionen":[{"text":"Wer den Text liest, soll die Schritte selbst nacheinander ausführen.","richtig":true},{"text":"Der Text soll erklären, warum ein rohes Ei im Salzwasser schwimmt.","richtig":false},{"text":"Der Text soll erzählen, was ein Kind bei einem Experiment erlebt hat.","richtig":false},{"text":"Der Text soll die Leser warnen, was bei dem Experiment gefährlich ist.","richtig":false}],"tipp":"Lies Schritt 1 noch einmal. Wem sagt dieser Satz etwas, und was soll diese Person damit machen?","erklaerung":"Der Text ist eine Anleitung. Die Sätze in den Schritten sagen dir, was du tun sollst. So kannst du das Experiment selbst Schritt für Schritt durchführen. Warum das Ei schwimmt und worauf du achten musst, steht in anderen Abschnitten."}]},{"id":"l-meinung","titel":"Bücher für die Pause?","textsorte":"Zeitungsartikel","einleitung":"In der Kinderzeitung „Rabenblatt“ geht es um eine Frage, über die an einer Grundschule gerade heftig diskutiert wird.","text":{"titel":"Ein Bücherschrank für den Pausenhof?","untertitel":"An der Grundschule an der Mühlwiese wird diskutiert – am Freitag fällt die Entscheidung","autor":"Leyla Aksoy, Kinderreporterin","absaetze":["An der Grundschule an der Mühlwiese in Kirchwinkel wird gerade heftig diskutiert: Soll auf dem Pausenhof ein offener Bücherschrank stehen? In so einen Schrank darf jeder Bücher hineinstellen. Wer möchte, darf sich auch Bücher herausnehmen und behalten. Das kostet nichts. Der Elternbeirat hat angeboten, einen Schrank aus Holz zu bezahlen. Der Schrank kostet 450 €. Am Freitag stimmen die Klassensprecherinnen und Klassensprecher aller zwölf Klassen darüber ab.","## Amira sagt: Ja!","Amira (10) aus der Klasse 4b ist für den Bücherschrank. „Viele Kinder wollen in der Pause nicht Fußball oder Fangen spielen“, sagt sie. „Für sie wäre ein spannendes Buch genau das Richtige.“ Außerdem findet Amira, dass Bücher zu schade sind, um zu Hause im Regal zu verstauben. Sie hat schon zehn Bücher gesammelt, die sie verschenken möchte. Amira ist sicher: Mit dem Schrank bekommen mehr Kinder Lust aufs Lesen.","## Jonas sagt: Nein!","Jonas (9) aus der Klasse 4a ist dagegen. „Die Pause ist zum Toben da. Wir lesen doch schon den ganzen Vormittag im Unterricht“, meint er. Außerdem befürchtet Jonas, dass die Bücher bei Regen nass werden und kaputtgehen. „Für 450 € sollten wir lieber neue Bälle und Springseile kaufen. Davon hätten viel mehr Kinder etwas“, sagt er.","## Was man weiß","Die Schulleiterin, Frau Hölzl, möchte sich nicht festlegen. Sie nennt aber ein paar Zahlen: In der Schulbücherei werden pro Woche etwa 40 Bücher ausgeliehen. Die Bücherei ist allerdings nur am Dienstag und am Donnerstag geöffnet. In der Spielekiste für die Pause sind von 20 Bällen nur noch 8 zu gebrauchen.","An der Grundschule im Nachbarort Oberwinkel steht schon seit zwei Jahren ein Bücherschrank mit einem kleinen Dach. Der Hausmeister dort erzählt: „Nasse Bücher hatten wir bisher nur ein einziges Mal. Da hatte jemand die Tür offen gelassen.“ Allerdings räumt er den Schrank jede Woche auf, weil oft Bücher herumliegen.","Welche Seite überzeugt dich mehr? Wie die Abstimmung ausgegangen ist, liest du in der nächsten Ausgabe des „Rabenblatts“."]},"items":[{"id":"l-meinung-1","typ":"single","stufe":1,"kompetenz":"entnehmen","frage":"Wer stimmt am Freitag über den Bücherschrank ab?","optionen":[{"text":"Die Klassensprecherinnen und Klassensprecher aller Klassen","richtig":true},{"text":"Die Schulleiterin Frau Hölzl zusammen mit dem Elternbeirat","richtig":false},{"text":"Alle Kinder der Grundschule an der Mühlwiese","richtig":false},{"text":"Die Leserinnen und Leser der Kinderzeitung","richtig":false}],"tipp":"Die Antwort steht im ersten Absatz. Suche das Wort „Freitag“.","erklaerung":"Im ersten Absatz steht: Am Freitag stimmen die Klassensprecherinnen und Klassensprecher aller zwölf Klassen ab."},{"id":"l-meinung-2","typ":"multi","stufe":2,"kompetenz":"entnehmen","frage":"Welche Gründe nennt Jonas gegen den Bücherschrank?","optionen":[{"text":"In der Pause sollen sich die Kinder austoben können.","richtig":true},{"text":"Die Bücher könnten bei Regen nass werden und kaputtgehen.","richtig":true},{"text":"Mit Bällen und Springseilen hätten mehr Kinder etwas vom Geld.","richtig":true},{"text":"Der Elternbeirat hat zu wenig Geld für den Schrank.","richtig":false},{"text":"In der Schulbücherei gibt es schon genug Bücher für alle.","richtig":false},{"text":"Ein Schrank aus Holz passt nicht auf den Pausenhof.","richtig":false}],"tipp":"Lies nur den Abschnitt „Jonas sagt: Nein!“. Achte auf alles, was Jonas sagt oder befürchtet.","erklaerung":"Jonas meint, die Pause sei zum Toben da. Er befürchtet, dass die Bücher bei Regen nass werden, und er möchte von dem Geld lieber Bälle und Springseile kaufen. Die anderen Gründe nennt er nicht."},{"id":"l-meinung-3","typ":"matrix","stufe":2,"kompetenz":"schliessen","frage":"Ist das eine Tatsache oder eine Meinung? Entscheide bei jeder Aussage.","spalten":["Tatsache","Meinung"],"aussagen":[{"text":"Der Bücherschrank aus Holz kostet 450 €.","richtig":true},{"text":"Bücher sind zu schade, um im Regal zu verstauben.","richtig":false},{"text":"Die Schulbücherei ist nur am Dienstag und am Donnerstag geöffnet.","richtig":true},{"text":"Die Pause ist zum Toben da.","richtig":false}],"tipp":"Eine Tatsache kann man nachprüfen, zum Beispiel durch Nachschauen oder Zählen. Eine Meinung zeigt, was jemand denkt oder findet.","erklaerung":"Den Preis und die Öffnungszeiten kann man nachprüfen, das sind Tatsachen. Ob Bücher zu schade fürs Regal sind und wozu die Pause da ist, sehen nicht alle gleich. Das sind Meinungen von Amira und Jonas."},{"id":"l-meinung-4","typ":"single","stufe":3,"kompetenz":"schliessen","frage":"Jonas befürchtet, dass die Bücher bei Regen nass werden. Welche Information aus dem Text zeigt, dass diese Sorge vielleicht unnötig ist?","optionen":[{"text":"An einer Nachbarschule wurden in zwei Jahren nur einmal Bücher nass.","richtig":true},{"text":"In der Schulbücherei werden pro Woche etwa 40 Bücher ausgeliehen.","richtig":false},{"text":"Von den 20 Bällen in der Spielekiste sind nur noch 8 zu gebrauchen.","richtig":false},{"text":"Der Elternbeirat würde den Bücherschrank aus Holz bezahlen.","richtig":false}],"tipp":"Alle Antworten stehen im Text. Frage dich bei jeder: Hat sie etwas mit Regen und nassen Büchern zu tun?","erklaerung":"In Oberwinkel steht schon seit zwei Jahren ein Bücherschrank. Dort sind nur einmal Bücher nass geworden, weil die Tür offen war. Das spricht gegen die Sorge von Jonas."},{"id":"l-meinung-5","typ":"single","stufe":3,"kompetenz":"reflektieren","frage":"Was will die Kinderreporterin Leyla Aksoy mit ihrem Artikel vor allem erreichen?","optionen":[{"text":"Sie will beide Seiten zeigen, damit sich jeder selbst eine Meinung bildet.","richtig":true},{"text":"Sie will die Leser davon überzeugen, für den Bücherschrank zu stimmen.","richtig":false},{"text":"Sie will allen mitteilen, wie die Abstimmung am Freitag ausgegangen ist.","richtig":false},{"text":"Sie will erreichen, dass die Schule neue Bälle und Springseile kauft.","richtig":false}],"tipp":"Vergleiche, wie viel Platz Amira und Jonas bekommen. Achte auch darauf, ob Leyla ihre eigene Meinung sagt und wie der Artikel endet.","erklaerung":"Leyla stellt beide Meinungen ausführlich vor und nennt Tatsachen. Ihre eigene Meinung verrät sie nicht. Am Ende fragt sie dich, welche Seite dich mehr überzeugt."}]}],"rechtschreibung":{"themen":[{"id":"rs-silben","titel":"Silben und Trennung","kurz":"Silben schwingen und am Zeilenende richtig trennen","kompetenz":"mitsprechen","wissen":{"merksatz":"Sprich ein Wort langsam und schwinge bei jeder Silbe mit. Am Zeilenende trennst du das Wort nach diesen Silben: Fens-ter, Ho-se, Zu-cker.","punkte":["Jede Silbe hat einen Vokal (a, e, i, o, u, ä, ö, ü) oder einen Zwielaut (au, ei, eu, äu).","Steht nur ein Mitlaut zwischen zwei Vokalen, kommt er in die neue Zeile: Ho-se, Na-se, le-sen.","Stehen mehrere Mitlaute dazwischen, kommt nur der letzte in die neue Zeile: Kat-ze, Fens-ter, Ap-fel. Aber: <b>ck<\/b>, <b>ch<\/b> und <b>sch<\/b> bleiben immer zusammen: Zu-cker, Ku-chen, Ta-sche.","Ein einzelner Vokal am Wortanfang oder am Wortende wird nicht abgetrennt: Igel, Abend und Ofen trennst du gar nicht.","Endet eine Silbe mit einem Vokal, ist sie <b>offen<\/b>: <b>Ro<\/b>-se. Endet sie mit einem Mitlaut, ist sie <b>geschlossen<\/b>: <b>Kat<\/b>-ze. In einer offenen Silbe klingt der Vokal meist lang, in einer geschlossenen meist kurz."],"beispiele":["Fens-ter","Kat-ze","Zu-cker","Ta-sche","Ho-se","Igel (nicht trennen)"]},"items":[{"id":"rs-silben-01","typ":"zuordnen","stufe":1,"kompetenz":"mitsprechen","frage":"Schwinge die Silben mit. Wie viele Silben hat jedes Wort? Sortiere.","gruppen":["2 Silben","3 Silben","4 Silben"],"elemente":[{"t":"Fenster","g":0},{"t":"Zucker","g":0},{"t":"Katze","g":0},{"t":"Banane","g":1},{"t":"Tomate","g":1},{"t":"Eidechse","g":1},{"t":"Schokolade","g":2},{"t":"Marmelade","g":2}],"tipp":"Sprich jedes Wort langsam und klatsche bei jeder Silbe einmal in die Hände. Zähle mit.","erklaerung":"Fens-ter, Zu-cker und Kat-ze haben 2 Silben. Ba-na-ne, To-ma-te und Ei-dech-se haben 3. Scho-ko-la-de und Mar-me-la-de haben sogar 4 Silben."},{"id":"rs-silben-02","typ":"luecke","stufe":1,"kompetenz":"mitsprechen","frage":"Wie trennt man diese Wörter am Zeilenende richtig? Wähle aus.","teile":[{"t":"Am Zeilenende trennt Jonas das Wort „Fenster“ so: "},{"wahl":["Fen-ster","Fens-ter","Fenst-er"],"loesung":1},{"t":". Das Wort „Katze“ trennt er so: "},{"wahl":["Kat-ze","Ka-tze","Katz-e"],"loesung":0},{"t":". Und „Zucker“ trennt er so: "},{"wahl":["Zuc-ker","Zuck-er","Zu-cker"],"loesung":2},{"t":"."}],"tipp":"Schwinge die Silben. Denk daran: Bei mehreren Mitlauten kommt nur der letzte in die neue Zeile – und ck bleibt zusammen.","erklaerung":"Fens-ter und Kat-ze: Von mehreren Mitlauten kommt nur der letzte in die neue Zeile. Zu-cker: ck wird nie getrennt und kommt ganz in die neue Zeile."},{"id":"rs-silben-03","typ":"markieren","stufe":1,"kompetenz":"mitsprechen","frage":"Tippe alle Wörter an, die nur eine Silbe haben.","teile":[{"t":"Hund","ziel":true},{"t":",","fix":true},{"t":"Wiese"},{"t":",","fix":true},{"t":"Brot","ziel":true},{"t":",","fix":true},{"t":"Lehrerin"},{"t":",","fix":true},{"t":"Baum","ziel":true},{"t":",","fix":true},{"t":"Apfel"},{"t":",","fix":true},{"t":"Schrank","ziel":true},{"t":",","fix":true},{"t":"Ameise"},{"t":",","fix":true},{"t":"Zwerg","ziel":true},{"t":",","fix":true},{"t":"Tafel"}],"tipp":"Schwinge jedes Wort. Wenn du nur ein einziges Mal schwingst, hat es nur eine Silbe.","erklaerung":"Hund, Brot, Baum, Schrank und Zwerg schwingst du nur einmal. Wie-se, Ap-fel und Ta-fel haben zwei Silben, Leh-re-rin und A-mei-se sogar drei."},{"id":"rs-silben-04","typ":"markieren","stufe":2,"kompetenz":"mitsprechen","frage":"Tippe die Wörter an, die falsch getrennt sind.","teile":[{"t":"Ho-se"},{"t":",","fix":true},{"t":"Tas-che","ziel":true},{"t":",","fix":true},{"t":"Bä-cker"},{"t":",","fix":true},{"t":"Mü-tze","ziel":true},{"t":",","fix":true},{"t":"Kis-te"},{"t":",","fix":true},{"t":"Ap-fel"},{"t":",","fix":true},{"t":"Lö-ffel","ziel":true},{"t":",","fix":true},{"t":"Wol-ke"}],"tipp":"Prüfe jedes Wort: Steht nur ein Mitlaut zwischen den Vokalen oder stehen mehrere dort? Und welche Buchstaben bleiben immer zusammen?","erklaerung":"Richtig wäre Ta-sche (sch bleibt zusammen), Müt-ze und Löf-fel (nur der letzte Mitlaut kommt in die neue Zeile). Ap-fel und Kis-te sind richtig getrennt."},{"id":"rs-silben-05","typ":"zuordnen","stufe":2,"kompetenz":"mitsprechen","frage":"Trenne jedes Wort in Gedanken. Ist die erste Silbe offen oder geschlossen? Sortiere.","gruppen":["offen: endet mit Vokal","geschlossen: endet mit Mitlaut"],"elemente":[{"t":"Rose","g":0},{"t":"Nase","g":0},{"t":"Tafel","g":0},{"t":"lesen","g":0},{"t":"Katze","g":1},{"t":"Hunde","g":1},{"t":"Winter","g":1},{"t":"Fenster","g":1}],"tipp":"Trenne das Wort zuerst, zum Beispiel Bo-den oder Wan-ne. Schau dann auf den letzten Buchstaben der ersten Silbe.","erklaerung":"Ro-, Na-, Ta- und le- enden mit einem Vokal: Das sind offene Silben, der Vokal klingt lang. Kat-, Hun-, Win- und Fens- enden mit einem Mitlaut: Das sind geschlossene Silben, der Vokal klingt kurz."},{"id":"rs-silben-06","typ":"eingabe","stufe":2,"kompetenz":"mitsprechen","frage":"Trenne das Wort nach allen Silben. Schreibe es mit Bindestrichen und ohne Leerzeichen.","vorgabe":"Taschenlampe","loesungen":["Ta-schen-lam-pe"],"tipp":"Schwinge das Wort langsam. Achte auf sch: Diese drei Buchstaben bleiben zusammen.","erklaerung":"Ta-schen-lam-pe hat vier Silben. sch bleibt zusammen, und zwischen m und p wird getrennt."},{"id":"rs-silben-07","typ":"multi","stufe":3,"kompetenz":"mitsprechen","frage":"Welche Wörter darfst du am Zeilenende gar nicht trennen?","optionen":[{"text":"Igel","richtig":true},{"text":"Abend","richtig":true},{"text":"Esel","richtig":true},{"text":"Eule","richtig":false},{"text":"Ameise","richtig":false},{"text":"Eimer","richtig":false}],"tipp":"Schwinge jedes Wort. Prüfe dann: Bliebe am Zeilenende nur ein einzelner Buchstabe stehen? Das ist nicht erlaubt.","erklaerung":"Bei I-gel, A-bend und E-sel bliebe nur ein einzelner Vokal stehen, darum trennst du sie nicht. Eu-le und Ei-mer darfst du trennen, denn eu und ei sind zwei Buchstaben. Ameise trennst du so: Amei-se."},{"id":"rs-silben-08","typ":"matrix","stufe":3,"kompetenz":"mitsprechen","frage":"Stimmt das? Entscheide bei jeder Aussage.","spalten":["richtig","falsch"],"aussagen":[{"text":"„Wecker“ trennt man so: We-cker.","richtig":true},{"text":"„Ufer“ darf man so trennen: U-fer.","richtig":false},{"text":"„Kasten“ trennt man so: Kas-ten.","richtig":true},{"text":"In „Ho-se“ ist die erste Silbe geschlossen.","richtig":false}],"tipp":"Denk an die Regeln für ck, für einzelne Vokale am Wortanfang und für mehrere Mitlaute. Bei der letzten Aussage hilft dir der letzte Buchstabe der ersten Silbe.","erklaerung":"We-cker stimmt, denn ck bleibt zusammen. Kas-ten stimmt auch: Nur der letzte Mitlaut kommt in die neue Zeile. Ufer darfst du nicht trennen, und „Ho-“ endet mit einem Vokal, ist also offen."}]},{"id":"rs-verlaengern","titel":"Verlängern","kurz":"b oder p? d oder t? g oder k?","kompetenz":"nachdenken","wissen":{"merksatz":"Am Wortende hörst du b, d und g oft wie p, t und k. Verlängere das Wort – dann hörst du den richtigen Buchstaben deutlich: Hund → Hun-de.","punkte":["Auch vor einem Mitlaut klingen b, d und g oft hart: er lebt, sie fragt. Verlängern hilft auch hier.","<b>Nomen<\/b> verlängerst du mit der Mehrzahl: der Zwerg → die Zwerge, der Wald → die Wälder.","<b>Verben<\/b> verlängerst du mit der Grundform: er lebt → leben, sie fragt → fragen.","<b>Adjektive<\/b> verlängerst du mit der Steigerung oder mit einem Nomen dahinter: wild → wilder, rund → der runde Ball.","Bei zusammengesetzten Wörtern verlängerst du den Wortteil, bei dem du unsicher bist: Handtuch → Hand → Hände."],"beispiele":["Hund → Hunde","Zwerg → Zwerge","Wald → Wälder","er lebt → leben","wild → wilder","Handtuch → Hand → Hände"]},"items":[{"id":"rs-verlaengern-01","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"d oder t? g oder k? Verlängere die Wörter und wähle richtig.","teile":[{"t":"Im Wal"},{"wahl":["d","t"],"loesung":0},{"t":" steht ein Zel"},{"wahl":["d","t"],"loesung":1},{"t":". Davor sitzt ein Zwer"},{"wahl":["g","k"],"loesung":0},{"t":" auf einer Ban"},{"wahl":["g","k"],"loesung":1},{"t":"."}],"tipp":"Bilde von jedem Nomen die Mehrzahl und sprich sie deutlich in Silben.","erklaerung":"Wald → Wäl-der, Zelt → Zel-te, Zwerg → Zwer-ge, Bank → Bän-ke. In der Mehrzahl hörst du den richtigen Buchstaben."},{"id":"rs-verlaengern-02","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"Wie verlängerst du diese Wörter am besten? Sortiere.","gruppen":["Mehrzahl bilden","Grundform bilden","steigern"],"elemente":[{"t":"der Korb","g":0},{"t":"das Kleid","g":0},{"t":"der Berg","g":0},{"t":"sie lebt","g":1},{"t":"er fragt","g":1},{"t":"es gibt","g":1},{"t":"wild","g":2},{"t":"lieb","g":2}],"tipp":"Überlege zuerst: Ist das Wort ein Nomen, ein Verb oder ein Adjektiv?","erklaerung":"Nomen verlängerst du mit der Mehrzahl (Körbe, Kleider, Berge), Verben mit der Grundform (leben, fragen, geben) und Adjektive mit der Steigerung (wilder, lieber)."},{"id":"rs-verlaengern-03","typ":"eingabe","stufe":1,"kompetenz":"nachdenken","frage":"b oder p? Schreibe das fehlende Wort richtig auf.","vorgabe":"Der Hund schläft in seinem Kor_.","loesungen":["Korb"],"tipp":"Bilde die Mehrzahl des Wortes und sprich sie deutlich in Silben.","erklaerung":"Korb → Kör-be. In der Mehrzahl hörst du deutlich ein b."},{"id":"rs-verlaengern-04","typ":"luecke","stufe":2,"kompetenz":"nachdenken","frage":"Wähle die richtigen Buchstaben. Verlängere dazu Verben, Adjektive und Nomen.","teile":[{"t":"Elif schrei"},{"wahl":["b","p"],"loesung":0},{"t":"t Opa eine Karte: „Die Bucht hier ist run"},{"wahl":["d","t"],"loesung":0},{"t":" wie ein Hal"},{"wahl":["b","p"],"loesung":0},{"t":"mond. Das Wasser ist ganz schön kal"},{"wahl":["d","t"],"loesung":1},{"t":"!“"}],"tipp":"Verben verlängerst du mit der Grundform, Adjektive mit der Steigerung. Beim zusammengesetzten Wort verlängerst du nur den ersten Teil.","erklaerung":"schreibt → schrei-ben, rund → run-der, Halbmond → halb → hal-be, kalt → käl-ter."},{"id":"rs-verlaengern-05","typ":"markieren","stufe":2,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an.","teile":[{"t":"Am"},{"t":"Wandertag"},{"t":"laufen"},{"t":"wir"},{"t":"durch"},{"t":"den"},{"t":"Walt","ziel":true},{"t":"bis"},{"t":"zur"},{"t":"alten"},{"t":"Burk","ziel":true},{"t":".","fix":true},{"t":"Dort"},{"t":"gipt","ziel":true},{"t":"uns"},{"t":"Herr"},{"t":"Huber"},{"t":"ein"},{"t":"Stück"},{"t":"Brot"},{"t":"und"},{"t":"einen"},{"t":"gelben"},{"t":"Apfel"},{"t":".","fix":true}],"tipp":"Verlängere jedes Wort, das auf b, d, g, p, t oder k endet. Auch Verben kannst du verlängern.","erklaerung":"Richtig ist Wald (Wäl-der), Burg (Bur-gen) und gibt (ge-ben). Wandertag (Ta-ge) und Brot (Bro-te) sind richtig geschrieben."},{"id":"rs-verlaengern-06","typ":"zuordnen","stufe":2,"kompetenz":"nachdenken","frage":"Welcher Buchstabe fehlt? Verlängere jedes Wort und sortiere.","gruppen":["d","t","g","k"],"elemente":[{"t":"der Mon_","g":0},{"t":"gesun_","g":0},{"t":"das Bro_","g":1},{"t":"lau_","g":1},{"t":"der Zu_","g":2},{"t":"der We_","g":2},{"t":"der Schran_","g":3},{"t":"kran_","g":3}],"tipp":"Bilde die Mehrzahl oder setze ein -e oder -er an. Dann hörst du den Buchstaben am Anfang der zweiten Silbe.","erklaerung":"Mon-de, ge-sun-de → d. Bro-te, lau-ter → t. Zü-ge, We-ge → g. Schrän-ke, kran-ke → k."},{"id":"rs-verlaengern-07","typ":"markieren","stufe":3,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an. Achtung: Auch zusammengesetzte Wörter sind dabei.","teile":[{"t":"Am"},{"t":"Samstag"},{"t":"fährt"},{"t":"Ben"},{"t":"mit"},{"t":"dem"},{"t":"Fahrrad"},{"t":"zum"},{"t":"Bergsee"},{"t":".","fix":true},{"t":"Im"},{"t":"Rucksack"},{"t":"hat"},{"t":"er"},{"t":"ein"},{"t":"Hanttuch","ziel":true},{"t":",","fix":true},{"t":"einen"},{"t":"Korbball"},{"t":"und"},{"t":"ein"},{"t":"Brod","ziel":true},{"t":"mit"},{"t":"Käse"},{"t":".","fix":true},{"t":"Am"},{"t":"Ufer"},{"t":"baut"},{"t":"er"},{"t":"eine"},{"t":"Sandburk","ziel":true},{"t":".","fix":true}],"tipp":"Zerlege zusammengesetzte Wörter in ihre Teile. Verlängere dann jeden Teil, der auf b, d, g, p, t oder k endet.","erklaerung":"Richtig ist Handtuch (Hän-de), Brot (Bro-te) und Sandburg (Bur-gen). Samstag, Fahrrad, Bergsee und Korbball sind richtig geschrieben."},{"id":"rs-verlaengern-08","typ":"luecke","stufe":3,"kompetenz":"nachdenken","frage":"Verlängere jedes Verb mit der Grundform. Wähle dann den richtigen Buchstaben.","teile":[{"t":"Papa tan"},{"wahl":["g","k"],"loesung":1},{"t":"t das Auto voll. Hinter uns hu"},{"wahl":["b","p"],"loesung":1},{"t":"t ein Bus. Ein Luftballon schwe"},{"wahl":["b","p"],"loesung":0},{"t":"t über die Straße. Auf dem Gehweg lie"},{"wahl":["g","k"],"loesung":0},{"t":"t ein Handschuh."}],"tipp":"Sprich die Grundform jedes Verbs langsam in Silben. Achte auf den Laut am Anfang der zweiten Silbe.","erklaerung":"tankt → tan-ken, hupt → hu-pen, schwebt → schwe-ben, liegt → lie-gen. Die Grundform zeigt dir, ob du einen weichen oder einen harten Buchstaben schreibst."}]},{"id":"rs-ableiten","titel":"Ableiten: ä und äu","kurz":"e oder ä? eu oder äu?","kompetenz":"nachdenken","wissen":{"merksatz":"Du hörst e oder ä, eu oder äu? Suche ein verwandtes Wort mit a oder au. Findest du eins, schreibst du ä oder äu: Land → Länder, Baum → Bäume.","punkte":["Bei <b>Nomen<\/b> hilft oft die Einzahl: die Hände → die Hand, die Häuser → das Haus.","Bei <b>Verben<\/b> hilft die Grundform: er fährt → fahren, sie läuft → laufen.","Bei <b>Adjektiven<\/b> hilft die Grundstufe: älter → alt, wärmer → warm.","Findest du kein verwandtes Wort mit a oder au, schreibst du meistens e oder eu: das Bett, das Feld, heute, die Freundin.","Manche Wörter schreibt man mit ä, obwohl es kein verwandtes Wort mit a gibt. Diese <b>Merkwörter<\/b> musst du dir einprägen: der Käfer, der Bär, der Käse, der März."],"beispiele":["Baum → Bäume","Land → Länder","Haus → Häuser","alt → älter","fahren → er fährt","Merkwörter: Käfer, Bär, Käse"]},"items":[{"id":"rs-ableiten-01","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"eu oder äu? e oder ä? Suche verwandte Wörter und wähle richtig.","teile":[{"t":"H"},{"wahl":["eu","äu"],"loesung":0},{"t":"te spielen Aylin und Emir vor den alten H"},{"wahl":["eu","äu"],"loesung":1},{"t":"sern. Unter den B"},{"wahl":["eu","äu"],"loesung":1},{"t":"men stehen zwei B"},{"wahl":["e","ä"],"loesung":1},{"t":"nke."}],"tipp":"Suche zu jedem Wort ein verwandtes Wort mit a oder au. Gibt es keins, nimmst du e oder eu.","erklaerung":"Häuser kommt von Haus, Bäume von Baum und Bänke von Bank. Zu „heute“ gibt es kein verwandtes Wort mit au, darum schreibst du eu."},{"id":"rs-ableiten-02","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"Welcher Buchstabe fehlt: ä oder e? Suche verwandte Wörter und sortiere.","gruppen":["ä","e"],"elemente":[{"t":"die H_nde","g":0},{"t":"die Gl_ser","g":0},{"t":"die M_use","g":0},{"t":"tr_umen","g":0},{"t":"das B_tt","g":1},{"t":"das F_ld","g":1},{"t":"die L_ute","g":1},{"t":"das F_uer","g":1}],"tipp":"Setze probeweise ä ein und frage dich: Gibt es ein verwandtes Wort mit a oder au? Nur dann bleibt das ä.","erklaerung":"Hände (Hand), Gläser (Glas), Mäuse (Maus) und träumen (Traum) haben verwandte Wörter mit a oder au. Bett, Feld, Leute und Feuer haben keine, darum schreibst du sie mit e."},{"id":"rs-ableiten-03","typ":"markieren","stufe":1,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an.","teile":[{"t":"Im"},{"t":"Herbst"},{"t":"fallen"},{"t":"die"},{"t":"Bletter","ziel":true},{"t":"von"},{"t":"den"},{"t":"Beumen","ziel":true},{"t":".","fix":true},{"t":"Die"},{"t":"Kinder"},{"t":"sammeln"},{"t":"das"},{"t":"Laub"},{"t":"mit"},{"t":"den"},{"t":"Henden","ziel":true},{"t":"und"},{"t":"springen"},{"t":"in"},{"t":"den"},{"t":"großen"},{"t":"Haufen"},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort mit e oder eu: Gibt es ein verwandtes Wort mit a oder au?","erklaerung":"Richtig ist Blätter (Blatt), Bäumen (Baum) und Händen (Hand). „Herbst“ schreibt man mit e, denn es gibt kein verwandtes Wort mit a."},{"id":"rs-ableiten-04","typ":"eingabe","stufe":2,"kompetenz":"nachdenken","frage":"ä oder e? Schreibe das fehlende Wort vollständig auf.","vorgabe":"Im Juli ist es meistens w_rmer als im April.","loesungen":["wärmer"],"tipp":"Bilde die Grundstufe des Adjektivs: Wie heißt das Wort ohne -er?","erklaerung":"„wärmer“ kommt von „warm“. Weil das verwandte Wort ein a hat, schreibst du ä."},{"id":"rs-ableiten-05","typ":"luecke","stufe":2,"kompetenz":"nachdenken","frage":"Wähle die richtige Schreibung. Suche dazu verwandte Wörter mit a oder au.","teile":[{"t":"Jeden Morgen f"},{"wahl":["e","ä"],"loesung":1},{"t":"hrt Luca mit dem Bus zur Schule. Seine Schwester l"},{"wahl":["eu","äu"],"loesung":1},{"t":"ft lieber mit ihren Fr"},{"wahl":["eu","äu"],"loesung":0},{"t":"ndinnen. Im Bus tr"},{"wahl":["eu","äu"],"loesung":1},{"t":"mt Luca von den Ferien."}],"tipp":"Bei Verben hilft die Grundform. Bei Nomen überlegst du, ob es ein verwandtes Wort mit au gibt.","erklaerung":"„fährt“ kommt von „fahren“, „läuft“ von „laufen“ und „träumt“ von „Traum“. Zu „Freundin“ gibt es kein verwandtes Wort mit au, also schreibst du eu."},{"id":"rs-ableiten-06","typ":"zuordnen","stufe":2,"kompetenz":"nachdenken","frage":"Mit welchem Wort ist jedes Wort verwandt? Ordne zu.","gruppen":["Raum","Kraft","fahren","Hand"],"elemente":[{"t":"aufräumen","g":0},{"t":"geräumig","g":0},{"t":"kräftig","g":1},{"t":"die Kräfte","g":1},{"t":"die Fähre","g":2},{"t":"er fährt","g":2},{"t":"die Hände","g":3},{"t":"das Händchen","g":3}],"tipp":"Ersetze in jedem Wort ä durch a oder äu durch au. Welches Wort aus den Kisten steckt dann darin?","erklaerung":"aufräumen und geräumig gehören zu Raum, kräftig und Kräfte zu Kraft, Fähre und fährt zu fahren, Hände und Händchen zu Hand. Darum schreibst du sie mit ä oder äu."},{"id":"rs-ableiten-07","typ":"multi","stufe":3,"kompetenz":"merken","frage":"Welche Wörter sind Merkwörter? Bei ihnen gibt es kein verwandtes Wort mit a.","optionen":[{"text":"der Käfer","richtig":true},{"text":"der Käse","richtig":true},{"text":"der März","richtig":true},{"text":"der Gärtner","richtig":false},{"text":"die Kälte","richtig":false},{"text":"die Schränke","richtig":false}],"tipp":"Überlege bei jedem Wort: Gibt es ein verwandtes Wort mit a, zum Beispiel die Einzahl, die Grundstufe oder ein Wort aus derselben Wortfamilie?","erklaerung":"„Gärtner“ kommt von „Garten“, „Kälte“ von „kalt“ und „Schränke“ von „Schrank“. Zu Käfer, Käse und März gibt es kein verwandtes Wort mit a. Diese Merkwörter musst du dir einprägen."},{"id":"rs-ableiten-08","typ":"markieren","stufe":3,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an. Achtung: Auch Merkwörter sind dabei.","teile":[{"t":"Im"},{"t":"März"},{"t":"entdeckt"},{"t":"Hannah"},{"t":"im"},{"t":"Garten"},{"t":"einen"},{"t":"kleinen"},{"t":"Kefer","ziel":true},{"t":".","fix":true},{"t":"Er"},{"t":"krabbelt"},{"t":"über"},{"t":"die"},{"t":"Handschuhe"},{"t":"des"},{"t":"Gertners","ziel":true},{"t":".","fix":true},{"t":"Hannah"},{"t":"lechelt","ziel":true},{"t":"und"},{"t":"holt"},{"t":"ihre"},{"t":"Lupe"},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort mit e oder ä: Gibt es ein verwandtes Wort mit a? Denk auch an die Merkwörter.","erklaerung":"Richtig ist Käfer (ein Merkwort), Gärtners (von Garten) und lächelt (von lachen). „März“ ist ein Merkwort mit ä und richtig geschrieben."}]},{"id":"rs-gross","titel":"Großschreibung","kurz":"Nomen, Satzanfang und höfliche Anrede","kompetenz":"nachdenken","wissen":{"merksatz":"Groß schreibst du Nomen, das erste Wort eines Satzes und die höfliche Anrede „Sie“. Ob ein Wort ein Nomen ist, prüfst du mit der Artikelprobe: Passt „der“, „die“ oder „das“ davor?","punkte":["Artikelprobe: der Hund, die Freude, das Glück. Auch Gefühle und Dinge, die man nicht anfassen kann, sind Nomen.","Wörter mit den Endungen <b>-ung<\/b>, <b>-heit<\/b>, <b>-keit<\/b>, <b>-nis<\/b> und <b>-schaft<\/b> sind immer Nomen: die Zeitung, die Gesundheit, die Freundlichkeit, das Zeugnis, die Freundschaft.","Das erste Wort eines Satzes schreibst du immer groß.","Sprichst du Erwachsene höflich an, schreibst du „Sie“, „Ihnen“ und „Ihr“ groß: Können Sie mir helfen? Meinst du mit „sie“ eine andere Person, schreibst du klein.","Auch Verben können zu Nomen werden. Steht „beim“, „zum“ oder „das“ davor, schreibst du sie groß: beim Lesen, zum Malen, das Schwimmen."],"beispiele":["der Mut, die Freude","die Zeitung, die Freiheit","die Ehrlichkeit, das Erlebnis","die Freundschaft","Können Sie mir helfen?","beim Lesen, zum Malen"]},"items":[{"id":"rs-gross-01","typ":"markieren","stufe":1,"kompetenz":"nachdenken","frage":"Hier ist alles kleingeschrieben. Tippe die Wörter an, die man großschreiben muss.","teile":[{"t":"am","ziel":true},{"t":"samstag","ziel":true},{"t":"backt"},{"t":"emir","ziel":true},{"t":"mit"},{"t":"seiner"},{"t":"oma","ziel":true},{"t":"einen"},{"t":"kuchen","ziel":true},{"t":".","fix":true}],"tipp":"Denk an den Satzanfang und an Namen. Mache bei den anderen Wörtern die Artikelprobe.","erklaerung":"„Am“ steht am Satzanfang. Samstag, Oma und Kuchen sind Nomen (der Samstag, die Oma, der Kuchen), und Emir ist ein Name."},{"id":"rs-gross-02","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"Groß oder klein? Wähle die richtige Schreibung.","teile":[{"t":"Mia fährt mit dem "},{"wahl":["Fahrrad","fahrrad"],"loesung":0},{"t":" zur "},{"wahl":["schule","Schule"],"loesung":1},{"t":". Dort "},{"wahl":["Spielt","spielt"],"loesung":1},{"t":" sie mit ihren "},{"wahl":["Freunden","freunden"],"loesung":0},{"t":"."}],"tipp":"Mache die Artikelprobe: Kannst du der, die oder das davorsetzen?","erklaerung":"Fahrrad, Schule und Freunde sind Nomen (das Fahrrad, die Schule, die Freunde). „spielt“ ist ein Verb und wird kleingeschrieben."},{"id":"rs-gross-03","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"Die Wörter stehen in Großbuchstaben. Wie schreibt man sie normal? Sortiere.","gruppen":["großschreiben","kleinschreiben"],"elemente":[{"t":"WIESE","g":0},{"t":"MUT","g":0},{"t":"FREUDE","g":0},{"t":"MANTEL","g":0},{"t":"SCHNELL","g":1},{"t":"SPRINGT","g":1},{"t":"LEISE","g":1},{"t":"OFT","g":1}],"tipp":"Mache die Artikelprobe: Passt der, die oder das davor?","erklaerung":"die Wiese, der Mut, die Freude, der Mantel: Das sind Nomen. „schnell“ und „leise“ sind Adjektive, „springt“ ist ein Verb, und vor „oft“ passt kein Artikel."},{"id":"rs-gross-04","typ":"eingabe","stufe":2,"kompetenz":"nachdenken","frage":"Bilde aus dem Adjektiv ein Nomen mit der Endung -keit. Schreibe nur das Nomen auf.","vorgabe":"freundlich → die ___","loesungen":["Freundlichkeit","die Freundlichkeit"],"tipp":"Hänge die Endung an das Adjektiv an. Denk daran, was für Wörter mit dieser Endung gilt.","erklaerung":"Aus „freundlich“ wird „die Freundlichkeit“. Wörter mit -keit sind Nomen und werden großgeschrieben."},{"id":"rs-gross-05","typ":"zuordnen","stufe":2,"kompetenz":"nachdenken","frage":"Mit welcher Endung wird aus dem Wort ein Nomen? Ordne zu.","gruppen":["-ung","-heit","-keit","-nis"],"elemente":[{"t":"hoffen","g":0},{"t":"wohnen","g":0},{"t":"gesund","g":1},{"t":"frech","g":1},{"t":"ehrlich","g":2},{"t":"sauber","g":2},{"t":"erleben","g":3},{"t":"geheim","g":3}],"tipp":"Hänge jede Endung probeweise an und sprich das neue Wort laut. Welches Nomen kennst du?","erklaerung":"die Hoffnung, die Wohnung, die Gesundheit, die Frechheit, die Ehrlichkeit, die Sauberkeit, das Erlebnis, das Geheimnis."},{"id":"rs-gross-06","typ":"luecke","stufe":2,"kompetenz":"nachdenken","frage":"Ben schreibt seiner Nachbarin. Groß oder klein? Wähle richtig.","teile":[{"t":"Liebe Frau Berger, können "},{"wahl":["Sie","sie"],"loesung":0},{"t":" mir bitte "},{"wahl":["ihr","Ihr"],"loesung":1},{"t":" Buch über Pferde leihen? Meine Mama sagt, "},{"wahl":["sie","Sie"],"loesung":0},{"t":" holt es morgen bei "},{"wahl":["ihnen","Ihnen"],"loesung":1},{"t":" ab."}],"tipp":"Frage dich bei jedem Wort: Spricht Ben Frau Berger höflich an? Oder ist eine andere Person gemeint?","erklaerung":"„Sie“, „Ihr“ und „Ihnen“ sind die höfliche Anrede für Frau Berger, darum schreibt Ben sie groß. Mit „sie“ ist die Mama gemeint, das schreibt man klein."},{"id":"rs-gross-07","typ":"markieren","stufe":3,"kompetenz":"nachdenken","frage":"Hier ist alles kleingeschrieben. Tippe alle Wörter an, die man großschreiben muss.","teile":[{"t":"beim","ziel":true},{"t":"lesen","ziel":true},{"t":"vergisst"},{"t":"er"},{"t":"oft"},{"t":"die"},{"t":"zeit","ziel":true},{"t":",","fix":true},{"t":"denn"},{"t":"das"},{"t":"spannende"},{"t":"buch","ziel":true},{"t":"macht"},{"t":"ihm"},{"t":"großen"},{"t":"spaß","ziel":true},{"t":".","fix":true}],"tipp":"Denk an den Satzanfang und mache die Artikelprobe. Achtung: Auch ein Verb kann zum Nomen werden.","erklaerung":"„Beim“ steht am Satzanfang. „Lesen“ ist hier ein Nomen, denn in „beim“ steckt der Artikel (bei dem Lesen). Zeit, Buch und Spaß sind Nomen. „spannende“ beschreibt das Buch und bleibt klein."},{"id":"rs-gross-08","typ":"luecke","stufe":3,"kompetenz":"nachdenken","frage":"Verb oder Nomen? Wähle die richtige Schreibung.","teile":[{"t":"Am Nachmittag möchte Emir "},{"wahl":["malen","Malen"],"loesung":0},{"t":". Zum "},{"wahl":["malen","Malen"],"loesung":1},{"t":" holt er Pinsel und Farben. Seine Schwester Leyla will lieber "},{"wahl":["lesen","Lesen"],"loesung":0},{"t":", denn beim "},{"wahl":["lesen","Lesen"],"loesung":1},{"t":" kann sie sich gut entspannen."}],"tipp":"Prüfe, ob im Wort davor ein Artikel versteckt ist: zum = zu dem, beim = bei dem.","erklaerung":"Nach „möchte“ und „will“ stehen die Verben malen und lesen, sie bleiben klein. In „zum“ und „beim“ steckt der Artikel „dem“. Darum sind „Malen“ und „Lesen“ dort Nomen und werden großgeschrieben."}]},{"id":"rs-merk","titel":"Merkwörter: ie, h, aa/ee/oo, v","kurz":"Langes i, Dehnungs-h, Doppelvokale und v","kompetenz":"merken","wissen":{"merksatz":"Ein langes i schreibst du meistens <b>ie<\/b>. Wörter mit Dehnungs-h, mit <b>aa, ee, oo<\/b> oder mit <b>v<\/b> sind Merkwörter: Präge sie dir gut ein!","punkte":["Hörst du ein langes i, schreibst du fast immer <b>ie<\/b>: Biene, Wiese, Spiegel, liegen. Ausnahmen wie <b>Tiger, Kino, Igel, Krokodil<\/b> und <b>Maschine<\/b> musst du dir merken.","Das Dehnungs-h hörst du nicht. Es steht meistens vor <b>l, m, n<\/b> oder <b>r<\/b>: Zahl, nehmen, Huhn, Uhr. Viele Wörter haben aber kein h: Schule, Name, Tor.","Das h bleibt in der ganzen Wortfamilie: fahren – Fahrt – Fahrrad – er fährt.","Doppelte Selbstlaute gibt es nur als <b>aa, ee<\/b> und <b>oo<\/b>: Haar, Meer, Boot. In deutschen Wörtern gibt es kein ii und kein uu.","Bei <b>v<\/b> hörst du oft ein f: Vogel, Vater, viel, vier. Die Wortbausteine <b>ver-<\/b> und <b>vor-<\/b> schreibst du immer mit v: verlieren, vorlesen."],"beispiele":["Biene, Wiese, liegen → ie","Tiger, Kino, Igel → Ausnahmen mit i","Zahl, Huhn, Uhr → Dehnungs-h","Haar, Meer, Boot → Doppelvokal","Vogel, vier, verlieren → v"]},"items":[{"id":"rs-merk-01","typ":"luecke","stufe":1,"kompetenz":"merken","frage":"Wähle die richtige Schreibung aus.","teile":[{"t":"Lena kämmt sich vor dem "},{"wahl":["Spiegel","Spigel","Spihgel"],"loesung":0},{"t":" ihre langen "},{"wahl":["Haare","Hare","Hahre"],"loesung":0},{"t":"."}],"tipp":"Sprich beide Wörter langsam. Wie schreibt man ein langes i meistens? Und welche Selbstlaute dürfen doppelt stehen?","erklaerung":"<b>Spiegel<\/b> schreibt man mit ie, denn ein langes i schreibt man meistens ie. <b>Haare<\/b> ist ein Merkwort mit aa."},{"id":"rs-merk-02","typ":"zuordnen","stufe":2,"kompetenz":"merken","frage":"v oder f? Ordne jedes Wort der richtigen Kiste zu.","vorgabe":"Das Zeichen _ steht für den fehlenden Buchstaben.","gruppen":["mit v","mit f"],"elemente":[{"t":"_ogel","g":0},{"t":"_ier","g":0},{"t":"_erstecken","g":0},{"t":"_orlesen","g":0},{"t":"_ertig","g":1},{"t":"_reund","g":1},{"t":"_ernsehen","g":1},{"t":"_ahrrad","g":1}],"tipp":"Denk an die Merkwörter mit v und an die Bausteine ver- und vor-. Vorsicht: Nicht jedes Wort, das mit „fer“ beginnt, hat den Baustein ver-.","erklaerung":"Vogel und vier sind Merkwörter mit v, verstecken und vorlesen haben die Bausteine ver- und vor-. Fertig, Freund, fernsehen (von „fern“) und Fahrrad schreibt man mit f."},{"id":"rs-merk-03","typ":"markieren","stufe":2,"kompetenz":"merken","frage":"In diesem Satz sind drei Wörter falsch geschrieben. Tippe sie an.","teile":[{"t":"Am"},{"t":"Se","ziel":true},{"t":"steht"},{"t":"ein"},{"t":"alter"},{"t":"Stul","ziel":true},{"t":",","fix":true},{"t":"auf"},{"t":"dem"},{"t":"ein"},{"t":"bunter"},{"t":"Fogel","ziel":true},{"t":"sitzt"},{"t":".","fix":true}],"tipp":"Lies jedes Wort einzeln. Achte auf Doppelvokale, auf das Dehnungs-h und auf v.","erklaerung":"Richtig ist <b>See<\/b> mit ee, <b>Stuhl<\/b> mit Dehnungs-h vor l und <b>Vogel<\/b> mit v. „steht“ stimmt: Es kommt von „stehen“."},{"id":"rs-merk-04","typ":"eingabe","stufe":1,"kompetenz":"merken","frage":"Schreibe die fehlende Zahl als Wort auf.","vorgabe":"Ein Hund hat ___ Beine.","loesungen":["vier"],"tipp":"Überlege, wie viele Beine ein Hund hat. Das Zahlwort gehört zu den Merkwörtern.","erklaerung":"Ein Hund hat <b>vier<\/b> Beine. „vier“ schreibt man mit v und mit ie – ein Merkwort, das du dir einprägen musst."},{"id":"rs-merk-05","typ":"single","stufe":1,"kompetenz":"merken","frage":"Welches Wort passt in die Lücke?","vorgabe":"In den Sommerferien baden wir im ___.","optionen":[{"text":"Meer","richtig":true},{"text":"Mehr","richtig":false},{"text":"Mer","richtig":false},{"text":"Meher","richtig":false}],"tipp":"Gesucht ist das große, salzige Wasser. Welche Selbstlaute dürfen doppelt stehen?","erklaerung":"Das <b>Meer<\/b> schreibt man mit ee. Das Wort „mehr“ mit h gibt es auch. Es bedeutet aber „eine größere Menge“: Ich möchte mehr Eis."},{"id":"rs-merk-06","typ":"single","stufe":2,"kompetenz":"merken","frage":"In welchem Satz sind alle Wörter richtig geschrieben?","optionen":[{"text":"Im Winter liegt viel Schnee auf den Wiesen.","richtig":true},{"text":"Im Winter ligt viel Schnee auf den Wiesen.","richtig":false},{"text":"Im Winter liegt fiel Schnee auf den Wiesen.","richtig":false},{"text":"Im Winter liegt viel Schne auf den Wiesen.","richtig":false}],"tipp":"Vergleiche die Sätze Wort für Wort. Prüfe das lange i, das v und den Doppelvokal.","erklaerung":"Nur im ersten Satz stimmen <b>liegt<\/b> mit ie, <b>viel<\/b> mit v und <b>Schnee<\/b> mit ee. „fiel“ gibt es auch, es kommt aber von „fallen“."},{"id":"rs-merk-07","typ":"luecke","stufe":3,"kompetenz":"merken","frage":"Setze die richtigen Wörter ein.","teile":[{"t":"Der "},{"wahl":["Tiger","Tieger","Tihger"],"loesung":0},{"t":" im Zoo frisst "},{"wahl":["viel","fiel","vihl"],"loesung":0},{"t":" Fleisch. Danach "},{"wahl":["liegt","ligt","lihgt"],"loesung":0},{"t":" er müde im Gras."}],"tipp":"Denk an die Ausnahmen beim langen i. Überlege bei der zweiten Lücke: Kommt das Wort von „fallen“ oder bedeutet es „eine große Menge“?","erklaerung":"<b>Tiger<\/b> ist eine Ausnahme: langes i, aber kein e. <b>viel<\/b> (eine große Menge) schreibt man mit v und ie, <b>liegt<\/b> mit ie wie „liegen“."},{"id":"rs-merk-08","typ":"multi","stufe":3,"kompetenz":"merken","frage":"Welche Wörter sind richtig geschrieben?","optionen":[{"text":"das Kino","richtig":true},{"text":"der Tiger","richtig":true},{"text":"die Maschine","richtig":true},{"text":"der Spigel","richtig":false},{"text":"die Wise","richtig":false},{"text":"das Krokodiel","richtig":false}],"tipp":"Sprich jedes Wort. Überlege: Ist es ein normales Wort mit ie oder eine Ausnahme, die man nur mit i schreibt?","erklaerung":"Kino, Tiger und Maschine sind Ausnahmen: langes i ohne e. Richtig heißt es <b>Spiegel<\/b>, <b>Wiese<\/b> und <b>Krokodil<\/b>."}]},{"id":"rs-doppel","titel":"Doppelte Mitlaute, ck und tz","kurz":"Kurzer Selbstlaut – dann zwei Mitlaute","kompetenz":"mitsprechen","wissen":{"merksatz":"Nach einem kurzen, betonten Selbstlaut folgen zwei Mitlaute. Hörst du nur einen, verdoppelst du ihn. Statt kk schreibst du <b>ck<\/b>, statt zz schreibst du <b>tz<\/b>.","punkte":["Sprich das Wort deutlich in Silben. Ist der betonte Selbstlaut kurz (Son-ne) oder lang (Ha-se)?","Nach kurzem Selbstlaut folgen zwei Mitlaute. Hörst du nur einen, wird er verdoppelt: Sonne, Teller, Mutter. Bei einsilbigen Wörtern hilft Verlängern: Ball → Bälle.","Statt kk schreibst du <b>ck<\/b>, statt zz schreibst du <b>tz<\/b>: Decke, Zucker, Katze, sitzen.","Nach l, n, r – das merke ja – steht nie tz und nie ck: Wolke, Bank, stark, Pilz, tanzen, Kerze.","Nach langem Selbstlaut und nach au, ei, eu folgt nur ein Mitlaut: Haken, Schaukel, heizen. Kleine Wörter wie an, in, mit, um sind Ausnahmen."],"beispiele":["Sonne, Teller, Mutter","Ball → Bälle","Decke, Zucker → ck","Katze, sitzen → tz","Wolke, Bank, Pilz, Kerze → nach l, n, r","Haken, heizen → nach langem Laut"]},"items":[{"id":"rs-doppel-01","typ":"zuordnen","stufe":1,"kompetenz":"mitsprechen","frage":"Sprich jedes Wort deutlich. Ist der betonte Selbstlaut lang oder kurz? Ordne zu.","gruppen":["langer Selbstlaut","kurzer Selbstlaut"],"elemente":[{"t":"Hase","g":0},{"t":"Kasse","g":1},{"t":"Ofen","g":0},{"t":"offen","g":1},{"t":"Schal","g":0},{"t":"Schall","g":1},{"t":"Miete","g":0},{"t":"Mitte","g":1}],"tipp":"Sprich zwei Wörter mit gleichem Anfang direkt nacheinander und vergleiche. Klingt der Selbstlaut gedehnt oder kurz und knapp?","erklaerung":"In Kasse, offen, Schall und Mitte ist der Selbstlaut kurz – deshalb folgen zwei Mitlaute. In Hase, Ofen, Schal und Miete ist er lang."},{"id":"rs-doppel-02","typ":"luecke","stufe":1,"kompetenz":"mitsprechen","frage":"Setze die richtigen Buchstaben ein.","teile":[{"t":"Die Ka"},{"wahl":["tz","z","zz"],"loesung":0},{"t":"e liegt auf einer De"},{"wahl":["ck","k","kk"],"loesung":0},{"t":"e in der So"},{"wahl":["nn","n","hn"],"loesung":0},{"t":"e."}],"tipp":"Sprich die Wörter in Silben. Ist der Selbstlaut vor der Lücke kurz? Denk daran, wie man ein doppeltes k und ein doppeltes z schreibt.","erklaerung":"In <b>Katze<\/b>, <b>Decke<\/b> und <b>Sonne<\/b> ist der Selbstlaut kurz. Deshalb folgen zwei Mitlaute: tz statt zz, ck statt kk und nn."},{"id":"rs-doppel-03","typ":"markieren","stufe":2,"kompetenz":"mitsprechen","frage":"In diesem Satz sind drei Wörter falsch geschrieben. Tippe sie an.","teile":[{"t":"Am"},{"t":"Mitwoch","ziel":true},{"t":"sitzt"},{"t":"Ben"},{"t":"mit"},{"t":"Opa"},{"t":"am"},{"t":"Bach"},{"t":"und"},{"t":"pakt","ziel":true},{"t":"zwei"},{"t":"Semeln","ziel":true},{"t":"aus"},{"t":".","fix":true}],"tipp":"Sprich jedes Wort in Silben. Wo ist der Selbstlaut kurz, aber danach steht nur ein Mitlaut? Vorsicht: Kleine Wörter sind manchmal Ausnahmen.","erklaerung":"Richtig ist <b>Mittwoch<\/b> (wie Mitte), <b>packt<\/b> (von packen) und <b>Semmeln<\/b>. Das kleine Wort „mit“ ist eine Ausnahme und hat nur ein t."},{"id":"rs-doppel-04","typ":"eingabe","stufe":1,"kompetenz":"mitsprechen","frage":"Verlängere das Wort. Schreibe die Mehrzahl auf.","vorgabe":"der Ball → die ___","loesungen":["Bälle"],"tipp":"Die Mehrzahl hat zwei Silben. Achte auf den Umlaut.","erklaerung":"Die Mehrzahl heißt <b>Bälle<\/b>. Beim Verlängern hörst du deutlich: Bäl-le. Der kurze Selbstlaut braucht zwei l."},{"id":"rs-doppel-05","typ":"zuordnen","stufe":2,"kompetenz":"mitsprechen","frage":"ck oder k? Ordne jedes Wort der richtigen Kiste zu.","vorgabe":"Das Zeichen _ steht für die fehlenden Buchstaben.","gruppen":["ck","k"],"elemente":[{"t":"Glo_e","g":0},{"t":"Zu_er","g":0},{"t":"Ja_e","g":0},{"t":"Brü_e","g":0},{"t":"Wol_e","g":1},{"t":"Ban_","g":1},{"t":"Schau_el","g":1},{"t":"Mar_t","g":1}],"tipp":"Schau genau, was direkt vor der Lücke steht: ein kurzer Selbstlaut, ein Mitlaut oder au?","erklaerung":"Nach kurzem Selbstlaut steht ck: Glocke, Zucker, Jacke, Brücke. Nach l, n, r und nach au steht nur k: Wolke, Bank, Markt, Schaukel."},{"id":"rs-doppel-06","typ":"multi","stufe":2,"kompetenz":"mitsprechen","frage":"Welche Wörter sind richtig geschrieben?","optionen":[{"text":"der Pilz","richtig":true},{"text":"die Mütze","richtig":true},{"text":"die Kerze","richtig":true},{"text":"der Plaz","richtig":false},{"text":"der Tantz","richtig":false},{"text":"die Wurtzel","richtig":false}],"tipp":"Prüfe bei jedem Wort, was vor dem z-Laut steht: ein kurzer Selbstlaut oder l, n, r?","erklaerung":"Nach kurzem Selbstlaut steht tz: <b>Mütze<\/b>, <b>Platz<\/b>. Nach l, n, r steht nur z: <b>Pilz<\/b>, <b>Kerze<\/b>, <b>Tanz<\/b>, <b>Wurzel<\/b>."},{"id":"rs-doppel-07","typ":"luecke","stufe":3,"kompetenz":"mitsprechen","frage":"Setze die richtigen Buchstaben ein.","teile":[{"t":"Oma hei"},{"wahl":["z","tz"],"loesung":0},{"t":"t den Ofen, stellt eine Ker"},{"wahl":["z","tz"],"loesung":0},{"t":"e auf den Tisch und schmü"},{"wahl":["k","ck"],"loesung":1},{"t":"t ihn mit Tannenzweigen."}],"tipp":"Schau genau, was vor jeder Lücke steht: ei, ein Mitlaut oder ein kurzer Selbstlaut?","erklaerung":"Nach ei steht nur z: <b>heizt<\/b>. Nach r steht nie tz: <b>Kerze<\/b>. Das ü in <b>schmückt<\/b> ist kurz, deshalb ck."},{"id":"rs-doppel-08","typ":"single","stufe":3,"kompetenz":"mitsprechen","frage":"Emir schreibt „Wolcke“. Welche Erklärung hilft ihm, seinen Fehler zu verstehen?","optionen":[{"text":"Nach l steht nie ck, also schreibt man Wolke.","richtig":true},{"text":"Das o ist lang, deshalb schreibt man Wolke.","richtig":false},{"text":"Nach o steht nie ck, also schreibt man Wolke.","richtig":false},{"text":"Wolke ist ein Nomen, also schreibt man Wolke.","richtig":false}],"tipp":"Sprich „Wolke“ in Silben. Welcher Buchstabe steht direkt vor dem k-Laut?","erklaerung":"Vor dem k steht ein l, und nach l, n, r steht nie ck. Das o in <b>Wolke<\/b> ist zwar kurz, aber das l ist schon der erste von zwei Mitlauten."}]},{"id":"rs-s","titel":"s, ss oder ß","kurz":"Summend oder zischend, lang oder kurz?","kompetenz":"nachdenken","wissen":{"merksatz":"Summt das s, schreibst du <b>s<\/b>. Zischt es nach langem Selbstlaut oder nach au, ei, eu, schreibst du <b>ß<\/b>. Zischt es nach kurzem Selbstlaut, schreibst du <b>ss<\/b>.","punkte":["Ein summendes s (es klingt wie eine Biene) schreibst du mit <b>s<\/b>: Rose, Hose, Wiese, lesen.","Ein zischendes s nach langem Selbstlaut schreibst du mit <b>ß<\/b>: Straße, Füße, grüßen, groß.","Auch nach au, ei und eu schreibst du für das zischende s ein <b>ß<\/b>: draußen, heißen, fleißig.","Nach kurzem Selbstlaut schreibst du <b>ss<\/b>: Wasser, Kissen, essen, Fluss.","Am Wortende hörst du den Unterschied nicht. Verlängere das Wort: Gras → Gräser, Fuß → Füße, Kuss → küssen."],"beispiele":["Rose, Hose, lesen → s","Straße, groß, heißen → ß","Wasser, Kissen, essen → ss","Gras → Gräser","Fuß → Füße","Kuss → küssen"]},"items":[{"id":"rs-s-01","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"Setze s, ss oder ß richtig ein.","teile":[{"t":"Im Sommer baden wir drau"},{"wahl":["ß","ss","s"],"loesung":0},{"t":"en im Flu"},{"wahl":["ss","ß","s"],"loesung":0},{"t":". Das Wa"},{"wahl":["ss","ß","s"],"loesung":0},{"t":"er ist herrlich kühl."}],"tipp":"Sprich jedes Wort deutlich. Was steht vor dem s-Laut: ein kurzer Selbstlaut, ein langer oder au?","erklaerung":"Nach au schreibt man ß: <b>draußen<\/b>. In <b>Fluss<\/b> und <b>Wasser<\/b> ist der Selbstlaut kurz, deshalb ss."},{"id":"rs-s-02","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"ss oder ß? Ordne jedes Wort der richtigen Kiste zu.","vorgabe":"Das Zeichen _ steht für die fehlenden Buchstaben.","gruppen":["ss","ß"],"elemente":[{"t":"Ki_en","g":0},{"t":"e_en","g":0},{"t":"Schlü_el","g":0},{"t":"Ta_e","g":0},{"t":"Stra_e","g":1},{"t":"Fü_e","g":1},{"t":"grü_en","g":1},{"t":"hei_en","g":1}],"tipp":"Sprich jedes Wort und hör auf den Laut vor der Lücke: kurz und knapp, lang gezogen oder ein ei?","erklaerung":"Kurzer Selbstlaut → ss: Kissen, essen, Schlüssel, Tasse. Langer Selbstlaut oder ei → ß: Straße, Füße, grüßen, heißen."},{"id":"rs-s-03","typ":"single","stufe":1,"kompetenz":"nachdenken","frage":"Welches Wort passt in die Lücke?","vorgabe":"Am Morgen ___ Lena freundlich ihre Nachbarin.","optionen":[{"text":"grüßt","richtig":true},{"text":"grüsst","richtig":false},{"text":"grüst","richtig":false},{"text":"grühst","richtig":false}],"tipp":"Sprich das Wort langsam. Ist das ü lang oder kurz? Summt oder zischt das s?","erklaerung":"In <b>grüßt<\/b> (von grüßen) ist das ü lang und das s zischt. Deshalb schreibt man ß."},{"id":"rs-s-04","typ":"markieren","stufe":2,"kompetenz":"nachdenken","frage":"In diesem Satz sind drei Wörter falsch geschrieben. Tippe sie an.","teile":[{"t":"Nach"},{"t":"der"},{"t":"Schule"},{"t":"laufen"},{"t":"wir"},{"t":"über"},{"t":"die"},{"t":"Strasse","ziel":true},{"t":"zum"},{"t":"Fluß","ziel":true},{"t":"und"},{"t":"werfen"},{"t":"kleine"},{"t":"Steine"},{"t":"ins"},{"t":"Waßer","ziel":true},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort mit s-Laut: Ist der Selbstlaut davor lang oder kurz? Am Wortende hilft dir das Verlängern.","erklaerung":"Richtig ist <b>Straße<\/b> (langes a → ß), <b>Fluss<\/b> (Flüsse: kurzes u → ss) und <b>Wasser<\/b> (kurzes a → ss)."},{"id":"rs-s-05","typ":"eingabe","stufe":2,"kompetenz":"nachdenken","frage":"Wie schreibt man das Wort richtig? Tippe es ein.","vorgabe":"Ich trinke Saft aus einem Gla_.","loesungen":["Glas"],"tipp":"Verlängere das Wort: Bilde die Mehrzahl. Summt oder zischt das s dann?","erklaerung":"Die Mehrzahl heißt <b>Gläser<\/b>. Dort hörst du ein summendes s – also schreibt man auch <b>Glas<\/b> mit s."},{"id":"rs-s-06","typ":"single","stufe":2,"kompetenz":"nachdenken","frage":"Ben weiß nicht, ob man „Nuss“ oder „Nuß“ schreibt. Was hilft ihm?","optionen":[{"text":"Er verlängert zu „Nüsse“: Das ü ist kurz, also ss.","richtig":true},{"text":"Er verlängert zu „Nüsse“: Das ü ist lang, also ß.","richtig":false},{"text":"Er merkt sich: Am Ende eines Wortes steht immer ß.","richtig":false},{"text":"Er merkt sich: Nach dem Buchstaben u steht nie ss.","richtig":false}],"tipp":"Bilde die Mehrzahl und sprich sie langsam. Wie klingt das ü?","erklaerung":"In <b>Nüsse<\/b> ist das ü kurz. Nach kurzem Selbstlaut schreibt man ss – also auch <b>Nuss<\/b>."},{"id":"rs-s-07","typ":"luecke","stufe":3,"kompetenz":"nachdenken","frage":"Setze s, ss oder ß richtig ein.","teile":[{"t":"Im Gra"},{"wahl":["s","ss","ß"],"loesung":0},{"t":" schläft unser Hund, auf einem gro"},{"wahl":["ß","ss","s"],"loesung":0},{"t":"en Stein sitzt die Katze, und eine Mau"},{"wahl":["s","ss","ß"],"loesung":0},{"t":" huscht vorbei."}],"tipp":"Am Wortende hilft das Verlängern. Prüfe dann: Summt das s oder zischt es? Ist der Laut davor lang oder kurz?","erklaerung":"<b>Gras<\/b> → Gräser und <b>Maus<\/b> → Mäuse: Das s summt, also s. In <b>großen<\/b> ist das o lang und das s zischt, also ß."},{"id":"rs-s-08","typ":"multi","stufe":3,"kompetenz":"nachdenken","frage":"In welche Wörter gehört ein ß?","vorgabe":"Das Zeichen _ steht für die Lücke.","optionen":[{"text":"flei_ig","richtig":true},{"text":"sü_","richtig":true},{"text":"bei_en","richtig":true},{"text":"die Na_e","richtig":false},{"text":"na_","richtig":false},{"text":"das Schlo_","richtig":false}],"tipp":"Verlängere die kurzen Wörter. Ist der Laut vor dem s lang, kurz oder ein ei? Summt oder zischt das s?","erklaerung":"ß gehört in <b>fleißig<\/b> und <b>beißen<\/b> (nach ei) und in <b>süß<\/b> (süße: langes ü, zischendes s). <b>Nase<\/b> hat ein summendes s, <b>nass<\/b> und <b>Schloss<\/b> haben einen kurzen Selbstlaut."}]},{"id":"rs-rede","titel":"Wörtliche Rede und Satzzeichen","kurz":"Anführungszeichen, Doppelpunkt, Komma","kompetenz":"zeichen","wissen":{"merksatz":"Was jemand wörtlich sagt, setzt du in Anführungszeichen. Der Begleitsatz verrät, wer spricht.","punkte":["Die wörtliche Rede steht in Anführungszeichen: am Anfang unten („), am Ende oben (“).","Steht der Begleitsatz vorn, folgt ein <b>Doppelpunkt<\/b>: Mia ruft: „Komm schnell!“","Steht der Begleitsatz hinten, folgt nach dem Anführungszeichen ein <b>Komma<\/b>. Der Punkt der wörtlichen Rede fällt weg: „Ich komme mit“, sagt Ben.","Fragezeichen und Ausrufezeichen bleiben stehen, das Komma kommt trotzdem dazu: „Kommst du mit?“, fragt Lena.","Jede Satzart hat ihr Zeichen: Aussagesatz → Punkt, Fragesatz → Fragezeichen, Ausruf → Ausrufezeichen."],"beispiele":["Tim sagt: „Ich habe Hunger.“","„Ich habe Hunger“, sagt Tim.","Oma fragt: „Hast du Hunger?“","„Hast du Hunger?“, fragt Oma.","„Pass auf!“, ruft Papa."]},"items":[{"
