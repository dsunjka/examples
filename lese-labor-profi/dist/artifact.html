  }
}
const itemInfo = (id) => REG.items[id];
const gruppeVon = (id) => REG.gruppen[(REG.items[id] || {}).gruppe];
function kompetenzLabel(modul, k) { return (KOMPETENZEN[modul] || {})[k] || k || 'Sonstiges'; }
function modulHatInhalt(id) {
  if (id === 'tempo') return !!(INHALT.tempo && (INHALT.tempo.saetze || []).length);
  return (REG.module[id] || { items: [] }).items.length > 0;
}

/* ---- 02-speicher.js ---- */
/* ===== Speicher: Profile, Fortschritt, Punkte, Abzeichen (nur auf diesem Gerät) ===== */
const SPEICHER_KEY = 'lese-labor-profi:v1';
const EINST_STANDARD = {
  zeitDigital: 40, zeitLesen: 30, zeitTest: 20, zeitGross: 45, timerZeigen: true,
  schrift: 'normal', weit: false, ruhig: false, thema: 'auto',
  stimme: '', sprechTempo: 0.85, tempoDauer: 180, blitzSek: 3,
};
const AVATARE = ['🦊', '🦉', '🐢', '🐙', '🦔', '🐝', '🐧', '🦁', '🐼', '🐸', '🦄', '🐳'];
const INTERVALLE = [0, 864e5, 2 * 864e5, 4 * 864e5, 8 * 864e5, 16 * 864e5];
let speicherOk = true;

function leererSpeicher() { return { version: 1, aktivesProfil: null, profile: {}, einstellungen: { ...EINST_STANDARD } }; }
function ladeSpeicher() {
  try {
    const roh = window.localStorage.getItem(SPEICHER_KEY);
    if (roh) {
      const d = JSON.parse(roh);
      if (d && d.version === 1 && d.profile) {
        d.einstellungen = { ...EINST_STANDARD, ...(d.einstellungen || {}) };
        for (const p of Object.values(d.profile)) normalisiereProfil(p);
        return d;
      }
    }
  } catch (e) { speicherOk = false; }
  return leererSpeicher();
}
function normalisiereProfil(p) {
  p.items = p.items || {}; p.pruefungen = p.pruefungen || []; p.tempo = p.tempo || [];
  p.diktate = p.diktate || {}; p.texte = p.texte || {}; p.abzeichen = p.abzeichen || {};
  p.tage = p.tage || []; p.punkte = p.punkte || 0; p.fehlerBehoben = p.fehlerBehoben || 0;
  p.fehlerwoerter = p.fehlerwoerter || [];
  return p;
}
let DB = ladeSpeicher();
let speicherTimer = null;
function speichern(sofort = false) {
  clearTimeout(speicherTimer);
  const los = () => {
    try { window.localStorage.setItem(SPEICHER_KEY, JSON.stringify(DB)); speicherOk = true; }
    catch (e) { speicherOk = false; }
  };
  if (sofort) los(); else speicherTimer = setTimeout(los, 250);
}
window.addEventListener('pagehide', () => speichern(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) speichern(true); });

const E = () => DB.einstellungen;
const P = () => DB.profile[DB.aktivesProfil] || null;

function neuesProfil(name, avatar) {
  const id = 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
  DB.profile[id] = normalisiereProfil({ id, name: (name || '').trim().slice(0, 24) || 'Forscherkind', avatar: avatar || AVATARE[0], erstellt: Date.now() });

  speichern(true);
  return DB.profile[id];
}
function profilLoeschen(id) {
  delete DB.profile[id];
  if (DB.aktivesProfil === id) DB.aktivesProfil = Object.keys(DB.profile)[0] || null;
  speichern(true);
}

/* ---------- Fortschritt je Aufgabe ----------
   l: letzter Status  r = richtig ohne Hilfe, h = richtig mit Hilfe/zweitem Versuch, t = teilweise, f = falsch */
function itemStand(id, p = P()) { return (p && p.items[id]) || null; }
function itemStatus(id, p = P()) { const s = itemStand(id, p); return s ? s.l : 'neu'; }
function notiereErgebnis(id, status, { sauber = false } = {}) {
  const p = P(); if (!p) return 0;
  const vorher = p.items[id];
  const r = p.items[id] || (p.items[id] = { v: 0, ok: 0, x: 0, b: 0, d: 0 });
  const warFehler = vorher && ['f', 't', 'h'].includes(vorher.l);
  r.v++; r.z = Date.now();
  let punkte = 1;
  if (status === 'richtig') {
    r.ok++;
    if (sauber) { r.l = 'r'; r.b = Math.min(5, (r.b || 0) + 1); punkte = 10; if (warFehler) p.fehlerBehoben++; }
    else { r.l = 'h'; r.b = Math.max(1, r.b || 0); punkte = 5; }
  } else {
    r.x++; r.l = status === 'teilweise' ? 't' : 'f'; r.b = 1; punkte = status === 'teilweise' ? 2 : 1;
  }
  r.d = Date.now() + INTERVALLE[r.b || 0];
  punkteDazu(punkte);
  merkeTag();
  speichern();
  return punkte;
}
function punkteDazu(n) { const p = P(); if (p) p.punkte = Math.max(0, (p.punkte || 0) + n); }
function merkeTag() {
  const p = P(); if (!p) return;
  const t = heute();
  if (!p.tage.includes(t)) { p.tage.push(t); if (p.tage.length > 400) p.tage = p.tage.slice(-400); }
}
function serie(p = P()) {
  if (!p || !p.tage.length) return 0;
  const set = new Set(p.tage); let n = 0; const d = new Date();
  if (!set.has(heute(d))) d.setDate(d.getDate() - 1);
  while (set.has(heute(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function modulStand(modul, p = P()) {
  const ids = (REG.module[modul] || { items: [] }).items;
  let r = 0, h = 0, f = 0, gesehen = 0;
  for (const id of ids) {
    const s = itemStatus(id, p);
    if (s !== 'neu') gesehen++;
    if (s === 'r') r++; else if (s === 'h') h++; else if (s === 'f' || s === 't') f++;
  }
  return { gesamt: ids.length, gemeistert: r, geuebt: h, fehler: f, gesehen };
}
function gesamtStand(p = P()) {
  let g = 0, m = 0;
  for (const mod of MODULE) { const s = modulStand(mod.id, p); g += s.gesamt; m += s.gemeistert; }
  return { gesamt: g, gemeistert: m, prozent: pct(m, g) };
}
function fehlerKiste(p = P()) {
  if (!p) return [];
  return Object.keys(p.items).filter((id) => REG.items[id] && ['f', 't', 'h'].includes(p.items[id].l))
    .sort((a, b) => (p.items[a].z || 0) - (p.items[b].z || 0));
}
function faelligeWiederholungen(p = P()) {
  if (!p) return [];
  const jetzt = Date.now();
  return Object.keys(p.items).filter((id) => REG.items[id] && p.items[id].l === 'r' && (p.items[id].b || 0) < 4 && (p.items[id].d || 0) <= jetzt);
}

/* ---------- Level ---------- */
const LEVEL = [
  [0, 'Labor-Neuling'], [150, 'Lese-Entdecker'], [400, 'Wort-Forscher'], [800, 'Text-Detektiv'],
  [1400, 'Sprach-Experte'], [2200, 'Lese-Labor-PROFI'], [3200, 'Labor-Legende'],
];
function level(punkte) {
  let i = 0; while (i + 1 < LEVEL.length && punkte >= LEVEL[i + 1][0]) i++;
  const [ab, name] = LEVEL[i], naechst = LEVEL[i + 1];
  return { nr: i + 1, name, ab, bis: naechst ? naechst[0] : null, naechsterName: naechst ? naechst[1] : null };
}

/* ---------- Tagesmission ---------- */
function tagesMission() {
  const p = P(); if (!p) return null;
  const t = heute();
  if (p.mission && p.mission.datum === t && p.mission.ids.every((id) => REG.items[id])) return p.mission;
  const rnd = rng(p.id + t);
  const ids = [];
  const nimm = (id) => { if (id && !ids.includes(id) && ids.length < 10) ids.push(id); };
  fehlerKiste(p).slice(0, 3).forEach(nimm);
  faelligeWiederholungen(p).slice(0, 2).forEach(nimm);
  const reihen = mische(MODULE.filter((m) => m.id !== 'tempo'), rnd).map((m) => {
    const alle = REG.module[m.id].items;
    const neu = mische(alle.filter((id) => itemStatus(id, p) === 'neu'), rnd);
    const rest = mische(alle.filter((id) => itemStatus(id, p) !== 'neu'), rnd);
    // Digitale Fälle und Texte: zusammenhängend wählen (eine Gruppe), damit die Quelle passt
    return neu.concat(rest);
  });
  let runde = 0;
  while (ids.length < 10 && reihen.some((r) => r.length) && runde < 50) {
    for (const r of reihen) if (r.length) nimm(r.shift());
    runde++;
  }
  // nach Quelle gruppieren, damit Fälle/Texte nicht ständig wechseln
  const reihenfolge = ids.slice().sort((a, b) => {
    const ga = REG.items[a].modul + REG.items[a].gruppe, gb = REG.items[b].modul + REG.items[b].gruppe;
    return ga < gb ? -1 : ga > gb ? 1 : 0;
  });
  p.mission = { datum: t, ids: reihenfolge, erledigt: [] };
  speichern();
  return p.mission;
}

/* ---------- Abzeichen ---------- */
const ABZEICHEN = [
  { id: 'start', sym: '🧪', name: 'Erster Versuch', text: 'Die erste Aufgabe gelöst', test: (p) => Object.keys(p.items).length >= 1 },

function importCode(code) {
  const roh = String(code || '').trim();
  let json;
  if (roh.startsWith('LLP1:')) json = decodeURIComponent(escape(atob(roh.slice(5).replace(/\s+/g, ''))));
  else if (roh.startsWith('{')) json = roh;
  else throw new Error('Das ist kein gültiger Sicherungscode. Er beginnt mit „LLP1:“.');
  const d = JSON.parse(json);
  if (!d || d.app !== 'lese-labor-profi' || !d.profile) throw new Error('Der Code gehört nicht zu Lese-Labor PROFI.');
  let n = 0;
  for (const [id, p] of Object.entries(d.profile)) { DB.profile[id] = normalisiereProfil(p); n++; }
  if (d.einstellungen) DB.einstellungen = { ...EINST_STANDARD, ...d.einstellungen };
  if (!DB.profile[DB.aktivesProfil]) DB.aktivesProfil = Object.keys(DB.profile)[0] || null;
  speichern(true);
  return n;
}

/* ===== Aufgaben: Darstellung, Eingabe und Auswertung aller Aufgabentypen ===== */
const PUNKT_DAVOR = /^[.,!?;:)\]»“"'…]/;
const KEIN_LEER_DANACH = /[„(«‚\[]$/;

/** Zufällige Anzeigereihenfolge für eine Aufgabe (wird pro Sitzung gemerkt). */
function neuePerm(it) {
  const p = {};
  if (it.typ === 'single' || it.typ === 'multi') p.opt = permutation((it.optionen || []).length);
  if (it.typ === 'luecke') p.gaps = (it.teile || []).filter((t) => t.wahl).map((t) => permutation(t.wahl.length));
  if (it.typ === 'zuordnen') p.el = permutation((it.elemente || []).length);
  if (it.typ === 'reihenfolge') p.reihe = permutation((it.reihe || []).length, true);
  return p;
}
function leereAntwort(it, perm) {
  switch (it.typ) {
    case 'single': return null;
    case 'multi': return [];
    case 'matrix': return (it.aussagen || []).map(() => null);
    case 'luecke': return (it.teile || []).filter((t) => t.wahl).map(() => null);
    case 'markieren': return [];
    case 'zuordnen': return (it.elemente || []).map(() => -1);
    case 'reihenfolge': return { ordnung: (perm && perm.reihe) ? perm.reihe.slice() : (it.reihe || []).map((_, i) => i), beruehrt: false };
    case 'eingabe': return '';
    default: return null;
  }
}
function antwortStand(it, a) {
  if (a == null) return 'leer';
  switch (it.typ) {
    case 'single': return a == null ? 'leer' : 'voll';
    case 'multi': case 'markieren': return a.length ? 'voll' : 'leer';
    case 'matrix': case 'luecke': { const n = a.filter((x) => x != null).length; return n === 0 ? 'leer' : n === a.length ? 'voll' : 'teil'; }
    case 'zuordnen': { const n = a.filter((x) => x >= 0).length; return n === 0 ? 'leer' : n === a.length ? 'voll' : 'teil'; }
    case 'reihenfolge': return a.beruehrt ? 'voll' : 'leer';
    case 'eingabe': return String(a).trim() ? 'voll' : 'leer';
    default: return 'leer';
  }
}
function normEingabe(s) { return String(s || '').replace(/[‘’‚]/g, "'").replace(/[“”„]/g, '"').replace(/\s+/g, ' ').trim(); }

/** Auswertung: status richtig | teilweise | falsch | leer */
function bewerte(it, a) {
  const stand = antwortStand(it, a);
  if (stand === 'leer') return { status: 'leer', richtigAnz: 0, gesamt: 1 };
  const aus = (ok, n, extra = {}) => ({ status: ok === n ? 'richtig' : ok >= Math.ceil(n / 2) && ok > 0 ? 'teilweise' : 'falsch', richtigAnz: ok, gesamt: n, ...extra });
  switch (it.typ) {
    case 'single': return { status: it.optionen[a] && it.optionen[a].richtig ? 'richtig' : 'falsch', richtigAnz: 0, gesamt: 1 };
    case 'multi': {
      const soll = it.optionen.map((o, i) => (o.richtig ? i : -1)).filter((i) => i >= 0);
      const tp = a.filter((i) => soll.includes(i)).length, fp = a.length - tp;
      if (tp === soll.length && fp === 0) return { status: 'richtig', tp, fp, n: soll.length, richtigAnz: tp, gesamt: soll.length };
      return { status: tp > 0 && tp - fp >= 1 ? 'teilweise' : 'falsch', tp, fp, n: soll.length, richtigAnz: tp, gesamt: soll.length };
    }
    case 'matrix': return aus(it.aussagen.filter((s, z) => a[z] === (s.richtig ? 0 : 1)).length, it.aussagen.length);
    case 'luecke': { const g = it.teile.filter((t) => t.wahl); return aus(g.filter((t, i) => a[i] === t.loesung).length, g.length); }
    case 'markieren': {
      const ziele = it.teile.map((t, k) => (t.ziel ? k : -1)).filter((k) => k >= 0);
      const tp = a.filter((k) => ziele.includes(k)).length, fp = a.length - tp;
      if (tp === ziele.length && fp === 0) return { status: 'richtig', tp, fp, n: ziele.length, richtigAnz: tp, gesamt: ziele.length };
      return { status: tp > 0 && tp - fp >= Math.ceil(ziele.length / 2) ? 'teilweise' : 'falsch', tp, fp, n: ziele.length, richtigAnz: tp, gesamt: ziele.length };
    }
    case 'zuordnen': return aus(it.elemente.filter((e, i) => a[i] === e.g).length, it.elemente.length);
    case 'reihenfolge': return aus(a.ordnung.filter((v, i) => v === i).length, a.ordnung.length);
    case 'eingabe': {
      const g = normEingabe(a), loes = (it.loesungen || []).map(normEingabe);
      if (loes.includes(g)) return { status: 'richtig', richtigAnz: 1, gesamt: 1 };
      if (loes.some((l) => l.toLowerCase() === g.toLowerCase())) return { status: 'teilweise', richtigAnz: 0, gesamt: 1, gross: true };
      return { status: 'falsch', richtigAnz: 0, gesamt: 1 };
    }
    default: return { status: 'falsch', richtigAnz: 0, gesamt: 1 };
  }
}

/** Neue Antwort aus einer Aktion berechnen (reine Funktion). */
function aendereAntwort(it, a, act, ds, ui) {
  switch (act) {
    case 'opt': {
      const i = Number(ds.i);
      if (it.typ === 'single') return a === i ? null : i;
      return a.includes(i) ? a.filter((x) => x !== i) : a.concat(i);
    }
    case 'mx': { const n = a.slice(); const z = Number(ds.z), s = Number(ds.s); n[z] = n[z] === s ? null : s; return n; }
    case 'lk': { const n = a.slice(); n[Number(ds.g)] = ds.wert === '' ? null : Number(ds.wert); return n; }
    case 'tok': { const k = Number(ds.i); return a.includes(k) ? a.filter((x) => x !== k) : a.concat(k); }
    case 'chip': {
      const i = Number(ds.i);
      // Ein anderes Kärtchen ist ausgewählt und das angetippte liegt schon in einer Kiste: dorthin einsortieren.
      if (ui.chip != null && ui.chip !== i && a[i] >= 0) { const n = a.slice(); n[ui.chip] = a[i]; ui.chip = null; return n; }
      ui.chip = ui.chip === i ? null : i; return a;
    }
    case 'gruppe': {
      if (ui.chip == null) return a;
      const n = a.slice(); n[ui.chip] = Number(ds.g); ui.chip = null; return n;
    }
    case 'pool': {
      if (ui.chip == null) return a;
      const n = a.slice(); n[ui.chip] = -1; ui.chip = null; return n;
    }
    case 'hoch': case 'runter': {
      const k = Number(ds.k), o = a.ordnung.slice(), z = act === 'hoch' ? k - 1 : k + 1;
      if (z < 0 || z >= o.length) return a;
      [o[k], o[z]] = [o[z], o[k]];
      return { ordnung: o, beruehrt: true };
    }
    case 'eingabe': return ds.wert;
    default: return a;
  }
}

function rueckmeldung(it, erg, { versuch = 1, zeigeLoesung = false } = {}) {

const SITE_FARBEN = { gruen: '#2f8a3f', blau: '#2f68d8', orange: '#d9671c', lila: '#7a4cc2', rot: '#c7364a', grau: '#4b5568', tuerkis: '#0c8b8b', gelb: '#b88a00' };
const ERLAUBTE_TAGS = new Set('h1 h2 h3 h4 p ul ol li strong em b i small span div a button br hr table thead tbody tr th td dl dt dd details summary time caption'.split(' '));
const GEFAEHRLICH = new Set('script style iframe object embed img video audio link meta form input textarea select svg math template noscript'.split(' '));
const ERLAUBTE_ATTR = new Set(['class', 'data-ziel', 'data-extern', 'open', 'colspan', 'rowspan', 'datetime', 'title', 'aria-label']);
const KLASSE_OK = /^(?:[wspcma]-[a-z0-9-]+|aktiv)$/;
const MARKER_ZIELE = 'p, li, td, th, dd, dt, h1, h2, h3, h4, summary, .c-text, .p-text, .s-text, .s-titel, .m-vorschau, .m-betreff, .a-zelle, .a-hinweis, .a-gross';

const htmlCache = new Map();
function saeubere(html) {
  if (htmlCache.has(html)) return htmlCache.get(html);
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  for (const el of Array.from(tpl.content.querySelectorAll('*'))) {
    const tag = el.tagName.toLowerCase();
    if (GEFAEHRLICH.has(tag)) { el.remove(); continue; }
    if (!ERLAUBTE_TAGS.has(tag)) { el.replaceWith(...Array.from(el.childNodes)); continue; }
    for (const at of Array.from(el.attributes)) {
      if (!ERLAUBTE_ATTR.has(at.name)) el.removeAttribute(at.name);
    }
    if (el.hasAttribute('class')) {
      const cls = el.getAttribute('class').split(/\s+/).filter((c) => KLASSE_OK.test(c));
      if (cls.length) el.setAttribute('class', cls.join(' ')); else el.removeAttribute('class');
    }
    if (tag === 'a' && (el.hasAttribute('data-ziel') || el.hasAttribute('data-extern'))) { el.setAttribute('role', 'link'); el.setAttribute('tabindex', '0'); }
    if (tag === 'button') el.setAttribute('type', 'button');
  }
  const div = document.createElement('div');
  div.appendChild(tpl.content.cloneNode(true));
  const out = div.innerHTML;
  htmlCache.set(html, out);
  return out;
}

function fallNavigiere(fallId, wohin) {

/* ---------- Lesetext ---------- */

/* ---------- Textmarker ---------- */
function markerVorbereiten(wurzel) {
  const box = wurzel.querySelector('[data-marker-key]');
  if (!box) return;
  const key = box.getAttribute('data-marker-key');
  const ziele = Array.from(box.querySelectorAll(MARKER_ZIELE)).filter((el) => !el.querySelector(MARKER_ZIELE));
  ziele.forEach((el, i) => el.setAttribute('data-tm', String(i)));
  const gesetzt = ((SITZ && SITZ.marker) || {})[key] || [];
  for (const i of gesetzt) { const el = box.querySelector(`[data-tm="${i}"]`); if (el) el.classList.add('tm'); }
}
function markerUmschalten(el) {
  const box = el.closest('[data-marker-key]'); if (!box) return;
  const key = box.getAttribute('data-marker-key'), i = Number(el.getAttribute('data-tm'));
  SITZ.marker = SITZ.marker || {};
  const liste = SITZ.marker[key] || (SITZ.marker[key] = []);
  const pos = liste.indexOf(i);
  if (pos >= 0) { liste.splice(pos, 1); el.classList.remove('tm'); } else { liste.push(i); el.classList.add('tm'); }
  sitzungMerken();
}
function markerLoeschen() {
  const box = $('.quelle-flaeche [data-marker-key]'); if (!box) return;
  const key = box.getAttribute('data-marker-key');
  if (SITZ.marker) SITZ.marker[key] = [];
  $$('.tm', box).forEach((el) => el.classList.remove('tm'));
  sitzungMerken();
}

/* ---- 05-sitzung.js ---- */

  SITZ = {

    zeitLimit: cfg.zeitMin ? cfg.zeitMin * 60 : 0, verbraucht: 0, browser: {}, marker: {}, ui: { chip: null },

    zeitVerborgen: !E().timerZeigen,

  for (const id of ids) {
    const it = REG.items[id].it;
    SITZ.perms[id] = neuePerm(it);
    SITZ.antworten[id] = leereAntwort(it, SITZ.perms[id]);

}
function sitzungFortsetzen() {

function zeichneAntwortNeu() {

/* ---------- Aktionen ---------- */
function antwortAktion(act, ds) {
  if (!SITZ) return;
  const id = aktId(), it = aktIt();
  if (!istPruefung() && SITZ.phase[id] !== 'edit') return;
  SITZ.antworten[id] = aendereAntwort(it, SITZ.antworten[id], act, ds, SITZ.ui);
  if (act === 'eingabe') { const k = $('#pruefen-knopf'); if (k) k.disabled = antwortStand(it, SITZ.antworten[id]) === 'leer'; if (istPruefung()) { zeichneKopf(); sitzungMerken(); } return; }
  zeichneAntwortNeu();
}
function gehe(i) {
  if (!SITZ) return;
  i = clamp(i, 0, SITZ.ids.length - 1);
  if (i === SITZ.index) return;
  SITZ.ui.chip = null;
  const alteGruppe = REG.items[aktId()].gruppe;
  const alteArt = quellArt(aktId());
  SITZ.index = i;
  const neueArt = quellArt(aktId());
  const mitQ = (a) => a === 'fall' || a === 'text';
  if (mitQ(alteArt) !== mitQ(neueArt)) { renderSitzung(); }
  else {
    zeichneKopf();
    if (REG.items[aktId()].gruppe !== alteGruppe) zeichneQuelle();
    zeichneAufgabe();
    const sp = $('#aufgabe-spalte'); if (sp) sp.scrollTop = 0;
    if (window.innerWidth <= 900) { const a = $('#aufgabe-spalte'); if (a && mitQ(neueArt)) a.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0); }
  }
  sitzungMerken();
}
function pruefen() {
  const id = aktId(), it = aktIt(), a = SITZ.antworten[id];
  if (antwortStand(it, a) === 'leer') return;
  const erg = bewerte(it, a);
  const v = (SITZ.versuche[id] = (SITZ.versuche[id] || 0) + 1);
  if (v === 1) SITZ.erste[id] = erg.status;
  SITZ._letzteErg = { id, erg };
  if (erg.status === 'richtig') {
    const sauber = v === 1 && !SITZ.tipp[id];
    SITZ.phase[id] = 'fertig';
    abschliessen(id, 'richtig', sauber);
  } else if (v < 2) {
    SITZ.phase[id] = 'nochmal';
  } else {
    SITZ.phase[id] = 'loesung';
    abschliessen(id, erg.status === 'leer' ? 'falsch' : erg.status, false);
  }
  zeichneAufgabe(); zeichneKopf();
  const rm = $('.rueckmeldung'); if (rm && rm.scrollIntoView) rm.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function abschliessen(id, status, sauber) {
  if (SITZ.ergebnis[id]) return;
  SITZ.ergebnis[id] = status === 'richtig' ? (sauber ? 'r' : 'h') : status === 'teilweise' ? 't' : 'f';
  const n = notiereErgebnis(id, status, { sauber });
  SITZ.punkte += n;
  SITZ._letztePunkte = { id, n };
  if (SITZ.art === 'mission') { const p = P(); if (p && p.mission && !p.mission.erledigt.includes(id)) p.mission.erledigt.push(id); }
  pruefeAbzeichen();
}
function loesungZeigen() {
  const id = aktId(), it = aktIt();
  SITZ.phase[id] = 'loesung';
  const erste = SITZ.erste[id] || bewerte(it, SITZ.antworten[id]).status;
  abschliessen(id, erste === 'richtig' ? 'falsch' : erste === 'leer' ? 'falsch' : erste, false);
  zeichneAufgabe(); zeichneKopf();
}
function tippZeigen() {
  const id = aktId(), it = aktIt();
  SITZ.tipp[id] = true;
  const g = gruppeVon(id);
  if (it.tippSeite && g && g.art === 'fall') {
    fallNavigiere(g.id, it.tippSeite);
    const q = $('#quelle .geraet'); if (q) { q.classList.remove('ziel-blitz'); void q.offsetWidth; q.classList.add('ziel-blitz'); }
  }
  zeichneAufgabe();
}
function weiter() {
  if (SITZ.index < SITZ.ids.length - 1) { gehe(SITZ.index + 1); return; }
  if (istPruefung()) { abgebenFragen(); return; }
  trainingFertig();
}

/* ---------- Uhr ---------- */
function starteUhr() {
  stoppeUhr();
  if (!istPruefung()) return;
  bildschirmWach(true);
  uhrTimer = setInterval(() => {
    if (!SITZ || !istPruefung() || SITZ.abgegeben) { stoppeUhr(); return; }
    if (document.visibilityState !== 'visible' || $('.dialog-huelle')) return;
    SITZ.verbraucht++;
    const u = $('#uhr span');
    if (SITZ.zeitLimit) {
      const rest = SITZ.zeitLimit - SITZ.verbraucht;
      if (u && !SITZ.zeitVerborgen) u.textContent = zeitLesbar(rest);
      const uhr = $('#uhr'); if (uhr) uhr.classList.toggle('knapp', rest <= 300);
      if (rest === 300) toast('Noch 5 Minuten!');
      if (rest <= 0) { zeitAbgelaufen(); return; }
    }
    if (SITZ.verbraucht % 5 === 0) sitzungMerken();
  }, 1000);
}
function stoppeUhr() { if (uhrTimer) clearInterval(uhrTimer); uhrTimer = null; bildschirmWach(false); }
async function bildschirmWach(an) {
  try {
    if (an && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!an && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
async function zeitAbgelaufen() {
  stoppeUhr();
  await dialog({ titel: 'Die Zeit ist um!', text: 'Deine Prüfung wird jetzt ausgewertet. Alle Antworten, die du gegeben hast, zählen.', knoepfe: [{ label: 'Zur Auswertung', wert: true }] });
  auswerten();
}
async function abgebenFragen() {
  let leer = 0, teil = 0, mark = 0;
  for (const id of SITZ.ids) {
    const s = antwortStand(REG.items[id].it, SITZ.antworten[id]);
    if (s === 'leer') leer++; else if (s === 'teil') teil++;
    if (SITZ.markiert[id]) mark++;
  }
  const teile = [];
  if (leer) teile.push(`${plural(leer, 'Aufgabe ist', 'Aufgaben sind')} noch nicht beantwortet`);
  if (teil) teile.push(`${plural(teil, 'Aufgabe ist', 'Aufgaben sind')} nur teilweise beantwortet`);
  if (mark) teile.push(`${plural(mark, 'Aufgabe hast', 'Aufgaben hast')} du zum späteren Ansehen markiert`);
  const ok = await dialog({
    titel: 'Prüfung abgeben?',
    text: teile.length ? teile.join('. ') + '. Danach kannst du nichts mehr ändern.' : 'Du hast alle Aufgaben beantwortet. Danach kannst du nichts mehr ändern.',
    knoepfe: [{ label: 'Weiterarbeiten', wert: false, stil: 'knopf-zweit' }, { label: 'Jetzt abgeben', wert: true, stil: 'knopf-signal' }],
  });
  if (ok) auswerten();
}

/* ---------- Auswertung ---------- */
function auswerten() {
  if (!SITZ || SITZ.abgegeben) return;
  SITZ.abgegeben = true;
  stoppeUhr();
  const details = {};
  let punkte = 0;
  for (const id of SITZ.ids) {
    const it = REG.items[id].it, erg = bewerte(it, SITZ.antworten[id]);
    const st = erg.status === 'richtig' ? 'r' : erg.status === 'teilweise' ? 't' : erg.status === 'leer' ? 'leer' : 'f';
    details[id] = st;
    if (st === 'r') punkte++;
    notiereErgebnis(id, erg.status === 'richtig' ? 'richtig' : erg.status === 'teilweise' ? 'teilweise' : 'falsch', { sauber: true });
  }
  const p = P();
  const eintrag = {
    art: SITZ.pruefArt || 'test', titel: SITZ.titel, datum: Date.now(), punkte, max: SITZ.ids.length,
    dauer: SITZ.verbraucht, zeitLimit: SITZ.zeitLimit, ids: SITZ.ids, details, antworten: SITZ.antworten, perms: SITZ.perms,
  };
  if (p) {
    p.pruefungen.push(eintrag);
    if (p.pruefungen.length > 40) p.pruefungen = p.pruefungen.slice(-40);
    punkteDazu(punkte * 3);
    delete p.laufend;
    speichern(true);
  }
  pruefeAbzeichen();
  zeige('ergebnis', { index: p ? p.pruefungen.length - 1 : -1, eintrag });
}
function trainingFertig() {
  stoppeUhr();
  const p = P();
  if (SITZ.art === 'mission' && p && p.mission && p.mission.erledigt.length >= p.mission.ids.length) {
    if (p.missionGeschafft !== p.mission.datum) { p.missionGeschafft = p.mission.datum; punkteDazu(30); SITZ.punkte += 30; }
    speichern();
  }
  pruefeAbzeichen();
  zeige('zusammenfassung', { sitz: SITZ });
}
async function sitzungBeenden() {
  if (istPruefung()) {
    const w = await dialog({ titel: 'Prüfung unterbrechen?', text: 'Deine Antworten und die Zeit werden gespeichert. Du kannst später auf der Startseite weitermachen.', knoepfe: [{ label: 'Weiterarbeiten', wert: false, stil: 'knopf-zweit' }, { label: 'Unterbrechen', wert: true }] });
    if (!w) return;
    sitzungMerken(true);
  } else {
    const offen = SITZ.ids.filter((id) => !SITZ.ergebnis[id]).length;
    if (offen && Object.keys(SITZ.ergebnis).length === 0 && SITZ.ids.length > 1) {
      // nichts gelöst: ohne Rückfrage zurück
    } else if (offen) {
      const w = await dialog({ titel: 'Training beenden?', text: `Noch ${plural(offen, 'Aufgabe ist', 'Aufgaben sind')} offen. Was du schon gelöst hast, ist gespeichert.`, knoepfe: [{ label: 'Weiterüben', wert: false, stil: 'knopf-zweit' }, { label: 'Beenden', wert: true }] });
      if (!w) return;
    }
  }
  stoppeUhr();
  const z = SITZ.zurueck || { name: 'start' };
  SITZ = null;
  zeige(z.name, z.param);
}

function ringSVG(wert, max, farbe = 'var(--akzent)') {
  const r = 60, u = 2 * Math.PI * r, anteil = max ? wert / max : 0;
  return `<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="${wert} von ${max} Punkten"><circle class="spur" cx="75" cy="75" r="${r}"/><circle class="wert" cx="75" cy="75" r="${r}" style="stroke:${farbe}" stroke-dasharray="${u.toFixed(1)}" stroke-dashoffset="${(u * (1 - anteil)).toFixed(1)}"/><text x="75" y="72" text-anchor="middle" font-size="34">${wert}</text><text x="75" y="98" text-anchor="middle" font-size="15" style="fill:var(--tinte-2)">von ${max}</text></svg>`;
}
function urteil(anteil) {
  if (anteil >= 0.9) return 'Lese-Labor-PROFI! Hervorragend gearbeitet.';
  if (anteil >= 0.75) return 'Sehr stark! Du bist richtig gut vorbereitet.';
  if (anteil >= 0.55) return 'Gute Grundlage! Übe gezielt deine schwächsten Bereiche.';

}
function balkenZeilen(gruppen) {

}
function auswertungNach(ids, details) {
  const nachKomp = {}, nachGruppe = {};
  for (const id of ids) {

    const ok = details[id] === 'r' ? 1 : 0;

    gg.ok += ok; gg.n++;
  }
  return { komp: Object.values(nachKomp), gruppen: Object.values(nachGruppe) };
}
function reviewListe(ids, antworten, perms, details) {
  return `<div class="review-liste">${ids.map((id, i) => {
    const info = REG.items[id]; if (!info) return '';
    const it = info.it, st = details[id] || 'leer', g = REG.gruppen[info.gruppe];

function gruppeKarte(gid, mod) {

function pruefKarte(art, titel, n, min, beschr) {

    <div class="fakten"><span class="fakt">${n} Aufgaben</span><span class="fakt">${icon('uhr')}${min ? min + ' Min.' : 'ohne Zeit'}</span>${best != null ? `<span class="fakt">Bestwert ${best}/${n}</span>` : ''}</div>

/* ---------- Prüfungen definieren ---------- */
function leseChecks() {
  const g = REG.module.lesen.gruppen;
  if (!g.length) return [];
  const halb = Math.ceil(g.length / 2);
  const teile = g.length > 3 ? [g.slice(0, halb), g.slice(halb)] : [g];
  return teile.map((t, i) => ({ art: i === 0 ? 'lesen-a' : 'lesen-b', titel: `Lese-Check ${i === 0 ? 'A' : 'B'}`, ids: t.flatMap((gid) => REG.gruppen[gid].items), beschr: 'Texte: ' + t.map((gid) => REG.gruppen[gid].titel).join(', ') }));
}
function modulTest(modul, proThema = 2) {
  const out = [];
  for (const gid of REG.module[modul].gruppen) out.push(...mische(REG.gruppen[gid].items).slice(0, proThema));
  return out;
}
function grosserCheck() {
  const p = P(), anz = p.pruefungen.filter((x) => x.art === 'gross').length;
  const ids = [];
  const fg = REG.module.digital.gruppen; if (fg.length) ids.push(...REG.gruppen[fg[anz % fg.length]].items);
  const tg = REG.module.lesen.gruppen; if (tg.length) ids.push(...REG.gruppen[tg[anz % tg.length]].items);
  const zieh = (m, n) => mische(REG.module[m].items).slice(0, n);
  ids.push(...zieh('rechtschreibung', 4), ...zieh('grammatik', 4), ...zieh('schreiben', 3));
  return ids;
}
function pruefConfig(art) {
  if (art === 'digital') return { art, titel: 'BYLET-D-Prüfung', ids: REG.module.digital.items.slice(), zeitMin: E().zeitDigital, modul: 'digital' };
  if (art === 'lesen-a' || art === 'lesen-b') { const c = leseChecks().find((x) => x.art === art); return c ? { art, titel: c.titel, ids: c.ids, zeitMin: E().zeitLesen, modul: 'lesen' } : null; }
  if (art.startsWith('test-')) { const m = art.slice(5); return { art, titel: MODUL[m].titel.replace('-Labor', '').replace('Schreib-Werkstatt', 'Schreib') + '-Test', ids: modulTest(m), zeitMin: E().zeitTest, modul: m }; }
  if (art === 'gross') return { art, titel: 'Großer Deutsch-Check', ids: grosserCheck(), zeitMin: E().zeitGross, modul: null };
  return null;
}

/* ---------- Ergebnis & Zusammenfassung ---------- */

/* ---------- Labor-Buch ---------- */

      <div class="start-raster" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">
        <section class="karte" style="display:grid;gap:12px;--farbe:var(--m-tempo)"><h2 style="font-size:1.1rem">Lese-Tempo (richtige Sätze)</h2>

const TEMPO_UEBUNG = [{ t: 'Ein Hund kann bellen.', r: true }, { t: 'Die Sonne ist kalt und dunkel.', r: false }, { t: 'Im Winter kann es schneien.', r: true }];

function viewTempo() {

          <button type="button" class="knopf" data-act="tempo-start" ${saetze.length ? '' : 'disabled'}>Test starten</button>

          <p class="klein leise">Der Tempo-Wert ist: richtige minus falsche Sätze. Vergleiche dich mit dir selbst – jedes Mal ein bisschen besser!</p></section>

function tempoStart() {
  const saetze = (INHALT.tempo || {}).saetze || [];
  const n = saetze.length, drittel = Math.ceil(n / 3);
  const reihe = [0, 1, 2].flatMap((b) => mische(saetze.slice(b * drittel, (b + 1) * drittel)));
  TEMPO = { phase: 'uebung', uebung: TEMPO_UEBUNG.slice(), saetze: reihe, i: 0, richtig: 0, falsch: 0, fehler: [], dauer: E().tempoDauer, rest: E().tempoDauer, rueck: null };
  zeige('tempo-lauf');
}
function renderTempoLauf() {
  if (!TEMPO) { zeige('tempo'); return; }
  const app = $('#app');
  const uebung = TEMPO.phase === 'uebung';
  const satz = uebung ? TEMPO.uebung[TEMPO.i] : TEMPO.saetze[TEMPO.i];
  if (!satz) { tempoEnde(); return; }
  app.innerHTML = `<div class="sitzung">
    <header class="sitzung-kopf"><button type="button" class="rund-knopf" data-act="tempo-abbruch" aria-label="Test abbrechen">${icon('zurueck')}</button>
      <div class="sitzung-titel"><b>Lese-Tempo</b><span>${uebung ? `Übungssatz ${TEMPO.i + 1} von ${TEMPO.uebung.length}` : `Satz ${TEMPO.i + 1}`}</span></div>
      ${uebung ? '' : `<span class="uhr" id="tempo-uhr">${icon('uhr')}<span>${zeitLesbar(TEMPO.rest)}</span></span>`}</header>
    <div class="tempo-buehne">
      ${uebung ? '' : `<div class="zeitbalken" aria-hidden="true"><i id="tempo-balken" style="width:${pct(TEMPO.rest, TEMPO.dauer)}%"></i></div>`}
      <p class="tempo-satz" id="tempo-satz" aria-live="polite">${esc(satz.t)}</p>
      <div class="tempo-knoepfe"><button type="button" class="tempo-knopf ja" data-act="tempo-antwort" data-r="1"><span aria-hidden="true">✓</span>stimmt</button><button type="button" class="tempo-knopf nein" data-act="tempo-antwort" data-r="0"><span aria-hidden="true">✗</span>stimmt nicht</button></div>
      <p class="leise" id="tempo-rueck" style="min-height:1.5em">${uebung && TEMPO.rueck ? esc(TEMPO.rueck) : uebung ? 'Übung: Hier bekommst du eine Rückmeldung.' : ''}</p>
    </div></div>`;
}
function tempoAntwort(r) {
  if (!TEMPO) return;
  const uebung = TEMPO.phase === 'uebung';
  const satz = uebung ? TEMPO.uebung[TEMPO.i] : TEMPO.saetze[TEMPO.i];
  if (!satz) return;
  const ok = (r === 1) === !!satz.r;
  if (uebung) {
    TEMPO.rueck = ok ? 'Richtig!' : `Nicht ganz: Der Satz ${satz.r ? 'stimmt' : 'stimmt nicht'}.`;
    TEMPO.i++;
    if (TEMPO.i >= TEMPO.uebung.length) {
      TEMPO.phase = 'start';
      $('#app').innerHTML = `<div class="sitzung"><div class="tempo-buehne"><h1 style="font-size:2rem">Bereit?</h1><p class="leise">${esc(TEMPO.rueck)} Jetzt geht es richtig los. Die Uhr läuft ${TEMPO.dauer / 60} ${TEMPO.dauer === 60 ? 'Minute' : 'Minuten'}.</p><button type="button" class="knopf knopf-signal" data-act="tempo-los" style="min-width:220px">Los!</button><button type="button" class="knopf knopf-geist" data-act="tempo-abbruch">Abbrechen</button></div></div>`;
      return;
    }
    renderTempoLauf();
    return;
  }
  if (ok) TEMPO.richtig++; else { TEMPO.falsch++; TEMPO.fehler.push(satz); }
  TEMPO.i++;
  const s = TEMPO.saetze[TEMPO.i];
  if (!s) { tempoEnde(); return; }
  const el = $('#tempo-satz'); if (el) el.textContent = s.t;
  const kopf = $('.sitzung-titel span'); if (kopf) kopf.textContent = `Satz ${TEMPO.i + 1}`;

  const erg = schreibAnalyse(feld.value, a);
  $('#schreib-analyse').innerHTML = `<h3 style="font-size:1rem;margin:6px 0 8px">Schreib-Check</h3><ul class="analyse">${erg.map((e) => `<li class="${e.gut ? 'gut' : 'tipp'}"><i aria-hidden="true">${e.gut ? '✓' : '!'}</i><span>${esc(e.t)}</span></li>`).join('')}</ul><p class="klein leise" style="margin-top:8px">Der Schreib-Check zählt nur. Ob dein Text spannend und verständlich ist, prüfst du mit der Liste unten – oder lies ihn jemandem vor.</p>`;
}
function schreibFertig() {
  schreibSpeichern();
  const a = ((INHALT.schreiben || {}).auftraege || []).find((x) => x.id === schreibAuftragId);
  const p = P(), st = p.texte[schreibAuftragId];
  const n = woerterIn(st.text || '').length;
  if (n < Math.round(a.minWoerter * 0.6)) { toast(`Dein Text ist noch sehr kurz (${n} Wörter). Schreib noch ein bisschen weiter!`, 3400); return; }
  const neu = !st.fertig;
  st.fertig = true; st.fertigDatum = Date.now();
  if (neu) punkteDazu(40);
  merkeTag(); speichern(true);
  pruefeAbzeichen();
  toast(neu ? 'Super! Dein Text ist fertig. +40 Laborpunkte' : 'Gespeichert.');
}
async function textKopieren(text) {

let downloadsNS;
async function downloadsVerfuegbar() {
  if (window.claude && typeof window.claude.use === 'function') {
    try { if (downloadsNS === undefined) downloadsNS = await window.claude.use('downloads'); } catch (e) { downloadsNS = null; }

}
async function sicherungAlsDatei() {
  const code = exportCode(), name = `lese-labor-profi-sicherung-${heute()}.txt`;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      if (!downloadsNS) { toast('Speichern als Datei ist hier nicht möglich. Kopiere den Code.'); return; }
      await downloadsNS.save({ filename: name, data: code });

    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();

}

let themaGesetzt = false;
function wendeEinstellungenAn() {
  const e = E(), root = document.documentElement;
  root.style.setProperty('--gross', { normal: 1, gross: 1.12, sehrgross: 1.25 }[e.schrift] || 1);
  root.style.setProperty('--zeilen', e.weit ? 1.95 : 1.55);
  root.classList.toggle('ruhig', !!e.ruhig);
  if (e.thema === 'light' || e.thema === 'dark') { root.setAttribute('data-theme', e.thema); themaGesetzt = true; }
  else if (themaGesetzt) { root.removeAttribute('data-theme'); themaGesetzt = false; }
}
function gruppeSortiert(ids) {
  const reihenfolge = Object.keys(REG.gruppen);
  return ids.slice().sort((a, b) => {
    const ga = reihenfolge.indexOf(REG.items[a].gruppe), gb = reihenfolge.indexOf(REG.items[b].gruppe);
    if (ga !== gb) return ga - gb;
    return REG.gruppen[REG.items[a].gruppe].items.indexOf(a) - REG.gruppen[REG.items[b].gruppe].items.indexOf(b);
  });
}
function starteTraining(ids, titel, art = 'training', zurueck) {
  starteSitzung({ art, titel, ids, zurueck: zurueck || { name: ANSICHT.name === 'sitzung' ? 'start' : ANSICHT.name, param: ANSICHT.param } });
}

document.addEventListener('click', async (ev) => {
  const ziel = ev.target;
  if (!(ziel instanceof Element)) return;
  if (ziel.closest('[data-dlg]')) return;

  /* Quelle: Textmarker und Links im simulierten Browser */
  const quelle = ziel.closest('.quelle-flaeche');
  if (quelle && SITZ) {
    if (SITZ.markerAn) {
      const tm = ziel.closest('[data-tm]');
      if (tm) { ev.preventDefault(); markerUmschalten(tm); return; }
      if (ziel.closest('a, button[data-ziel]')) { ev.preventDefault(); toast('Der Textmarker ist an. Schalte ihn aus, um Links zu öffnen.'); return; }
    }
    const link = ziel.closest('[data-ziel]');
    if (link) { ev.preventDefault(); const g = gruppeVon(aktId()); if (g && g.art === 'fall') fallNavigiere(g.id, link.getAttribute('data-ziel')); return; }
    if (ziel.closest('[data-extern]')) { ev.preventDefault(); toast('Dieser Link führt in der Übung nirgendwohin.'); return; }
    if (ziel.closest('a')) { ev.preventDefault(); return; }
  }

  const nav = ziel.closest('[data-nav]');
  if (nav && !nav.disabled) {
    const n = nav.getAttribute('data-nav');
    if (n === 'profile') neuProfilAvatar = AVATARE[Math.floor(Math.random() * AVATARE.length)];
    zeige(n); return;
  }
  const el = ziel.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.getAttribute('data-act'), ds = el.dataset;

  switch (act) {
    /* Antworten */
    case 'opt': case 'mx': case 'tok': case 'chip': case 'gruppe': case 'pool': case 'hoch': case 'runter':
      antwortAktion(act, ds); return;
    /* Sitzung */
    case 's-beenden': sitzungBeenden(); return;
    case 's-gehe': gehe(Number(ds.i)); return;
    case 's-zurueck': gehe(SITZ.index - 1); return;
    case 's-weiter': weiter(); return;
    case 's-abgeben': abgebenFragen(); return;
    case 's-markieren': { const id = aktId(); SITZ.markiert[id] = !SITZ.markiert[id]; zeichneKopf(); zeichneAufgabe(); sitzungMerken(); return; }
    case 's-tipp': tippZeigen(); return;
    case 's-pruefen': pruefen(); return;
    case 's-loesung': loesungZeigen(); return;
    case 's-nochmal': SITZ.phase[aktId()] = 'edit'; zeichneAufgabe(); return;
    case 's-springen': {
      const z = el.dataset.ziel === 'quelle' ? $('.quelle-spalte') : $('#aufgabe-spalte');
      if (z) z.scrollIntoView({ block: 'start', behavior: E().ruhig ? 'auto' : 'smooth' });
      setTimeout(springenAktualisieren, 400); return;
    }
    case 's-uhr': SITZ.zeitVerborgen = !SITZ.zeitVerborgen; zeichneKopf(); return;
    case 'q-marker': SITZ.markerAn = !SITZ.markerAn; el.setAttribute('aria-pressed', String(SITZ.markerAn)); $('#quelle').classList.toggle('marker-an', SITZ.markerAn); if (SITZ.markerAn) toast('Textmarker an: Tippe auf Sätze, um sie gelb zu markieren.'); return;
    case 'q-loeschen': markerLoeschen(); return;
    case 'q-gross': SITZ.quelleGross = !SITZ.quelleGross; renderSitzung(); return;
    case 'b-zurueck': case 'b-vor': case 'b-start': { const g = gruppeVon(aktId()); if (g && g.art === 'fall') fallNavigiere(g.id, act.slice(2)); return; }

    /* Profile */
    case 'profil-wahl': DB.aktivesProfil = ds.id; speichern(true); zeige('start'); return;
    case 'ava': neuProfilAvatar = ds.ava; $$('.ava-wahl button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ava === neuProfilAvatar))); return;
    case 'profil-loeschen': {
      const p = DB.profile[ds.id]; if (!p) return;
      const ok = await dialog({ titel: `Profil „${p.name}“ löschen?`, text: 'Der ganze Fortschritt dieses Profils wird von diesem Gerät gelöscht. Das kann man nicht rückgängig machen.', knoepfe: [{ label: 'Abbrechen', wert: false, stil: 'knopf-zweit' }, { label: 'Löschen', wert: true, stil: 'knopf-gefahr' }] });
      if (ok) { profilLoeschen(ds.id); zeige(P() ? 'erwachsene' : 'profile'); }
      return;
    }

    /* Start & Labore */
    case 'laufend-weiter': sitzungFortsetzen(); return;
    case 'laufend-verwerfen': {
      const ok = await dialog({ titel: 'Angefangene Prüfung verwerfen?', text: 'Die Antworten dieser Prüfung werden gelöscht.', knoepfe: [{ label: 'Behalten', wert: false, stil: 'knopf-zweit' }, { label: 'Verwerfen', wert: true, stil: 'knopf-gefahr' }] });
      if (ok) { sitzungVerwerfen(); render(); }
      return;
    }
    case 'mission': { const m = tagesMission(); if (!m) return; const offen = m.ids.filter((id) => !m.erledigt.includes(id)); starteSitzung({ art: 'mission', titel: 'Tagesmission', ids: offen.length ? offen : m.ids, zurueck: { name: 'start' } }); return; }
    case 'fehler-kiste': starteTraining(gruppeSortiert(fehlerKiste().slice(0, 12)), 'Fehler-Kiste', 'fehler', { name: 'start' }); return;
    case 'training-gruppe': { const g = REG.gruppen[ds.g]; starteTraining(g.items.slice(), g.art === 'fall' ? `Fall ${g.daten.nummer}: ${g.titel}` : g.titel, 'training', { name: g.modul }); return; }
    case 'training-modul': {
      const alle = REG.module[ds.m].items, offen = alle.filter((id) => itemStatus(id) !== 'r');
      const ids = gruppeSortiert(mische(offen.length >= 6 ? offen : alle).slice(0, 10));
      starteTraining(ids, `${MODUL[ds.m].titel}: gemischt`, 'training', { name: ds.m }); return;
    }
    case 'training-ids': starteTraining(gruppeSortiert(String(ds.ids).split(',').filter((id) => REG.items[id])), ds.titel || 'Training', 'training', { name: 'start' }); return;
    case 'pruef-intro': { const cfg = pruefConfig(ds.art); if (cfg && cfg.ids.length) zeige('pruefung-start', cfg); else toast('Für diese Prüfung fehlen noch Aufgaben.'); return; }
    case 'pruef-los': {
      const cfg = ANSICHT.param; if (!cfg) return;
      const box = $('#uhr-zeigen'); if (box) { E().timerZeigen = box.checked; speichern(); }
      starteSitzung({ art: 'pruefung', titel: cfg.titel, ids: cfg.ids, pruefArt: cfg.art, zeitMin: cfg.zeitMin, zurueck: { name: cfg.modul || 'start' } });
      return;
    }
    case 'zurueck-modul': zeige(ds.m && MODUL[ds.m] ? ds.m : 'start'); return;
    case 'pruefung-ansehen': { const e = P().pruefungen[Number(ds.i)]; if (e) zeige('ergebnis', { eintrag: e }); return; }

    /* Tempo */
    case 'tempo-start': tempoStart(); return;
    case 'tempo-antwort': tempoAntwort(Number(ds.r)); return;
    case 'tempo-los': tempoLos(); return;
    case 'tempo-abbruch': tempoStopp(); TEMPO = null; zeige('tempo'); return;

    /* Diktat */
    case 'diktat': diktatStart(ds.id); return;
    case 'diktat-modus': DIKTAT.modus = ds.modus; DIKTAT.phase = ds.modus === 'hoer' ? 'hoer' : 'bereit'; zeige('diktat'); if (ds.modus === 'hoer') diktatVorlesen(); return;
    case 'diktat-hoeren': diktatVorlesen(); return;
    case 'diktat-satz': diktatVorlesen(true); return;
    case 'diktat-weiter': diktatWeiter(); return;
    case 'diktat-blitz': diktatBlitz(); return;

    /* Schreiben */
    case 'schreibauftrag': zeige('schreibauftrag', ds.id); return;
    case 'wort-einfuegen': {
      const f = $('#schreibfeld'); if (!f) return;
      const s = f.selectionStart != null ? f.selectionStart : f.value.length, e2 = f.selectionEnd != null ? f.selectionEnd : s;
      const vor = f.value.slice(0, s), nach = f.value.slice(e2);
      const einfueg = (vor && !/\s$/.test(vor) ? ' ' : '') + ds.wort + (nach && !/^[\s.,!?]/.test(nach) ? ' ' : '');
      f.value = vor + einfueg + nach;
      const pos = (vor + einfueg).length; f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) { /* egal */ }
      f.dispatchEvent(new Event('input')); return;
    }
    case 'schreib-check': schreibCheck(); return;
    case 'text-kopieren': { const f = $('#schreibfeld'); if (f) { textKopieren(f.value); } return; }
    case 'schreib-fertig': schreibFertig(); return;

    /* Erwachsene */
    case 'stimme-test': if (!sprich(['Hallo! So klingt die Vorlesestimme im Lese-Labor.'])) toast('Auf diesem Gerät gibt es keine Sprachausgabe.'); return;
    case 'export-zeigen': { const f = $('#export-feld'), t = $('#export-code'); t.value = exportCode(); f.hidden = false; t.focus(); t.select(); return; }
    case 'export-kopieren': { const t = $('#export-code'); try { await navigator.clipboard.writeText(t.value); toast('Code kopiert. Bewahren Sie ihn gut auf.'); } catch (x) { t.focus(); t.select(); toast('Bitte den markierten Code selbst kopieren.'); } return; }
    case 'export-datei': sicherungAlsDatei(); return;
    case 'import': {
      try { const n = importCode($('#import-code').value); wendeEinstellungenAn(); toast(`${plural(n, 'Profil', 'Profile')} wiederhergestellt.`); zeige('erwachsene'); }
      catch (x) { toast(x.message || 'Der Code konnte nicht gelesen werden.', 3600); }
      return;
    }
    case 'alles-loeschen': {
      const ok = await dialog({ titel: 'Wirklich alles löschen?', text: 'Alle Profile, Ergebnisse, Texte und Einstellungen werden von diesem Gerät gelöscht.', knoepfe: [{ label: 'Abbrechen', wert: false, stil: 'knopf-zweit' }, { label: 'Alles löschen', wert: true, stil: 'knopf-gefahr' }] });
      if (ok) { DB = leererSpeicher(); speichern(true); erwachseneOffen = false; wendeEinstellungenAn(); zeige('profile'); }
      return;
    }
    default: return;
  }
});
