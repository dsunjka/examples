r in Abschnitt 4 weitergeht.","erklaerung":"An der Tür hört Zeynep nur: „Zeynep darf auf keinen Fall etwas merken. Sonst …“ Erst in Abschnitt 4 erfährt sie den Rest: „Sonst ist die Überraschung kaputt!“ Weil sie nur die halbe Wahrheit kannte, hat sie Ronja zu Unrecht verdächtigt."},{"id":"lv-staffellauf-18","typ":"single","stufe":3,"kompetenz":"entnehmen","abschnitt":0,"frage":"In welcher Reihenfolge passieren die Ereignisse in der Geschichte?","optionen":[{"text":"Valentin wird als Läufer bestimmt → Valentin wird rot und läuft weg → Ronja geht wortlos davon → Zeynep bekommt eine Fahne","richtig":true},{"text":"Valentin wird rot und läuft weg → Valentin wird als Läufer bestimmt → Ronja geht wortlos davon → Zeynep bekommt eine Fahne","richtig":false},{"text":"Valentin wird als Läufer bestimmt → Valentin wird rot und läuft weg → Zeynep bekommt eine Fahne → Ronja geht wortlos davon","richtig":false},{"text":"Valentin wird rot und läuft weg → Valentin wird als Läufer bestimmt → Zeynep bekommt eine Fahne → Ronja geht wortlos davon","richtig":false}],"tipp":"Suche jedes Ereignis in der Geschichte und merke dir, in welchem Abschnitt es steht.","erklaerung":"In Abschnitt 1 bestimmt Frau Lindner Valentin als Läufer. In Abschnitt 2 wird Valentin in der Pause rot und läuft weg. In Abschnitt 3 geht Ronja wortlos davon, in Abschnitt 4 reicht Valentin Zeynep die Fahne."},{"id":"lv-staffellauf-19","typ":"single","stufe":3,"kompetenz":"reflektieren","abschnitt":0,"frage":"Aus wessen Sicht wird die Geschichte erzählt?","optionen":[{"text":"Ein Erzähler berichtet vor allem, was Zeynep denkt und fühlt.","richtig":true},{"text":"Zeynep erzählt selbst in der Ich-Form, was sie erlebt.","richtig":false},{"text":"Ronja erzählt in der Ich-Form, weil sie das Geheimnis kennt.","richtig":false},{"text":"Ein Erzähler berichtet vor allem, was Ronja denkt und fühlt.","richtig":false}],"tipp":"Prüfe, ob außerhalb der wörtlichen Rede jemand „ich“ sagt. Überlege dann, wessen Gedanken du in den Abschnitten 2 und 3 erfährst.","erklaerung":"Außerhalb der wörtlichen Rede sagt niemand „ich“. Du erfährst, was Zeynep denkt, zum Beispiel: „Außerdem war Ronja schuld, fand Zeynep.“ Was Ronja denkt, erfährst du nicht – darum weißt du lange so wenig wie Zeynep."},{"id":"lv-staffellauf-20","typ":"single","stufe":2,"kompetenz":"reflektieren","abschnitt":0,"frage":"Was kann man aus dieser Geschichte lernen?","optionen":[{"text":"Bei einem Verdacht ist es besser, den anderen zu fragen.","richtig":true},{"text":"Hat eine Freundin ein Geheimnis, geht man ihr besser aus dem Weg.","richtig":false},{"text":"Wenn Freunde tuscheln, wollen sie einen ausschließen.","richtig":false},{"text":"Wer gekränkt ist, sollte warten, bis der andere sich entschuldigt.","richtig":false}],"tipp":"Überlege, wodurch der Streit zwischen Zeynep und Ronja entstanden ist und wie er sich in Abschnitt 4 auflöst.","erklaerung":"Zeynep hätte Ronja einfach fragen können, wie Oma Gül es ihr geraten hat. Stattdessen ist sie Ronja aus dem Weg gegangen und hat auf eine Entschuldigung gewartet – das hat den Streit nur verlängert. Dabei wollten Ronja und Valentin Zeynep gar nicht ausschließen, sondern haben heimlich eine Überraschung für sie vorbereitet."}]}],"rechtschreibung":{"themen":[{"id":"rs-silben","titel":"Silben und Trennung","kurz":"Silben schwingen und am Zeilenende richtig trennen","kompetenz":"mitsprechen","wissen":{"merksatz":"Sprich ein Wort langsam und schwinge bei jeder Silbe mit. Am Zeilenende trennst du das Wort nach diesen Silben: Fens-ter, Ho-se, Zu-cker.","punkte":["Jede Silbe hat einen Vokal (a, e, i, o, u, ä, ö, ü) oder einen Zwielaut (au, ei, eu, äu).","Steht nur ein Mitlaut zwischen zwei Vokalen, kommt er in die neue Zeile: Ho-se, Na-se, le-sen.","Stehen mehrere Mitlaute dazwischen, kommt nur der letzte in die neue Zeile: Kat-ze, Fens-ter, Ap-fel. Aber: <b>ck<\/b>, <b>ch<\/b> und <b>sch<\/b> bleiben immer zusammen: Zu-cker, Ku-chen, Ta-sche.","Ein einzelner Vokal am Wortanfang oder am Wortende wird nicht abgetrennt: Igel, Abend und Ofen trennst du gar nicht. Längere Wörter trennst du an einer anderen Stelle: Ele-fant (nicht E-lefant).","Ein <b>Zwielaut<\/b> (au, ei, eu, äu) am Wortanfang darf allein stehen, denn er hat zwei Buchstaben: Au-to, Ei-sen, Eu-ro.","Endet eine Silbe mit einem Vokal, ist sie <b>offen<\/b>: <b>Ro<\/b>-se. Endet sie mit einem Mitlaut, ist sie <b>geschlossen<\/b>: <b>Kat<\/b>-ze. In einer offenen Silbe klingt der Vokal meist lang, in einer geschlossenen meist kurz.","Achtung bei <b>ck<\/b>: In Zu-cker oder We-cker klingt der Vokal trotzdem kurz, denn ck steht für ein doppeltes k."],"beispiele":["Fens-ter","Kat-ze","Zu-cker","Ta-sche","Ho-se","Igel (nicht trennen)"]},"items":[{"id":"rs-silben-01","typ":"zuordnen","stufe":1,"kompetenz":"mitsprechen","frage":"Schwinge die Silben mit. Wie viele Silben hat jedes Wort? Sortiere.","gruppen":["2 Silben","3 Silben","4 Silben"],"elemente":[{"t":"Fenster","g":0},{"t":"Zucker","g":0},{"t":"Katze","g":0},{"t":"Banane","g":1},{"t":"Tomate","g":1},{"t":"Eidechse","g":1},{"t":"Schokolade","g":2},{"t":"Marmelade","g":2}],"tipp":"Sprich jedes Wort langsam und klatsche bei jeder Silbe einmal in die Hände. Zähle mit.","erklaerung":"Fens-ter, Zu-cker und Kat-ze haben 2 Silben. Ba-na-ne, To-ma-te und Ei-dech-se haben 3. Scho-ko-la-de und Mar-me-la-de haben sogar 4 Silben."},{"id":"rs-silben-02","typ":"luecke","stufe":1,"kompetenz":"mitsprechen","frage":"Wie trennt man diese Wörter am Zeilenende richtig? Wähle aus.","teile":[{"t":"Am Zeilenende trennt Jonas das Wort „Fenster“ so: "},{"wahl":["Fen-ster","Fens-ter","Fenst-er"],"loesung":1},{"t":". Das Wort „Katze“ trennt er so: "},{"wahl":["Kat-ze","Ka-tze","Katz-e"],"loesung":0},{"t":". Und „Zucker“ trennt er so: "},{"wahl":["Zuc-ker","Zuck-er","Zu-cker"],"loesung":2},{"t":"."}],"tipp":"Schwinge die Silben. Denk daran: Bei mehreren Mitlauten kommt nur der letzte in die neue Zeile – und ck bleibt zusammen.","erklaerung":"Fens-ter und Kat-ze: Von mehreren Mitlauten kommt nur der letzte in die neue Zeile. Zu-cker: ck wird nie getrennt und kommt ganz in die neue Zeile."},{"id":"rs-silben-03","typ":"markieren","stufe":1,"kompetenz":"mitsprechen","frage":"Tippe alle Wörter an, die nur eine Silbe haben.","teile":[{"t":"Hund","ziel":true},{"t":",","fix":true},{"t":"Wiese"},{"t":",","fix":true},{"t":"Brot","ziel":true},{"t":",","fix":true},{"t":"Lehrerin"},{"t":",","fix":true},{"t":"Baum","ziel":true},{"t":",","fix":true},{"t":"Apfel"},{"t":",","fix":true},{"t":"Schrank","ziel":true},{"t":",","fix":true},{"t":"Ameise"},{"t":",","fix":true},{"t":"Zwerg","ziel":true},{"t":",","fix":true},{"t":"Tafel"}],"tipp":"Schwinge jedes Wort. Wenn du nur ein einziges Mal schwingst, hat es nur eine Silbe.","erklaerung":"Hund, Brot, Baum, Schrank und Zwerg schwingst du nur einmal. Wie-se, Ap-fel und Ta-fel haben zwei Silben, Leh-re-rin und A-mei-se sogar drei."},{"id":"rs-silben-04","typ":"markieren","stufe":2,"kompetenz":"mitsprechen","frage":"Tippe die Wörter an, die falsch getrennt sind.","teile":[{"t":"Ho-se"},{"t":",","fix":true},{"t":"Tas-che","ziel":true},{"t":",","fix":true},{"t":"Bä-cker"},{"t":",","fix":true},{"t":"Mü-tze","ziel":true},{"t":",","fix":true},{"t":"Kis-te"},{"t":",","fix":true},{"t":"Ap-fel"},{"t":",","fix":true},{"t":"Lö-ffel","ziel":true},{"t":",","fix":true},{"t":"Wol-ke"}],"tipp":"Prüfe jedes Wort: Steht nur ein Mitlaut zwischen den Vokalen oder stehen mehrere dort? Und welche Buchstaben bleiben immer zusammen?","erklaerung":"Richtig wäre Ta-sche (sch bleibt zusammen), Müt-ze und Löf-fel (nur der letzte Mitlaut kommt in die neue Zeile). Ap-fel und Kis-te sind richtig getrennt."},{"id":"rs-silben-05","typ":"zuordnen","stufe":2,"kompetenz":"mitsprechen","frage":"Trenne jedes Wort in Gedanken. Ist die erste Silbe offen oder geschlossen? Sortiere.","gruppen":["offen: endet mit Vokal","geschlossen: endet mit Mitlaut"],"elemente":[{"t":"Rose","g":0},{"t":"Nase","g":0},{"t":"Tafel","g":0},{"t":"lesen","g":0},{"t":"Katze","g":1},{"t":"Hunde","g":1},{"t":"Winter","g":1},{"t":"Fenster","g":1}],"tipp":"Trenne das Wort zuerst, zum Beispiel Bo-den oder Wan-ne. Schau dann auf den letzten Buchstaben der ersten Silbe.","erklaerung":"Ro-, Na-, Ta- und le- enden mit einem Vokal: Das sind offene Silben, der Vokal klingt lang. Kat-, Hun-, Win- und Fens- enden mit einem Mitlaut: Das sind geschlossene Silben, der Vokal klingt kurz."},{"id":"rs-silben-06","typ":"eingabe","stufe":2,"kompetenz":"mitsprechen","frage":"Trenne das Wort nach allen Silben. Schreibe es mit Bindestrichen und ohne Leerzeichen.","vorgabe":"Taschenlampe","loesungen":["Ta-schen-lam-pe"],"tipp":"Schwinge das Wort langsam. Achte auf sch: Diese drei Buchstaben bleiben zusammen.","erklaerung":"Ta-schen-lam-pe hat vier Silben. Die Buchstaben sch bleiben zusammen, und zwischen m und p wird getrennt."},{"id":"rs-silben-07","typ":"multi","stufe":3,"kompetenz":"mitsprechen","frage":"Welche Wörter darfst du am Zeilenende gar nicht trennen?","optionen":[{"text":"Igel","richtig":true},{"text":"Abend","richtig":true},{"text":"Esel","richtig":true},{"text":"Eule","richtig":false},{"text":"Ameise","richtig":false},{"text":"Eimer","richtig":false}],"tipp":"Schwinge jedes Wort. Prüfe dann: Bliebe am Zeilenende nur ein einzelner Buchstabe stehen? Das ist nicht erlaubt. Denk auch an die Regel für Zwielaute.","erklaerung":"Bei I-gel, A-bend und E-sel bliebe nur ein einzelner Vokal stehen, darum trennst du sie nicht. Eu-le und Ei-mer darfst du trennen, denn ein Zwielaut wie eu oder ei darf am Wortanfang allein stehen. Ameise trennst du so: Amei-se."},{"id":"rs-silben-08","typ":"matrix","stufe":3,"kompetenz":"mitsprechen","frage":"Stimmt das? Entscheide bei jeder Aussage.","spalten":["richtig","falsch"],"aussagen":[{"text":"„Wecker“ trennt man so: We-cker.","richtig":true},{"text":"„Ufer“ darf man so trennen: U-fer.","richtig":false},{"text":"„Kasten“ trennt man so: Kas-ten.","richtig":true},{"text":"In „Ho-se“ ist die erste Silbe geschlossen.","richtig":false}],"tipp":"Denk an die Regeln für ck, für einzelne Vokale am Wortanfang und für mehrere Mitlaute. Bei der letzten Aussage hilft dir der letzte Buchstabe der ersten Silbe.","erklaerung":"We-cker stimmt, denn ck bleibt zusammen. Kas-ten stimmt auch: Nur der letzte Mitlaut kommt in die neue Zeile. Ufer darfst du nicht trennen, und „Ho-“ endet mit einem Vokal, ist also offen."}]},{"id":"rs-verlaengern","titel":"Verlängern","kurz":"b oder p? d oder t? g oder k?","kompetenz":"nachdenken","wissen":{"merksatz":"Am Wortende hörst du b, d und g oft wie p, t und k. Verlängere das Wort – dann hörst du den richtigen Buchstaben deutlich: Hund → Hun-de.","punkte":["Auch vor einem Mitlaut klingen b, d und g oft hart: er lebt, sie fragt. Verlängern hilft auch hier.","<b>Nomen<\/b> verlängerst du mit der Mehrzahl: der Zwerg → die Zwerge, der Wald → die Wälder.","<b>Verben<\/b> verlängerst du mit der Grundform: er lebt → leben, sie fragt → fragen.","<b>Adjektive<\/b> verlängerst du mit der Steigerung oder mit einem Nomen dahinter: wild → wilder, rund → der runde Ball.","Bei zusammengesetzten Wörtern verlängerst du den Wortteil, bei dem du unsicher bist: Handtuch → Hand → Hände."],"beispiele":["Hund → Hunde","Zwerg → Zwerge","Wald → Wälder","er lebt → leben","wild → wilder","Handtuch → Hand → Hände"]},"items":[{"id":"rs-verlaengern-01","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"d oder t? g oder k? Verlängere die Wörter und wähle richtig.","teile":[{"t":"Im Wal"},{"wahl":["d","t"],"loesung":0},{"t":" steht ein Zel"},{"wahl":["d","t"],"loesung":1},{"t":". Davor sitzt ein Zwer"},{"wahl":["k","g"],"loesung":1},{"t":" auf einer Ban"},{"wahl":["k","g"],"loesung":0},{"t":"."}],"tipp":"Bilde von jedem Nomen die Mehrzahl und sprich sie deutlich in Silben.","erklaerung":"Wald → Wäl-der, Zelt → Zel-te, Zwerg → Zwer-ge, Bank → Bän-ke. In der Mehrzahl hörst du den richtigen Buchstaben."},{"id":"rs-verlaengern-02","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"Wie verlängerst du diese Wörter am besten? Sortiere.","gruppen":["Mehrzahl bilden","Grundform bilden","steigern"],"elemente":[{"t":"der Korb","g":0},{"t":"das Kleid","g":0},{"t":"der Berg","g":0},{"t":"sie lebt","g":1},{"t":"er fragt","g":1},{"t":"es gibt","g":1},{"t":"wild","g":2},{"t":"lieb","g":2}],"tipp":"Überlege zuerst: Ist das Wort ein Nomen, ein Verb oder ein Adjektiv?","erklaerung":"Nomen verlängerst du mit der Mehrzahl (Körbe, Kleider, Berge), Verben mit der Grundform (leben, fragen, geben) und Adjektive mit der Steigerung (wilder, lieber)."},{"id":"rs-verlaengern-03","typ":"eingabe","stufe":1,"kompetenz":"nachdenken","frage":"b oder p? Schreibe das Wort mit dem richtigen Buchstaben vollständig auf.","vorgabe":"Der Hund schläft in seinem Kor_.","loesungen":["Korb"],"tipp":"Bilde die Mehrzahl des Wortes und sprich sie deutlich in Silben.","erklaerung":"Korb → Kör-be. In der Mehrzahl hörst du deutlich ein b."},{"id":"rs-verlaengern-04","typ":"luecke","stufe":2,"kompetenz":"nachdenken","frage":"Wähle die richtigen Buchstaben. Verlängere dazu Verben, Adjektive und Nomen.","teile":[{"t":"Elif schrei"},{"wahl":["b","p"],"loesung":0},{"t":"t Opa eine Karte: „Die Bucht hier ist run"},{"wahl":["d","t"],"loesung":0},{"t":" wie ein Hal"},{"wahl":["b","p"],"loesung":0},{"t":"mond. Das Wasser ist ganz schön kal"},{"wahl":["d","t"],"loesung":1},{"t":"!“"}],"tipp":"Verben verlängerst du mit der Grundform, Adjektive mit der Steigerung. Beim zusammengesetzten Wort verlängerst du nur den ersten Teil.","erklaerung":"schreibt → schrei-ben, rund → run-der, Halbmond → halb → hal-be, kalt → käl-ter."},{"id":"rs-verlaengern-05","typ":"markieren","stufe":2,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an.","teile":[{"t":"Am"},{"t":"Wandertag"},{"t":"laufen"},{"t":"wir"},{"t":"durch"},{"t":"den"},{"t":"Walt","ziel":true},{"t":"bis"},{"t":"zur"},{"t":"alten"},{"t":"Burk","ziel":true},{"t":".","fix":true},{"t":"Dort"},{"t":"gipt","ziel":true},{"t":"uns"},{"t":"Herr"},{"t":"Huber"},{"t":"ein"},{"t":"Stück"},{"t":"Brot"},{"t":"und"},{"t":"einen"},{"t":"gelben"},{"t":"Apfel"},{"t":".","fix":true}],"tipp":"Verlängere jedes Wort, das auf b, d, g, p, t oder k endet. Auch Verben kannst du verlängern.","erklaerung":"Richtig ist Wald (Wäl-der), Burg (Bur-gen) und gibt (ge-ben). Wandertag (Ta-ge) und Brot (Bro-te) sind richtig geschrieben."},{"id":"rs-verlaengern-06","typ":"zuordnen","stufe":2,"kompetenz":"nachdenken","frage":"Welcher Buchstabe fehlt? Verlängere jedes Wort und sortiere.","gruppen":["d","t","g","k"],"elemente":[{"t":"der Mon_","g":0},{"t":"gesun_","g":0},{"t":"das Bro_","g":1},{"t":"lau_","g":1},{"t":"der Zu_","g":2},{"t":"der We_","g":2},{"t":"der Schran_","g":3},{"t":"kran_","g":3}],"tipp":"Bilde die Mehrzahl oder setze ein -e oder -er an. Dann hörst du den Buchstaben am Anfang der letzten Silbe.","erklaerung":"Mon-de, ge-sun-de → d. Bro-te, lau-ter → t. Zü-ge, We-ge → g. Schrän-ke, kran-ke → k."},{"id":"rs-verlaengern-07","typ":"markieren","stufe":3,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an. Achtung: Auch zusammengesetzte Wörter sind dabei.","teile":[{"t":"Am"},{"t":"Samstag"},{"t":"fährt"},{"t":"Ben"},{"t":"mit"},{"t":"dem"},{"t":"Fahrrad"},{"t":"zum"},{"t":"Bergsee"},{"t":".","fix":true},{"t":"Im"},{"t":"Rucksack"},{"t":"hat"},{"t":"er"},{"t":"ein"},{"t":"Hanttuch","ziel":true},{"t":",","fix":true},{"t":"einen"},{"t":"Sonnenhut"},{"t":"und"},{"t":"ein"},{"t":"Brod","ziel":true},{"t":"mit"},{"t":"Käse"},{"t":".","fix":true},{"t":"Am"},{"t":"Ufer"},{"t":"baut"},{"t":"er"},{"t":"eine"},{"t":"Sandburk","ziel":true},{"t":".","fix":true}],"tipp":"Zerlege zusammengesetzte Wörter in ihre Teile. Verlängere dann jeden Teil, der auf b, d, g, p, t oder k endet.","erklaerung":"Richtig ist Handtuch (Hän-de), Brot (Bro-te) und Sandburg (Bur-gen). Samstag (Ta-ge), Fahrrad (Rä-der), Bergsee (Ber-ge) und Sonnenhut (Hü-te) sind richtig geschrieben."},{"id":"rs-verlaengern-08","typ":"luecke","stufe":3,"kompetenz":"nachdenken","frage":"Verlängere jedes Verb mit der Grundform. Wähle dann den richtigen Buchstaben.","teile":[{"t":"Papa tan"},{"wahl":["g","k"],"loesung":1},{"t":"t das Auto voll. Hinter uns hu"},{"wahl":["b","p"],"loesung":1},{"t":"t ein Bus. Ein Luftballon schwe"},{"wahl":["b","p"],"loesung":0},{"t":"t über die Straße. Auf dem Gehweg lie"},{"wahl":["g","k"],"loesung":0},{"t":"t ein Handschuh."}],"tipp":"Sprich die Grundform jedes Verbs langsam in Silben. Achte auf den Laut am Anfang der zweiten Silbe.","erklaerung":"tankt → tan-ken, hupt → hu-pen, schwebt → schwe-ben, liegt → lie-gen. Die Grundform zeigt dir, ob du einen weichen oder einen harten Buchstaben schreibst."}]},{"id":"rs-ableiten","titel":"Ableiten: ä und äu","kurz":"e oder ä? eu oder äu?","kompetenz":"nachdenken","wissen":{"merksatz":"Du hörst e oder ä, eu oder äu? Suche ein verwandtes Wort mit a oder au. Findest du eins, schreibst du ä oder äu: Länder → Land, Bäume → Baum.","punkte":["Bei <b>Nomen<\/b> hilft oft die Einzahl: die Hände → die Hand, die Häuser → das Haus.","Bei <b>Verben<\/b> hilft die Grundform: er fährt → fahren, sie läuft → laufen.","Bei <b>Adjektiven<\/b> hilft die Grundstufe: älter → alt, wärmer → warm.","Findest du kein verwandtes Wort mit a oder au, schreibst du meistens e oder eu: das Bett, das Feld, heute, die Freundin.","Manche Wörter schreibt man mit ä, obwohl es kein verwandtes Wort mit a gibt. Diese <b>Merkwörter<\/b> musst du dir einprägen, zum Beispiel: der Käfer, der Bär, der Käse, der März."],"beispiele":["Bäume → Baum","Länder → Land","Häuser → Haus","älter → alt","er fährt → fahren","Merkwörter: Käfer, Bär, Käse"]},"items":[{"id":"rs-ableiten-01","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"eu oder äu? e oder ä? Suche verwandte Wörter und wähle richtig.","teile":[{"t":"H"},{"wahl":["eu","äu"],"loesung":0},{"t":"te spielen Aylin und Emir vor den alten H"},{"wahl":["eu","äu"],"loesung":1},{"t":"sern. Unter den B"},{"wahl":["eu","äu"],"loesung":1},{"t":"men stehen zwei B"},{"wahl":["e","ä"],"loesung":1},{"t":"nke."}],"tipp":"Suche zu jedem Wort ein verwandtes Wort mit a oder au. Gibt es keins, nimmst du e oder eu.","erklaerung":"Häuser kommt von Haus, Bäume von Baum und Bänke von Bank. Zu „heute“ gibt es kein verwandtes Wort mit au, darum schreibst du eu."},{"id":"rs-ableiten-02","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"Welcher Buchstabe fehlt: ä oder e? Suche verwandte Wörter und sortiere.","gruppen":["ä","e"],"elemente":[{"t":"die H_nde","g":0},{"t":"die Gl_ser","g":0},{"t":"die M_use","g":0},{"t":"tr_umen","g":0},{"t":"das B_tt","g":1},{"t":"das F_ld","g":1},{"t":"die L_ute","g":1},{"t":"das F_uer","g":1}],"tipp":"Setze probeweise ä ein und frage dich: Gibt es ein verwandtes Wort mit a oder au? Nur dann bleibt das ä.","erklaerung":"Hände (Hand), Gläser (Glas), Mäuse (Maus) und träumen (Traum) haben verwandte Wörter mit a oder au. Bett, Feld, Leute und Feuer haben keine, darum schreibst du sie mit e."},{"id":"rs-ableiten-03","typ":"markieren","stufe":1,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an.","teile":[{"t":"Im"},{"t":"Herbst"},{"t":"fallen"},{"t":"die"},{"t":"Bletter","ziel":true},{"t":"von"},{"t":"den"},{"t":"Beumen","ziel":true},{"t":".","fix":true},{"t":"Die"},{"t":"Kinder"},{"t":"sammeln"},{"t":"das"},{"t":"Laub"},{"t":"mit"},{"t":"den"},{"t":"Henden","ziel":true},{"t":"und"},{"t":"springen"},{"t":"in"},{"t":"den"},{"t":"großen"},{"t":"Haufen"},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort mit e oder eu: Gibt es ein verwandtes Wort mit a oder au?","erklaerung":"Richtig ist Blätter (Blatt), Bäumen (Baum) und Händen (Hand). „Herbst“ schreibt man mit e, denn es gibt kein verwandtes Wort mit a."},{"id":"rs-ableiten-04","typ":"eingabe","stufe":2,"kompetenz":"nachdenken","frage":"ä oder e? Schreibe das Wort mit der Lücke vollständig und richtig auf.","vorgabe":"Im Winter ist die Nacht l_nger als im Sommer.","loesungen":["länger"],"tipp":"Bilde die Grundstufe des Adjektivs, also das Wort ohne -er. Welchen Vokal hörst du dann deutlich?","erklaerung":"„länger“ kommt von „lang“. Weil das verwandte Wort ein a hat, schreibst du ä."},{"id":"rs-ableiten-05","typ":"luecke","stufe":2,"kompetenz":"nachdenken","frage":"Wähle die richtige Schreibung. Suche dazu verwandte Wörter mit a oder au.","teile":[{"t":"Jeden Morgen f"},{"wahl":["e","ä"],"loesung":1},{"t":"hrt Luca mit dem Bus zur Schule. Seine Schwester l"},{"wahl":["eu","äu"],"loesung":1},{"t":"ft lieber mit ihren Fr"},{"wahl":["eu","äu"],"loesung":0},{"t":"ndinnen. Im Bus tr"},{"wahl":["eu","äu"],"loesung":1},{"t":"mt Luca von den Ferien."}],"tipp":"Bei Verben hilft oft die Grundform oder ein Nomen aus derselben Wortfamilie. Bei Nomen überlegst du, ob es ein verwandtes Wort mit au gibt.","erklaerung":"„fährt“ kommt von „fahren“, „läuft“ von „laufen“ und „träumt“ von „Traum“. Zu „Freundin“ gibt es kein verwandtes Wort mit au, also schreibst du eu."},{"id":"rs-ableiten-06","typ":"zuordnen","stufe":2,"kompetenz":"nachdenken","frage":"Mit welchem Wort ist jedes Wort verwandt? Ordne zu.","gruppen":["Raum","Kraft","fahren","Hand"],"elemente":[{"t":"aufräumen","g":0},{"t":"geräumig","g":0},{"t":"kräftig","g":1},{"t":"die Kräfte","g":1},{"t":"die Fähre","g":2},{"t":"er fährt","g":2},{"t":"die Hände","g":3},{"t":"das Händchen","g":3}],"tipp":"Ersetze in jedem Wort ä durch a oder äu durch au. Welches Wort aus den Kisten steckt dann darin?","erklaerung":"aufräumen und geräumig gehören zu Raum, kräftig und Kräfte zu Kraft, Fähre und fährt zu fahren, Hände und Händchen zu Hand. Darum schreibst du sie mit ä oder äu."},{"id":"rs-ableiten-07","typ":"multi","stufe":3,"kompetenz":"merken","frage":"Welche Wörter sind Merkwörter? Bei ihnen gibt es kein verwandtes Wort mit a.","optionen":[{"text":"der Käfer","richtig":true},{"text":"die Träne","richtig":true},{"text":"der März","richtig":true},{"text":"der Gärtner","richtig":false},{"text":"die Kälte","richtig":false},{"text":"die Schränke","richtig":false}],"tipp":"Überlege bei jedem Wort: Gibt es ein verwandtes Wort mit a, zum Beispiel die Einzahl, die Grundstufe oder ein Wort aus derselben Wortfamilie?","erklaerung":"„Gärtner“ kommt von „Garten“, „Kälte“ von „kalt“ und „Schränke“ von „Schrank“. Zu Käfer, Träne und März gibt es kein verwandtes Wort mit a. Diese Merkwörter musst du dir einprägen."},{"id":"rs-ableiten-08","typ":"markieren","stufe":3,"kompetenz":"nachdenken","frage":"Tippe die falsch geschriebenen Wörter an. Achtung: Auch Merkwörter sind dabei.","teile":[{"t":"Im"},{"t":"März"},{"t":"entdeckt"},{"t":"Hannah"},{"t":"im"},{"t":"Garten"},{"t":"einen"},{"t":"kleinen"},{"t":"Kefer","ziel":true},{"t":".","fix":true},{"t":"Er"},{"t":"krabbelt"},{"t":"über"},{"t":"die"},{"t":"Handschuhe"},{"t":"des"},{"t":"Gertners","ziel":true},{"t":".","fix":true},{"t":"Hannah"},{"t":"lechelt","ziel":true},{"t":"und"},{"t":"holt"},{"t":"ihre"},{"t":"Lupe"},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort mit e oder ä: Gibt es ein verwandtes Wort mit a? Denk auch an die Merkwörter.","erklaerung":"Richtig ist Käfer (ein Merkwort), Gärtners (von Garten) und lächelt (von lachen). „März“ ist ein Merkwort mit ä und richtig geschrieben."}]},{"id":"rs-gross","titel":"Großschreibung","kurz":"Nomen, Namen, Satzanfang und höfliche Anrede","kompetenz":"nachdenken","wissen":{"merksatz":"Groß schreibst du Nomen, Namen, das erste Wort eines Satzes und die höfliche Anrede „Sie“. Ob ein Wort ein Nomen ist, prüfst du mit der Artikelprobe: Passt „der“, „die“ oder „das“ davor?","punkte":["Artikelprobe: der Hund, die Freude, das Glück. Auch Gefühle und Dinge, die man nicht anfassen kann, sind Nomen.","Wörter mit den Nachsilben <b>-ung<\/b>, <b>-heit<\/b>, <b>-keit<\/b>, <b>-nis<\/b> und <b>-schaft<\/b> sind Nomen: die Zeitung, die Schönheit, die Freundlichkeit, das Zeugnis, die Freundschaft. Aber Achtung: In „jung“ ist -ung keine Nachsilbe. „jung“ ist ein Adjektiv und wird kleingeschrieben.","Das erste Wort eines Satzes schreibst du immer groß.","<b>Namen<\/b> von Menschen schreibst du immer groß: Lena, Paul, Herr Huber.","Sprichst du Erwachsene höflich an, schreibst du „Sie“, „Ihnen“ und „Ihr“ groß: Können Sie mir helfen? Ist das Ihr Hut? Meinst du mit „sie“ eine andere Person, schreibst du klein. Auch „ihr“ für mehrere Kinder schreibst du klein: Kommt ihr mit?","Auch Verben können zu Nomen werden. Steht ein Artikel davor (das Schwimmen) oder „beim“ oder „zum“ (bei dem, zu dem), schreibst du das Verb groß: beim Singen, zum Basteln."],"beispiele":["der Mut, die Freude","die Zeitung, die Freiheit","die Pünktlichkeit, das Ergebnis","Namen: Lena, Herr Huber","Können Sie mir helfen?","beim Singen, zum Basteln"]},"items":[{"id":"rs-gross-01","typ":"markieren","stufe":1,"kompetenz":"nachdenken","frage":"Hier ist alles kleingeschrieben. Tippe die Wörter an, die man großschreiben muss.","teile":[{"t":"am","ziel":true},{"t":"samstag","ziel":true},{"t":"backt"},{"t":"emir","ziel":true},{"t":"mit"},{"t":"seiner"},{"t":"oma","ziel":true},{"t":"einen"},{"t":"kuchen","ziel":true},{"t":".","fix":true}],"tipp":"Denk an den Satzanfang und an Namen. Mache bei den anderen Wörtern die Artikelprobe.","erklaerung":"„Am“ steht am Satzanfang. Samstag, Oma und Kuchen sind Nomen (der Samstag, die Oma, der Kuchen), und Emir ist ein Name."},{"id":"rs-gross-02","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"Groß oder klein? Wähle die richtige Schreibung.","teile":[{"t":"Mia fährt mit dem "},{"wahl":["Fahrrad","fahrrad"],"loesung":0},{"t":" zur "},{"wahl":["schule","Schule"],"loesung":1},{"t":". Dort "},{"wahl":["Spielt","spielt"],"loesung":1},{"t":" sie mit ihren "},{"wahl":["Freunden","freunden"],"loesung":0},{"t":"."}],"tipp":"Mache die Artikelprobe: Kannst du der, die oder das davorsetzen?","erklaerung":"Fahrrad, Schule und Freunde sind Nomen (das Fahrrad, die Schule, die Freunde). „spielt“ ist ein Verb und wird kleingeschrieben."},{"id":"rs-gross-03","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"Die Wörter stehen in Großbuchstaben. Wie schreibt man sie normal? Sortiere.","gruppen":["großschreiben","kleinschreiben"],"elemente":[{"t":"WIESE","g":0},{"t":"MUT","g":0},{"t":"FREUDE","g":0},{"t":"MANTEL","g":0},{"t":"SCHNELL","g":1},{"t":"SPRINGT","g":1},{"t":"LEISE","g":1},{"t":"OFT","g":1}],"tipp":"Mache die Artikelprobe: Passt der, die oder das davor?","erklaerung":"die Wiese, der Mut, die Freude, der Mantel: Das sind Nomen. „schnell“ und „leise“ sind Adjektive, „springt“ ist ein Verb, und vor „oft“ passt kein Artikel."},{"id":"rs-gross-04","typ":"eingabe","stufe":2,"kompetenz":"nachdenken","frage":"Bilde aus dem Adjektiv ein Nomen. Hänge dazu -heit oder -keit an. Schreibe nur das Nomen auf.","vorgabe":"höflich → die ___","loesungen":["Höflichkeit","die Höflichkeit"],"tipp":"Probiere beide Nachsilben aus und sprich die Wörter leise vor dich hin. Denk auch daran, wie man Nomen schreibt.","erklaerung":"Aus „höflich“ wird „die Höflichkeit“. Wörter mit der Nachsilbe -keit sind Nomen, darum schreibst du sie groß."},{"id":"rs-gross-05","typ":"zuordnen","stufe":2,"kompetenz":"nachdenken","frage":"Mit welcher Nachsilbe wird aus dem Wort ein Nomen? Ordne zu.","gruppen":["-ung","-heit","-keit","-nis"],"elemente":[{"t":"hoffen","g":0},{"t":"wohnen","g":0},{"t":"gesund","g":1},{"t":"frech","g":1},{"t":"ehrlich","g":2},{"t":"sauber","g":2},{"t":"erleben","g":3},{"t":"geheim","g":3}],"tipp":"Hänge jede Nachsilbe probeweise an und sprich das neue Wort laut. Welches Nomen kennst du?","erklaerung":"die Hoffnung, die Wohnung, die Gesundheit, die Frechheit, die Ehrlichkeit, die Sauberkeit, das Erlebnis, das Geheimnis."},{"id":"rs-gross-06","typ":"luecke","stufe":2,"kompetenz":"nachdenken","frage":"Ben schreibt seiner Nachbarin. Groß oder klein? Wähle richtig.","teile":[{"t":"Liebe Frau Berger, können "},{"wahl":["sie","Sie"],"loesung":1},{"t":" mir bitte "},{"wahl":["ihr","Ihr"],"loesung":1},{"t":" Buch über Pferde leihen? Meine Mama sagt, "},{"wahl":["sie","Sie"],"loesung":0},{"t":" holt es morgen bei "},{"wahl":["Ihnen","ihnen"],"loesung":0},{"t":" ab."}],"tipp":"Frage dich bei jedem Wort: Spricht Ben Frau Berger höflich an? Oder ist eine andere Person gemeint?","erklaerung":"„Sie“, „Ihr“ und „Ihnen“ sind die höfliche Anrede für Frau Berger, darum schreibt Ben sie groß. Mit „sie“ ist die Mama gemeint, das schreibt man klein."},{"id":"rs-gross-07","typ":"markieren","stufe":3,"kompetenz":"nachdenken","frage":"Hier ist alles kleingeschrieben. Tippe alle Wörter an, die man großschreiben muss.","teile":[{"t":"beim","ziel":true},{"t":"lesen","ziel":true},{"t":"vergisst"},{"t":"er"},{"t":"oft"},{"t":"die"},{"t":"zeit","ziel":true},{"t":",","fix":true},{"t":"denn"},{"t":"das"},{"t":"spannende"},{"t":"buch","ziel":true},{"t":"macht"},{"t":"ihm"},{"t":"großen"},{"t":"spaß","ziel":true},{"t":".","fix":true}],"tipp":"Denk an den Satzanfang und mache die Artikelprobe. Achtung: Auch ein Verb kann zum Nomen werden.","erklaerung":"„Beim“ steht am Satzanfang. „Lesen“ ist hier ein Nomen, denn in „beim“ steckt der Artikel (bei dem Lesen). Zeit, Buch und Spaß sind Nomen. „spannende“ beschreibt das Buch und bleibt klein."},{"id":"rs-gross-08","typ":"luecke","stufe":3,"kompetenz":"nachdenken","frage":"Verb oder Nomen? Wähle die richtige Schreibung.","teile":[{"t":"Am Nachmittag möchte Emir "},{"wahl":["Malen","malen"],"loesung":1},{"t":". Zum "},{"wahl":["Malen","malen"],"loesung":0},{"t":" holt er Pinsel und Farben. Seine Schwester Leyla will lieber "},{"wahl":["lesen","Lesen"],"loesung":0},{"t":", denn beim "},{"wahl":["lesen","Lesen"],"loesung":1},{"t":" kann sie sich gut entspannen."}],"tipp":"Prüfe, ob im Wort davor ein Artikel versteckt ist: zum = zu dem, beim = bei dem.","erklaerung":"Nach „möchte“ und „will“ stehen die Verben malen und lesen, sie bleiben klein. In „zum“ und „beim“ steckt der Artikel „dem“. Darum sind „Malen“ und „Lesen“ dort Nomen und werden großgeschrieben."}]},{"id":"rs-merk","titel":"ie-Regel und Merkwörter: h, aa/ee/oo, v","kurz":"Langes i, Dehnungs-h, doppelte Selbstlaute und v","kompetenz":"merken","wissen":{"merksatz":"Ein langes i schreibst du meistens <b>ie<\/b>. Wörter mit Dehnungs-h, mit <b>aa, ee, oo<\/b> oder mit <b>v<\/b> sind Merkwörter: Präge sie dir gut ein!","punkte":["Hörst du ein langes i, schreibst du fast immer <b>ie<\/b>: Biene, Wiese, Spiegel, liegen. Ausnahmen wie <b>Tiger, Kino, Igel, Krokodil<\/b> und <b>Maschine<\/b> musst du dir merken.","Das Dehnungs-h hörst du nicht. Es steht meistens vor <b>l, m, n<\/b> oder <b>r<\/b>: Zahl, nehmen, Huhn, Uhr. Viele Wörter haben aber kein h: Schule, Name, Tor.","Das h bleibt in der ganzen Wortfamilie: fahren – Fahrt – Fahrrad – er fährt.","Doppelte Selbstlaute gibt es nur als <b>aa, ee<\/b> und <b>oo<\/b>: Haar, Meer, Boot. In deutschen Wörtern gibt es kein ii und kein uu.","Bei <b>v<\/b> hörst du oft ein f: Vogel, Vater, viel, vier. Die Wortbausteine <b>ver-<\/b> und <b>vor-<\/b> schreibst du immer mit v: verlieren, vorlesen."],"beispiele":["Biene, Wiese, liegen → ie","Tiger, Kino, Igel → Ausnahmen mit i","Zahl, Huhn, Uhr → Dehnungs-h","Haar, Meer, Boot → doppelte Selbstlaute","Vogel, vier, verlieren → v"]},"items":[{"id":"rs-merk-01","typ":"luecke","stufe":1,"kompetenz":"merken","frage":"Wähle die richtige Schreibung aus.","teile":[{"t":"Lena kämmt sich vor dem "},{"wahl":["Spiegel","Spigel","Spihgel"],"loesung":0},{"t":" ihre langen "},{"wahl":["Haare","Hare","Hahre"],"loesung":0},{"t":"."}],"tipp":"Sprich beide Wörter langsam. Wie schreibt man ein langes i meistens? Und welche Selbstlaute dürfen doppelt stehen?","erklaerung":"<b>Spiegel<\/b> schreibt man mit ie, denn ein langes i schreibt man meistens ie. <b>Haare<\/b> ist ein Merkwort mit aa."},{"id":"rs-merk-02","typ":"zuordnen","stufe":2,"kompetenz":"merken","frage":"v oder f? Ordne jedes Wort der richtigen Kiste zu.","vorgabe":"Das Zeichen _ steht für den fehlenden Buchstaben.","gruppen":["mit v","mit f"],"elemente":[{"t":"_ogel","g":0},{"t":"_ier","g":0},{"t":"_erstecken","g":0},{"t":"_orlesen","g":0},{"t":"_ertig","g":1},{"t":"_reund","g":1},{"t":"_ernsehen","g":1},{"t":"_ahrrad","g":1}],"tipp":"Denk an die Merkwörter mit v und an die Bausteine ver- und vor-. Vorsicht: Nicht jedes Wort, das am Anfang wie „fer“ klingt, hat den Baustein ver-.","erklaerung":"Vogel und vier sind Merkwörter mit v, verstecken und vorlesen haben die Bausteine ver- und vor-. Fertig, Freund, fernsehen (von „fern“) und Fahrrad schreibt man mit f."},{"id":"rs-merk-03","typ":"markieren","stufe":2,"kompetenz":"merken","frage":"In diesem Satz sind drei Wörter falsch geschrieben. Tippe sie an.","teile":[{"t":"Am"},{"t":"Se","ziel":true},{"t":"steht"},{"t":"ein"},{"t":"alter"},{"t":"Stul","ziel":true},{"t":",","fix":true},{"t":"auf"},{"t":"dem"},{"t":"ein"},{"t":"bunter"},{"t":"Fogel","ziel":true},{"t":"sitzt"},{"t":".","fix":true}],"tipp":"Lies jedes Wort einzeln. Achte auf doppelte Selbstlaute, auf das Dehnungs-h und auf v.","erklaerung":"Richtig ist <b>See<\/b> mit ee, <b>Stuhl<\/b> mit Dehnungs-h vor l und <b>Vogel<\/b> mit v. „steht“ stimmt: Es kommt von „stehen“."},{"id":"rs-merk-04","typ":"eingabe","stufe":1,"kompetenz":"merken","frage":"Schreibe die fehlende Zahl als Wort auf.","vorgabe":"Ein Hund hat ___ Beine.","loesungen":["vier"],"tipp":"Überlege, wie viele Beine ein Hund hat. Das Zahlwort gehört zu den Merkwörtern.","erklaerung":"Ein Hund hat <b>vier<\/b> Beine. „vier“ schreibt man mit v und mit ie – ein Merkwort, das du dir einprägen musst."},{"id":"rs-merk-05","typ":"single","stufe":1,"kompetenz":"merken","frage":"Welches Wort passt in die Lücke?","vorgabe":"In den Sommerferien baden wir im ___.","optionen":[{"text":"Meer","richtig":true},{"text":"Mehr","richtig":false},{"text":"Mer","richtig":false},{"text":"Meher","richtig":false}],"tipp":"Gesucht ist das große, salzige Wasser. Welche Selbstlaute dürfen doppelt stehen?","erklaerung":"Das <b>Meer<\/b> schreibt man mit ee. Das Wort „mehr“ mit h gibt es auch. Es bedeutet aber „eine größere Menge“: Ich möchte mehr Eis."},{"id":"rs-merk-06","typ":"single","stufe":2,"kompetenz":"merken","frage":"In welchem Satz sind alle Wörter richtig geschrieben?","optionen":[{"text":"Im Winter liegt viel Schnee auf den Wiesen.","richtig":true},{"text":"Im Winter ligt viel Schnee auf den Wiesen.","richtig":false},{"text":"Im Winter liegt fiel Schnee auf den Wiesen.","richtig":false},{"text":"Im Winter liegt viel Schne auf den Wiesen.","richtig":false}],"tipp":"Vergleiche die Sätze Wort für Wort. Prüfe das lange i, das v und den doppelten Selbstlaut.","erklaerung":"Nur in einem Satz stimmen alle drei Wörter: <b>liegt<\/b> mit ie, <b>viel<\/b> mit v und <b>Schnee<\/b> mit ee. „fiel“ gibt es auch, es kommt aber von „fallen“."},{"id":"rs-merk-07","typ":"luecke","stufe":3,"kompetenz":"merken","frage":"Setze die richtigen Wörter ein.","teile":[{"t":"Der "},{"wahl":["Tiger","Tieger","Tihger"],"loesung":0},{"t":" im Zoo frisst "},{"wahl":["viel","fiel","vihl"],"loesung":0},{"t":" Fleisch. Danach "},{"wahl":["liegt","ligt","lihgt"],"loesung":0},{"t":" er müde im Gras."}],"tipp":"Denk an die Ausnahmen beim langen i. Überlege bei der zweiten Lücke: Kommt das Wort von „fallen“ oder bedeutet es „eine große Menge“?","erklaerung":"<b>Tiger<\/b> ist eine Ausnahme: langes i, aber kein e. <b>viel<\/b> (eine große Menge) schreibt man mit v und ie, <b>liegt<\/b> mit ie wie „liegen“."},{"id":"rs-merk-08","typ":"multi","stufe":3,"kompetenz":"merken","frage":"Welche Wörter sind richtig geschrieben?","optionen":[{"text":"das Kino","richtig":true},{"text":"der Tiger","richtig":true},{"text":"die Maschine","richtig":true},{"text":"der Spigel","richtig":false},{"text":"die Wise","richtig":false},{"text":"das Krokodiel","richtig":false}],"tipp":"Sprich jedes Wort. Überlege: Ist es ein normales Wort mit ie oder eine Ausnahme, die man nur mit i schreibt?","erklaerung":"Kino, Tiger und Maschine sind Ausnahmen: langes i ohne e. Richtig heißt es <b>Spiegel<\/b>, <b>Wiese<\/b> und <b>Krokodil<\/b>."}]},{"id":"rs-doppel","titel":"Doppelte Mitlaute, ck und tz","kurz":"Kurzer Selbstlaut – dann zwei Mitlaute","kompetenz":"mitsprechen","wissen":{"merksatz":"Nach einem kurzen, betonten Selbstlaut folgen fast immer zwei Mitlaute. Hörst du nur einen, verdoppelst du ihn. Statt kk schreibst du <b>ck<\/b>, statt zz schreibst du <b>tz<\/b>.","punkte":["Sprich das Wort deutlich in Silben. Ist der betonte Selbstlaut kurz (Son-ne) oder lang (Ha-se)?","Nach kurzem Selbstlaut folgen zwei Mitlaute. Hörst du nur einen, wird er verdoppelt: Sonne, Teller, Mutter. Bei einsilbigen Wörtern hilft Verlängern: Ball → Bälle. Ausnahmen: Kleine Wörter wie <b>an, in, mit, um<\/b> haben einen kurzen Selbstlaut und trotzdem nur einen Mitlaut.","Statt kk schreibst du <b>ck<\/b>, statt zz schreibst du <b>tz<\/b>: Decke, Zucker, Katze, sitzen.","Nach l, n, r – das merke ja – steht nie tz und nie ck: Wolke, Bank, stark, Pilz, tanzen, Kerze.","Nach langem Selbstlaut und nach au, ei, eu wird nicht verdoppelt (kein ck, kein tz): Haken, Schaukel, heizen."],"beispiele":["Sonne, Teller, Mutter","Ball → Bälle","an, in, mit, um → Ausnahmen mit einem Mitlaut","Decke, Zucker → ck","Katze, sitzen → tz","Wolke, Bank, Pilz, Kerze → nach l, n, r","Haken → nach langem Selbstlaut","Schaukel, heizen → nach au, ei"]},"items":[{"id":"rs-doppel-01","typ":"zuordnen","stufe":1,"kompetenz":"mitsprechen","frage":"Sprich jedes Wort deutlich. Ist der betonte Selbstlaut lang oder kurz? Ordne zu.","gruppen":["langer Selbstlaut","kurzer Selbstlaut"],"elemente":[{"t":"Hase","g":0},{"t":"Kasse","g":1},{"t":"Ofen","g":0},{"t":"offen","g":1},{"t":"Schal","g":0},{"t":"Schall","g":1},{"t":"Miete","g":0},{"t":"Mitte","g":1}],"tipp":"Sprich zwei Wörter mit gleichem Anfang direkt nacheinander und vergleiche. Klingt der Selbstlaut gedehnt oder kurz und knapp?","erklaerung":"In Kasse, offen, Schall und Mitte ist der Selbstlaut kurz – deshalb folgen zwei Mitlaute. In Hase, Ofen, Schal und Miete ist er lang."},{"id":"rs-doppel-02","typ":"luecke","stufe":1,"kompetenz":"mitsprechen","frage":"Setze die richtigen Buchstaben ein.","teile":[{"t":"Die Ka"},{"wahl":["tz","z","zz"],"loesung":0},{"t":"e liegt auf einer De"},{"wahl":["ck","k","kk"],"loesung":0},{"t":"e in der So"},{"wahl":["nn","n","hn"],"loesung":0},{"t":"e."}],"tipp":"Sprich die Wörter in Silben. Ist der Selbstlaut vor der Lücke kurz? Denk daran, wie man ein doppeltes k und ein doppeltes z schreibt.","erklaerung":"In <b>Katze<\/b>, <b>Decke<\/b> und <b>Sonne<\/b> ist der Selbstlaut kurz. Deshalb folgen zwei Mitlaute: tz statt zz, ck statt kk und nn."},{"id":"rs-doppel-03","typ":"markieren","stufe":2,"kompetenz":"mitsprechen","frage":"In diesem Satz sind drei Wörter falsch geschrieben. Tippe sie an.","teile":[{"t":"Am"},{"t":"Mitwoch","ziel":true},{"t":"sitzt"},{"t":"Ben"},{"t":"mit"},{"t":"Opa"},{"t":"am"},{"t":"Bach"},{"t":"und"},{"t":"pakt","ziel":true},{"t":"zwei"},{"t":"Semeln","ziel":true},{"t":"aus"},{"t":".","fix":true}],"tipp":"Sprich jedes Wort in Silben. Wo ist der Selbstlaut kurz, aber danach steht nur ein Mitlaut? Vorsicht: Kleine Wörter sind manchmal Ausnahmen.","erklaerung":"Richtig ist <b>Mittwoch<\/b> (wie Mitte), <b>packt<\/b> (von packen) und <b>Semmeln<\/b>. Das kleine Wort „mit“ ist eine Ausnahme und hat nur ein t."},{"id":"rs-doppel-04","typ":"eingabe","stufe":1,"kompetenz":"mitsprechen","frage":"Verlängere das Wort. Schreibe die Mehrzahl auf.","vorgabe":"der Ball → die ___","loesungen":["Bälle","die Bälle"],"tipp":"Die Mehrzahl hat zwei Silben. Achte auf den Umlaut.","erklaerung":"Die Mehrzahl heißt <b>Bälle<\/b>. Beim Verlängern hörst du deutlich: Bäl-le. Der kurze Selbstlaut braucht zwei l."},{"id":"rs-doppel-05","typ":"zuordnen","stufe":2,"kompetenz":"mitsprechen","frage":"ck oder k? Ordne jedes Wort der richtigen Kiste zu.","vorgabe":"Das Zeichen _ steht für die fehlenden Buchstaben.","gruppen":["ck","k"],"elemente":[{"t":"Glo_e","g":0},{"t":"Zu_er","g":0},{"t":"Ja_e","g":0},{"t":"Brü_e","g":0},{"t":"Wol_e","g":1},{"t":"Ban_","g":1},{"t":"Schau_el","g":1},{"t":"Mar_t","g":1}],"tipp":"Schau genau, was direkt vor der Lücke steht: ein kurzer Selbstlaut, ein Mitlaut oder au?","erklaerung":"Nach kurzem Selbstlaut steht ck: Glocke, Zucker, Jacke, Brücke. Nach l, n, r und nach au steht nur k: Wolke, Bank, Markt, Schaukel."},{"id":"rs-doppel-06","typ":"multi","stufe":2,"kompetenz":"mitsprechen","frage":"Welche Wörter sind richtig geschrieben?","optionen":[{"text":"der Pilz","richtig":true},{"text":"die Mütze","richtig":true},{"text":"die Kerze","richtig":true},{"text":"der Plaz","richtig":false},{"text":"der Tantz","richtig":false},{"text":"die Wurtzel","richtig":false}],"tipp":"Prüfe bei jedem Wort, was vor dem z-Laut steht: ein kurzer Selbstlaut oder l, n, r?","erklaerung":"Nach kurzem Selbstlaut steht tz: <b>Mütze<\/b>, <b>Platz<\/b>. Nach l, n, r steht nur z: <b>Pilz<\/b>, <b>Kerze<\/b>, <b>Tanz<\/b>, <b>Wurzel<\/b>."},{"id":"rs-doppel-07","typ":"luecke","stufe":3,"kompetenz":"mitsprechen","frage":"Setze die richtigen Buchstaben ein.","teile":[{"t":"Oma hei"},{"wahl":["z","tz"],"loesung":0},{"t":"t den Ofen, stellt eine Ker"},{"wahl":["z","tz"],"loesung":0},{"t":"e auf den Tisch und schmü"},{"wahl":["k","ck"],"loesung":1},{"t":"t das Zimmer mit Tannenzweigen."}],"tipp":"Schau genau, was vor jeder Lücke steht: ei, ein Mitlaut oder ein kurzer Selbstlaut?","erklaerung":"Nach ei steht nur z: <b>heizt<\/b>. Nach r steht nie tz: <b>Kerze<\/b>. Das ü in <b>schmückt<\/b> ist kurz, deshalb ck."},{"id":"rs-doppel-08","typ":"single","stufe":3,"kompetenz":"mitsprechen","frage":"Emir schreibt „Wolcke“. Welche Erklärung hilft ihm, seinen Fehler zu verstehen?","optionen":[{"text":"Nach l steht nie ck, also schreibt man Wolke.","richtig":true},{"text":"Das o ist lang, deshalb schreibt man Wolke.","richtig":false},{"text":"Nach o steht nie ck, also schreibt man Wolke.","richtig":false},{"text":"Wolke ist ein Nomen, also schreibt man Wolke.","richtig":false}],"tipp":"Sprich „Wolke“ in Silben. Welcher Buchstabe steht direkt vor dem k-Laut?","erklaerung":"Vor dem k steht ein l, und nach l, n, r steht nie ck. Das o in <b>Wolke<\/b> ist zwar kurz, aber das l ist schon der erste von zwei Mitlauten."}]},{"id":"rs-s","titel":"s, ss oder ß","kurz":"Kurz oder lang? Verlängern hilft!","kompetenz":"nachdenken","wissen":{"merksatz":"Nach kurzem Selbstlaut schreibst du meistens <b>ss<\/b>. Nach langem Selbstlaut und nach au, ei, eu schreibst du <b>ß<\/b> oder <b>s<\/b>. Bist du unsicher, verlängerst du das Wort oder lernst es als Merkwort.","punkte":["Sprich das Wort deutlich und frag dich zuerst: Ist der Selbstlaut vor dem s-Laut kurz oder lang?","Nach kurzem Selbstlaut schreibst du <b>ss<\/b>: Wasser, Kissen, essen, Fluss.","Nach langem Selbstlaut und nach au, ei, eu gibt es <b>ß<\/b> und <b>s<\/b>. Sprich das Wort ganz deutlich. Zischt das s, schreibst du ß (Straße, Füße, heißen, draußen). Summt es wie eine Biene, schreibst du s (Rose, Hose, Wiese, lesen).","Am Wortende hörst du den Unterschied nicht. Verlängere das Wort: Gras → Gräser, Fuß → Füße, Kuss → küssen.","In Bayern sprechen viele Menschen auch das s in Rose oder Hose zischend. Hörst du den Unterschied nicht sicher, ist das ganz normal. Dann hilft dir: auf kurz oder lang achten, verlängern und die Wörter mit ß als Merkwörter lernen, zum Beispiel Straße, groß, Fuß, heißen, draußen, fleißig."],"beispiele":["Wasser, Kissen, essen → kurz: ss","Straße, groß, heißen → lang oder ei, zischend: ß","Rose, Hose, lesen → lang, summend: s","Gras → Gräser","Fuß → Füße","Kuss → küssen"]},"items":[{"id":"rs-s-01","typ":"luecke","stufe":1,"kompetenz":"nachdenken","frage":"Setze s, ss oder ß richtig ein.","teile":[{"t":"Im Sommer baden wir drau"},{"wahl":["ß","ss","s"],"loesung":0},{"t":"en im Flu"},{"wahl":["ss","ß","s"],"loesung":0},{"t":". Das Wa"},{"wahl":["ss","ß","s"],"loesung":0},{"t":"er ist herrlich kühl."}],"tipp":"Sprich jedes Wort deutlich. Was steht vor dem s-Laut: ein kurzer Selbstlaut, ein langer oder au?","erklaerung":"In <b>draußen<\/b> zischt das s nach au, deshalb schreibt man ß. In <b>Fluss<\/b> und <b>Wasser<\/b> ist der Selbstlaut kurz, deshalb ss."},{"id":"rs-s-02","typ":"zuordnen","stufe":1,"kompetenz":"nachdenken","frage":"ss oder ß? Ordne jedes Wort der richtigen Kiste zu.","vorgabe":"Das Zeichen _ steht für die fehlenden Buchstaben.","gruppen":["ss","ß"],"elemente":[{"t":"Ki_en","g":0},{"t":"e_en","g":0},{"t":"Schlü_el","g":0},{"t":"Ta_e","g":0},{"t":"Stra_e","g":1},{"t":"Fü_e","g":1},{"t":"grü_en","g":1},{"t":"hei_en","g":1}],"tipp":"Sprich jedes Wort und hör auf den Laut vor der Lücke: kurz und knapp, lang gezogen oder ein ei?","erklaerung":"Kurzer Selbstlaut → ss: Kissen, essen, Schlüssel, Tasse. Langer Selbstlaut oder ei → ß: Straße, Füße, grüßen, heißen."},{"id":"rs-s-03","typ":"single","stufe":1,"kompetenz":"nachdenken","frage":"Welches Wort passt in die Lücke?","vorgabe":"Am Morgen ___ Lena freundlich ihre Nachbarin.","optionen":[{"text":"grüßt","richtig":true},{"text":"grüsst","richtig":false},{"text":"grüst","richtig":false},{"text":"grühst","richtig":false}],"tipp":"Sprich das Wort langsam. Ist das ü lang oder kurz? Summt oder zischt das s?","erklaerung":"In <b>grüßt<\/b> (von grüßen) ist das ü lang und das s zischt. Deshalb schreibt man ß."},{"id":"rs-s-04","typ":"markieren","stufe":2,"kompetenz":"nachdenken","frage":"In diesem Satz sind drei Wörter falsch geschrieben. Tippe sie an.","teile":[{"t":"Nach"},{"t":"der"},{"t":"Schule"},{"t":"laufen"},{"t":"wir"},{"t":"über"},{"t":"die"},{"t":"Strasse","ziel":true},{"t":"zum"},{"t":"Fluß","ziel":true},{"t":"und"},{"t":"werfen"},{"t":"kleine"},{"t":"Steine"},{"t":"ins"},{"t":"Waßer","ziel":true},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort mit s-Laut: Ist der Selbstlaut davor lang oder kurz? Am Wortende hilft dir das Verlängern.","erklaerung":"Richtig ist <b>Straße<\/b> (langes a → ß), <b>Fluss<\/b> (Flüsse: kurzes u → ss) und <b>Wasser<\/b> (kurzes a → ss)."},{"id":"rs-s-05","typ":"eingabe","stufe":2,"kompetenz":"nachdenken","frage":"Wie schreibt man das Wort richtig? Tippe das ganze Wort ein.","vorgabe":"Ich trinke Saft aus einem Gla_.","loesungen":["Glas"],"tipp":"Verlängere das Wort: Bilde die Mehrzahl und sprich sie ganz deutlich. Summt oder zischt das s dann?","erklaerung":"Die Mehrzahl heißt <b>Gläser<\/b>. Wenn du sie deutlich sprichst, summt das s – also schreibt man auch <b>Glas<\/b> mit s."},{"id":"rs-s-06","typ":"single","stufe":2,"kompetenz":"nachdenken","frage":"Ben weiß nicht, ob man „Nuss“ oder „Nuß“ schreibt. Was hilft ihm?","optionen":[{"text":"Er verlängert zu „Nüsse“: Das ü ist kurz, also ss.","richtig":true},{"text":"Er verlängert zu „Nüsse“: Das ü ist lang, also ß.","richtig":false},{"text":"Er merkt sich: Am Ende eines Wortes steht immer ß.","richtig":false},{"text":"Er merkt sich: Nach dem Buchstaben u steht nie ss.","richtig":false}],"tipp":"Bilde die Mehrzahl und sprich sie langsam. Wie klingt das ü?","erklaerung":"In <b>Nüsse<\/b> ist das ü kurz. Nach kurzem Selbstlaut schreibt man ss – also auch <b>Nuss<\/b>."},{"id":"rs-s-07","typ":"luecke","stufe":3,"kompetenz":"nachdenken","frage":"Setze s, ss oder ß richtig ein.","teile":[{"t":"Im Gra"},{"wahl":["s","ss","ß"],"loesung":0},{"t":" schläft unser Hund, auf einem gro"},{"wahl":["ß","ss","s"],"loesung":0},{"t":"en Stein sitzt die Katze, und eine Mau"},{"wahl":["s","ss","ß"],"loesung":0},{"t":" huscht vorbei."}],"tipp":"Am Wortende hilft das Verlängern. Prüfe dann: Summt das s oder zischt es? Ist der Laut davor lang oder kurz?","erklaerung":"<b>Gras<\/b> → Gräser und <b>Maus<\/b> → Mäuse: Das s summt, also s. In <b>großen<\/b> ist das o lang und das s zischt, also ß."},{"id":"rs-s-08","typ":"multi","stufe":3,"kompetenz":"nachdenken","frage":"In welche Wörter gehört ein ß?","vorgabe":"Das Zeichen _ steht für die Lücke.","optionen":[{"text":"flei_ig","richtig":true},{"text":"sü_","richtig":true},{"text":"bei_en","richtig":true},{"text":"die Na_e","richtig":false},{"text":"na_","richtig":false},{"text":"das Schlo_","richtig":false}],"tipp":"Verlängere die kurzen Wörter. Ist der Laut vor dem s lang, kurz oder ein ei? Summt oder zischt das s?","erklaerung":"ß gehört in <b>fleißig<\/b> und <b>beißen<\/b> (nach ei, zischendes s) und in <b>süß<\/b> (süße: langes ü, zischendes s). <b>Nase<\/b> hat ein summendes s, <b>nass<\/b> und <b>Schloss<\/b> haben einen kurzen Selbstlaut."}]},{"id":"rs-rede","titel":"Wörtliche Rede und Satzzeichen","kurz":"Anführungszeichen, Doppelpunkt, Komma","kompetenz":"zeichen","wissen":{"merksatz":"Was jemand wörtlich sagt, setzt du in Anführungszeichen. Der Begleitsatz verrät, wer spricht.","punkte":["Die wörtliche Rede steht in Anführungszeichen: am Anfang unten („), am Ende oben (“).","Steht der Begleitsatz vorn, folgt ein <b>Doppelpunkt<\/b>: Mia ruft: „Komm schnell!“","Steht der Begleitsatz hinten, folgt nach dem Anführungszeichen ein <b>Komma<\/b>. Der Punkt der wörtlichen Rede fällt weg: „Ich komme mit“, sagt Ben.","Fragezeichen und Ausrufezeichen bleiben stehen, das Komma kommt trotzdem dazu: „Kommst du mit?“, fragt Lena.","Jede Satzart hat ihr Zeichen: Aussagesatz → Punkt, Fragesatz → Fragezeichen, Ausruf → Ausrufezeichen."],"beispiele":["Tim sagt: „Ich habe Hunger.“","„Ich habe Hunger“, sagt Tim.","Oma fragt: „Hast du Hunger?“","„Hast du Hunger?“, fragt Oma.","„Pass auf!“, ruft Papa."]},"items":[{"id":"rs-rede-01","typ":"zuordnen","stufe":1,"kompetenz":"zeichen","frage":"Welches Satzzeichen fehlt am Ende? Ordne jeden Satz zu.","gruppen":["Punkt","Fragezeichen","Ausrufezeichen"],"elemente":[{"t":"Wie heißt dein Hund","g":1},{"t":"Wann fährt der Bus ab","g":1},{"t":"Hast du deine Brotzeit dabei","g":1},{"t":"Mein Bruder ist acht Jahre alt","g":0},{"t":"Der Bus fährt um halb acht ab","g":0},{"t":"Unsere Schule hat einen großen Pausenhof","g":0},{"t":"Au, das tut weh","g":2},{"t":"Hurra, wir haben gewonnen","g":2}],"tipp":"Lies jeden Satz laut. Fragst du etwas, erzählst du ruhig etwas oder rufst du etwas aus?","erklaerung":"Fragesätze beginnen oft mit einem Fragewort oder dem Verb und bekommen ein Fragezeichen. Aussagesätze bekommen einen Punkt, Ausrufe wie „Au“ oder „Hurra“ ein Ausrufezeichen."},{"id":"rs-rede-02","typ":"markieren","stufe":1,"kompetenz":"zeichen","frage":"Tippe alle Wörter des Begleitsatzes an.","teile":[{"t":"„","fix":true},{"t":"Wer"},{"t":"möchte"},{"t":"noch"},{"t":"ein"},{"t":"Stück"},{"t":"Kuchen"},{"t":"?","fix":true},{"t":"“","fix":true},{"t":",","fix":true},{"t":"fragt","ziel":true},{"t":"Oma","ziel":true},{"t":"freundlich","ziel":true},{"t":".","fix":true}],"tipp":"Der Begleitsatz steht nicht in den Anführungszeichen. Er verrät, wer spricht, und manchmal auch, wie jemand spricht.","erklaerung":"„fragt Oma freundlich“ ist der Begleitsatz: Er sagt, wer spricht und wie. Weil er hinten steht, folgt nach der wörtlichen Rede ein Komma."},{"id":"rs-rede-03","typ":"single","stufe":1,"kompetenz":"zeichen","frage":"Welcher Satz ist richtig geschrieben?","optionen":[{"text":"Lena sagt: „Ich komme gleich.“","richtig":true},{"text":"Lena sagt, „Ich komme gleich.“","richtig":false},{"text":"Lena sagt: „Ich komme gleich“.","richtig":false},{"text":"Lena sagt: “Ich komme gleich.„","richtig":false}],"tipp":"Achte auf drei Dinge: das Zeichen nach dem Begleitsatz, die Form der Anführungszeichen und die Stelle des Punktes.","erklaerung":"Steht der Begleitsatz vorn, folgt ein Doppelpunkt. Die Anführungszeichen stehen am Anfang unten („) und am Ende oben (“). Der Punkt steht innerhalb der Anführungszeichen."},{"id":"rs-rede-04","typ":"luecke","stufe":2,"kompetenz":"zeichen","frage":"Wähle die richtigen Satzzeichen aus.","teile":[{"t":"„Heute fahren wir ins Freibad"},{"wahl":["“,",".“,","“."],"loesung":0},{"t":" sagt Papa. Mia fragt"},{"wahl":[":",",","."],"loesung":0},{"t":" „Darf Aylin auch mitkommen"},{"wahl":["?“","“?","?“."],"loesung":0}],"tipp":"Wo steht der Begleitsatz – vor oder nach der wörtlichen Rede? Denk daran, was mit dem Punkt passiert und dass Fragezeichen stehen bleiben.","erklaerung":"Begleitsatz hinten: erst das Anführungszeichen, dann ein Komma, kein Punkt. Begleitsatz vorn: Doppelpunkt. Das Fragezeichen steht vor dem schließenden Anführungszeichen, danach kommt kein Punkt mehr."},{"id":"rs-rede-05","typ":"multi","stufe":2,"kompetenz":"zeichen","frage":"Welche Sätze sind richtig geschrieben?","optionen":[{"text":"„Ich habe Durst“, sagt Ben.","richtig":true},{"text":"„Hast du Durst?“, fragt Oma.","richtig":true},{"text":"„Trink etwas!“, ruft Papa.","richtig":true},{"text":"„Ich habe Durst.“, sagt Ben.","richtig":false},{"text":"„Hast du Durst“? fragt Oma.","richtig":false},{"text":"„Ich habe Durst“ sagt Ben.","richtig":false}],"tipp":"In allen Sätzen steht der Begleitsatz hinten. Prüfe Schritt für Schritt: das Zeichen in der Rede, das schließende Anführungszeichen und das Komma.","erklaerung":"Steht der Begleitsatz hinten, folgt nach dem Anführungszeichen immer ein Komma. Ein Punkt in der Rede fällt weg, Frage- und Ausrufezeichen bleiben in den Anführungszeichen."},{"id":"rs-rede-06","typ":"eingabe","stufe":2,"kompetenz":"zeichen","frage":"Hier fehlt ein Satzzeichen. Schreibe seinen Namen auf.","vorgabe":"Paul flüstert ___ „Das Baby schläft.“","loesungen":["Doppelpunkt","der Doppelpunkt","ein Doppelpunkt","Der Doppelpunkt","Ein Doppelpunkt"],"tipp":"Der Begleitsatz steht vor der wörtlichen Rede. Welches Zeichen kündigt an, dass gleich jemand spricht?","erklaerung":"Steht der Begleitsatz vorn, folgt ein <b>Doppelpunkt<\/b>: Paul flüstert: „Das Baby schläft.“ Das Wort „Doppelpunkt“ ist ein Nomen, deshalb schreibst du es groß."},{"id":"rs-rede-07","typ":"luecke","stufe":3,"kompetenz":"zeichen","frage":"Wähle die richtigen Satzzeichen aus.","teile":[{"t":"„Wann beginnt der Film"},{"wahl":["?“,","?“","“?,"],"loesung":0},{"t":" fragt Felix. „Um halb vier"},{"wahl":["“,",".“,","“."],"loesung":0},{"t":" antwortet Amira. „Beeil dich"},{"wahl":["!“,","!“","“!,"],"loesung":0},{"t":" ruft sie."}],"tipp":"In allen drei Sätzen steht der Begleitsatz hinten. Überlege bei jeder Lücke: Bleibt das Zeichen der Rede stehen oder fällt es weg? Und was folgt nach dem Anführungszeichen?","erklaerung":"Frage- und Ausrufezeichen bleiben in den Anführungszeichen, der Punkt fällt weg. Danach folgt immer ein Komma: <b>Film?“, fragt<\/b> – <b>vier“, antwortet<\/b> – <b>dich!“, ruft<\/b>."},{"id":"rs-rede-08","typ":"markieren","stufe":3,"kompetenz":"zeichen","frage":"Leyla und Ben haben ihr Gespräch aufgeschrieben. Zwei Satzzeichen sind falsch. Tippe sie an.","teile":[{"t":"„"},{"t":"Ich habe meinen Schlüssel verloren","fix":true},{"t":".","ziel":true},{"t":"“"},{"t":","},{"t":"sagt Leyla","fix":true},{"t":"."},{"t":"Ben fragt","fix":true},{"t":",","ziel":true},{"t":"„"},{"t":"Wo hast du ihn zuletzt gesehen","fix":true},{"t":"?"},{"t":"“"}],"tipp":"Prüfe die beiden Sätze einzeln: Steht der Begleitsatz vorn oder hinten? Welche Zeichen gehören dann an welche Stelle?","erklaerung":"Im ersten Satz steht der Begleitsatz hinten, deshalb fällt der Punkt in der Rede weg. Im zweiten Satz steht er vorn, deshalb gehört nach „Ben fragt“ ein Doppelpunkt statt eines Kommas."}]}],"diktate":[{"id":"dk-merk","titel":"Merkwörter-Diktat","woerter":[{"wort":"Vogel","satz":"Der Vogel baut ein Nest."},{"wort":"vier","satz":"Unsere Katze hat vier Pfoten."},{"wort":"verlieren","satz":"Ich will das Spiel nicht verlieren."},{"wort":"Zahl","satz":"Schreibe die Zahl an die Tafel."},{"wort":"Uhr","satz":"Meine Uhr tickt ganz leise."},{"wort":"Boot","satz":"Wir fahren mit dem Boot über den See."},{"wort":"Meer","satz":"Im Urlaub baden wir im Meer."},{"wort":"Zoo","satz":"Am Sonntag gehen wir in den Zoo."},{"wort":"Biene","satz":"Die Biene fliegt von Blüte zu Blüte."},{"wort":"Tiger","satz":"Der Tiger hat schwarze Streifen."}]},{"id":"dk-doppel","titel":"Diktat: Doppelte Mitlaute, ck und tz","woerter":[{"wort":"Sonne","satz":"Die Sonne scheint hell."},{"wort":"Ball","satz":"Der Ball fliegt ins Tor."},{"wort":"kommen","satz":"Morgen kommen meine Großeltern."},{"wort":"schnell","satz":"Mein Hund rennt sehr schnell."},{"wort":"Brücke","satz":"Wir gehen über die Brücke."},{"wort":"Zucker","satz":"Opa nimmt Zucker in den Tee."},{"wort":"Glück","satz":"Ich wünsche dir viel Glück."},{"wort":"Katze","satz":"Die Katze schläft auf dem Sofa."},{"wort":"Platz","satz":"Ist dieser Platz noch frei?"},{"wort":"sitzen","satz":"Wir sitzen alle am Tisch."}]},{"id":"dk-s","titel":"Diktat: s, ss oder ß","woerter":[{"wort":"Straße","satz":"Wir gehen am Zebrastreifen über die Straße."},{"wort":"Fuß","satz":"Ich gehe zu Fuß zur Schule."},{"wort":"groß","satz":"Der Elefant ist sehr groß."},{"wort":"draußen","satz":"Heute spielen wir draußen."},{"wort":"heißen","satz":"Wie heißen deine Freunde?"},{"wort":"Wasser","satz":"Bitte gib mir ein Glas Wasser."},{"wort":"Fluss","satz":"Im Fluss schwimmen Fische."},{"wort":"essen","satz":"Mittags essen wir Nudeln."},{"wort":"Hose","satz":"Meine Hose hat ein Loch."},{"wort":"Gras","satz":"Die Kühe fressen Gras."}]},{"id":"dk-mix","titel":"Profi-Diktat: alles gemischt","woerter":[{"wort":"verstecken","satz":"Die Kinder verstecken sich hinter der Hecke."},{"wort":"Fahrrad","satz":"Ich fahre mit dem Fahrrad zur Schule."},{"wort":"Spiegel","satz":"Im Spiegel sehe ich mich."},{"wort":"Schnee","satz":"Im Winter fällt viel Schnee."},{"wort":"Wolke","satz":"Am Himmel zieht eine dunkle Wolke vorbei."},{"wort":"plötzlich","satz":"Da klingelt plötzlich das Telefon."},{"wort":"Kerze","satz":"Auf dem Kuchen brennt eine Kerze."},{"wort":"Schlüssel","satz":"Ich habe meinen Schlüssel vergessen."},{"wort":"fleißig","satz":"Die Bienen arbeiten fleißig."},{"wort":"Fußball","satz":"In der Pause spielen wir Fußball."}]}]},"grammatik":{"themen":[{"id":"gr-nomen","titel":"Nomen, Artikel und Pronomen","kurz":"Namenwörter erkennen, Begleiter wählen, Fürwörter einsetzen","kompetenz":"wortarten","wissen":{"merksatz":"<b>Nomen<\/b> (Namenwörter) sind Wörter für Menschen, Tiere, Pflanzen und Dinge – aber auch für Gefühle und Gedanken wie <i>Angst<\/i>, <i>Traum<\/i> oder <i>Hoffnung<\/i>. Nomen schreibt man immer groß. Vor dem Nomen steht oft ein <b>Artikel<\/b> (Begleiter). Ein <b>Personalpronomen<\/b> (persönliches Fürwort) kann ein Nomen ersetzen.","punkte":["Nomen-Probe: Passt <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> davor? Dann ist es ein Nomen: <i>die Angst, der Traum, die Hoffnung<\/i>.","Jedes Nomen hat ein Geschlecht: männlich (<i>der<\/i> Tisch), weiblich (<i>die<\/i> Lampe) oder sächlich (<i>das<\/i> Bett).","Bestimmte Artikel sind <i>der, die, das<\/i>. Unbestimmte Artikel sind <i>ein, eine<\/i>.","Die meisten Nomen haben eine Einzahl und eine Mehrzahl: <i>das Buch – die Bücher<\/i>. In der Mehrzahl heißt der bestimmte Artikel bei <i>Wer oder was?<\/i> immer <i>die<\/i>: <i>die Bücher, die Bäume<\/i>.","Personalpronomen sind <i>ich, du, er, sie, es, wir, ihr, sie<\/i>. Sie ersetzen Nomen, damit sich Wörter nicht dauernd wiederholen: <i>Der Hund bellt. Er hat Hunger.<\/i>"],"beispiele":["die Angst, der Traum, die Hoffnung","das Buch – die Bücher","ein Igel – der Igel","Lena und Tom → sie","Das Fahrrad ist neu. → Es ist neu."]},"items":[{"id":"gr-nomen-01","typ":"markieren","stufe":1,"kompetenz":"wortarten","frage":"Tippe alle Nomen an.","teile":[{"t":"Im"},{"t":"Herbst","ziel":true},{"t":"sammelt"},{"t":"der"},{"t":"Igel","ziel":true},{"t":"trockene"},{"t":"Blätter","ziel":true},{"t":"für"},{"t":"sein"},{"t":"Nest","ziel":true},{"t":".","fix":true}],"tipp":"Das erste Wort im Satz schreibt man immer groß. Prüfe deshalb bei jedem Wort, ob du <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> davorsetzen kannst.","erklaerung":"<i>Herbst<\/i>, <i>Igel<\/i>, <i>Blätter<\/i> und <i>Nest<\/i> sind Nomen: der Herbst, der Igel, die Blätter, das Nest. <i>Im<\/i> ist nur groß, weil es am Satzanfang steht."},{"id":"gr-nomen-02","typ":"zuordnen","stufe":1,"kompetenz":"wortarten","frage":"Welcher Artikel passt? Ordne jedes Nomen zu.","gruppen":["der","die","das"],"elemente":[{"t":"Löffel","g":0},{"t":"Gabel","g":1},{"t":"Messer","g":2},{"t":"Mut","g":0},{"t":"Freude","g":1},{"t":"Glück","g":2},{"t":"Mädchen","g":2}],"tipp":"Sprich jedes Nomen leise mit <i>der<\/i>, <i>die<\/i> und <i>das<\/i>. Was klingt richtig?","erklaerung":"Es heißt: der Löffel, der Mut – die Gabel, die Freude – das Messer, das Glück, das Mädchen. Auch Gefühle wie Mut und Freude haben einen Artikel."},{"id":"gr-nomen-03","typ":"luecke","stufe":1,"kompetenz":"wortarten","frage":"Wähle den passenden Artikel.","teile":[{"t":"Im Tierpark sieht Ben "},{"wahl":["ein","eine","einen"],"loesung":0},{"t":" Zebra. "},{"wahl":["Der","Die","Das"],"loesung":2},{"t":" Zebra frisst Heu. Daneben steht "},{"wahl":["ein","eine","einen"],"loesung":1},{"t":" Giraffe."}],"tipp":"Überlege zuerst: Heißt es <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> Zebra? Und wie ist es bei der Giraffe?","erklaerung":"Es heißt <i>das Zebra<\/i>, also <i>ein Zebra<\/i>, und <i>die Giraffe<\/i>, also <i>eine Giraffe<\/i>. <i>Das<\/i> ist ein bestimmter Artikel, <i>ein<\/i> und <i>eine<\/i> sind unbestimmte Artikel."},{"id":"gr-nomen-04","typ":"markieren","stufe":2,"kompetenz":"wortarten","frage":"Tippe nur die Nomen an, die etwas bezeichnen, das man <b>nicht<\/b> anfassen kann.","teile":[{"t":"Voller"},{"t":"Stolz","ziel":true},{"t":"und"},{"t":"mit"},{"t":"viel"},{"t":"Mut","ziel":true},{"t":"springt"},{"t":"Hannah"},{"t":"vom"},{"t":"Dreimeterbrett"},{"t":"ins"},{"t":"Becken"},{"t":".","fix":true}],"tipp":"Suche zuerst alle Nomen. Frage dann bei jedem: Kann ich das mit meinen Händen berühren?","erklaerung":"<i>Stolz<\/i> und <i>Mut<\/i> sind Gefühle. Man kann sie nicht anfassen, trotzdem sind es Nomen: der Stolz, der Mut. <i>Hannah<\/i>, <i>Dreimeterbrett<\/i> und <i>Becken<\/i> sind Nomen für eine Person und für Dinge, die man anfassen kann."},{"id":"gr-nomen-05","typ":"matrix","stufe":2,"kompetenz":"wortarten","frage":"Lies jede Aussage. Ist sie richtig oder falsch?","aussagen":[{"text":"Die Mehrzahl von <i>die Maus<\/i> heißt <i>die Mäuse<\/i>.","richtig":true},{"text":"<i>Ein<\/i> und <i>eine<\/i> sind bestimmte Artikel.","richtig":false},{"text":"Beim Wort <i>der Koffer<\/i> sieht das Nomen in der Mehrzahl genauso aus wie in der Einzahl: <i>die Koffer<\/i>.","richtig":true},{"text":"Weil es <i>der Baum<\/i> heißt, sagt man in der Mehrzahl: <i>Im Wald stehen der Bäume.<\/i>","richtig":false}],"tipp":"Bilde die Mehrzahl laut: <i>eine Maus – zwei …<\/i>, <i>ein Koffer – zwei …<\/i>. Setze dann <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> vor die Mehrzahl und hör genau hin.","erklaerung":"Richtig: die Maus – die Mäuse, der Koffer – die Koffer. Falsch: <i>ein<\/i> und <i>eine<\/i> sind unbestimmte Artikel. In der Mehrzahl heißt der bestimmte Artikel bei <i>Wer oder was?<\/i> immer <i>die<\/i>: <i>Im Wald stehen die Bäume.<\/i>"},{"id":"gr-nomen-06","typ":"luecke","stufe":2,"kompetenz":"wortarten","frage":"Welches Personalpronomen ersetzt das Nomen richtig?","teile":[{"t":"Paul und Mia bauen ein Floß. "},{"wahl":["Sie","Er","Es"],"loesung":0},{"t":" sammeln dafür dicke Äste. Nach zwei Stunden ist das Floß fertig, aber "},{"wahl":["es","er","sie"],"loesung":0},{"t":" wackelt noch ein bisschen. Mia findet einen langen Stock. "},{"wahl":["Er","Sie","Es"],"loesung":0},{"t":" ist genau richtig für den Mast."}],"tipp":"Frage dich bei jeder Lücke: Wer oder was ist gemeint? Ist es eine Person oder sind es mehrere? Heißt das Nomen <i>der<\/i>, <i>die<\/i> oder <i>das<\/i>?","erklaerung":"<i>Paul und Mia<\/i> sind zwei Personen, also <i>sie<\/i>. <i>Das Floß<\/i> wird zu <i>es<\/i>, <i>der Stock<\/i> wird zu <i>er<\/i>. Das Pronomen passt zum Geschlecht des Nomens: der → er, die → sie, das → es."},{"id":"gr-nomen-07","typ":"multi","stufe":3,"kompetenz":"wortarten","frage":"Hier stehen alle Wörter in Großbuchstaben. So verrät dir die Schreibung nicht, welche Wörter Nomen sind. Welche Wörter sind Nomen?","optionen":[{"text":"FREUDE","richtig":true},{"text":"FRÖHLICH","richtig":false},{"text":"MUT","richtig":true},{"text":"MUTIG","richtig":false},{"text":"IDEE","richtig":true},{"text":"WÜTEND","richtig":false}],"tipp":"Mach die Nomen-Probe: Kannst du <i>der<\/i>, <i>die<\/i> oder <i>das<\/i> davorsetzen? Probiere auch, ob das Wort in den Satz <i>Ich bin sehr …<\/i> passt.","erklaerung":"Nomen sind <i>die Freude<\/i>, <i>der Mut<\/i> und <i>die Idee<\/i>. Man kann sie nicht anfassen, aber sie haben einen Artikel. Die Wörter <i>fröhlich<\/i>, <i>mutig<\/i> und <i>wütend<\/i> sind Adjektive: Sie sagen, wie jemand ist."},{"id":"gr-nomen-08","typ":"eingabe","stufe":3,"kompetenz":"wortarten","frage":"Ersetze die fett gedruckten Wörter durch ein Personalpronomen. Tippe nur das Pronomen ein.","vorgabe":"Heute haben <b>Emir und ich<\/b> ein Fußballturnier. → Heute haben ___ ein Fußballturnier.","loesungen":["wir"],"tipp":"Zähle: Wie viele Personen sind gemeint? Und gehört die Person, die spricht, selbst dazu?","erklaerung":"<i>Emir und ich<\/i> sind zwei Personen, und wer spricht, gehört selbst dazu. Dafür steht das Personalpronomen <i>wir<\/i>."}]},{"id":"gr-verben","titel":"Verben","kurz":"Grundform, Personalform, Wortstamm und Personalendungen","kompetenz":"wortarten","wissen":{"merksatz":"<b>Verben<\/b> (Tunwörter) sagen, was jemand tut oder was geschieht: <i>lachen, rennen, regnen<\/i>. Im Wörterbuch steht die <b>Grundform<\/b> (Infinitiv): <i>spielen<\/i>. Im Satz steht die <b>Personalform<\/b>, die zur Person passt: <i>du spielst<\/i>.","punkte":["Ein Verb besteht aus dem <b>Wortstamm<\/b> und der <b>Endung<\/b>: <i>spiel-en, spiel-st, spiel-t<\/i>. Der Wortstamm bleibt meistens gleich, die Endung wechselt. Manchmal heißt die Endung der Grundform nur <i>-n<\/i>: <i>kletter-n – du kletter-st<\/i>.","Personalendungen: ich spiel<b>e<\/b>, du spiel<b>st<\/b>, er/sie/es spiel<b>t<\/b>, wir spiel<b>en<\/b>, ihr spiel<b>t<\/b>, sie spiel<b>en<\/b>.","Bei manchen Verben ändert sich bei <i>du<\/i> und <i>er/sie/es<\/i> der Selbstlaut im Wortstamm: <i>schlafen – du schläfst<\/i>, <i>helfen – sie hilft<\/i>.","Bei <i>ihr<\/i> bleibt der Selbstlaut wie in der Grundform: <i>ihr schlaft, ihr helft<\/i>.","Endet der Wortstamm auf <i>s<\/i>, <i>ß<\/i> oder <i>z<\/i>, hängt man bei <i>du<\/i> nur <i>-t<\/i> an: <i>du reist, du heißt, du sitzt<\/i>."],"beispiele":["spielen – ich spiele – du spielst","schlafen – er schläft","helfen – du hilfst","malen → Wortstamm: mal"]},"items":[{"id":"gr-verben-01","typ":"markieren","stufe":1,"kompetenz":"wortarten","frage":"Tippe alle Verben an.","teile":[{"t":"Am"},{"t":"Nachmittag"},{"t":"füttert","ziel":true},{"t":"Elif"},{"t":"die"},{"t":"Hasen"},{"t":",","fix":true},{"t":"dann"},{"t":"holt","ziel":true},{"t":"sie"},{"t":"ihren"},{"t":"Ball"},{"t":"und"},{"t":"spielt","ziel":true},{"t":"mit"},{"t":"Luca"},{"t":".","fix":true}],"tipp":"Verben sagen, was jemand tut. Frage: Was macht Elif alles?","erklaerung":"<i>füttert<\/i>, <i>holt<\/i> und <i>spielt<\/i> sagen, was Elif tut. Es sind Verben in der Personalform. Ihre Grundformen heißen <i>füttern<\/i>, <i>holen<\/i> und <i>spielen<\/i>."},{"id":"gr-verben-02","typ":"zuordnen","stufe":1,"kompetenz":"wortarten","frage":"Grundform oder Personalform? Ordne zu.","gruppen":["Grundform","Personalform"],"elemente":[{"t":"schwimmen","g":0},{"t":"du schwimmst","g":1},{"t":"lachen","g":0},{"t":"sie lacht","g":1},{"t":"springen","g":0},{"t":"ich springe","g":1},{"t":"ihr malt","g":1},{"t":"erzählen","g":0}],"tipp":"Die Grundform steht so im Wörterbuch und endet meist auf <i>-en<\/i>. Die Personalform passt zu einer Person wie <i>ich<\/i>, <i>du<\/i> oder <i>sie<\/i>.","erklaerung":"Grundformen sind <i>schwimmen<\/i>, <i>lachen<\/i>, <i>springen<\/i> und <i>erzählen<\/i>. Bei <i>du schwimmst<\/i>, <i>sie lacht<\/i>, <i>ich springe<\/i> und <i>ihr malt<\/i> passt das Verb zur Person: Das sind Personalformen."},{"id":"gr-verben-03","typ":"luecke","stufe":1,"kompetenz":"wortarten","frage":"Welche Personalendung passt?","teile":[{"t":"Ich spiel"},{"wahl":["e","st","t","en"],"loesung":0},{"t":" Flöte. Du spiel"},{"wahl":["e","st","t","en"],"loesung":1},{"t":" Gitarre. Wir spiel"},{"wahl":["e","st","t","en"],"loesung":3},{"t":" zusammen im Schulorchester. Ihr hör"},{"wahl":["e","st","t","en"],"loesung":2},{"t":" uns zu."}],"tipp":"Schau genau, wer etwas tut: <i>ich<\/i>, <i>du<\/i>, <i>wir<\/i> oder <i>ihr<\/i>? Jede Person hat ihre eigene Endung.","erklaerung":"Es heißt: ich spiel<b>e<\/b>, du spiel<b>st<\/b>, wir spiel<b>en<\/b>, ihr hör<b>t<\/b>. Der Wortstamm bleibt hier gleich, nur die Endung passt sich der Person an."},{"id":"gr-verben-04","typ":"multi","stufe":2,"kompetenz":"wortarten","frage":"Bei welchen Verben ändert sich in der du-Form der Selbstlaut im Wortstamm?","optionen":[{"text":"lesen","richtig":true},{"text":"fahren","richtig":true},{"text":"geben","richtig":true},{"text":"kaufen","richtig":false},{"text":"gehen","richtig":false},{"text":"malen","richtig":false}],"tipp":"Bilde zu jedem Verb die du-Form und sprich sie laut. Klingt der Selbstlaut noch so wie in der Grundform?","erklaerung":"<i>lesen – du liest<\/i>, <i>fahren – du fährst<\/i>, <i>geben – du gibst<\/i>: Hier wechselt der Selbstlaut. Bei <i>du kaufst<\/i>, <i>du gehst<\/i> und <i>du malst<\/i> bleibt er gleich."},{"id":"gr-verben-05","typ":"luecke","stufe":2,"kompetenz":"wortarten","frage":"Wähle die richtige Verbform.","teile":[{"t":"Mama, "},{"wahl":["liest","lest","lesst"],"loesung":0},{"t":" du mir etwas vor? Papa "},{"wahl":["fahrt","fährt","fährst"],"loesung":1},{"t":" heute mit dem Bus zur Arbeit. Sofia "},{"wahl":["gebt","gibst","gibt"],"loesung":2},{"t":" mir ihren Radiergummi."}],"tipp":"Wer tut hier jeweils etwas: <i>du<\/i>, <i>er<\/i> oder <i>sie<\/i>? Denke daran, dass sich bei manchen Verben der Selbstlaut im Wortstamm ändert.","erklaerung":"Richtig ist: du <b>liest<\/b>, Papa (er) <b>fährt<\/b>, Sofia (sie) <b>gibt<\/b>. <i>lest<\/i>, <i>fahrt<\/i> und <i>gebt<\/i> passen zu <i>ihr<\/i>, <i>fährst<\/i> und <i>gibst<\/i> passen zu <i>du<\/i>."},{"id":"gr-verben-06","typ":"eingabe","stufe":2,"kompetenz":"wortarten","frage":"Setze das Verb in der passenden Personalform ein. Der Satz steht in der Gegenwart.","vorgabe":"sehen → Felix ___ am Himmel einen Regenbogen.","loesungen":["sieht"],"tipp":"Felix ist eine Person, also <i>er<\/i>. Prüfe, ob sich bei <i>sehen<\/i> der Selbstlaut im Wortstamm ändert.","erklaerung":"Bei <i>sehen<\/i> wird in der er-Form aus dem <i>e<\/i> ein <i>ie<\/i>: Felix <b>sieht<\/b>. Das <i>h<\/i> aus dem Wortstamm bleibt erhalten."},{"id":"gr-verben-07","typ":"single","stufe":3,"kompetenz":"wortarten","frage":"Was ist der Wortstamm in <i>du wanderst<\/i>?","optionen":[{"text":"wander","richtig":true},{"text":"wand","richtig":false},{"text":"wanderst","richtig":false},{"text":"wandern","richtig":false}],"tipp":"Nimm die Personalendung weg. Welche Endung gehört zu <i>du<\/i>? Vergleiche auch mit <i>ich wandere<\/i> und <i>er wandert<\/i>.","erklaerung":"Bei <i>du<\/i> ist die Endung <i>-st<\/i>. Was übrig bleibt, ist der Wortstamm <i>wander<\/i>. Er steckt auch in <i>er wandert<\/i> und <i>wir wandern<\/i>."},{"id":"gr-verben-08","typ":"single","stufe":3,"kompetenz":"wortarten","frage":"In welchem Satz passt die Verbform zur Person?","optionen":[{"text":"Du trägst die schwere Kiste.","richtig":true},{"text":"Er tragt die schwere Kiste.","richtig":false},{"text":"Ihr trägt die schwere Kiste.","richtig":false},{"text":"Du tragst die schwere Kiste.","richtig":false}],"tipp":"Bilde zuerst die Formen von <i>fahren<\/i> mit <i>du<\/i>, <i>er<\/i> und <i>ihr<\/i>. <i>tragen<\/i> verhält sich genauso.","erklaerung":"Richtig ist <i>du trägst<\/i>. Außerdem heißt es <i>er trägt<\/i> und <i>ihr tragt<\/i>: Bei <i>ihr<\/i> bleibt das <i>a<\/i> aus der Grundform."}]},{"id":"gr-adjektive","titel":"Adjektive","kurz":"Eigenschaften beschreiben, steigern und vergleichen","kompetenz":"wortarten","wissen":{"merksatz":"<b>Adjektive<\/b> (Wiewörter) sagen, wie jemand oder etwas ist: <i>groß, leise, mutig<\/i>. Adjektive schreibt man klein. Die meisten Adjektive kann man <b>steigern<\/b>: <i>schnell – schneller – am schnellsten<\/i>.","punkte":["Adjektiv-Probe: Passt das Wort zwischen Artikel und Nomen? <i>der … Hund<\/i> → <i>der freche Hund<\/i>.","Es gibt drei Stufen: Grundstufe <i>klein<\/i>, Vergleichsstufe <i>kleiner<\/i>, Höchststufe <i>am kleinsten<\/i>. Oft kommt ein Umlaut dazu: <i>jung – jünger – am jüngsten<\/i>.","Manche Adjektive werden unregelmäßig gesteigert: <i>gut – besser – am besten<\/i> und <i>viel – mehr – am meisten<\/i>.","Vergleichen: Sind zwei gleich, sagt man <i>wie<\/i>: <i>so groß wie<\/i>. Sind sie verschieden, sagt man <i>als<\/i>: <i>größer als<\/i>.","Die Nachsilben <i>-ig, -lich, -isch<\/i> und <i>-bar<\/i> zeigen oft ein Adjektiv an: <i>lustig, ehrlich, neidisch, essbar<\/i>."],"beispiele":["leise – leiser – am leisesten","gut – besser – am besten","viel – mehr – am meisten","Mia ist so alt wie Ben.","Ben ist größer als Mia.","der Durst → durstig"]},"items":[{"id":"gr-adjektive-01","typ":"markieren","stufe":1,"kompetenz":"wortarten","frage":"Tippe alle Adjektive an.","teile":[{"t":"Auf"},{"t":"der"},{"t":"bunten","ziel":true},{"t":"Wiese"},{"t":"sitzt"},{"t":"der"},{"t":"kleine","ziel":true},{"t":"Hase"},{"t":"mit"},{"t":"langen","ziel":true},{"t":"Ohren"},{"t":".","fix":true}],"tipp":"Adjektive sagen, wie etwas ist. Frage: Wie ist die Wiese? Wie ist der Hase? Wie sind seine Ohren?","erklaerung":"<i>bunten<\/i>, <i>kleine<\/i> und <i>langen<\/i> beschreiben, wie die Wiese, der Hase und die Ohren sind. Es sind Adjektive. Sie stehen hier jeweils direkt vor einem Nomen."},{"id":"gr-adjektive-02","typ":"zuordnen","stufe":1,"kompetenz":"wortarten","frage":"In welcher Stufe steht das Adjektiv? Ordne zu.","gruppen":["Grundstufe","Vergleichsstufe","Höchststufe"],"elemente":[{"t":"leise","g":0},{"t":"kalt","g":0},{"t":"gut","g":0},{"t":"wärmer","g":1},{"t":"besser","g":1},{"t":"älter","g":1},{"t":"am schnellsten","g":2},{"t":"am meisten","g":2}],"tipp":"Die Vergleichsstufe endet meist auf <i>-er<\/i>. Vor der Höchststufe steht <i>am<\/i>.","erklaerung":"Grundstufe: leise, kalt, gut. Vergleichsstufe: wärmer, besser, älter. Höchststufe: am schnellsten, am meisten. <i>besser<\/i> und <i>am meisten<\/i> sind unregelmäßig gesteigert."},{"id":"gr-adjektive-03","typ":"luecke","stufe":1,"kompetenz":"wortarten","frage":"Welche Stufe passt in den Satz?","teile":[{"t":"Der Bleistift ist lang. Das Lineal ist "},{"wahl":["lang","länger","am längsten"],"loesung":1},{"t":" als der Bleistift. Das Maßband ist von allen drei Sachen "},{"wahl":["lang","länger","am längsten"],"loesung":2},{"t":"."}],"tipp":"Achte auf die Wörter rund um die Lücke: Steht danach <i>als<\/i>? Oder werden alle drei Sachen miteinander verglichen?","erklaerung":"Mit <i>als<\/i> vergleicht man zwei Dinge: <i>länger als<\/i> ist die Vergleichsstufe. Ist etwas von allen am längsten, braucht man die Höchststufe: <i>am längsten<\/i>."},{"id":"gr-adjektive-04","typ":"luecke","stufe":2,"kompetenz":"wortarten","frage":"Mit welcher Nachsilbe wird daraus ein Adjektiv? Wähle aus.","teile":[{"t":"Am Morgen war es noch sonn"},{"wahl":["ig","lich","isch","bar"],"loesung":0},{"t":", doch am Nachmittag wurde es stürm"},{"wahl":["ig","lich","isch","bar"],"loesung":2},{"t":". Unser Bergführer war sehr freund"},{"wahl":["ig","lich","isch","bar"],"loesung":1},{"t":". Er zeigte uns eine Quelle. Das Wasser dort ist trink"},{"wahl":["ig","lich","isch","bar"],"loesung":3},{"t":"."}],"tipp":"Sprich jedes Wort mit allen vier Nachsilben leise vor dich hin. Nur eine Möglichkeit ergibt ein echtes Wort.","erklaerung":"Es heißt <i>sonnig<\/i>, <i>stürmisch<\/i>, <i>freundlich<\/i> und <i>trinkbar<\/i>. Die Nachsilben machen aus <i>Sonne<\/i>, <i>Sturm<\/i>, <i>Freund<\/i> und <i>trinken<\/i> Adjektive."},{"id":"gr-adjektive-05","typ":"eingabe","stufe":2,"kompetenz":"wortarten","frage":"Setze das Adjektiv in der Vergleichsstufe ein.","vorgabe":"gut → Heute ist mein Bild viel ___ als gestern.","loesungen":["besser"],"tipp":"Achtung: <i>gut<\/i> wird unregelmäßig gesteigert. Hänge also nicht einfach <i>-er<\/i> an.","erklaerung":"Die Steigerung heißt <i>gut – besser – am besten<\/i>. Vor <i>als<\/i> steht die Vergleichsstufe: <i>besser als gestern<\/i>."},{"id":"gr-adjektive-06","typ":"matrix","stufe":2,"kompetenz":"wortarten","frage":"Ist der Vergleich richtig gebildet? Achte auf <i>als<\/i> und <i>wie<\/i>.","aussagen":[{"text":"Die Katze ist schneller als die Schildkröte.","richtig":true},{"text":"Mein Rucksack ist so schwer als deiner.","richtig":false},{"text":"Heute ist es kälter wie gestern.","richtig":false},{"text":"Der Kuchen schmeckt so gut wie bei Oma.","richtig":true}],"tipp":"Prüfe zuerst: Sind die beiden Dinge gleich oder verschieden? Schau dann, ob das Adjektiv in der Grundstufe oder in der Vergleichsstufe steht.","erklaerung":"Bei Gleichheit sagt man <i>so … wie<\/i>: so schwer wie, so gut wie. Bei einem Unterschied sagt man <i>als<\/i>: schneller als, kälter als. Falsch sind also <i>so schwer als<\/i> und <i>kälter wie<\/i>."},{"id":"gr-adjektive-07","typ":"multi","stufe":3,"kompetenz":"wortarten","frage":"Welche Steigerungen sind richtig?","optionen":[{"text":"gut – besser – am besten","richtig":true},{"text":"viel – mehr – am meisten","richtig":true},{"text":"alt – älter – am ältesten","richtig":true},{"text":"viel – mehr – am mehrsten","richtig":false},{"text":"gut – guter – am gutesten","richtig":false},{"text":"groß – größer – am größesten","richtig":false}],"tipp":"Sprich jede Reihe laut. Achte besonders auf die Höchststufe mit <i>am<\/i>.","erklaerung":"Richtig sind <i>gut – besser – am besten<\/i>, <i>viel – mehr – am meisten<\/i> und <i>alt – älter – am ältesten<\/i>. Falsch sind <i>am mehrsten<\/i>, <i>guter<\/i> und <i>am größesten<\/i>. Richtig heißt es <i>am meisten<\/i>, <i>besser<\/i> und <i>am größten<\/i>."},{"id":"gr-adjektive-08","typ":"markieren","stufe":3,"kompetenz":"wortarten","frage":"Tippe alle Adjektive an. Achtung: Nicht jedes Wort, das auf <i>-ig<\/i> endet, ist ein Adjektiv!","teile":[{"t":"Zum"},{"t":"Frühstück"},{"t":"isst"},{"t":"der"},{"t":"König"},{"t":"frisches","ziel":true},{"t":"Brot"},{"t":"mit"},{"t":"süßem","ziel":true},{"t":"Honig"},{"t":"und"},{"t":"ist"},{"t":"danach"},{"t":"sehr"},{"t":"fröhlich","ziel":true},{"t":".","fix":true}],"tipp":"Prüfe jedes Wort: Sagt es, wie jemand oder etwas ist? Passt es zwischen Artikel und Nomen, zum Beispiel <i>der … König<\/i>?","erklaerung":"<i>frisches<\/i>, <i>süßem<\/i> und <i>fröhlich<\/i> sagen, wie das Brot, der Honig und der König sind. <i>König<\/i> und <i>Honig<\/i> enden zwar auf <i>-ig<\/i>, sind aber Nomen. <i>sehr<\/i> verstärkt nur ein Adjektiv, ist aber selbst kein Adjektiv."}]},{"id":"gr-wortbildung","titel":"Wortbausteine und Wortfamilien","kurz":"Zusammengesetzte Nomen, Wortfamilien, Wortfelder, Vor- und Nachsilben","kompetenz":"wortbildung","wissen":{"merksatz":"Aus <b>Wortbausteinen<\/b> entstehen neue Wörter. Ein <b>zusammengesetztes Nomen<\/b> besteht aus <b>Bestimmungswort<\/b> und <b>Grundwort<\/b>. Das Grundwort steht hinten und bestimmt den Artikel: <i>das Haus + die Tür = die Haustür<\/i>. Wörter mit demselben Wortstamm bilden eine <b>Wortfamilie<\/b>.","punkte":["Das Bestimmungswort erklärt das Grundwort genauer: Eine <i>Haustür<\/i> ist eine Tür <b>am Haus<\/b>, ein <i>Türschloss<\/i> ist ein Schloss <b>an der Tür<\/b>.","Eine <b>Wortfamilie<\/b> hat einen gemeinsamen Wortstamm: <i>spielen, der Spieler, der Spielplatz, verspielt<\/i>. Manchmal ändert sich dabei ein Selbstlaut: <i>fahren – die Fähre<\/i>.","Zu einem <b>Wortfeld<\/b> gehören Wörter mit ähnlicher Bedeutung, aber verschiedenem Wortstamm: <i>sagen – flüstern, rufen, fragen<\/i>; <i>gehen – schleichen, rennen, bummeln<\/i>.","<b>Vorsilben<\/b> (Präfixe) stehen vorn und verändern die Bedeutung: <i>kaufen – verkaufen<\/i>, <i>decken – entdecken<\/i>, <i>freundlich – unfreundlich<\/i>.","<b>Nachsilben<
