\/b> (Suffixe) stehen hinten. Mit <i>-ung, -heit, -keit<\/i> und <i>-nis<\/i> entstehen Nomen: <i>die Hoffnung, die Freiheit, die Ehrlichkeit, das Ergebnis<\/i>.","Bei Verben fällt die Endung der Grundform weg: <i>wohnen → die Wohnung<\/i>, <i>erleben → das Erlebnis<\/i>. Nach <i>-ig<\/i>, <i>-lich<\/i> und <i>-bar<\/i> steht meist <i>-keit<\/i>: <i>die Fröhlichkeit<\/i>, <i>die Dankbarkeit<\/i>."],"beispiele":["der Apfel + der Saft = der Apfelsaft","das Haus + die Tür = die Haustür","Wortfamilie: spielen, Spieler, Spielplatz","Wortfeld sagen: flüstern, rufen, fragen","Vorsilbe: kaufen → verkaufen","Nachsilbe: frei → die Freiheit"]},"items":[{"id":"gr-wortbildung-01","typ":"markieren","stufe":1,"kompetenz":"wortbildung","frage":"Tippe alle zusammengesetzten Nomen an.","teile":[{"t":"Am"},{"t":"Wandertag","ziel":true},{"t":"packt"},{"t":"Noah"},{"t":"eine"},{"t":"Wasserflasche","ziel":true},{"t":",","fix":true},{"t":"einen"},{"t":"Apfel"},{"t":"und"},{"t":"seine"},{"t":"Regenjacke","ziel":true},{"t":"in"},{"t":"die"},{"t":"Tasche"},{"t":".","fix":true}],"tipp":"Suche zuerst alle Nomen. Prüfe dann bei jedem: Stecken darin zwei Wörter, so wie in <i>Schnee + Mann<\/i>?","erklaerung":"<i>Wandertag<\/i> (wandern + Tag), <i>Wasserflasche<\/i> (Wasser + Flasche) und <i>Regenjacke<\/i> (Regen + Jacke) sind zusammengesetzt. <i>Apfel<\/i>, <i>Tasche<\/i> und <i>Noah<\/i> kann man nicht zerlegen."},{"id":"gr-wortbildung-02","typ":"luecke","stufe":1,"kompetenz":"wortbildung","frage":"Welcher Artikel passt zum zusammengesetzten Nomen?","teile":[{"t":"Bei Oma blüht "},{"wahl":["der","die","das"],"loesung":0},{"t":" Kirschbaum. "},{"wahl":["Der","Die","Das"],"loesung":1},{"t":" Gartentür steht offen. "},{"wahl":["Der","Die","Das"],"loesung":2},{"t":" Vogelhaus hängt am Zaun."}],"tipp":"Zerlege jedes Nomen in seine zwei Teile. Welcher der beiden Teile bestimmt den Artikel?","erklaerung":"Der Artikel richtet sich nach dem Grundwort, also nach dem hinteren Wort: <i>der Baum → der Kirschbaum<\/i>, <i>die Tür → die Gartentür<\/i>, <i>das Haus → das Vogelhaus<\/i>."},{"id":"gr-wortbildung-03","typ":"zuordnen","stufe":1,"kompetenz":"wortbildung","frage":"Zu welchem Wortfeld gehört das Verb? Ordne zu.","gruppen":["Wortfeld sagen","Wortfeld gehen"],"elemente":[{"t":"brüllen","g":0},{"t":"murmeln","g":0},{"t":"antworten","g":0},{"t":"erzählen","g":0},{"t":"schlendern","g":1},{"t":"wandern","g":1},{"t":"stapfen","g":1},{"t":"eilen","g":1}],"tipp":"Stell dir vor, wie jemand das macht: Braucht er dafür vor allem den Mund oder die Beine?","erklaerung":"<i>brüllen, murmeln, antworten<\/i> und <i>erzählen<\/i> sind verschiedene Arten zu sprechen. <i>schlendern, wandern, stapfen<\/i> und <i>eilen<\/i> sind verschiedene Arten, sich zu Fuß fortzubewegen."},{"id":"gr-wortbildung-04","typ":"single","stufe":2,"kompetenz":"wortbildung","frage":"Was ist eine <i>Topfblume<\/i>?","optionen":[{"text":"eine Blume, die in einem Topf wächst","richtig":true},{"text":"ein Topf, in den man Blumen pflanzt","richtig":false},{"text":"ein Topf mit einem bunten Blumenmuster","richtig":false},{"text":"ein Topf, der wie eine Blume aussieht","richtig":false}],"tipp":"Welches Wort steht hinten? Das Grundwort sagt dir, was für ein Ding gemeint ist.","erklaerung":"Das Grundwort steht hinten: <i>Blume<\/i>. Eine Topfblume ist also eine Blume, und das Bestimmungswort <i>Topf<\/i> sagt, wo sie wächst. Ein Topf für Blumen heißt umgekehrt <i>Blumentopf<\/i>."},{"id":"gr-wortbildung-05","typ":"multi","stufe":2,"kompetenz":"wortbildung","frage":"Welche Wörter gehören zur Wortfamilie <i>fahren<\/i>?","optionen":[{"text":"der Beifahrer","richtig":true},{"text":"die Abfahrt","richtig":true},{"text":"das Fahrrad","richtig":true},{"text":"die Farbe","richtig":false},{"text":"die Fahne","richtig":false},{"text":"der Pfarrer","richtig":false}],"tipp":"Suche in jedem Wort den Wortstamm <i>fahr<\/i>. Klingt ein Wort nur ähnlich, gehört es nicht dazu.","erklaerung":"In <i>Beifahrer<\/i>, <i>Abfahrt<\/i> und <i>Fahrrad<\/i> steckt der Wortstamm <i>fahr<\/i>. <i>Farbe<\/i>, <i>Fahne<\/i> und <i>Pfarrer<\/i> klingen nur ähnlich, mit <i>fahren<\/i> haben sie nichts zu tun."},{"id":"gr-wortbildung-06","typ":"luecke","stufe":2,"kompetenz":"wortbildung","frage":"Welche Vorsilbe passt? Wähle aus.","teile":[{"t":"Gestern ist Amiras Katze aus dem Garten "},{"wahl":["ver","ent","be"],"loesung":1},{"t":"laufen. Bei der Suche im Nebel haben sich Amira und ihr Bruder fast selbst "},{"wahl":["ver","ent","be"],"loesung":0},{"t":"laufen. Am Abend saß die Katze vor der Tür und wartete "},{"wahl":["un","ver","ent"],"loesung":0},{"t":"geduldig auf ihr Futter."}],"tipp":"Lies den ganzen Satz mit jeder Vorsilbe. Welches Wort gibt es wirklich, und welches passt zum Sinn?","erklaerung":"Die Katze ist <i>entlaufen<\/i>: Sie ist weggelaufen. Amira und ihr Bruder hätten sich fast <i>verlaufen<\/i>: Sie hätten beinahe den Weg nicht mehr gefunden. Das Wort <i>ungeduldig<\/i> bedeutet „nicht geduldig“ – die Vorsilbe verändert die Bedeutung."},{"id":"gr-wortbildung-07","typ":"matrix","stufe":3,"kompetenz":"wortbildung","frage":"Lies jede Aussage genau. Ist sie richtig oder falsch?","aussagen":[{"text":"Es heißt <i>die Apfelsaftflasche<\/i>, weil das Grundwort <i>die Flasche<\/i> ist.","richtig":true},{"text":"Bei <i>Haustür<\/i> ist <i>Haus<\/i> das Grundwort.","richtig":false},{"text":"<i>murmeln<\/i>, <i>schreien<\/i> und <i>fragen<\/i> gehören zu einer Wortfamilie.","richtig":false},{"text":"<i>backen<\/i>, <i>der Bäcker<\/i> und <i>das Gebäck<\/i> gehören zu einer Wortfamilie.","richtig":true}],"tipp":"Bei einer Wortfamilie steckt in allen Wörtern derselbe Wortstamm. Bei einem Wortfeld haben die Wörter nur eine ähnliche Bedeutung. Und: Wo steht das Grundwort?","erklaerung":"Das Grundwort steht immer hinten: Bei <i>Apfelsaftflasche<\/i> ist es <i>Flasche<\/i>, bei <i>Haustür<\/i> ist es <i>Tür<\/i>. <i>murmeln, schreien, fragen<\/i> sind ein Wortfeld, weil sie Ähnliches bedeuten. In <i>backen, Bäcker, Gebäck<\/i> steckt derselbe Wortstamm <i>back<\/i>, manchmal mit <i>ä<\/i>."},{"id":"gr-wortbildung-08","typ":"zuordnen","stufe":3,"kompetenz":"wortbildung","frage":"Mit welcher Nachsilbe wird aus dem Wort ein Nomen? Ordne zu.","gruppen":["-heit","-keit","-ung","-nis"],"elemente":[{"t":"frech","g":0},{"t":"krank","g":0},{"t":"freundlich","g":1},{"t":"dankbar","g":1},{"t":"üben","g":2},{"t":"wandern","g":2},{"t":"erlauben","g":3},{"t":"geheim","g":3}],"tipp":"Hänge jede Nachsilbe probeweise an und sprich das neue Wort laut. Bei Verben lässt du vorher die Endung der Grundform weg. Nur eine Nachsilbe ergibt ein echtes Nomen.","erklaerung":"Es heißt: die Frechheit, die Krankheit – die Freundlichkeit, die Dankbarkeit – die Übung, die Wanderung – die Erlaubnis, das Geheimnis. Nach <i>-lich<\/i> und <i>-bar<\/i> steht <i>-keit<\/i>. Alle neuen Wörter sind Nomen und werden großgeschrieben."}]},{"id":"gr-zeiten","titel":"Zeitformen","kurz":"Präsens, Präteritum, Perfekt und Futur","kompetenz":"zeitformen","wissen":{"merksatz":"Die <b>Zeitform<\/b> erkennst du an der Verbform. Sie zeigt dir meistens, <b>wann<\/b> etwas passiert: jetzt, früher oder später.","punkte":["<b>Präsens<\/b> (Gegenwart): Es passiert jetzt oder immer wieder. Beispiel: <i>Lena liest.<\/i> Mit einem Signalwort kann man im Präsens auch über die Zukunft sprechen: <i>Am Freitag spielen wir Theater.<\/i>","<b>Präteritum<\/b> (1. Vergangenheit): Es ist vorbei. Man benutzt es vor allem in geschriebenen Texten wie Erzählungen. Beispiel: <i>Lena las.<\/i>","<b>Perfekt<\/b> (2. Vergangenheit): Es ist vorbei. Man benutzt es vor allem beim mündlichen Erzählen. Es besteht aus einer Form von <i>haben<\/i> oder <i>sein<\/i> und dem <b>Partizip<\/b>. Das Partizip ist eine Verbform wie <i>gelesen<\/i>, <i>gespielt<\/i> oder <i>gerannt<\/i>. Beispiele: <i>Lena hat gelesen. Lena ist gerannt.<\/i>","<b>Futur<\/b> (Zukunft): Es passiert später. Es besteht aus einer Form von <i>werden<\/i> und der Grundform. Beispiel: <i>Lena wird lesen.<\/i>","<b>Schwache Verben<\/b> bekommen im Präteritum <i>-te<\/i>: <i>spielen – spielte – hat gespielt<\/i>. <b>Starke Verben<\/b> ändern im Präteritum ihren Vokal: <i>gehen – ging – ist gegangen<\/i>. Manche Verben machen beides: <i>rennen – rannte – ist gerannt<\/i>, <i>kennen – kannte – hat gekannt<\/i>.","Signalwörter wie <i>gestern<\/i>, <i>jetzt<\/i> oder <i>morgen<\/i> verraten dir, <b>wann<\/b> etwas passiert. Welche Zeitform ein Satz hat, erkennst du aber immer an der Verbform."],"beispiele":["Präsens: ich spiele, er geht","Präteritum: ich spielte, er ging","Perfekt: ich habe gespielt, er ist gegangen","Futur: ich werde spielen, er wird gehen","schreiben – schrieb – hat geschrieben"]},"items":[{"id":"gr-zeiten-01","typ":"single","stufe":1,"kompetenz":"zeitformen","frage":"In welcher Zeitform steht dieser Satz?","vorgabe":"Sofia hat im Freibad einen Kopfsprung gemacht.","optionen":[{"text":"Präsens","richtig":false},{"text":"Präteritum","richtig":false},{"text":"Perfekt","richtig":true},{"text":"Futur","richtig":false}],"tipp":"Schau dir das Verb genau an. Besteht es aus einem Teil oder aus zwei Teilen? Steckt eine Form von <i>haben<\/i>, <i>sein<\/i> oder <i>werden<\/i> darin?","erklaerung":"Das Prädikat <i>hat … gemacht<\/i> besteht aus einer Form von <i>haben<\/i> und dem Partizip. Das ist das Perfekt."},{"id":"gr-zeiten-02","typ":"zuordnen","stufe":1,"kompetenz":"zeitformen","frage":"Signalwörter verraten dir die Zeit. Sortiere sie.","gruppen":["Vergangenheit","Gegenwart","Zukunft"],"elemente":[{"t":"gestern","g":0},{"t":"letzte Woche","g":0},{"t":"vor zwei Tagen","g":0},{"t":"jetzt","g":1},{"t":"im Moment","g":1},{"t":"morgen","g":2},{"t":"übermorgen","g":2},{"t":"nächsten Sommer","g":2}],"tipp":"Frage dich bei jedem Wort: Ist das schon vorbei, passiert es gerade oder kommt es erst noch?","erklaerung":"Die Signalwörter <i>gestern<\/i>, <i>letzte Woche<\/i> und <i>vor zwei Tagen<\/i> zeigen, dass etwas vorbei ist. Bei <i>jetzt<\/i> und <i>im Moment<\/i> passiert etwas gerade. Bei <i>morgen<\/i>, <i>übermorgen<\/i> und <i>nächsten Sommer<\/i> geht es um die Zukunft."},{"id":"gr-zeiten-03","typ":"luecke","stufe":1,"kompetenz":"zeitformen","frage":"Achte auf die Signalwörter. Wähle die passende Verbform.","teile":[{"t":"Letzten Sommer "},{"wahl":["schwamm","schwimmt","schwimmte"],"loesung":0},{"t":" Leyla im Badesee. Jetzt "},{"wahl":["schwamm","schwimmt","schwomm"],"loesung":1},{"t":" sie im Hallenbad. Nächstes Jahr "},{"wahl":["hat","wurde","wird"],"loesung":2},{"t":" sie den Freischwimmer machen."}],"tipp":"Suche zuerst die Signalwörter. Sagen sie dir: vorbei, jetzt oder später? Prüfe auch, ob es die Verbform wirklich gibt.","erklaerung":"<i>Letzten Sommer<\/i> → Präteritum: <i>schwamm<\/i> (die Formen „schwimmte“ und „schwomm“ gibt es nicht). <i>Jetzt<\/i> → Präsens: <i>schwimmt<\/i>. <i>Nächstes Jahr<\/i> → Futur mit <i>werden<\/i>: <i>wird … machen<\/i>."},{"id":"gr-zeiten-04","typ":"eingabe","stufe":2,"kompetenz":"zeitformen","frage":"Setze das Verb <i>finden<\/i> ins Präteritum und tippe es ein.","vorgabe":"Beim Wandertag ___ Ben eine Vogelfeder.","loesungen":["fand"],"tipp":"Sprich den Satz mit <i>gestern<\/i>: „Gestern … Ben eine Feder.“ Achtung: <i>finden<\/i> ist ein starkes Verb und bekommt im Präteritum kein <i>-te<\/i>.","erklaerung":"Das Verb <i>finden<\/i> ist stark: <i>finden – fand – hat gefunden<\/i>. Im Präteritum heißt es also <i>fand<\/i>, nicht „findete“."},{"id":"gr-zeiten-05","typ":"multi","stufe":2,"kompetenz":"zeitformen","frage":"In welche Sätze gehört <i>ist<\/i>? Die anderen brauchen <i>hat<\/i>.","optionen":[{"text":"Der Apfel ___ vom Baum gefallen.","richtig":true},{"text":"Amira ___ ein spannendes Buch gelesen.","richtig":false},{"text":"Ben ___ den Gartenzaun gestrichen.","richtig":false},{"text":"Der Zug ___ pünktlich angekommen.","richtig":true},{"text":"Die Katze ___ ihre Milch getrunken.","richtig":false},{"text":"Das Baby ___ endlich eingeschlafen.","richtig":true}],"tipp":"Sprich jeden Satz einmal mit <i>ist<\/i> und einmal mit <i>hat<\/i>. Verben, die eine Bewegung zu einem anderen Ort oder eine Veränderung ausdrücken, bilden das Perfekt oft mit <i>sein<\/i>.","erklaerung":"Die Verben <i>fallen<\/i>, <i>ankommen<\/i> und <i>einschlafen<\/i> bilden das Perfekt mit <i>sein<\/i>. Sie drücken eine Bewegung oder eine Veränderung aus. Die Verben <i>lesen<\/i>, <i>streichen<\/i> und <i>trinken<\/i> bilden es mit <i>haben<\/i>."},{"id":"gr-zeiten-06","typ":"markieren","stufe":2,"kompetenz":"zeitformen","frage":"Markiere alle Verben, die im Präteritum stehen.","teile":[{"t":"Am Samstag"},{"t":"besuchte","ziel":true},{"t":"Hannah"},{"t":"den Christkindlmarkt"},{"t":".","fix":true},{"t":"Es"},{"t":"war","ziel":true},{"t":"sehr voll"},{"t":".","fix":true},{"t":"Sie"},{"t":"trank","ziel":true},{"t":"einen Kinderpunsch"},{"t":".","fix":true},{"t":"Heute"},{"t":"erzählt"},{"t":"sie"},{"t":"Luca"},{"t":"davon"},{"t":":","fix":true},{"t":"„","fix":true},{"t":"Ich"},{"t":"habe"},{"t":"eine Krippe"},{"t":"gesehen"},{"t":"!“","fix":true}],"tipp":"Suche zuerst alle Verben. Prüfe dann bei jedem: Steht es allein und erzählt es von etwas, das schon vorbei ist?","erklaerung":"Die Formen <i>besuchte<\/i>, <i>war<\/i> und <i>trank<\/i> stehen im Präteritum. Die Form <i>erzählt<\/i> ist Präsens. Mit <i>habe … gesehen<\/i> spricht Hannah im Perfekt – so erzählt man meistens mündlich."},{"id":"gr-zeiten-07","typ":"matrix","stufe":3,"kompetenz":"zeitformen","frage":"Stimmt die Zeitform? Entscheide bei jedem Satz.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Der Satz „Der Wind wehte die ganze Nacht“ steht im Perfekt.","richtig":false},{"text":"Der Satz „Morgen fährt Emir ins Schullandheim“ steht im Präsens.","richtig":true},{"text":"Der Satz „Die Kinder werden im Zelt schlafen“ steht im Futur.","richtig":true},{"text":"Der Satz „Wir sind gestern lange wach geblieben“ steht im Präteritum.","richtig":false}],"tipp":"Achte nur auf die Verbform, nicht auf Wörter wie <i>morgen<\/i> oder <i>gestern<\/i>. Aus wie vielen Teilen besteht das Prädikat, und welche Teile sind es?","erklaerung":"Die Form <i>wehte<\/i> ist Präteritum. Die Form <i>fährt<\/i> ist Präsens – zusammen mit <i>morgen<\/i> spricht sie über die Zukunft. Dagegen ist <i>werden … schlafen<\/i> Futur und <i>sind … geblieben<\/i> Perfekt."},{"id":"gr-zeiten-08","typ":"single","stufe":3,"kompetenz":"zeitformen","frage":"In welcher Reihe sind alle drei Verbformen richtig?","optionen":[{"text":"bringen – bringte – hat gebracht","richtig":false},{"text":"schwimmen – schwomm – ist geschwommen","richtig":false},{"text":"denken – dachte – hat gedenkt","richtig":false},{"text":"trinken – trank – hat getrunken","richtig":true}],"tipp":"Prüfe jede Form mit einem kleinen Satz: „Heute …“ – „Gestern …“ – „Ich habe …“ oder „Ich bin …“. In drei Reihen steckt je ein Fehler.","erklaerung":"Nur <i>trinken – trank – hat getrunken<\/i> stimmt ganz. Richtig heißt es: <i>bringen – brachte<\/i>, <i>schwimmen – schwamm<\/i> und <i>denken – hat gedacht<\/i>."}]},{"id":"gr-satzglieder","titel":"Satzglieder","kurz":"Umstellprobe, Subjekt und Prädikat","kompetenz":"satzglieder","wissen":{"merksatz":"Stelle einen Satz um, ohne dass er seinen Sinn verliert. Wörter, die dabei immer zusammenbleiben, bilden ein <b>Satzglied<\/b>.","punkte":["Ein Satzglied kann aus einem Wort oder aus mehreren Wörtern bestehen: <i>Mia<\/i> oder <i>meine beste Freundin Mia<\/i>.","Das <b>Prädikat<\/b> (Satzkern) sagt, was jemand tut oder was geschieht. Im Aussagesatz steht das Prädikat (oder sein erster Teil) immer als zweites Satzglied.","Das Prädikat kann aus zwei Teilen bestehen. Sie bilden eine Klammer um andere Satzglieder: <i>Ben <b>ruft<\/b> seine Oma <b>an<\/b>.<\/i> <i>Lena <b>hat<\/b> ein Bild <b>gemalt<\/b>.<\/i>","Das <b>Subjekt<\/b> (Satzgegenstand) findest du mit der Frage <i>Wer oder was …?<\/i> und dem Prädikat: <i>Wer oder was bellt?<\/i> → <i>der Hund<\/i>.","Subjekt und Prädikat passen immer zusammen: <i>Der Hund bellt.<\/i> – <i>Die Hunde bellen.<\/i>"],"beispiele":["Der Hausmeister | repariert | heute | die Schaukel.","Heute | repariert | der Hausmeister | die Schaukel.","Die Schaukel | repariert | der Hausmeister | heute.","Wer oder was repariert? → der Hausmeister","zweiteilige Prädikate: ruft … an, hat … gemalt"]},"items":[{"id":"gr-satzglieder-01","typ":"markieren","stufe":1,"kompetenz":"satzglieder","frage":"Markiere das Subjekt.","teile":[{"t":"Im Herbst"},{"t":"sammelt"},{"t":"der kleine Igel","ziel":true},{"t":"Laub"},{"t":"für sein Nest"},{"t":".","fix":true}],"tipp":"Stelle die Frage <i>Wer oder was …?<\/i> und setze das Prädikat ein.","erklaerung":"<i>Wer oder was sammelt Laub?<\/i> – <i>der kleine Igel<\/i>. Das Subjekt steht hier nicht am Anfang, sondern nach dem Prädikat."},{"id":"gr-satzglieder-02","typ":"eingabe","stufe":1,"kompetenz":"satzglieder","frage":"Wie viele Satzglieder hat dieser Satz? Mach die Umstellprobe und tippe die Zahl ein.","vorgabe":"Meine große Schwester backt am Wochenende einen Apfelkuchen.","loesungen":["4","vier","Vier"],"tipp":"Stelle den Satz mehrmals um. Beginne zum Beispiel mit <i>Am Wochenende …<\/i>. Zähle dann die Wortgruppen, die immer zusammenbleiben.","erklaerung":"<i>Meine große Schwester | backt | am Wochenende | einen Apfelkuchen<\/i>: Das sind 4 Satzglieder. Probe: <i>Einen Apfelkuchen backt meine große Schwester am Wochenende.<\/i>"},{"id":"gr-satzglieder-03","typ":"luecke","stufe":1,"kompetenz":"satzglieder","frage":"Subjekt und Prädikat müssen zusammenpassen. Wähle die richtige Verbform.","teile":[{"t":"In der Pause "},{"wahl":["spielen","spielt","spielst"],"loesung":0},{"t":" die Kinder Fangen. Der Hausmeister "},{"wahl":["schaut","schauen","schaust"],"loesung":0},{"t":" ihnen dabei zu."}],"tipp":"Suche zuerst das Subjekt. Steht es in der Einzahl oder in der Mehrzahl?","erklaerung":"Das Subjekt <i>die Kinder<\/i> steht in der Mehrzahl, also <i>spielen<\/i>. Das Subjekt <i>der Hausmeister<\/i> steht in der Einzahl, also <i>schaut … zu<\/i>."},{"id":"gr-satzglieder-04","typ":"markieren","stufe":2,"kompetenz":"satzglieder","frage":"Markiere in beiden Sätzen alle Teile des Prädikats.","teile":[{"t":"Lena"},{"t":"hat","ziel":true},{"t":"in der Pause"},{"t":"ein Pferd"},{"t":"gemalt","ziel":true},{"t":".","fix":true},{"t":"Danach"},{"t":"räumt","ziel":true},{"t":"sie"},{"t":"ihre Stifte"},{"t":"auf","ziel":true},{"t":".","fix":true}],"tipp":"Ein Prädikat kann aus zwei Teilen bestehen. Der zweite Teil steht dann oft ganz am Ende des Satzes.","erklaerung":"Im ersten Satz heißt das Prädikat <i>hat … gemalt<\/i>, im zweiten <i>räumt … auf<\/i>. Die beiden Teile bilden jeweils eine Klammer um die anderen Satzglieder."},{"id":"gr-satzglieder-05","typ":"multi","stufe":2,"kompetenz":"satzglieder","frage":"Emir hat mit diesem Satz die Umstellprobe gemacht. Welche Wortgruppen sind vollständige Satzglieder?","vorgabe":"Die Kinder der 4b besuchen am Freitag das Naturkundemuseum. → Am Freitag besuchen die Kinder der 4b das Naturkundemuseum. → Das Naturkundemuseum besuchen die Kinder der 4b am Freitag.","optionen":[{"text":"die Kinder","richtig":false},{"text":"die Kinder der 4b","richtig":true},{"text":"am Freitag das Naturkundemuseum","richtig":false},{"text":"am Freitag","richtig":true},{"text":"der 4b","richtig":false},{"text":"das Naturkundemuseum","richtig":true}],"tipp":"Prüfe jede Wortgruppe: Bleibt sie in allen drei Sätzen genau so zusammen? Fehlt ihr etwas, das immer dabeisteht?","erklaerung":"Die Wortgruppen <i>die Kinder der 4b<\/i>, <i>am Freitag<\/i> und <i>das Naturkundemuseum<\/i> bleiben beim Umstellen immer zusammen. Dagegen sind <i>die Kinder<\/i> und <i>der 4b<\/i> nur Teile eines Satzglieds. Im zweiten Satz werden <i>am Freitag<\/i> und <i>das Naturkundemuseum<\/i> getrennt – es sind also zwei Satzglieder."},{"id":"gr-satzglieder-06","typ":"zuordnen","stufe":2,"kompetenz":"satzglieder","frage":"Ordne die Teile des Satzes richtig zu.","vorgabe":"Morgen früh holt Opa Franz die Kinder mit dem Traktor ab.","gruppen":["Subjekt","Prädikat","anderes Satzglied"],"elemente":[{"t":"Morgen früh","g":2},{"t":"holt","g":1},{"t":"Opa Franz","g":0},{"t":"die Kinder","g":2},{"t":"mit dem Traktor","g":2},{"t":"ab","g":1}],"tipp":"Frage: <i>Wer oder was holt ab?<\/i> Achte darauf, ob <i>holt<\/i> zu einer Person oder zu mehreren passt.","erklaerung":"Das Prädikat ist zweiteilig: <i>holt … ab<\/i>. <i>Wer holt ab?<\/i> – <i>Opa Franz<\/i>, denn <i>holt<\/i> passt nur zur Einzahl. <i>Morgen früh<\/i>, <i>die Kinder<\/i> und <i>mit dem Traktor<\/i> sind weitere Satzglieder."},{"id":"gr-satzglieder-07","typ":"single","stufe":3,"kompetenz":"satzglieder","frage":"Was ist das Subjekt dieses Satzes?","vorgabe":"Dem kleinen Luca gefallen die bunten Herbstblätter besonders gut.","optionen":[{"text":"Dem kleinen Luca","richtig":false},{"text":"die bunten Herbstblätter","richtig":true},{"text":"besonders gut","richtig":false},{"text":"Der Satz hat kein Subjekt.","richtig":false}],"tipp":"Frage genau: <i>Wer oder was gefällt …?<\/i> Prüfe auch, ob die Verbform <i>gefallen<\/i> zur Einzahl oder zur Mehrzahl passt.","erklaerung":"<i>Wer oder was gefällt Luca?<\/i> – <i>die bunten Herbstblätter<\/i>. Die Verbform <i>gefallen<\/i> steht in der Mehrzahl und passt zu ihnen. Nach <i>dem kleinen Luca<\/i> fragt man mit <i>Wem?<\/i> – das ist kein Subjekt."},{"id":"gr-satzglieder-08","typ":"matrix","stufe":3,"kompetenz":"satzglieder","frage":"Lies den Satz. Stimmen die Aussagen?","vorgabe":"Gestern Nachmittag hat Opa mit Felix einen Drachen gebaut.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Das Prädikat besteht aus zwei Teilen: <i>hat<\/i> und <i>gebaut<\/i>.","richtig":true},{"text":"Die Wörter <i>Gestern Nachmittag<\/i> bilden zusammen ein Satzglied.","richtig":true},{"text":"Das Subjekt ist <i>Felix<\/i>.","richtig":false},{"text":"Die Wörter <i>einen Drachen gebaut<\/i> bilden zusammen ein Satzglied.","richtig":false}],"tipp":"Mach die Umstellprobe: Beginne den Satz mit <i>Opa<\/i> oder mit <i>Einen Drachen<\/i>. Was bleibt zusammen, was wandert an eine andere Stelle?","erklaerung":"Das Prädikat <i>hat … gebaut<\/i> ist zweiteilig, und <i>Gestern Nachmittag<\/i> bleibt beim Umstellen zusammen. <i>Wer hat gebaut?<\/i> – <i>Opa<\/i>, nicht Felix. Das Wort <i>gebaut<\/i> gehört zum Prädikat, nicht zu <i>einen Drachen<\/i>."}]},{"id":"gr-objekte","titel":"Objekte, Orts- und Zeitangaben","kurz":"Wem? Wen oder was? Wo? Wann?","kompetenz":"satzglieder","wissen":{"merksatz":"Die richtige Frage verrät dir das Satzglied: <i>Wem?<\/i> → Dativobjekt, <i>Wen oder was?<\/i> → Akkusativobjekt, <i>Wo? Wohin? Woher?<\/i> → Ortsangabe, <i>Wann? Wie lange? Seit wann? Wie oft?<\/i> → Zeitangabe.","punkte":["Das <b>Dativobjekt<\/b> erfragst du mit <i>Wem?<\/i> Beispiel: Emir schenkt <i>seiner Schwester<\/i> ein Buch.","Das <b>Akkusativobjekt<\/b> erfragst du mit <i>Wen oder was?<\/i> Beispiel: Emir schenkt seiner Schwester <i>ein Buch<\/i>.","Die <b>Ortsangabe<\/b> erfragst du mit <i>Wo?<\/i>, <i>Wohin?<\/i> oder <i>Woher?<\/i> Beispiel: Wir treffen uns <i>am Brunnen<\/i>.","Die <b>Zeitangabe<\/b> erfragst du mit <i>Wann?<\/i>, <i>Wie lange?<\/i>, <i>Seit wann?<\/i> oder <i>Wie oft?<\/i> Beispiel: <i>Am Freitag<\/i> ist Wandertag.","Das Prädikat bestimmt, welches Objekt ein Satz braucht: <i>Ben folgt seinem Hund.<\/i> (Wem?) – <i>Ben sucht seinen Hund.<\/i> (Wen?) Orts- und Zeitangaben kannst du meist ergänzen oder weglassen."],"beispiele":["Die Lehrerin gibt <i>dem Jungen<\/i> ein Heft. → Wem? Dativobjekt","Mia füttert <i>die Katze<\/i>. → Wen oder was? Akkusativobjekt","Die Katze schläft <i>im Körbchen<\/i>. → Wo? Ortsangabe","Wir fahren <i>ins Schullandheim<\/i>. → Wohin? Ortsangabe","Wir bleiben <i>drei Tage<\/i>. → Wie lange? Zeitangabe"]},"items":[{"id":"gr-objekte-01","typ":"multi","stufe":1,"kompetenz":"satzglieder","frage":"Welche Wortgruppen sind Zeitangaben?","optionen":[{"text":"am Freitag","richtig":true},{"text":"im Schwimmbad","richtig":false},{"text":"drei Stunden lang","richtig":true},{"text":"seinem Bruder","richtig":false},{"text":"unter dem Bett","richtig":false},{"text":"nach dem Frühstück","richtig":true}],"tipp":"Probiere bei jeder Wortgruppe die Fragen <i>Wann?<\/i> und <i>Wie lange?<\/i> aus.","erklaerung":"Die Wortgruppen <i>am Freitag<\/i> und <i>nach dem Frühstück<\/i> sagen, wann etwas passiert. Die Wortgruppe <i>drei Stunden lang<\/i> sagt, wie lange es dauert. Dagegen sind <i>im Schwimmbad<\/i> und <i>unter dem Bett<\/i> Ortsangaben, und <i>seinem Bruder<\/i> ist ein Dativobjekt."},{"id":"gr-objekte-02","typ":"single","stufe":1,"kompetenz":"satzglieder","frage":"Welches Satzglied ist fett gedruckt?","vorgabe":"Aylin hilft <b>ihrem Opa<\/b> im Garten.","optionen":[{"text":"Akkusativobjekt","richtig":false},{"text":"Subjekt","richtig":false},{"text":"Dativobjekt","richtig":true},{"text":"Ortsangabe","richtig":false}],"tipp":"Bilde eine Frage nach dem fett gedruckten Satzglied. Beginnt sie mit <i>Wer<\/i>, <i>Wem<\/i>, <i>Wen<\/i> oder <i>Wo<\/i>?","erklaerung":"Du fragst: <i>Wem hilft Aylin im Garten?<\/i> – <i>ihrem Opa<\/i>. Mit <i>Wem?<\/i> fragt man nach dem Dativobjekt."},{"id":"gr-objekte-03","typ":"markieren","stufe":1,"kompetenz":"satzglieder","frage":"Markiere die Ortsangabe.","teile":[{"t":"Nach dem Unterricht"},{"t":"spielen"},{"t":"die Kinder"},{"t":"auf dem Bolzplatz","ziel":true},{"t":"Fußball"},{"t":".","fix":true}],"tipp":"Welche Wortgruppe antwortet auf die Frage <i>Wo?<\/i>","erklaerung":"<i>Wo spielen die Kinder Fußball?<\/i> – <i>auf dem Bolzplatz<\/i>. <i>Nach dem Unterricht<\/i> ist eine Zeitangabe (Wann?)."},{"id":"gr-objekte-04","typ":"zuordnen","stufe":2,"kompetenz":"satzglieder","frage":"Sortiere die Satzglieder aus den beiden Sätzen.","vorgabe":"Am Sonntag schenkt Leyla ihrem Bruder im Garten einen Fußball. Nach dem Spiel bringt Papa den Kindern Limonade auf die Terrasse.","gruppen":["Dativobjekt","Akkusativobjekt","Ortsangabe","Zeitangabe"],"elemente":[{"t":"Am Sonntag","g":3},{"t":"ihrem Bruder","g":0},{"t":"im Garten","g":2},{"t":"einen Fußball","g":1},{"t":"Nach dem Spiel","g":3},{"t":"den Kindern","g":0},{"t":"Limonade","g":1},{"t":"auf die Terrasse","g":2}],"tipp":"Stelle zu jedem Satzglied eine Frage mit dem Prädikat: <i>Wem …?<\/i>, <i>Wen oder was …?<\/i>, <i>Wo oder wohin …?<\/i> oder <i>Wann …?<\/i>","erklaerung":"<i>Wem?<\/i> – ihrem Bruder, den Kindern. <i>Wen oder was?<\/i> – einen Fußball, Limonade. <i>Wo oder wohin?<\/i> – im Garten, auf die Terrasse. <i>Wann?<\/i> – am Sonntag, nach dem Spiel. Achtung: <i>den Kindern<\/i> antwortet auf <i>Wem?<\/i>, obwohl <i>den<\/i> davorsteht."},{"id":"gr-objekte-05","typ":"luecke","stufe":2,"kompetenz":"satzglieder","frage":"Das Prädikat bestimmt, welches Objekt folgt. Wähle die richtige Form.","teile":[{"t":"Am Samstag gratuliert Mateo "},{"wahl":["seinen","seinem"],"loesung":1},{"t":" Opa zum Geburtstag. Danach fährt er mit dem Bus in die Stadt und dankt beim Aussteigen "},{"wahl":["dem","den"],"loesung":0},{"t":" Busfahrer. Dort besucht er "},{"wahl":["seiner","seine"],"loesung":1},{"t":" Tante."}],"tipp":"Bilde mit jedem Prädikat eine Frage. Klingt sie mit <i>Wem<\/i> oder mit <i>Wen<\/i> richtig?","erklaerung":"Die Verben <i>gratulieren<\/i> und <i>danken<\/i> brauchen ein Dativobjekt (Wem?): <i>seinem Opa<\/i>, <i>dem Busfahrer<\/i>. Das Verb <i>besuchen<\/i> braucht ein Akkusativobjekt (Wen?): <i>seine Tante<\/i>."},{"id":"gr-objekte-06","typ":"single","stufe":2,"kompetenz":"satzglieder","frage":"Hannah will den Satz um eine <b>Zeitangabe<\/b> erweitern. Welcher Satz passt?","vorgabe":"Die Kinder bauen eine Sandburg.","optionen":[{"text":"Die Kinder bauen am Nachmittag eine Sandburg.","richtig":true},{"text":"Die Kinder bauen am Badesee eine Sandburg.","richtig":false},{"text":"Die Kinder bauen ihrem Vater eine Sandburg.","richtig":false},{"text":"Die fröhlichen Kinder bauen eine Sandburg.","richtig":false}],"tipp":"Finde in jedem Satz das neue Wort oder die neue Wortgruppe. Mit welcher Frage kannst du danach fragen?","erklaerung":"Die Wortgruppe <i>am Nachmittag<\/i> antwortet auf die Frage <i>Wann?<\/i> – das ist eine Zeitangabe. Dagegen ist <i>am Badesee<\/i> eine Ortsangabe und <i>ihrem Vater<\/i> ein Dativobjekt. Das Adjektiv <i>fröhlichen<\/i> gehört zum Subjekt und ist kein eigenes Satzglied."},{"id":"gr-objekte-07","typ":"markieren","stufe":3,"kompetenz":"satzglieder","frage":"Markiere alle Zeitangaben.","teile":[{"t":"Seit Montag","ziel":true},{"t":"übt"},{"t":"Mia"},{"t":"jeden Nachmittag","ziel":true},{"t":"im Kinderzimmer"},{"t":"Flöte"},{"t":".","fix":true}],"tipp":"Frage bei jedem Satzglied: <i>Wann?<\/i>, <i>Seit wann?<\/i> oder <i>Wie oft?<\/i> Lass dich nicht von der Form der Wörter täuschen.","erklaerung":"<i>Seit Montag<\/i> antwortet auf <i>Seit wann?<\/i>, <i>jeden Nachmittag<\/i> auf <i>Wann?<\/i> oder <i>Wie oft?<\/i> – beides sind Zeitangaben. Dagegen ist <i>im Kinderzimmer<\/i> eine Ortsangabe und <i>Flöte<\/i> ein Akkusativobjekt (Was übt Mia?)."},{"id":"gr-objekte-08","typ":"matrix","stufe":3,"kompetenz":"satzglieder","frage":"Lies den Satz. Stimmen die Aussagen?","vorgabe":"Emir besucht am Sonntag in Mühlbach seine Oma.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Die Wortgruppe „in Mühlbach“ ist eine Zeitangabe.","richtig":false},{"text":"Ohne „seine Oma“ ist der Satz immer noch vollständig.","richtig":false},{"text":"Die Wortgruppe „seine Oma“ ist ein Akkusativobjekt.","richtig":true},{"text":"Ohne „am Sonntag“ ist der Satz immer noch vollständig.","richtig":true}],"tipp":"Lass das Satzglied in Gedanken weg und lies den Rest laut. Klingt der Satz fertig, oder fehlt etwas, das <i>besucht<\/i> unbedingt braucht?","erklaerung":"Die Wortgruppe <i>in Mühlbach<\/i> ist eine Ortsangabe (Wo?). <i>Wen besucht Emir?<\/i> – <i>seine Oma<\/i>: ein Akkusativobjekt, das <i>besuchen<\/i> unbedingt braucht. Zeit- und Ortsangaben wie <i>am Sonntag<\/i> kannst du weglassen."}]},{"id":"gr-faelle","titel":"Die vier Fälle","kurz":"Nominativ, Genitiv, Dativ und Akkusativ","kompetenz":"faelle","wissen":{"merksatz":"Jedes Nomen steht in einem der vier Fälle. Die Fallfrage verrät dir den Fall – und der Artikel zeigt ihn oft an.","punkte":["<b>1. Fall – Nominativ<\/b>: <i>Wer oder was<\/i> bellt? → <i>Der Hund<\/i> bellt.","<b>2. Fall – Genitiv<\/b>: <i>Wessen<\/i> Napf ist das? → Das ist der Napf <i>des Hundes<\/i>.","<b>3. Fall – Dativ<\/b>: <i>Wem<\/i> gebe ich Futter? → Ich gebe <i>dem Hund<\/i> Futter.","<b>4. Fall – Akkusativ<\/b>: <i>Wen oder was<\/i> streichle ich? → Ich streichle <i>den Hund<\/i>.","Je nach Fall verändern sich der Artikel (Begleiter), manchmal das Nomen und auch das Adjektiv: <i>der große Hund – des großen Hundes – dem großen Hund – den großen Hund<\/i>.","Auch nach <i>ein<\/i> ändert sich das Adjektiv: <i>ein großer Hund – eines großen Hundes – einem großen Hund – einen großen Hund<\/i>."],"beispiele":["der Hund – des Hundes – dem Hund – den Hund","die Katze – der Katze – der Katze – die Katze","das Pferd – des Pferdes – dem Pferd – das Pferd","die Hunde – der Hunde – den Hunden – die Hunde"]},"items":[{"id":"gr-faelle-01","typ":"zuordnen","stufe":1,"kompetenz":"faelle","frage":"In welchem Fall stehen die Wortgruppen? Sortiere sie.","gruppen":["Nominativ","Genitiv","Dativ","Akkusativ"],"elemente":[{"t":"der Apfel","g":0},{"t":"der Zug","g":0},{"t":"des Baumes","g":1},{"t":"des Vaters","g":1},{"t":"dem Lehrer","g":2},{"t":"dem Freund","g":2},{"t":"den Ball","g":3},{"t":"den Igel","g":3}],"tipp":"Alle Nomen sind männlich. Achte genau auf den Artikel und auf die Endung des Nomens.","erklaerung":"Bei männlichen Nomen zeigt der Artikel den Fall: <i>der<\/i> → Nominativ, <i>des<\/i> (und <i>-es<\/i> oder <i>-s<\/i> am Nomen) → Genitiv, <i>dem<\/i> → Dativ, <i>den<\/i> → Akkusativ."},{"id":"gr-faelle-02","typ":"single","stufe":1,"kompetenz":"faelle","frage":"In welchem Fall steht das fett gedruckte Satzglied?","vorgabe":"Elif streichelt <b>das Pony<\/b>.","optionen":[{"text":"Nominativ","richtig":false},{"text":"Genitiv","richtig":false},{"text":"Dativ","richtig":false},{"text":"Akkusativ","richtig":true}],"tipp":"Stelle die passende Fallfrage mit dem Prädikat: <i>Wer oder was …?<\/i>, <i>Wessen …?<\/i>, <i>Wem …?<\/i> oder <i>Wen oder was …?<\/i>","erklaerung":"<i>Wen oder was streichelt Elif?<\/i> – <i>das Pony<\/i>. Das ist der Akkusativ. Bei sächlichen Nomen heißt der Artikel im Nominativ und im Akkusativ gleich: <i>das<\/i>."},{"id":"gr-faelle-03","typ":"luecke","stufe":1,"kompetenz":"faelle","frage":"Wähle den richtigen Artikel.","teile":[{"t":"Im Streichelzoo gebe ich "},{"wahl":["den","dem","des"],"loesung":1},{"t":" Esel eine Karotte. Das Fell "},{"wahl":["dem","den","des"],"loesung":2},{"t":" Esels ist ganz struppig. Zum Abschied streichle ich "},{"wahl":["den","dem","des"],"loesung":0},{"t":" Esel noch einmal."}],"tipp":"Stelle zu jeder Lücke die passende Fallfrage. Achte auch auf die Endung von <i>Esel<\/i>.","erklaerung":"<i>Wem gebe ich eine Karotte?<\/i> – <i>dem Esel<\/i> (Dativ). <i>Wessen Fell?<\/i> – das Fell <i>des Esels<\/i> (Genitiv). <i>Wen streichle ich?<\/i> – <i>den Esel<\/i> (Akkusativ)."},{"id":"gr-faelle-04","typ":"markieren","stufe":2,"kompetenz":"faelle","frage":"Markiere alle Wortgruppen, die im Dativ stehen.","teile":[{"t":"Heute"},{"t":"zeigt"},{"t":"Paul"},{"t":"seinem Freund","ziel":true},{"t":"den neuen Fußball"},{"t":".","fix":true},{"t":"Später"},{"t":"bringt"},{"t":"er"},{"t":"der Nachbarin","ziel":true},{"t":"einen Blumenstrauß"},{"t":".","fix":true}],"tipp":"Stelle zu jedem Satz die Fallfrage für den Dativ. Verlass dich nicht nur auf den Artikel.","erklaerung":"<i>Wem zeigt Paul den Fußball?<\/i> – <i>seinem Freund<\/i>. <i>Wem bringt er einen Blumenstrauß?<\/i> – <i>der Nachbarin<\/i>. Beide stehen im Dativ. Die Wortgruppen <i>den neuen Fußball<\/i> und <i>einen Blumenstrauß<\/i> stehen im Akkusativ."},{"id":"gr-faelle-05","typ":"luecke","stufe":2,"kompetenz":"faelle","frage":"Auch Adjektive verändern sich. Wähle die richtige Form.","teile":[{"t":"Ein "},{"wahl":["kleiner","kleinen","kleines"],"loesung":0},{"t":" Igel sucht im Laub nach Futter. Die Stacheln des "},{"wahl":["kleinen","kleines","kleiner"],"loesung":0},{"t":" Igels sind spitz. Lena stellt dem "},{"wahl":["durstigen","durstiger","durstiges"],"loesung":0},{"t":" Igel eine Schale Wasser hin."}],"tipp":"Bestimme zuerst den Fall: <i>Wer oder was sucht?<\/i> – <i>Wessen Stacheln?<\/i> – <i>Wem stellt Lena Wasser hin?<\/i> Sprich dann die Wortgruppe leise mit jeder Form.","erklaerung":"Nominativ: <i>ein kleiner Igel<\/i>. Genitiv: <i>des kleinen Igels<\/i>. Dativ: <i>dem durstigen Igel<\/i>. Nach <i>des<\/i> und <i>dem<\/i> endet das Adjektiv auf <i>-en<\/i>."},{"id":"gr-faelle-06","typ":"eingabe","stufe":2,"kompetenz":"faelle","frage":"Setze <i>der Fuchs<\/i> in den Genitiv. Tippe Artikel und Nomen ein.","vorgabe":"Der Schwanz ___ ist lang und buschig.","loesungen":["des Fuchses"],"tipp":"Frage: <i>Wessen Schwanz?<\/i> Im Genitiv ändert sich der Artikel, und das Nomen bekommt eine Endung.","erklaerung":"Genitiv (Wessen?): <i>des Fuchses<\/i>. Weil <i>Fuchs<\/i> auf <i>s<\/i> endet, bekommt das Nomen im Genitiv die Endung <i>-es<\/i>."},{"id":"gr-faelle-07","typ":"matrix","stufe":3,"kompetenz":"faelle","frage":"Bestimme die Fälle. Stimmen die Aussagen?","vorgabe":"Die Tochter des Bäckers bringt den Gästen den Kuchen.","spalten":["stimmt","stimmt nicht"],"aussagen":[{"text":"Die Wortgruppe „den Gästen“ steht im Akkusativ.","richtig":false},{"text":"Die Wortgruppe „des Bäckers“ steht im Genitiv.","richtig":true},{"text":"Die Wortgruppe „Die Tochter“ steht im Nominativ.","richtig":true},{"text":"Die Wortgruppe „den Kuchen“ steht im Akkusativ.","richtig":true}],"tipp":"Verlass dich nicht nur auf den Artikel. Stelle zu jeder Wortgruppe die Fallfrage und achte auch auf das Ende des Nomens.","erklaerung":"<i>Wem bringt sie den Kuchen?<\/i> – <i>den Gästen<\/i> (Dativ, Mehrzahl). <i>Wessen Tochter?<\/i> – <i>des Bäckers<\/i> (Genitiv). <i>Die Tochter<\/i> ist das Subjekt und steht im Nominativ, <i>den Kuchen<\/i> antwortet auf <i>Wen oder was?<\/i> (Akkusativ)."},{"id":"gr-faelle-08","typ":"multi","stufe":3,"kompetenz":"faelle","frage":"In welchen Sätzen steht <i>der Katze<\/i> im Dativ?","optionen":[{"text":"Oskar gibt der Katze frisches Wasser.","richtig":true},{"text":"Das Fell der Katze ist ganz weich.","richtig":false},{"text":"Der Katze gefällt das neue Kissen.","richtig":true},{"text":"Die Ohren der Katze sind spitz.","richtig":false},{"text":"Lena winkt der Katze zu.","richtig":true},{"text":"Der Napf der Katze ist leer.","richtig":false}],"tipp":"Ersetze <i>der Katze<\/i> in Gedanken durch <i>dem Kater<\/i> oder durch <i>des Katers<\/i>. Welche Form passt in den Satz?","erklaerung":"Bei <i>geben<\/i>, <i>gefallen<\/i> und <i>zuwinken<\/i> fragst du <i>Wem?<\/i> – dort steht <i>der Katze<\/i> im Dativ (<i>dem Kater<\/i>). Bei <i>Fell<\/i>, <i>Ohren<\/i> und <i>Napf<\/i> fragst du <i>Wessen?<\/i> – dort ist es Genitiv (<i>des Katers<\/i>)."}]}]},"schreiben":{"themen":[{"id":"sc-aufbau","titel":"Eine Erzählung aufbauen","kurz":"Einleitung, Hauptteil mit Höhepunkt, Schluss – der rote Faden einer Geschichte","kompetenz":"planen","wissen":{"merksatz":"Eine gute Erzählung hat einen roten Faden: Die <b>Einleitung<\/b> stellt die Situation vor, im <b>Hauptteil<\/b> steigt die Spannung bis zum <b>Höhepunkt<\/b>, und der <b>Schluss<\/b> erzählt, wie alles ausgeht.","punkte":["Einleitung: Beantworte die W-Fragen <b>Wer? Wo? Wann?<\/b> Verrate noch nicht, wie die Geschichte ausgeht.","Hauptteil: Erzähle Schritt für Schritt, was passiert. Die Spannung steigt bis zum Höhepunkt – dem spannendsten Moment.","Schluss: Erzähle kurz, wie es ausgeht und wie sich die Figuren fühlen. Die Spannung löst sich.","Erzähle in der richtigen zeitlichen Reihenfolge und im Präteritum. Die wörtliche Rede darf im Präsens stehen.","Die Überschrift passt zum Inhalt, macht neugierig und verrät das Ende nicht."],"beispiele":["Wer? – Mia und ihre Freundin Lena","Wo? – im Schullandheim am Waldsee","Wann? – in der letzten Nacht vor der Heimfahrt","Höhepunkt: Im allerletzten Moment …","Gute Überschrift: „Das Geheimnis auf dem Dachboden“","Verrät zu viel: „Wie wir den Schatz fanden“"]},"items":[{"id":"sc-aufbau-01","typ":"reihenfolge","stufe":1,"kompetenz":"planen","frage":"Bringe die Sätze der Erzählung in die richtige Reihenfolge.","reihe":["Am Samstag fuhr Emir mit seinem Opa zum Angeln an den Mühlweiher.","Zwei Stunden lang biss kein einziger Fisch an.","Auf einmal zuckte die Angel, und die Schnur spannte sich.","Emir zog mit aller Kraft und hielt endlich einen riesigen Karpfen in den Händen.","Am Abend erzählte Emir der ganzen Familie stolz von seinem Fang."],"tipp":"Suche zuerst den Satz, der verrät, wer dabei ist, wo und wann es spielt. Achte danach auf Signalwörter wie „auf einmal“ und „endlich“.","erklaerung":"Zuerst kommt die Einleitung mit Wer, Wo und Wann. Dann steigt die Spannung: Lange beißt nichts, auf einmal zuckt die Angel. Der Fang ist der Höhepunkt, Emirs stolze Erzählung am Abend ist der Schluss."},{"id":"sc-aufbau-02","typ":"multi","stufe":1,"kompetenz":"planen","frage":"Welche Fragen beantwortest du schon in der Einleitung einer Erzählung?","optionen":[{"text":"Wer ist dabei?","richtig":true},{"text":"Wo spielt die Geschichte?","richtig":true},{"text":"Wann passiert es?","richtig":true},{"text":"Wie geht die Geschichte aus?","richtig":false},{"text":"Was ist der spannendste Moment?","richtig":false}],"tipp":"Die Einleitung stellt die Geschichte vor. Überlege: Was muss der Leser gleich am Anfang wissen – und was soll noch eine Überraschung bleiben?","erklaerung":"In die Einleitung gehören Wer, Wo und Wann. Den spannendsten Moment und den Ausgang verrätst du erst im Hauptteil und im Schluss."},{"id":"sc-aufbau-03","typ":"single","stufe":2,"kompetenz":"planen","frage":"Welcher Satz ist der beste Anfang für eine Erzählung über einen Tag im Freibad?","optionen":[{"text":"An einem heißen Sonntag im Juli radelten Aylin und ihre Cousine Leyla zum Freibad in Seebrunn.","richtig":true},{"text":"An einem heißen Tag fuhren wir irgendwohin, und dort passierte dann etwas sehr Komisches.","richtig":false},{"text":"Aylin und Leyla fanden im Freibad einen verlorenen Schlüssel und brachten ihn zum Bademeister.","richtig":false},{"text":"Im Freibad ist es im Sommer immer schön, weil das Wasser kühl ist und es Pommes gibt.","richtig":false}],"tipp":"Prüfe jeden Satz: Erfährst du, wer dabei ist, wo und wann es spielt? Und bleibt noch offen, was passieren wird?","erklaerung":"Nur „An einem heißen Sonntag im Juli …“ nennt Wer (Aylin und Leyla), Wann (Sonntag im Juli) und Wo (Freibad in Seebrunn) und verrät noch nicht, was passiert. Der Satz mit dem Schlüssel erzählt schon die ganze Geschichte."},{"id":"sc-aufbau-04","typ":"zuordnen","stufe":2,"kompetenz":"planen","frage":"Ordne jeden Satz dem passenden Teil der Erzählung zu.","gruppen":["Einleitung","Hauptteil","Schluss"],"elemente":[{"t":"Am Wandertag stieg die Klasse 4b mit Frau Huber auf den Kogelberg.","g":0},{"t":"Jonas durfte an diesem Tag das Klassenmaskottchen tragen, einen kleinen Plüschfuchs.","g":0},{"t":"Oben am Gipfelkreuz merkte Jonas plötzlich, dass der Fuchs verschwunden war.","g":1},{"t":"Alle suchten aufgeregt. Im allerletzten Moment, kurz vor dem Abstieg, entdeckte Sofia etwas Rotes im hohen Gras.","g":1},{"t":"Erleichtert lachten alle auf dem Heimweg über die große Suchaktion.","g":2},{"t":"Seit diesem Tag bindet Jonas den Fuchs immer an seinem Rucksack fest.","g":2}],"tipp":"In der Einleitung ist noch alles ruhig. Im Hauptteil gibt es ein Problem, und die Spannung steigt bis zum Höhepunkt. Im Schluss ist die Spannung vorbei.","erklaerung":"Die Einleitung stellt Klasse, Ort und Zeit vor – und Jonas mit dem Plüschfuchs. Im Hauptteil verschwindet der Fuchs, alle suchen, und im allerletzten Moment entdeckt Sofia ihn – das ist der Höhepunkt. Der Schluss erzählt, wie sich alle fühlen und was danach passiert."},{"id":"sc-aufbau-05","typ":"markieren","stufe":3,"kompetenz":"planen","frage":"Tippe den Satz an, der den Höhepunkt dieser Erzählung bildet.","teile":[{"t":"Leyla hatte zum Geburtstag einen Wellensittich bekommen und ihn Kiwi genannt."},{"t":"Eines Morgens vergaß sie, die Käfigtür zu schließen."},{"t":"Kiwi schlüpfte hinaus und flatterte aufgeregt durch die Küche."},{"t":"Gerade als er auf das offene Fenster zuflog, schloss Leyla es im allerletzten Moment.","ziel":true},{"t":"Erschöpft landete Kiwi auf ihrer Schulter."},{"t":"Seitdem prüft Leyla die Käfigtür immer zweimal."}],"tipp":"Der Höhepunkt ist der spannendste Moment. Dort entscheidet sich, wie die Geschichte ausgeht.","erklaerung":"Am Fenster ist die Spannung am größten: Fliegt Kiwi davon oder nicht? Danach löst sich die Spannung, und der Schluss beginnt."},{"id":"sc-aufbau-06","typ":"single","stufe":3,"kompetenz":"planen","frage":"Welche Überschrift passt am besten zu dieser Erzählung?","vorgabe":"<b>Inhalt:<\/b> Paul und Amira hören beim Spielen im Park ein seltsames Schnaufen. In einer Hecke hat sich ein Igel in einem alten Netz verfangen. Die beiden holen Hilfe, und der Igel wird befreit.","optionen":[{"text":"Gefangen im Netz","richtig":true},{"text":"Wie wir den Igel retteten","richtig":false},{"text":"Spielen im Park","richtig":false},{"text":"Der Igel ist wieder frei!","richtig":false}],"tipp":"Eine gute Überschrift passt zum Inhalt, macht neugierig und verrät das Ende nicht. Prüfe jede Überschrift auf diese drei Punkte.","erklaerung":"„Gefangen im Netz“ passt zum Ereignis und macht neugierig, wie es weitergeht. „Wie wir den Igel retteten“ und „Der Igel ist wieder frei!“ verraten das Ende. „Spielen im Park“ sagt nichts über das Ereignis."}]},{"id":"sc-lebendig","titel":"Lebendig erzählen","kurz":"Treffende Verben, anschauliche Adjektive, Gefühle und wörtliche Rede","kompetenz":"formulieren","wissen":{"merksatz":"Lebendig erzählen heißt: Der Leser sieht die Geschichte wie einen Film im Kopf. Dabei helfen <b>treffende Verben<\/b>, <b>anschauliche Adjektive<\/b>, <b>gezeigte Gefühle<\/b> und <b>wörtliche Rede<\/b>.","punkte":["Ersetze „sagen“ und „gehen“ durch treffende Verben: erklären, schimpfen, jubeln – rennen, stolpern, trödeln.","Adjektive malen Bilder: ein <i>knorriger<\/i> Baum, eine <i>eiskalte<\/i> Hand.","Zeige Gefühle, statt sie nur zu nennen: „Mein Herz klopfte bis zum Hals.“ statt „Ich hatte Angst.“","Lass deine Figuren sprechen. Wörtliche Rede steht in Anführungszeichen.","Spannungswörter wie <i>plötzlich<\/i>, <i>auf einmal<\/i> oder <i>im letzten Moment<\/i> machen neugierig – aber nicht zu oft!"],"beispiele":["sagen → brüllen, wispern, erklären, jammern","gehen → stolzieren, trödeln, rennen, waten","ein Baum → ein knorriger, uralter Baum","Ich war froh. → Ich hätte die ganze Welt umarmen können.","„Pst!“, flüsterte Ben.","plötzlich, auf einmal, im letzten Moment"]},"items":[{"id":"sc-lebendig-01","typ":"zuordnen","stufe":1,"kompetenz":"formulieren","frage":"Sortiere die Verben: Gehören sie zum Wortfeld „sagen“ oder zum Wortfeld „gehen“?","gruppen":["Wortfeld „sagen“","Wortfeld „gehen“"],"elemente":[{"t":"flüstern","g":0},{"t":"schleichen","g":1},{"t":"rufen","g":0},{"t":"humpeln","g":1},{"t":"stottern","g":0},{"t":"schlendern","g":1},{"t":"murmeln","g":0},{"t":"hetzen","g":1}],"tipp":"Frage dich bei jedem Verb: Macht man das mit dem Mund oder mit den Beinen?","erklaerung":"Flüstern, rufen, stottern und murmeln sind Arten zu sprechen. Schleichen, humpeln, schlendern und hetzen sind Arten, sich fortzubewegen."},{"id":"sc-lebendig-02","typ":"luecke","stufe":1,"kompetenz":"formulieren","frage":"Wähle jeweils das Verb, das am besten passt.","teile":[{"t":"Damit niemand mithören konnte, "},{"wahl":["flüsterte","erzählte","rief"],"loesung":0},{"t":" Mia ihrer Freundin das Geheimnis ins Ohr. Danach "},{"wahl":["schlich","rannte","schlenderte"],"loesung":0},{"t":" sie auf Zehenspitzen aus dem Zimmer, denn ihr kleiner Bruder schlief schon."}],"tipp":"Achte auf die Hinweise im Text: „niemand mithören“, „ins Ohr“, „auf Zehenspitzen“ und „schlief schon“. Welches Verb beschreibt am genauesten, wie Mia spricht und geht?","erklaerung":"Ein Geheimnis, das niemand mithören soll, flüstert man ins Ohr. „Erzählte“ ist zu ungenau, „rief“ zu laut. Wer auf Zehenspitzen geht, damit der Bruder weiterschläft, schleicht – rennen wäre zu laut, und schlendern heißt gemütlich bummeln."},{"id":"sc-lebendig-03","typ":"markieren","stufe":2,"kompetenz":"formulieren","frage":"Tippe die drei Spannungswörter an.","teile":[{"t":"Ben"},{"t":"las"},{"t":"im Bett"},{"t":".","fix":true},{"t":"Plötzlich","ziel":true},{"t":"hörte"},{"t":"er"},{"t":"ein Kratzen"},{"t":"an der Tür"},{"t":".","fix":true},{"t":"Er"},{"t":"hielt"},{"t":"den Atem"},{"t":"an"},{"t":".","fix":true},{"t":"Auf einmal","ziel":true},{"t":"war"},{"t":"es"},{"t":"ganz still"},{"t":".","fix":true},{"t":"Im nächsten Moment","ziel":true},{"t":"sprang"},{"t":"die Tür"},{"t":"auf"},{"t":"–","fix":true},{"t":"und"},{"t":"Kater Moritz"},{"t":"spazierte"},{"t":"herein"},{"t":".","fix":true}],"tipp":"Spannungswörter kündigen an, dass gleich etwas Überraschendes passiert. Achte auch auf Wortgruppen aus mehreren Wörtern.","erklaerung":"„Plötzlich“, „Auf einmal“ und „Im nächsten Moment“ sind Spannungswörter. Sie zeigen: Jetzt passiert etwas Überraschendes."},{"id":"sc-lebendig-04","typ":"luecke","stufe":2,"kompetenz":"formulieren","frage":"Wähle für jede wörtliche Rede das Verb, das am besten zur Situation passt.","teile":[{"t":"„Hurra, wir haben gewonnen!“, "},{"wahl":["jubelte","schluchzte","flüsterte"],"loesung":0},{"t":" Luca. „Mein Knie tut so weh!“, "},{"wahl":["jammerte","lachte","prahlte"],"loesung":0},{"t":" Felix. „Räum sofort dein Zimmer auf!“, "},{"wahl":["befahl","bettelte","kicherte"],"loesung":0},{"t":" Papa."}],"tipp":"Überlege bei jeder wörtlichen Rede: Wie fühlt sich die Person gerade, und was will sie?","erklaerung":"Wer gewonnen hat, jubelt. Wer Schmerzen hat, jammert. „Räum sofort dein Zimmer auf!“ ist ein Befehl – Papa befiehlt."},{"id":"sc-lebendig-05","typ":"multi","stufe":3,"kompetenz":"formulieren","frage":"Welche Sätze zeigen ein Gefühl, ohne es beim Namen zu nennen?","optionen":[{"text":"Mateo biss sich auf die Lippe und starrte auf seine Schuhe.","richtig":true},{"text":"Hannah hüpfte quietschend durchs Zimmer und klatschte in die Hände.","richtig":true},{"text":"Mir lief ein eiskalter Schauer über den Rücken.","richtig":true},{"text":"Mateo war sehr traurig, weil er das Spiel verloren hatte.","richtig":false},{"text":"Hannah freute sich riesig über das große Geschenk von Oma.","richtig":false},{"text":"Ich hatte große Angst vor dem lauten Gewitter in der Nacht.","richtig":false}],"tipp":"Ein Gefühl zeigen heißt: beschreiben, was der Körper tut. Ein Gefühl nennen heißt: das Gefühlswort hinschreiben, zum Beispiel „wütend“.","erklaerung":"Sich auf die Lippe beißen, quietschend hüpfen und ein Schauer über den Rücken zeigen Gefühle durch den Körper. In den anderen Sätzen stehen die Gefühle direkt da: traurig, freute sich, Angst."},{"id":"sc-lebendig-06","typ":"single","stufe":3,"kompetenz":"formulieren","frage":"Welche Fassung erzählt am lebendigsten?","optionen":[{"text":"Ben schlich die knarrende Kellertreppe hinunter. Sein Herz pochte wie wild. „Ist da jemand?“, flüsterte er.","richtig":true},{"text":"Ben ging die Kellertreppe hinunter, weil er etwas holen wollte. Er hatte Angst. Dann sagte er: „Ist da jemand?“","richtig":false},{"text":"Plötzlich ging Ben in den Keller. Plötzlich war es dunkel. Plötzlich sagte er: „Ist da jemand?“","richtig":false},{"text":"Ben ging in den Keller. Er hatte sehr, sehr große Angst. Er sagte ganz leise: „Ist da jemand im Keller?“","richtig":false}],"tipp":"Achte auf drei Dinge: treffende Verben statt „gehen“ und „sagen“, ein gezeigtes Gefühl und keine Wiederholungen.","erklaerung":"Mit „schlich“, „knarrende Kellertreppe“, „Herz pochte“ und „flüsterte“ siehst du die Szene wie im Film. Die anderen Fassungen nutzen „ging“ und „sagte“, nennen das Gefühl nur oder wiederholen „plötzlich“."}]},{"id":"sc-satzanfaenge","titel":"Satzanfänge und Satzverbindungen","kurz":"Abwechslung statt „Dann … dann …“ und Sätze geschickt verbinden","kompetenz":"formulieren","wissen":{"merksatz":"Beginne nicht jeden Satz mit „Dann“ oder „Und dann“. Wechsle die Satzanfänge ab und verbinde Sätze mit passenden <b>Verbindungswörtern<\/b>.","punkte":["Abwechslungsreiche Satzanfänge: zuerst, danach, kurz darauf, anschließend, nach einer Weile, am Abend, schließlich.","Du kannst auch ein anderes Satzglied nach vorne stellen: „Im Garten spielte Noah.“ statt „Noah spielte im Garten.“","<b>weil<\/b> und <b>denn<\/b> nennen einen Grund, <b>deshalb<\/b> nennt eine Folge, <b>obwohl<\/b> und <b>trotzdem<\/b> zeigen einen Gegensatz.","<b>als<\/b>, <b>nachdem<\/b> und <b>bevor<\/b> sagen, wann etwas passiert. Bei <i>nachdem<\/i> ist das eine schon fertig, wenn das andere beginnt.","Nach <b>weil<\/b>, <b>als<\/b>, <b>nachdem<\/b>, <b>obwohl<\/b> und <b>bevor<\/b> steht das Verb am Ende: „…, weil ich krank <i>war<\/i>.“ Diesen Satzteil trennst du mit einem Komma ab.","Steht eines dieser Wörter am Satzanfang, kommt nach dem Komma gleich das Verb: „Obwohl es regnete, <i>spielten<\/i> wir Fußball.“","Nach <b>deshalb<\/b> und <b>trotzdem<\/b> kommt gleich das Verb: „Deshalb <i>blieb<\/i> ich zu Hause.“"],"beispiele":["Dann … Dann … → Zuerst … Danach … Zum Schluss …","Ich blieb zu Hause, weil ich krank war.","Ich war krank. Deshalb blieb ich zu Hause.","Obwohl es regnete, spielten wir Fußball.","Nachdem wir gegessen hatten, gingen wir hinaus.","Bevor wir losfuhren, packten wir die Koffer.","Als der Wecker klingelte, sprang ich aus dem Bett."]},"items":[{"id":"sc-satzanfaenge-01","typ":"single","stufe":1,"kompetenz":"formulieren","frage":"Welcher Text hat die abwechslungsreichsten Satzanfänge?","optionen":[{"text":"Am Morgen packten wir die Koffer. Kurz darauf kam der Bus. Nach zwei Stunden erreichten wir das Schullandheim.","richtig":true},{"text":"Dann packten wir die Koffer. Dann kam der Bus. Dann erreichten wir nach zwei langen Stunden das Schullandheim.","richtig":false},{"text":"Wir packten am Morgen die Koffer. Wir stiegen in den Bus. Wir erreichten nach zwei Stunden das Schullandheim.","richtig":false},{"text":"Und dann packten wir die Koffer. Und dann kam der Bus. Und dann waren wir endlich im Schullandheim.","richtig":false}],"tipp":"Lies nur den Anfang jedes Satzes. In welchem Text beginnt jeder Satz anders?","erklaerung":"„Am Morgen“, „Kurz darauf“ und „Nach zwei Stunden“ sind verschiedene Satzanfänge. Sie zeigen außerdem genau, wann etwas passiert. Die anderen Texte beginnen jeden Satz gleich."},{"id":"sc-satzanfaenge-02","typ":"zuordnen","stufe":1,"kompetenz":"formulieren","frage":"Was zeigen diese Verbindungswörter an? Sortiere sie.","gruppen":["nennt einen Grund","zeigt einen Gegensatz","sagt, wann etwas passiert"],"elemente":[{"t":"weil","g":0},{"t":"denn","g":0},{"t":"obwohl","g":1},{"t":"trotzdem","g":1},{"t":"als","g":2},{"t":"nachdem","g":2},{"t":"bevor","g":2}],"tipp":"Bilde mit jedem Wort einen kurzen Satz, zum Beispiel über das Wetter. Was drückt das Wort in deinem Satz aus?","erklaerung":"Die Wörter „weil“ und „denn“ nennen einen Grund, „obwohl“ und „trotzdem“ zeigen einen Gegensatz. Mit „als“, „nachdem“ und „bevor“ sagst du, wann etwas passiert."},{"id":"sc-satzanfaenge-03","typ":"luecke","stufe":2,"kompetenz":"formulieren","frage":"Wähle die Verbindungswörter, die den Sinn richtig ausdrücken.","teile":[{"t":"Lena zog ihre Regenjacke an, "},{"wahl":["weil","obwohl","sodass"],"loesung":0},{"t":" es in Strömen regnete. "},{"wahl":["Obwohl","Weil","Damit"],"loesung":0},{"t":" sie die Jacke trug, wurde sie auf dem Schulweg klatschnass. Zu Hause fror sie, "},{"wahl":["deshalb","trotzdem","obwohl"],"loesung":0},{"t":" kochte Mama ihr einen heißen Kakao."}],"tipp":"Frage bei jeder Lücke: Wird ein Grund genannt, ein Gegensatz oder eine Folge?","erklaerung":"Der Regen ist der Grund für die Jacke: weil. Nass werden trotz Jacke ist ein Gegensatz: obwohl. Der Kakao ist die Folge davon, dass Lena fror: deshalb."},{"id":"sc-satzanfaenge-04","typ":"reihenfolge","stufe":2,"kompetenz":"formulieren","frage":"Bringe die Sätze in die richtige Reihenfolge. Achte auf die Satzanfänge und Verbindungswörter.","reihe":["Am Samstagmorgen wollten Mia und Paul für Omas Geburtstag einen Kuchen backen.","Zuerst gaben sie Butter, Zucker, Eier und Mehl in eine große Schüssel.","Nachdem sie alles gut verrührt hatten, füllten sie den Teig in die Backform.","Während der Kuchen im Ofen war, deckten sie den Geburtstagstisch.","Zum Schluss verzierten sie den abgekühlten Kuchen mit bunten Streuseln."],"tipp":"Signalwörter helfen dir: „Zuerst“, „Nachdem“, „Während“ und „Zum Schluss“. Überlege auch, was beim Backen zuerst passieren muss.","erklaerung":"Nach der Einleitung kommt „Zuerst“. „Nachdem sie alles verrührt hatten“ zeigt, dass das Rühren schon fertig war, und „Während“ heißt: gleichzeitig mit dem Backen. „Zum Schluss“ steht am Ende."},{"id":"sc-satzanfaenge-05","typ":"single","stufe":3,"kompetenz":"formulieren","frage":"Die beiden Sätze bilden einen Gegensatz. Welcher Satz verbindet sie richtig?","vorgabe":"Felix hatte fleißig geübt. Er war beim Vorspielen sehr aufgeregt.","optionen":[{"text":"Obwohl Felix fleißig geübt hatte, war er beim Vorspielen sehr aufgeregt.","richtig":true},{"text":"Weil Felix fleißig geübt hatte, war er beim Vorspielen sehr aufgeregt.","richtig":false},{"text":"Felix hatte fleißig geübt, deshalb war er beim Vorspielen sehr aufgeregt.","richtig":false},{"text":"Obwohl Felix fleißig geübt hatte, er war beim Vorspielen sehr aufgeregt.","richtig":false}],"tipp":"Prüfe zwei Dinge: Drückt das Verbindungswort einen Gegensatz aus? Und steht das Verb nach dem Komma an der richtigen Stelle?","erklaerung":"„Obwohl“ zeigt den Gegensatz: Felix hatte geübt und war trotzdem aufgeregt. Nach dem Komma folgt sofort das Verb: „…, war er …“. „Weil“ und „deshalb“ nennen Grund und Folge – das passt hier nicht."},{"id":"sc-satzanfaenge-06","typ":"multi","stufe":3,"kompetenz":"formulieren","frage":"Welche Sätze sind richtig verbunden – mit Komma an der richtigen Stelle und richtigem Satzbau?","optionen":[{"text":"Wir blieben drinnen, weil es draußen stürmte.","richtig":true},{"text":"Nachdem Aylin ihre Hausaufgaben gemacht hatte, ging sie zum Training.","richtig":true},{"text":"Es war schon spät, deshalb liefen wir schnell nach Hause.","richtig":true},{"text":"Wir blieben drinnen, weil es stürmte draußen.","richtig":false},{"text":"Obwohl Paul nach der Schule sehr müde war ging er noch zum Training.","richtig":false},{"text":"Lena war krank, deshalb sie blieb im Bett.","richtig":false}],"tipp":"Prüfe bei jedem Satz das Komma und die Stelle des Verbs. Erinnere dich an den Merkkasten: Wo steht das Verb nach „weil“ oder „obwohl“, und wo nach „deshalb“?","erklaerung":"Richtig sind „…, weil es draußen stürmte“, „Nachdem … gemacht hatte, ging …“ und „…, deshalb liefen wir …“. Bei „weil es stürmte draußen“ steht das Verb nicht am Ende, bei Paul fehlt das Komma, und nach „deshalb“ muss das Verb sofort folgen: „deshalb blieb sie“."}]},{"id":"sc-bericht","titel":"Informieren und berichten","kurz":"Sachlich, genau und in der richtigen zeitlichen Reihenfolge","kompetenz":"planen","wissen":{"merksatz":"Ein <b>Bericht<\/b> informiert sachlich und genau über etwas, das wirklich passiert ist. Er beantwortet die W-Fragen und hält sich an die zeitliche Reihenfolge – ohne Spannung und ohne Gefühle.","punkte":["Beantworte die W-Fragen: Wer? Was? Wann? Wo? Wie? Warum? Manchmal auch: Welche Folgen hatte es?","Schreibe in der zeitlichen Reihenfolge, so wie es passiert ist.","Schreibe im Präteritum: Die Klasse fuhr um 8:00 Uhr los. Was jetzt noch gilt, darf im Präsens stehen: Die Brille liegt im Sekretariat.","Keine Spannungswörter, keine wörtliche Rede, keine eigenen Gefühle oder Meinungen.","Eine Erzählung will unterhalten und Spannung erzeugen. Ein Bericht will genau und sachlich informieren."],"beispiele":["Wer? Was? Wann? Wo? Wie? Warum? Welche Folgen?","Sachlich: Um 10:15 Uhr begann die Siegerehrung.","Nicht sachlich: Endlich kam der spannendste Moment!","Bericht: Ein Kind verletzte sich leicht am Knie.","Erzählung: Autsch! Mein Knie brannte wie Feuer."]},"items":[{"id":"sc-bericht-01","typ":"multi","stufe":1,"kompetenz":"planen","frage":"Für die Schülerzeitung entsteht ein Bericht über das Schulfest. Welche Sätze passen in den Bericht?","optionen":[{"text":"Das Schulfest begann um 14:00 Uhr auf dem Pausenhof.","richtig":true},{"text":"Die Klasse 4a verkaufte selbst gebackene Waffeln.","richtig":true},{"text":"Den Erlös von 312 € spendete die Schule dem Tierheim.","richtig":true},{"text":"Plötzlich passierte etwas total Unglaubliches!","richtig":false},{"text":"Ich fand die Hüpfburg einfach supertoll.","richtig":false},{"text":"„Das ist das beste Fest aller Zeiten!“, jubelte Ben.","richtig":false}],"tipp":"Ein Bericht informiert sachlich und genau. Prüfe: Nennt der Satz Tatsachen – oder enthält er Spannung, eine eigene Meinung oder wörtliche Rede?","erklaerung":"Die Sätze mit Uhrzeit, Waffelverkauf und Erlös informieren sachlich. Spannungswörter, die eigene Meinung und wörtliche Rede gehören in eine Erzählung."},{"id":"sc-bericht-02","typ":"reihenfolge","stufe":1,"kompetenz":"planen","frage":"Bringe die Sätze des Berichts über das Sommerfest in die richtige zeitliche Reihenfolge.","reihe":["Um 14:00 Uhr eröffnete Schulleiterin Frau Kaya das Sommerfest auf dem Pausenhof.","Direkt nach der Eröffnungsrede sang der Schulchor drei Lieder.","Ab 15:00 Uhr konnten die Gäste an zwölf Spielstationen mitmachen.","Um 17:30 Uhr wurden die Preise der Tombola verlost.","Gegen 18:00 Uhr endete das Fest mit dem gemeinsamen Aufräumen."],"tipp":"Achte auf die Uhrzeiten und auf Wörter, die an etwas anknüpfen, das vorher passiert ist.","erklaerung":"Ein Bericht hält sich an die zeitliche Reihenfolge: Eröffnung um 14:00 Uhr, direkt danach der Chor, ab 15:00 Uhr die Spiele, um 17:30 Uhr die Tombola, gegen 18:00 Uhr das Ende."},{"id":"sc-bericht-03","typ":"zuordnen","stufe":2,"kompetenz":"planen","frage":"Passt der Satz in einen sachlichen Bericht über eine Fundsache oder eher in eine Erzählung? Sortiere.","gruppen":["Bericht","Erzählung"],"elemente":[{"t":"Der Hausmeister fand am Mittwoch auf dem Pausenhof eine blaue Trinkflasche.","g":0},{"t":"Die Flasche hat einen grünen Deckel und einen Aufkleber mit einem Fuchs.","g":0},{"t":"Die Besitzerin oder der Besitzer kann sie im Sekretariat abholen.","g":0},{"t":"Mir stockte der Atem, als ich die geheimnisvolle Flasche entdeckte.","g":1},{"t":"„Wem gehört bloß dieses seltsame Ding?“, rätselte ich.","g":1},{"t":"Plötzlich blitzte im Gebüsch etwas Blaues auf!","g":1}],"tipp":"Ein Bericht nennt Tatsachen genau und sachlich. Eine Erzählung will unterhalten und spannend sein.","erklaerung":"Fundort, Aussehen und Abholort sind sachliche Angaben für einen Bericht. Der stockende Atem, die Frage in wörtlicher Rede und „Plötzlich …!“ erzeugen Spannung – das ist typisch für eine Erzählung."},{"id":"sc-bericht-04","typ":"single","stufe":2,"kompetenz":"planen","frage":"Welche wichtige Information fehlt in diesem Bericht?","vorgabe":"Am Dienstag fand in der Turnhalle der Grundschule am Mühlbach ein Vorlesewettbewerb statt. Zwölf Kinder aus den vierten Klassen lasen aus ihren Lieblingsbüchern vor. Eine Jury aus drei Lehrkräften bewertete die Vorträge.","optionen":[{"text":"Wann fand der Wettbewerb statt?","richtig":false},{"text":"Wo fand der Wettbewerb statt?","richtig":false},{"text":"Wer hat den Wettbewerb gewonnen?","richtig":true},{"text":"Wer hat beim Wettbewerb vorgelesen?","richtig":false}],"tipp":"Gehe die Antworten einzeln durch und suche die Information im Bericht. Bei welcher Frage findest du nichts?","erklaerung":"Im Bericht steht, wann (am Dienstag) und wo (in der Turnhalle) der Wettbewerb war und wer vorgelesen hat (zwölf Kinder). Das Ergebnis fehlt: Die Leser erfahren nicht, wer gewonnen hat."},{"id":"sc-bericht-05","typ":"markieren","stufe":3,"kompetenz":"planen","frage":"Tippe die drei Sätze an, die nicht in einen sachlichen Bericht für die Schülerzeitung passen.","teile":[{"t":"Am Freitag fand auf dem Sportplatz das Sportfest der Grundschule am Mühlbach statt."},{"t":"Es war der allertollste Tag meines Lebens!","ziel":true},{"t":"Rund 200 Kinder traten in sechs Disziplinen gegeneinander an."},{"t":"Wegen eines Gewitters unterbrach die Schulleitung die Wettkämpfe um 11:00 Uhr für eine halbe Stunde."},{"t":"Mein Herz raste vor Aufregung, als ich an den Start ging.","ziel":true},{"t":"Die Siegerehrung fand um 13:00 Uhr in der Turnhalle statt."},{"t":"„Wir sind die Größten!“, brüllte die Klasse 4a.","ziel":true}],"tipp":"Ein Bericht enthält nur Tatsachen. Suche Sätze mit eigenen Gefühlen, eigener Meinung oder wörtlicher Rede.","erklaerung":"Der „allertollste Tag“ ist eine Meinung, das rasende Herz ein Gefühl, und „Wir sind die Größten!“ ist wörtliche Rede. Die übrigen Sätze nennen sachlich, was wann und wo geschah."},{"id":"sc-bericht-06","typ":"single","stufe":3,"kompetenz":"planen","frage":"Lena berichtet in der Schülerzeitung über eine gefundene Brille. Welcher Anfang passt am besten zu einem Bericht?","optionen":[{"text":"Am Montagmorgen fand Hausmeister Herr Brandl im Musiksaal eine rote Kinderbrille.","richtig":true},{"text":"Ihr werdet nicht glauben, was unser Hausmeister am Montag im Musiksaal entdeckt hat!","richtig":false},{"text":"Es war einmal eine kleine rote Brille, die ganz allein und traurig im Musiksaal lag.","richtig":false},{"text":"Irgendwann letzte Woche fand jemand irgendwo in unserer Schule eine Brille.","richtig":false}],"tipp":"Ein guter Berichtsanfang beantwortet gleich die wichtigsten W-Fragen – genau und ohne Spannung.","erklaerung":"Nur „Am Montagmorgen fand Hausmeister Herr Brandl …“ nennt genau, wer, wann, wo und was. Die anderen Anfänge erzeugen Spannung, klingen wie ein Märchen oder sind ungenau."}]},{"id":"sc-meinung","titel":"Meinung begründen","kurz":"Standpunkt, Gründe und Beispiele – höflich überzeugen in Brief und E-Mail","kompetenz":"planen","wissen":{"merksatz":"Wer überzeugen will, sagt seine <b>Meinung<\/b> klar, begründet sie mit <b>Gründen<\/b> und macht sie mit <b>Beispielen<\/b> anschaulich. Dabei bleibt man immer höflich.","punkte":["Standpunkt: Sag klar, was du denkst oder dir wünschst: „Ich finde, dass …“, „Ich wünsche mir …“","Gründe: Erkläre, warum: „…, weil …“, „Ein wichtiger Grund ist …“, „Außerdem …“","Beispiele machen Gründe anschaulich: „Zum Beispiel …“","Ein Brief hat Ort und Datum, Anrede, Text, Gruß und Unterschrift. Eine E-Mail hat einen Betreff, Anrede, Text, Gruß und Namen.","Bleib höflich: Bitte freundlich, statt zu fordern. Drohe nicht und beleidige niemanden. Bedanke dich am Ende."],"beispiele":["Ich finde, dass …","Ein wichtiger Grund ist …","Zum Beispiel könnten wir …","Sehr geehrte Frau Kaya,","Sehr geehrter Herr Brandl,","Mit freundlichen Grüßen"]},"items":[{"id":"sc-meinung-01","typ":"reihenfolge","stufe":1,"kompetenz":"planen","frage":"Bringe die Teile der E-Mail in die richtige Reihenfolge.","reihe":["Betreff: Bitte um eine Lesekiste für die Regenpause","Sehr geehrte Frau Kaya,","wir wünschen uns eine Lesekiste, weil wir in der Regenpause gern lesen würden.","Mit freundlichen Grüßen","Klasse 4b"],"tipp":"Überlege, was in einer E-Mail ganz oben steht und womit man sich am Ende verabschiedet.","erklaerung":"Eine E-Mail beginnt mit dem Betreff, dann folgt die Anrede mit Komma. Danach kommt der Text, am Ende stehen Gruß und Name."},{"id":"sc-meinung-02","typ":"single","stufe":1,"kompetenz":"planen","frage":"Welche Anrede passt in eine E-Mail an die Schulleiterin Frau Kaya?","optionen":[{"text":"Sehr geehrte Frau Kaya,","richtig":true},{"text":"Sehr geehrter Frau Kaya,","richtig":false},{"text":"Hallo Kaya,","richtig":false},{"text":"Hey Frau Schulleiterin!","richtig":false}],"tipp":"Die Anrede soll höflich sein und zur Person passen. Achte auch auf die Endung des Wortes nach „Sehr“.","erklaerung":"„Sehr geehrte Frau Kaya,“ ist höflich und richtig: Bei einer Frau heißt es „geehrte“, bei einem Mann „geehrter“. „Hallo“ und „Hey“ sind für die Schulleitung zu locker."},{"id":"sc-meinung-03","typ":"zuordnen","stufe":2,"kompetenz":"planen","frage":"Ist der Satz eine Meinung, ein Grund oder ein Beispiel? Sortiere.","gruppen":["Meinung","Grund","Beispiel"],"elemente":[{"t":"Unsere Schule braucht unbedingt einen Schulgarten.","g":0},{"t":"Meiner Meinung nach sollte jede Klasse ein eigenes Beet bekommen.","g":0},{"t":"Denn draußen lernen wir am besten, wie Pflanzen wachsen.","g":1},{"t":"Außerdem ist Gartenarbeit gesund, weil man sich viel bewegt.","g":1},{"t":"Zum Beispiel könnten wir Radieschen säen und später ernten.","g":2},{"t":"Wir könnten zum Beispiel beobachten, wie aus einem winzigen Kürbiskern eine riesige Pflanze wird.","g":2}],"tipp":"Frage dich bei jedem Satz: Sagt er, was jemand will oder denkt? Erklärt er, warum? Oder zeigt er an einem genauen Fall, wie es aussehen könnte? Signalwörter helfen dir dabei.","erklaerung":"Die Meinung sagt, was man sich wünscht: einen Schulgarten und eigene Beete. „Denn“ und „weil“ leiten Gründe ein. Die Beispiele zeigen ganz genau, was man im Garten tun und beobachten könnte."},{"id":"sc-meinung-04","typ":"single","stufe":2,"kompetenz":"planen","frage":"Die Klasse 4c möchte in der Regenpause in die Turnhalle. Welcher Satz ist höflich und überzeugend?","optionen":[{"text":"Wir würden uns freuen, die Turnhalle in der Regenpause nutzen zu dürfen, weil wir uns dann bewegen können.","richtig":true},{"text":"Wir wollen in der Regenpause sofort in die Turnhalle, sonst machen wir beim Schulfest einfach nicht mehr mit!","richtig":false},{"text":"Bitte, bitte, bitte lassen Sie uns in der Regenpause in die Turnhalle, das wäre echt mega cool!","richtig":false},{"text":"Die Turnhalle in der Regenpause wäre vielleicht ganz schön, aber eigentlich ist es uns auch egal.","richtig":false}],"tipp":"Ein überzeugender Satz ist freundlich und nennt einen Grund. Prüfe jeden Satz auf beides.","erklaerung":"Nur „Wir würden uns freuen …“ ist freundlich und nennt einen Grund: Bewegung. Die anderen Sätze drohen, betteln ohne Grund oder zeigen keinen klaren Standpunkt."},{"id":"sc-meinung-05","typ":"markieren","stufe":3,"kompetenz":"planen","frage":"Emir hat eine E-Mail an die Schulleiterin geschrieben. Tippe die drei Stellen an, die zu locker oder unhöflich sind.","teile":[{"t":"Hi Frau Kaya!","ziel":true},{"t":"Wir, die Klasse 4a, wünschen uns einen Trinkbrunnen im Schulhaus."},{"t":"Viele Kinder vergessen ihre Trinkflasche und haben dann im Unterricht Durst."},{"t":"Ehrlich, das ist voll nervig und total unfair!","ziel":true},{"t":"Ein Trinkbrunnen würde außerdem viele Plastikflaschen sparen."},{"t":"Wir würden uns sehr über Ihre Antwort freuen."},{"t":"Tschüss!","ziel":true},{"t":"Emir für die Klasse 4a"}],"tipp":"Lies die E-Mail so, als wärst du die Schulleiterin. Achte besonders auf Anrede, Gruß und Wörter aus der Umgangssprache.","erklaerung":"„Hi“ und „Tschüss“ sind für die Schulleiterin zu locker – besser sind „Sehr geehrte Frau Kaya,“ und „Mit freundlichen Grüßen“. „Voll nervig und total unfair“ klingt wie ein Vorwurf und überzeugt nicht."},{"id":"sc-meinung-06","typ":"multi","stufe":3,"kompetenz":"planen","frage":"Ben möchte die Schulleiterin überzeugen, dass seine Klasse in den Kletterwald fahren darf. Welche Argumente sind sachlich und überzeugend?","optionen":[{"text":"Im Kletterwald müssen wir zusammenhalten. Das stärkt unsere Klassengemeinschaft.","richtig":true},{"text":"Der Eintritt kostet nur 8 € pro Kind, und mit dem Bus sind wir in 20 Minuten dort.","richtig":true},{"text":"Ausgebildete Trainer erklären uns vorher genau, wie wir uns richtig sichern.","richtig":true},{"text":"Alle anderen Klassen dürfen sowieso immer viel mehr als wir, das ist ungerecht.","richtig":false},{"text":"Klettern ist einfach cool, das weiß doch jeder in unserer Klasse.","richtig":false},{"text":"Wenn wir nicht in den Kletterwald dürfen, sind wir eben alle beleidigt.","richtig":false}],"tipp":"Stell dir vor, du bist die Schulleiterin. Welche Sätze nennen einen echten Vorteil, den du nachprüfen kannst?","erklaerung":"Klassengemeinschaft, niedrige Kosten mit kurzer Fahrt und die Sicherheit durch Trainer sind echte Gründe. Ein Vorwurf, „das weiß doch jeder“ und die Drohung, beleidigt zu sein, überzeugen niemanden."}]},{"id":"sc-ueberarbeiten","titel":"Texte überarbeiten","kurz":"Wortwiederholungen ersetzen, Fehler finden, Absätze und Satzzeichen prüfen","kompetenz":"ueberarbeiten","wissen":{"merksatz":"Kein Text ist sofort perfekt! Lies deinen Text noch einmal mit einem bestimmten <b>Überarbeitungsziel<\/b>: Wiederholungen? Fehler? Absätze? Satzzeichen? Dann verbessere ihn Schritt für Schritt.","punkte":["Wortwiederholungen ersetzen: Statt dreimal „der Hund“ schreibst du „er“, „das Tier“ oder den Namen des Hundes. Achte darauf, dass klar bleibt, wen du meinst.","Fehler finden: Lies langsam Wort für Wort, am besten halblaut. Prüfe die Großschreibung von Nomen und Satzanfängen.","Absätze: Beginne eine neue Zeile, wenn ein neuer Teil beginnt oder wenn Zeit oder Ort wechseln.","Satzzeichen: Jeder Satz endet mit Punkt, Fragezeichen oder Ausrufezeichen. Wörtliche Rede steht in Anführungszeichen.","Nimm dir für jeden Durchgang ein Ziel vor, zum Beispiel: „Jetzt achte ich nur auf die Satzanfänge.“"],"beispiele":["der Hund → er, das Tier, der Vierbeiner","das Fahrrad → es, das Rad","„Komm her!“, rief Ben.","Ben rief: „Komm her!“","neue Zeit oder neuer Ort → neuer Absatz"]},"items":[{"id":"sc-ueberarbeiten-01","typ":"zuordnen","stufe":1,"kompetenz":"ueberarbeiten","frage":"Amira schreibt über ihren Dackel Bruno und ihre Katze Minka. Welche Wörter können „der Hund“ ersetzen, welche „die Katze“? Sortiere.","gruppen":["statt „der Hund“","statt „die Katze“"],"elemente":[{"t":"er","g":0},{"t":"Bruno","g":0},{"t":"der Dackel","g":0},{"t":"der kleine Kläffer","g":0},{"t":"sie","g":1},{"t":"Minka","g":1},{"t":"die Samtpfote","g":1},{"t":"der Stubentiger","g":1}],"tipp":"Frage dich bei jedem Wort: Passt es nur zu einem Hund oder nur zu einer Katze? Verlass dich nicht allein auf den Begleiter „der“ oder „die“.","erklaerung":"„Er“ und „Bruno“ stehen für den Hund, „sie“ und „Minka“ für die Katze. Ein Dackel ist ein Hund, und ein Kläffer bellt – das passt nur zu Bruno. „Samtpfote“ und „Stubentiger“ sind Spitznamen für Katzen, auch wenn es „der Stubentiger“ heißt."},{"id":"sc-ueberarbeiten-02","typ":"single","stufe":1,"kompetenz":"ueberarbeiten","frage":"Worauf sollte Ben beim Überarbeiten dieses Textes vor allem achten?","vorgabe":"Wir gingen ins Kino. Das Kino war ganz voll. Im Kino roch es nach Popcorn.","optionen":[{"text":"auf Wortwiederholungen","richtig":true},{"text":"auf die Satzzeichen","richtig":false},{"text":"auf die Großschreibung","richtig":false},{"text":"auf die Zeitform","richtig":false}],"tipp":"Lies den Text halblaut vor und achte auf jedes einzelne Wort. Was klingt beim Zuhören langweilig?","erklaerung":"Das Wort „Kino“ steht dreimal hintereinander. Satzzeichen, Großschreibung und Zeitform stimmen schon. Besser: „Es war ganz voll. Drinnen roch es nach Popcorn.“"},{"id":"sc-ueberarbeiten-03","typ":"luecke","stufe":2,"kompetenz":"ueberarbeiten","frage":"Damit sich „Elefant“, „Pinguine“ und „Löwe“ nicht wiederholen, brauchst du Ersatzwörter. Wähle jeweils das passende Wort.","teile":[{"t":"Im Zoo sahen wir zuerst einen Elefanten. "},{"wahl":["Der Dickhäuter","Der Vogel","Die Raubkatze"],"loesung":0},{"t":" spritzte sich mit seinem Rüssel nass. Danach besuchten wir die Pinguine. "},{"wahl":["Die Frackträger","Die Dickhäuter","Die Raubkatzen"],"loesung":0},{"t":" watschelten über die Felsen. Zum Schluss beobachteten wir einen Löwen. "},{"wahl":["Die Raubkatze","Der Dickhäuter","Der Vogel"],"loesung":0},{"t":" gähnte laut."}],"tipp":"Jedes Ersatzwort beschreibt eine Besonderheit des Tieres. Denke an die Haut, das Aussehen und die Tierfamilie.","erklaerung":"Elefanten haben eine sehr dicke Haut – man nennt sie auch Dickhäuter. Pinguine sehen mit ihrem schwarz-weißen Gefieder aus, als hätten sie einen Frack an – einen festlichen Anzug. Löwen gehören zu den Raubkatzen."},{"id":"sc-ueberarbeiten-04","typ":"multi","stufe":2,"kompetenz":"ueberarbeiten","frage":"Welche Sätze mit wörtlicher Rede sind richtig geschrieben?","optionen":[{"text":"„Wo ist mein Schlüssel?“, fragte Paul.","richtig":true},{"text":"Mama rief: „Das Essen ist fertig!“","richtig":true},{"text":"„Wo ist mein Schlüssel“, fragte Paul?","richtig":false},{"text":"„Komm schnell her!“ rief Noah.","richtig":false},{"text":"Mia sagte: „ich habe großen Hunger.“","richtig":false}],"tipp":"Prüfe bei jedem Satz: Steht das Satzzeichen der Rede innerhalb der Anführungszeichen? Steht ein Komma vor dem nachgestellten Begleitsatz? Beginnt die Rede groß?","erklaerung":"Richtig: In Pauls Frage steht das Fragezeichen in der Rede und danach ein Komma. Bei Mama steht vor der Rede ein Doppelpunkt. Falsch: Das Fragezeichen hinter „Paul“ gehört in die Rede, nach Noahs Rede fehlt das Komma, und Mias Rede muss groß beginnen."},{"id":"sc-ueberarbeiten-05","typ":"markieren","stufe":3,"kompetenz":"ueberarbeiten","frage":"In diesem Text von Felix sind drei Wörter falsch geschrieben. Tippe sie an.","teile":[{"t":"Am"},{"t":"Wochenende"},{"t":"fuhren"},{"t":"wir"},{"t":"mit"},{"t":"dem"},{"t":"Fahrrad"},{"t":"zum"},{"t":"see","ziel":true},{"t":".","fix":true},{"t":"Dort"},{"t":"war"},{"t":"es"},{"t":"sehr"},{"t":"heis","ziel":true},{"t":".","fix":true},{"t":"Wir"},{"t":"sprangen"},{"t":"sofort"},{"t":"ins"},{"t":"kühle"},{"t":"Wasser"},{"t":".","fix":true},{"t":"Danach"},{"t":"assen","ziel":true},{"t":"wir"},{"t":"ein"},{"t":"Eis"},{"t":".","fix":true}],"tipp":"Lies langsam Wort für Wort. Prüfe bei jedem Wort: Ist es ein Nomen? Wird es mit s, ss oder ß geschrieben?","erklaerung":"Richtig heißt es „See“ (Nomen schreibt man groß), „heiß“ und „aßen“ (nach einem langen Vokal oder ei steht hier ß)."},{"id":"sc-ueberarbeiten-06","typ":"single","stufe":3,"kompetenz":"ueberarbeiten","frage":"Emir möchte seinen Text in zwei Absätze teilen. Vor welchem Satz sollte der zweite Absatz beginnen?","vorgabe":"(1) Am Samstag fuhr ich mit Oma auf den Christkindlmarkt. (2) Dort duftete es nach gebrannten Mandeln. (3) Wir kauften Lebkuchen und einen Holzstern. (4) Am nächsten Morgen lag draußen dicker Schnee. (5) Sofort zog ich mich warm an und baute im Garten einen Schneemann.","optionen":[{"text":"vor Satz 2","richtig":false},{"text":"vor Satz 3","richtig":false},{"text":"vor Satz 4","richtig":true},{"text":"vor Satz 5","richtig":false}],"tipp":"Ein neuer Absatz beginnt, wenn ein neuer Abschnitt anfängt – zum Beispiel, wenn sich Zeit und Ort ändern.","erklaerung":"Mit Satz 4 beginnt ein neuer Tag an einem anderen Ort: am nächsten Morgen zu Hause im Schnee. Die Sätze 1 bis 3 gehören zusammen, weil sie alle auf dem Christkindlmarkt spielen."}]}],"auftraege":[{"id":"sa-fantasie","titel":"Der leuchtende Schlüssel","textsorte":"Fantasieerzählung","auftrag":"Beim Aufräumen auf dem Dachboden findest du in einer alten Kiste einen goldenen Schlüssel. Als du ihn berührst, beginnt er geheimnisvoll zu leuchten … Schreibe eine spannende Fantasieerzählung. Die Bildzeichen über dem Auftrag geben dir Ideen, wohin dich der Schlüssel führen könnte.","impuls":"🗝️✨🚪☁️🏰🐉","planung":["Wer ist die Hauptfigur, und wer ist noch dabei?","Wo und wann beginnt die Geschichte?","Was passiert, als der Schlüssel zu leuchten beginnt?","Welches Abenteuer oder Problem gibt es? Was ist der Höhepunkt?","Wie geht die Geschichte aus?","Welche Überschrift macht neugierig, ohne das Ende zu verraten?"],"woerter":["plötzlich","auf einmal","im letzten Moment","geheimnisvoll","funkelte","schimmerte","flüsterte","staunte","knarrte","vorsichtig","mein Herz klopfte","verzaubert","schwebte","erleichtert"],"checkliste":["Meine Erzählung hat eine Überschrift, die neugierig macht.","In der Einleitung erfährt man, wer dabei ist, wo und wann alles beginnt.","Im Hauptteil steigt die Spannung bis zum Höhepunkt.","Im Schluss erzähle ich, wie das Abenteuer ausgeht.","Ich verwende treffende Verben und anschauliche Adjektive.","Meine Figuren sprechen in wörtlicher Rede mit Anführungszeichen.","Meine Satzanfänge sind abwechslungsreich.","Ich erzähle im Präteritum. Die wörtliche Rede darf im Präsens stehen."],"minWoerter":120},{"id":"sa-erlebnis","titel":"Ein Erlebnis, das ich nie vergesse","textsorte":"Erlebniserzählung","auftrag":"Erzähle von einem Erlebnis, das du nicht vergessen wirst – zum Beispiel aus dem Schullandheim, von einem Turnier oder von einem Ausflug. Schreibe so, dass deine Leser alles miterleben, als wären sie dabei gewesen. Erzähle in der Ich-Form und im Präteritum.","impuls":"🏕️⚽🎢🎤😲","planung":["Welches Erlebnis wähle ich? Was war der aufregendste Moment?","Wer war dabei? Wo und wann war das?","Was geschah Schritt für Schritt bis zum Höhepunkt?","Was habe ich in diesem Moment gedacht und gefühlt?","Wie ging es aus, und wie fühlte ich mich danach?"],"woerter":["aufgeregt","gespannt","mein Herz pochte","ich hielt die Luft an","kurz darauf","nachdem","schließlich","rief","jubelte","stolperte","zitterte","im nächsten Moment","vor Freude","erleichtert"],"checkliste":["Ich erzähle in der Ich-Form und im Präteritum.","Meine Einleitung beantwortet die Fragen Wer? Wo? Wann?","Ich erzähle Schritt für Schritt bis zum spannendsten Moment.","Ich zeige meine Gefühle und Gedanken.","Ich verwende wörtliche Rede.","Meine Satzanfänge sind abwechslungsreich – nicht immer „Dann“.","Ich habe Absätze für Einleitung, Hauptteil und Schluss gemacht.","Meine Überschrift passt und verrät nicht das Ende."],"minWoert
