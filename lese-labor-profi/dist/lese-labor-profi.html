er":110},{"id":"sa-bericht","titel":"Bericht vom Sommerfest","textsorte":"Bericht","auftrag":"Stell dir vor, an deiner Schule fand am Freitag das Sommerfest statt. Schreibe für die Schülerzeitung „Pausenpost“ einen Bericht darüber. Nutze die Wörter im Wortspeicher und denke dir passende Einzelheiten aus. Berichte aber so sachlich und genau wie in einer echten Zeitung und in der richtigen zeitlichen Reihenfolge.","impuls":"🎪🧇🎵🎟️📰","planung":["Was fand statt? Wann und wo?","Wer hat das Fest vorbereitet, und wer war dabei?","Was geschah nacheinander? Notiere die Reihenfolge mit Uhrzeiten.","Gab es etwas Besonderes, zum Beispiel einen Auftritt oder eine Tombola?","Welches Ergebnis gab es am Ende, zum Beispiel einen Erlös für einen guten Zweck?","Welche Überschrift sagt kurz und genau, worum es geht?"],"woerter":["fand statt","um 14:00 Uhr","auf dem Pausenhof","eröffnete","die Schulleiterin","der Elternbeirat","die Spielstationen","der Schulchor","die Tombola","anschließend","gegen Abend","der Erlös","spendete","insgesamt"],"checkliste":["Mein Bericht beantwortet die W-Fragen: Wer? Was? Wann? Wo? Wie? Warum?","Ich berichte in der richtigen zeitlichen Reihenfolge.","Ich schreibe sachlich – ohne Spannungswörter und ohne meine Gefühle.","Ich verwende keine wörtliche Rede.","Ich schreibe im Präteritum.","Ich nenne genaue Angaben wie Uhrzeiten, Orte und Zahlen.","Meine Überschrift sagt kurz, worum es geht."],"minWoerter":90},{"id":"sa-brief","titel":"Ein Wunsch an die Schulleitung","textsorte":"Brief als E-Mail","auftrag":"Was würde eure Schule noch schöner machen? Vielleicht ein Trinkbrunnen, eine Lesekiste für die Regenpause oder ein Schulgarten? Schreibe eine E-Mail an die Schulleiterin Frau Kaya. Nenne deinen Wunsch, begründe ihn mit mindestens zwei Gründen und bleibe dabei höflich.","impuls":"✉️🏫💡🌻📚","planung":["Was wünsche ich mir genau?","Welcher Betreff sagt kurz, worum es geht?","Mit welcher Anrede beginne ich?","Welche Gründe sprechen für meinen Wunsch? Notiere mindestens zwei.","Welches Beispiel macht einen Grund anschaulich?","Wie bedanke ich mich, und mit welchem Gruß ende ich?"],"woerter":["Sehr geehrte Frau Kaya","ich wünsche mir","meiner Meinung nach","weil","außerdem","ein weiterer Grund ist","zum Beispiel","deshalb","dadurch","wir würden uns sehr freuen","Ihre Antwort","vielen Dank","Mit freundlichen Grüßen"],"checkliste":["Meine E-Mail hat einen Betreff, der kurz sagt, worum es geht.","Ich beginne mit einer höflichen Anrede und setze danach ein Komma.","Ich sage klar, was ich mir wünsche.","Ich nenne mindestens zwei Gründe.","Ich mache mindestens einen Grund mit einem Beispiel anschaulich.","Ich bleibe höflich und schreibe „Sie“ und „Ihnen“ groß.","Am Schluss bedanke ich mich und verabschiede mich mit einem Gruß und meinem Namen.","Ich habe meine E-Mail noch einmal auf Fehler durchgelesen."],"minWoerter":80}]},"tempo":{"saetze":[{"t":"Im Frühling blühen auf vielen Wiesen bunte Blumen.","r":true},{"t":"Ein Radiergummi macht Bleistiftstriche auf dem Papier dicker und dunkler.","r":false},{"t":"Ein Specht klopft mit seinem Schnabel Löcher in Baumstämme.","r":true},{"t":"In der Pause essen viele Kinder ihre Brotzeit.","r":true},{"t":"Eine reife Zitrone schmeckt genauso süß wie Honig.","r":false},{"t":"Ein Eichhörnchen sammelt im Herbst Nüsse für den Winter.","r":true},{"t":"In jeder Woche kommt der Montag direkt nach dem Dienstag.","r":false},{"t":"Mit ihrem langen Hals kommt die Giraffe an hohe Blätter heran.","r":true},{"t":"Ein Elefant ist viel kleiner als eine Maus.","r":false},{"t":"Mit einem Lineal kann man gerade Linien zeichnen.","r":true},{"t":"Am hellsten scheint die Sonne mitten in der Nacht.","r":false},{"t":"Ein Schneemann schmilzt, wenn es draußen sehr warm wird.","r":true},{"t":"Enten schwimmen gern auf Teichen und Seen herum.","r":true},{"t":"Eine Brille hilft manchen Menschen, besser zu sehen.","r":true},{"t":"Zum Schwimmen im Freibad zieht man einen dicken Wintermantel an.","r":false},{"t":"Bei einem Gewitter kann man Blitze sehen und Donner hören.","r":true},{"t":"Unser Mund hilft uns beim Essen, Trinken und Sprechen.","r":true},{"t":"Regentropfen fallen von der Erde nach oben in die Wolken.","r":false},{"t":"Ein Fußball hat Ecken und Kanten wie ein Würfel.","r":false},{"t":"Ein Kaninchen kann mit seinen Hinterbeinen weit springen.","r":true},{"t":"Wenn Bananen reif sind, wird ihre Schale meistens blau.","r":false},{"t":"Ein Kissen aus Federn ist härter als ein Stein.","r":false},{"t":"Ein neugeborenes Baby ist größer als seine Mutter.","r":false},{"t":"Ein Fisch hat keine Beine, sondern Flossen zum Schwimmen.","r":true},{"t":"Wir Menschen sehen mit den Ohren und hören mit den Augen.","r":false},{"t":"Viele Marienkäfer sind rot und haben schwarze Punkte.","r":true},{"t":"Eine Ameise kann ein ganzes Haus auf dem Rücken tragen.","r":false},{"t":"Auf den Herbst folgt im Jahreslauf immer der Winter.","r":true},{"t":"Im Sommer ist es meistens kälter als im Winter.","r":false},{"t":"Ein Wal ist das kleinste Tier im Meer.","r":false},{"t":"Ein Meter ist länger als ein Zentimeter, aber kürzer als ein Kilometer.","r":true},{"t":"Ein Hund kann mit seiner feinen Nase viel besser riechen als ein Mensch.","r":true},{"t":"Kühe stehen tagsüber oft auf der Weide und fressen dort Gras und Kräuter.","r":true},{"t":"Je öfter man das Lesen übt, desto schlechter und langsamer kann man lesen.","r":false},{"t":"Im eisigen Januar ist das Wasser im See am wärmsten und lädt zum Baden ein.","r":false},{"t":"Ein Igel hält im Sommer einen langen Winterschlaf, weil es dann so heiß ist.","r":false},{"t":"Wenn heute Mittwoch ist, dann ist morgen Donnerstag, und gestern war Freitag.","r":false},{"t":"Im Sommer sind die Tage länger als im Winter, deshalb ist es abends lange hell.","r":true},{"t":"Ein Eiswürfel, den man in der warmen Hand hält, wird mit der Zeit immer größer.","r":false},{"t":"Wirft man einen Ball hoch in die Luft, fällt er kurz danach wieder auf den Boden.","r":true},{"t":"Wenn heute Freitag ist, dann ist morgen Samstag, und übermorgen ist schon Sonntag.","r":true},{"t":"Nudeln werden vor dem Essen in der Gefriertruhe gekocht, bis sie schön weich sind.","r":false},{"t":"In der Bücherei kann man sich Bücher ausleihen und sie später wieder zurückbringen.","r":true},{"t":"Eine Katze, die sich wohlfühlt, bellt so laut wie ein großer Schäferhund im Garten.","r":false},{"t":"Für ihr Nest sammeln viele Vögel kleine Zweige, Moos, Gras und manchmal auch Federn.","r":true},{"t":"Weil Igel nachts auf Futtersuche gehen, sieht man sie tagsüber nur selten im Garten.","r":true},{"t":"Ein ganzes Jahr dauert zwar länger als ein Monat, aber kürzer als eine einzige Woche.","r":false},{"t":"Wenn es draußen dunkel wird, schalten viele Menschen in ihren Wohnungen das Licht an.","r":true},{"t":"Eine Schildkröte ist das schnellste Tier der Welt und überholt mühelos jedes Rennauto.","r":false},{"t":"Wenn man im Winter die Fenster lange weit offen lässt, wird es im Zimmer immer wärmer.","r":false},{"t":"Ein Korken schwimmt auf dem Wasser, ein Kieselstein dagegen sinkt sofort auf den Grund.","r":true},{"t":"Wer sich auf dem Pausenhof das Knie aufschürft, bekommt oft ein Pflaster auf die Wunde.","r":true},{"t":"Wer abends spät ins Bett geht und früh aufstehen muss, ist am nächsten Morgen oft müde.","r":true},{"t":"Wer seine Hausaufgaben vergessen hat, bekommt dafür in der Schule immer eine Belohnung.","r":false},{"t":"Wenn man im Dunkeln eine Taschenlampe einschaltet, wird es ringsherum noch viel dunkler.","r":false},{"t":"Nach dem Sportunterricht haben viele Kinder Durst und trinken gern einen Schluck Wasser.","r":true},{"t":"Ein Kind, das zehn Jahre alt ist, ist älter als ein Kind, das schon zwölf Jahre alt ist.","r":false},{"t":"Damit Milch im Sommer länger frisch bleibt, stellt man sie am besten in die warme Sonne.","r":false},{"t":"Im Winter ziehen viele Menschen kurze Hosen und Sandalen an, weil es draußen so kalt ist.","r":false},{"t":"Ein Thermometer zeigt an, wie warm oder kalt es ist, und eine Waage zeigt das Gewicht an.","r":true},{"t":"Ein Regenwurm hat ein buntes Federkleid und singt morgens laut auf den Dächern der Stadt.","r":false},{"t":"Weil Pflanzen Wasser zum Wachsen brauchen, gießt man Blumen an heißen Tagen besonders oft.","r":true},{"t":"Kinder, die morgens viel zu lange schlafen, kommen deshalb besonders früh in der Schule an.","r":false},{"t":"Je weiter man sich von einer lauten Blaskapelle entfernt, desto leiser hört man ihre Musik.","r":true},{"t":"Wer krank ist und hohes Fieber hat, sollte im Bett bleiben, sich ausruhen und viel trinken.","r":true},{"t":"Das Wasser im Topf fängt erst an zu kochen, wenn man die Herdplatte ganz ausgeschaltet hat.","r":false},{"t":"Weil es im Kino ganz still sein soll, unterhalten sich alle Zuschauer während des Films laut.","r":false},{"t":"Weil Schnee aus gefrorenem Wasser besteht, wird er zu Wasser, wenn die Sonne ihn lange wärmt.","r":true},{"t":"Auf einem Kalender kann man nachsehen, an welchem Wochentag man in diesem Jahr Geburtstag hat.","r":true},{"t":"Nachdem man sich die Hände gründlich mit Seife gewaschen hat, sind sie schmutziger als vorher.","r":false},{"t":"Bevor man über die Straße geht, schaut man nach links, nach rechts und noch einmal nach links.","r":true},{"t":"Ein Fahrradhelm schützt den Kopf nur dann gut, wenn er fest sitzt und richtig eingestellt ist.","r":true},{"t":"Wer beim Wandern seinen Müll einfach in den Wald wirft, schützt damit die Tiere und die Natur.","r":false},{"t":"Je länger man einen Apfel im warmen Zimmer liegen lässt, desto frischer und knackiger wird er.","r":false},{"t":"Im Herbst färben sich die Blätter vieler Bäume gelb, orange oder rot, bevor sie herunterfallen.","r":true},{"t":"Wenn man einen Teelöffel Zucker in heißen Tee rührt, schmeckt der Tee danach saurer als vorher.","r":false},{"t":"Wenn es im Winter viel geschneit hat, können Kinder mit dem Schlitten einen Hügel hinunterfahren.","r":true},{"t":"Wenn eine Kerze lange brennt, wird sie mit der Zeit immer kürzer, weil das Wachs verbraucht wird.","r":true},{"t":"Wenn man im Schwimmbad untertaucht und die Luft anhält, kann man stundenlang unter Wasser bleiben.","r":false},{"t":"Wenn man einen Apfel in zwei Hälften schneidet und eine davon isst, bleibt noch eine Hälfte übrig.","r":true},{"t":"Wenn man eine Pizza in vier gleich große Stücke teilt, ist jedes Stück größer als die halbe Pizza.","r":false},{"t":"Weil Fahrradfahren ohne Licht im Dunkeln gefährlich ist, schaltet man abends das Fahrradlicht aus.","r":false},{"t":"Wenn man einen Luftballon immer weiter aufbläst, kann er irgendwann mit einem lauten Knall platzen.","r":true},{"t":"Wer im Freibad vom Sprungturm springen will, sollte vorher prüfen, ob das Becken darunter frei ist.","r":true},{"t":"Wer beim Wandertag bei großer Hitze lange unterwegs ist, sollte genug zu trinken im Rucksack haben.","r":true},{"t":"Die Kinder dürfen jetzt über die Straße gehen, weil die Fußgängerampel gerade auf Rot geschaltet hat.","r":false},{"t":"Weil Elefanten sehr schwer sind, können sie sich mühelos auf einen dünnen Ast in der Baumkrone setzen.","r":false},{"t":"Wenn man einen Brief verschicken will, klebt man eine Briefmarke darauf und wirft ihn in den Briefkasten.","r":true},{"t":"Weil es seit dem frühen Morgen stark regnet, bleiben die Straßen und Gehwege in der ganzen Stadt trocken.","r":false},{"t":"Während der Klassenfahrt ins Schullandheim schlafen alle Kinder jede Nacht zu Hause in ihren eigenen Betten.","r":false}]},"blitz":{"woerter":[{"id":"bw-biene","wort":"Biene","silben":2,"bild":{"e":"🐝","name":"Biene"},"ablenker":[{"e":"🍐","name":"Birne"},{"e":"🦋","name":"Schmetterling"},{"e":"🌸","name":"Blüte"}]},{"id":"bw-birne","wort":"Birne","silben":2,"bild":{"e":"🍐","name":"Birne"},"ablenker":[{"e":"🐝","name":"Biene"},{"e":"🍎","name":"Apfel"},{"e":"🍌","name":"Banane"}]},{"id":"bw-hose","wort":"Hose","silben":2,"bild":{"e":"👖","name":"Hose"},"ablenker":[{"e":"🌹","name":"Rose"},{"e":"🥫","name":   const a = arr.slice();

function permutation(n, nieIdentisch = false) {

/* ---------- Tagesmission ---------- */
function tagesMission() {
  const p = P(); if (!p) return null;
  const t = heute();
  if (p.mission && p.mission.datum === t && p.mission.ids.every((id) => REG.items[id])) return p.mission;
  const rnd = rng(p.id + t);
  const ids = [];
  const nimm = (id) => { if (id && !ids.includes(id) && ids.length < 10) ids.push(id); };
  fehlerKiste(p).slice(0, 3).forEach(nimm);
  faelligeWiederholungen(p).slice(0, 2).forEach(nimm);
  const reihen = mische(MODULE.filter((m) => m.id !== 'tempo'), rnd).map((m) => {
    const alle = REG.module[m.id].items;
    const neu = mische(alle.filter((id) => itemStatus(id, p) === 'neu'), rnd);
    const rest = mische(alle.filter((id) => itemStatus(id, p) !== 'neu'), rnd);
    // Digitale Fälle und Texte: zusammenhängend wählen (eine Gruppe), damit die Quelle passt
    return neu.concat(rest);
  });
  let runde = 0;
  while (ids.length < 10 && reihen.some((r) => r.length) && runde < 50) {
    for (const r of reihen) if (r.length) nimm(r.shift());
    runde++;
  }
  // nach Quelle gruppieren, damit Fälle/Texte nicht ständig wechseln
  const reihenfolge = ids.slice().sort((a, b) => {
    const ga = REG.items[a].modul + REG.items[a].gruppe, gb = REG.items[b].modul + REG.items[b].gruppe;
    return ga < gb ? -1 : ga > gb ? 1 : 0;

/* ===== Aufgaben: Darstellung, Eingabe und Auswertung aller Aufgabentypen ===== */
const PUNKT_DAVOR = /^[.,!?;:)\]»“"'…]/;
const KEIN_LEER_DANACH = /[„(«‚\[]$/;

/** Zufällige Anzeigereihenfolge für eine Aufgabe (wird pro Sitzung gemerkt). */
function neuePerm(it) {
  const p = {};
  if (it.typ === 'single' || it.typ === 'multi') p.opt = permutation((it.optionen || []).length);
  if (it.typ === 'luecke') p.gaps = (it.teile || []).filter((t) => t.wahl).map((t) => permutation(t.wahl.length));
  if (it.typ === 'zuordnen') p.el = permutation((it.elemente || []).length);
  if (it.typ === 'reihenfolge') p.reihe = permutation((it.reihe || []).length, true);
  return p;
}
function leereAntwort(it, perm) {
  switch (it.typ) {
    case 'single': return null;
    case 'multi': return [];
    case 'matrix': return (it.aussagen || []).map(() => null);
    case 'luecke': return (it.teile || []).filter((t) => t.wahl).map(() => null);
    case 'markieren': return [];
    case 'zuordnen': return (it.elemente || []).map(() => -1);
    case 'reihenfolge': return { ordnung: (perm && perm.reihe) ? perm.reihe.slice() : (it.reihe || []).map((_, i) => i), beruehrt: false };
    case 'eingabe': return '';
    default: return null;
  }
}
/** Gespeicherte Anzeige-Reihenfolge prüfen (z. B. nach Import oder geänderten Inhalten). */
function sicherePerm(it, p) {
  const ok = (arr, n) => Array.isArray(arr) && arr.length === n && new Set(arr).size === n && arr.every((v) => Number.isInteger(v) && v >= 0 && v < n);
  const neu = neuePerm(it);
  if (!p || typeof p !== 'object') return neu;
  if (neu.opt && !ok(p.opt, neu.opt.length)) return neu;
  if (neu.gaps && !(Array.isArray(p.gaps) && p.gaps.length === neu.gaps.length && p.gaps.every((g, i) => ok(g, neu.gaps[i].length)))) return neu;
  if (neu.el && !ok(p.el, neu.el.length)) return neu;
  if (neu.reihe && !ok(p.reihe, neu.reihe.length)) return neu;
  return p;
}
/** Gespeicherte Antwort auf die passende Form prüfen; sonst leere Antwort. */
function sichereAntwort(it, a, perm) {
  const leer = leereAntwort(it, perm);
  const idx = (v, n) => Number.isInteger(v) && v >= 0 && v < n;
  try {
    switch (it.typ) {
      case 'single': return a === null || idx(a, it.optionen.length) ? a : leer;
      case 'multi': return Array.isArray(a) && a.every((v) => idx(v, it.optionen.length)) ? Array.from(new Set(a)) : leer;
      case 'matrix': return Array.isArray(a) && a.length === it.aussagen.length && a.every((v) => v === null || v === 0 || v === 1) ? a : leer;
      case 'luecke': { const g = it.teile.filter((t) => t.wahl); return Array.isArray(a) && a.length === g.length && a.every((v, i) => v === null || idx(v, g[i].wahl.length)) ? a : leer; }
      case 'markieren': return Array.isArray(a) && a.every((v) => idx(v, it.teile.length)) ? Array.from(new Set(a)) : leer;
      case 'zuordnen': return Array.isArray(a) && a.length === it.elemente.length && a.every((v) => v === -1 || idx(v, it.gruppen.length)) ? a : leer;
      case 'reihenfolge': { const n = it.reihe.length; return a && Array.isArray(a.ordnung) && a.ordnung.length === n && new Set(a.ordnung).size === n && a.ordnung.every((v) => idx(v, n)) ? { ordnung: a.ordnung, beruehrt: !!a.beruehrt } : leer; }
      case 'eingabe': return typeof a === 'string' ? a.slice(0, 200) : leer;
      default: return leer;
    }
  } catch (e) { return leer; }
}
function antwortStand(it, a) {
  if (a == null) return 'leer';
  switch (it.typ) {
    case 'single': return a == null ? 'leer' : 'voll';
    case 'multi': case 'markieren': return a.length ? 'voll' : 'leer';
    case 'matrix': case 'luecke': { const n = a.filter((x) => x != null).length; return n === 0 ? 'leer' : n === a.length ? 'voll' : 'teil'; }
    case 'zuordnen': { const n = a.filter((x) => x >= 0).length; return n === 0 ? 'leer' : n === a.length ? 'voll' : 'teil'; }
    case 'reihenfolge': return a.beruehrt ? 'voll' : 'leer';
    case 'eingabe': return String(a).trim() ? 'voll' : 'leer';
    default: return 'leer';
  }
}
function normEingabe(s) { return String(s || '').replace(/[‘’‚]/g, "'").replace(/[“”„]/g, '"').replace(/\s+/g, ' ').trim(); }

/** Auswertung: status richtig | teilweise | falsch | leer */
function bewerte(it, a) {
  const stand = antwortStand(it, a);
  if (stand === 'leer') return { status: 'leer', richtigAnz: 0, gesamt: 1 };
  const aus = (ok, n, extra = {}) => ({ status: ok === n ? 'richtig' : ok >= Math.ceil(n / 2) && ok > 0 ? 'teilweise' : 'falsch', richtigAnz: ok, gesamt: n, ...extra });
  switch (it.typ) {
    case 'single': return { status: it.optionen[a] && it.optionen[a].richtig ? 'richtig' : 'falsch', richtigAnz: 0, gesamt: 1 };
    case 'multi': {
      const soll = it.optionen.map((o, i) => (o.richtig ? i : -1)).filter((i) => i >= 0);
      const tp = a.filter((i) => soll.includes(i)).length, fp = a.length - tp;
      if (tp === soll.length && fp === 0) return { status: 'richtig', tp, fp, n: soll.length, richtigAnz: tp, gesamt: soll.length };
      return { status: tp > 0 && tp - fp >= Math.ceil(soll.length / 2) ? 'teilweise' : 'falsch', tp, fp, n: soll.length, richtigAnz: tp, gesamt: soll.length };
    }
    case 'matrix': {
      const n = it.aussagen.length, ok = it.aussagen.filter((s, z) => a[z] === (s.richtig ? 0 : 1)).length;
      if (ok === n) return { status: 'richtig', richtigAnz: ok, gesamt: n };
      const ueberall = new Set(a).size === 1; // überall dieselbe Spalte ist Raten
      return { status: !ueberall && n >= 3 && ok >= n - 1 ? 'teilweise' : 'falsch', richtigAnz: ok, gesamt: n };
    }
    case 'luecke': { const g = it.teile.filter((t) => t.wahl); return aus(g.filter((t, i) => a[i] === t.loesung).length, g.length); }
    case 'markieren': {
      const ziele = it.teile.map((t, k) => (t.ziel ? k : -1)).filter((k) => k >= 0);
      const tp = a.filter((k) => ziele.includes(k)).length, fp = a.length - tp;
      if (tp === ziele.length && fp === 0) return { status: 'richtig', tp, fp, n: ziele.length, richtigAnz: tp, gesamt: ziele.length };
      return { status: tp > 0 && tp - fp >= Math.ceil(ziele.length / 2) ? 'teilweise' : 'falsch', tp, fp, n: ziele.length, richtigAnz: tp, gesamt: ziele.length };
    }
    case 'zuordnen': {
      const n = it.elemente.length, ok = it.elemente.filter((e, i) => a[i] === e.g).length;
      if (ok === n) return { status: 'richtig', richtigAnz: ok, gesamt: n };
      const ueberall = new Set(a.filter((g) => g >= 0)).size <= 1; // alles in eine Kiste ist Raten
      return { status: !ueberall && ok >= Math.ceil(n * 0.75) ? 'teilweise' : 'falsch', richtigAnz: ok, gesamt: n };
    }
    case 'reihenfolge': return aus(a.ordnung.filter((v, i) => v === i).length, a.ordnung.length);
    case 'eingabe': {
      const g = normEingabe(a), loes = (it.loesungen || []).map(normEingabe);
      if (loes.includes(g)) return { status: 'richtig', richtigAnz: 1, gesamt: 1 };
      if (loes.some((l) => l.toLowerCase() === g.toLowerCase())) return { status: 'teilweise', richtigAnz: 0, gesamt: 1, gross: true };
      return { status: 'falsch', richtigAnz: 0, gesamt: 1 };
    }
    default: return { status: 'falsch', richtigAnz: 0, gesamt: 1 };
  }
}

/** Neue Antwort aus einer Aktion berechnen (reine Funktion). */
function aendereAntwort(it, a, act, ds, ui) {
  switch (act) {
    case 'opt': {
      const i = Number(ds.i);
      if (it.typ === 'single') return a === i ? null : i;
      return a.includes(i) ? a.filter((x) => x !== i) : a.concat(i);
    }
    case 'mx': { const n = a.slice(); const z = Number(ds.z), s = Number(ds.s); n[z] = n[z] === s ? null : s; return n; }
    case 'lk': { const n = a.slice(); n[Number(ds.g)] = ds.wert === '' ? null : Number(ds.wert); return n; }
    case 'tok': { const k = Number(ds.i); return a.includes(k) ? a.filter((x) => x !== k) : a.concat(k); }
    case 'chip': {
      const i = Number(ds.i);
      // Ein anderes Kärtchen ist ausgewählt und das angetippte liegt schon in einer Kiste: dorthin einsortieren.
      if (ui.chip != null && ui.chip !== i && a[i] >= 0) { const n = a.slice(); n[ui.chip] = a[i]; ui.chip = null; return n; }
      ui.chip = ui.chip === i ? null : i; return a;
    }
    case 'gruppe': {
      if (ui.chip == null) return a;
      const n = a.slice(); n[ui.chip] = Number(ds.g); ui.chip = null; return n;
    }
    case 'pool': {
      if (ui.chip == null) return a;
      const n = a.slice(); n[ui.chip] = -1; ui.chip = null; return n;
    }
    case 'hoch': case 'runter': {
      const k = Number(ds.k), o = a.ordnung.slice(), z = act === 'hoch' ? k - 1 : k + 1;
      if (z < 0 || z >= o.length) return a;
      [o[k], o[z]] = [o[z], o[k]];
      return { ordnung: o, beruehrt: true };
    }
    case 'eingabe': return ds.wert;
    default: return a;
  }
}

/** HTML der Antwortfläche. modus: 'edit' | 'loesung' */
function renderAntwortflaeche(it, a, perm, modus, ui = {}, gesperrt = false) {

  switch (it.typ) {
    case 'single': case 'multi': {
      const multi = it.typ === 'multi';

      return `<div class="optionen ${multi ? 'mehrfach' : ''}">${order.map((oi, k) => {
        const o = it.optionen[oi], an = sel.has(oi);

        g++;
        const gi = g, wert = a ? a[gi] : null, order = (perm && perm.gaps && perm.gaps[gi]) || t.wahl.map((_, i) => i);
        const cls = L ? (wert === t.loesung ? 'ok' : 'nein') : wert == null ? 'leer' : '';

const SITE_FARBEN = { gruen: '#277335', blau: '#2559c4', orange: '#a3480c', lila: '#7a4cc2', rot: '#b02d42', grau: '#4b5568', tuerkis: '#087373', gelb: '#8a6700' };
const ERLAUBTE_TAGS = new Set('h1 h2 h3 h4 p ul ol li strong em b i small span div a button br hr table thead tbody tr th td dl dt dd details summary time caption'.split(' '));
const GEFAEHRLICH = new Set('script style iframe object embed img video audio link meta form input textarea select svg math template noscript'.split(' '));
const ERLAUBTE_ATTR = new Set(['class', 'data-ziel', 'data-extern', 'open', 'colspan', 'rowspan', 'datetime', 'title', 'aria-label']);
const KLASSE_OK = /^(?:[wspcma]-[a-z0-9-]+|aktiv)$/;
const MARKER_ZIELE = 'p, li, td, th, dd, dt, h1, h2, h3, h4, summary, .c-text, .p-text, .s-text, .s-titel, .m-vorschau, .m-betreff, .a-zelle, .a-hinweis, .a-gross';

const htmlCache = new Map();
function saeubere(html) {
  if (htmlCache.has(html)) return htmlCache.get(html);
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  for (const el of Array.from(tpl.content.querySelectorAll('*'))) {
    const tag = el.tagName.toLowerCase();
    if (GEFAEHRLICH.has(tag)) { el.remove(); continue; }
    if (!ERLAUBTE_TAGS.has(tag)) { el.replaceWith(...Array.from(el.childNodes)); continue; }
    for (const at of Array.from(el.attributes)) {
      if (!ERLAUBTE_ATTR.has(at.name)) el.removeAttribute(at.name);
    }
    if (el.hasAttribute('class')) {
      const cls = el.getAttribute('class').split(/\s+/).filter((c) => KLASSE_OK.test(c));
      if (cls.length) el.setAttribute('class', cls.join(' ')); else el.removeAttribute('class');
    }
    if (tag === 'a' && (el.hasAttribute('data-ziel') || el.hasAttribute('data-extern'))) { el.setAttribute('role', 'link'); el.setAttribute('tabindex', '0'); }
    if (tag === 'button') el.setAttribute('type', 'button');
  }
  for (const t of Array.from(tpl.content.querySelectorAll('table'))) {
    const huelle = document.createElement('div');
    huelle.className = 'w-tabelle-huelle';
    t.parentNode.insertBefore(huelle, t);
    huelle.appendChild(t);
  }
  const div = document.createElement('div');
  div.appendChild(tpl.content.cloneNode(true));
  const out = div.innerHTML;
  htmlCache.set(html, out);
  return out;
}

/* ---------- Textmarker ---------- */
function markerVorbereiten(wurzel) {
  const box = wurzel.querySelector('[data-marker-key]');
  if (!box) return;
  const key = box.getAttribute('data-marker-key');
  const ziele = Array.from(box.querySelectorAll(MARKER_ZIELE)).filter((el) => !el.querySelector(MARKER_ZIELE));
  // Lose Texte (z. B. in div, strong, small, time, Kästen) einhüllen, damit auch sie markiert werden können.
  const imZiel = (n) => ziele.some((b) => b.contains(n));
  const lose = [];
  const w = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    if (/\S/.test(n.nodeValue) && !imZiel(n) && !n.parentElement.closest('a[data-ziel]:not(.m-eintrag), a[data-extern], button, .w-menue, .a-reiter, .abs-nr, .vers-nr, .strophe-nr')) lose.push(n);
  }
  for (const n of lose) { const s = document.createElement('span'); n.parentNode.insertBefore(s, n); s.appendChild(n); ziele.push(s); }
  ziele.sort((a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1));
  ziele.forEach((el, i) => el.setAttribute('data-tm', String(i)));
  const gesetzt = ((SITZ && SITZ.marker) || {})[key] || [];
  for (const i of gesetzt) { const el = box.querySelector(`[data-tm="${i}"]`); if (el) el.classList.add('tm'); }
}

  const box = el.closest('[data-marker-key]'); if (!box) return;
  const key = box.getAttribute('data-marker-key'), i = Number(el.getAttribute('data-tm'));
  SITZ.marker = SITZ.marker || {};
  const liste = SITZ.marker[key] || (SITZ.marker[key] = []);

  sitzungMerken();
}

  $$('.tm', box).forEach((el) => el.classList.remove('tm'));

let ANSICHT = { name: 'start', param: null };
const HASH_ANSICHTEN = new Set(['start', 'digital', 'lesen', 'tempo', 'rechtschreibung', 'grammatik', 'schreiben', 'fortschritt', 'erwachsene', 'info', 'profile', 'byles']);
let erwachseneOffen = false;

const VERLAUF_ANSICHTEN = new Set(['sitzung', 'tempo-lauf', 'diktat', 'blitz-lauf']);
let verlaufGesetzt = false;
function zeige(name, param = null) {
  const alt = ANSICHT.name;
  if (alt === 'sitzung' && name !== 'sitzung') stoppeUhr();
  if (alt === 'tempo-lauf' && name !== 'tempo-lauf') tempoStopp();
  if (alt === 'blitz-lauf' && name !== 'blitz-lauf') { blitzStopp(); bildschirmWach(false); }
  if (alt === 'schreibauftrag') schreibVerlassen();
  if (alt === 'diktat' && name !== 'diktat') diktatVerlassen();
  if (!['erwachsene', 'info'].includes(name)) erwachseneOffen = false;
  ANSICHT = { name, param };
  if (VERLAUF_ANSICHTEN.has(name) && !verlaufGesetzt) {
    // Eigener Verlaufseintrag: Die Zurück-Geste von Safari beendet dann die Übung statt die App zu verlassen.
    try {
      if (!(history.state && history.state.lese)) history.pushState({ lese: name }, '', location.href);
      verlaufGesetzt = true;
    } catch (e) { /* Rahmen erlaubt es nicht */ }
  }
  if (!VERLAUF_ANSICHTEN.has(name)) verlaufGesetzt = false;
  render();
  if (HASH_ANSICHTEN.has(name)) {
    const h = '#' + name;
    if (location.hash !== h) { try { history.replaceState(history.state, '', h); } catch (e) { /* Rahmen erlaubt es nicht */ } }
  }
}

/* ---------- Prüfungen definieren ---------- */
function leseChecks() {
  const g = REG.module.lesen.gruppen.filter((gid) => !istAbschnittText(REG.gruppen[gid]));
  if (!g.length) return [];
  const halb = Math.ceil(g.length / 2);
  const teile = g.length > 3 ? [g.slice(0, halb), g.slice(halb)] : [g];
  return teile.map((t, i) => ({ art: i === 0 ? 'lesen-a' : 'lesen-b', titel: `Lese-Check ${i === 0 ? 'A' : 'B'}`, ids: t.flatMap((gid) => REG.gruppen[gid].items), beschr: 'Texte: ' + t.map((gid) => REG.gruppen[gid].titel).join(', ') }));
}
function modulTest(modul, proThema = 2) {
  const out = [];
  for (const gid of REG.module[modul].gruppen) out.push(...mische(REG.gruppen[gid].items).slice(0, proThema));
  return out;
}
function grosserCheckAnzahl() {
  const n = (m, k) => Math.min(k, REG.module[m].items.length);
  const erste = (m) => { const g = REG.module[m].gruppen.filter((gid) => !istAbschnittText(REG.gruppen[gid])); return g.length ? REG.gruppen[g[0]].items.length : 0; };
  return erste('digital') + erste('lesen') + n('rechtschreibung', 4) + n('grammatik', 4) + n('schreiben', 3);
}
function grosserCheck() {
  const p = P(), anz = p.grossZaehler != null ? p.grossZaehler : p.pruefungen.filter((x) => x.art === 'gross').length;
  const ids = [];
  const fg = REG.module.digital.gruppen; if (fg.length) ids.push(...REG.gruppen[fg[anz % fg.length]].items);
  const tg = REG.module.lesen.gruppen.filter((gid) => !istAbschnittText(REG.gruppen[gid])); if (tg.length) ids.push(...REG.gruppen[tg[anz % tg.length]].items);
  const zieh = (m, n) => mische(REG.module[m].items).slice(0, n);
  ids.push(...zieh('rechtschreibung', 4), ...zieh('grammatik', 4), ...zieh('schreiben', 3));
  return ids;
}
function pruefConfig(art) {
  if (art === 'digital') return { art, titel: 'BYLET-D-Prüfung', ids: REG.module.digital.items.slice(), zeitMin: E().zeitDigital, modul: 'digital' };
  if (art === 'lesen-a' || art === 'lesen-b') { const c = leseChecks().find((x) => x.art === art); return c ? { art, titel: c.titel, ids: c.ids, zeitMin: E().zeitLesen, modul: 'lesen' } : null; }
  if (art.startsWith('lesev-')) { const g = REG.gruppen[art.slice(6)]; return istAbschnittText(g) ? { art, titel: 'BYLET-V-Probe: ' + g.titel, ids: g.items.slice(), zeitMin: E().zeitLesen, modul: 'lesen' } : null; }
  if (art.startsWith('test-')) { const m = art.slice(5); return { art, titel: MODUL[m].titel.replace('-Labor', '').replace('Schreib-Werkstatt', 'Schreib') + '-Test', ids: modulTest(m), zeitMin: E().zeitTest, modul: m }; }
  if (art === 'gross') return { art, titel: 'Großer Deutsch-Check', ids: grosserCheck(), zeitMin: E().zeitGross, modul: null };
  return null;
}

/* ---------- Dialog & Toast ---------- */
let dialogAufloeser = null;
let dialogSchliessen = null;
function dialog({ titel, text = '', html = '', knoepfe = [{ label: 'OK', wert: true }] }) {
  if (dialogSchliessen) dialogSchliessen(undefined);
  return new Promise((resolve) => {
    const wurzel = $('#dialog-wurzel');
    const vorher = document.activeElement;
    document.documentElement.classList.add('dialog-offen');
    wurzel.innerHTML = `<div class="dialog-huelle"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-titel">
      <h2 id="dlg-titel">${esc(titel)}</h2>${text ? `<p>${esc(text)}</p>` : ''}${html}
      <div class="aktionen">${knoepfe.map((k, i) => `<button type="button" class="knopf ${k.stil || ''}" data-dlg="${i}">${esc(k.label)}</button>`).join('')}</div></div></div>`;
    const app = $('#app'); if (app) { app.setAttribute('inert', ''); app.setAttribute('aria-hidden', 'true'); }
    const fertig = (wert) => { if (dialogSchliessen !== fertig) return; dialogSchliessen = null; wurzel.innerHTML = ''; document.documentElement.classList.remove('dialog-offen'); dialogAufloeser = null; if (app) { app.removeAttribute('inert'); app.removeAttribute('aria-hidden'); } try { if (vorher && vorher.focus) vorher.focus(); } catch (e) { /* egal */ } resolve(wert); };
    dialogAufloeser = (taste) => {
      if (taste === 'Escape') { const k = knoepfe.find((x) => x.wert === false || x.wert === null); fertig(k ? k.wert : undefined); }
    };
    dialogSchliessen = fertig;
    $$('[data-dlg]', wurzel).forEach((b) => b.addEventListener('click', () => fertig(knoepfe[Number(b.dataset.dlg)].wert)));
    // Den sicheren Knopf (Abbrechen/Weiterarbeiten) fokussieren, damit ein versehentliches Enter nichts bestätigt.
    const alle = $$('[data-dlg]', wurzel), si = knoepfe.findIndex((k) => k.wert === false || k.wert === null);
    const ziel = si >= 0 ? alle[si] : alle[alle.length - 1];
    if (ziel) setTimeout(() => { try { ziel.focus(); } catch (e) { /* egal */ } }, 30);
  });
}
let toastTimer = null;
let toastEnde = 0;
const sanft = () => (fxStufe() !== 'voll' ? 'auto' : 'smooth');
/** Meldung erst zeigen, wenn die aktuelle fertig ist (für Abzeichen). */
function toastDanach(text) {
  const rest = toastEnde - Date.now();
  if (rest > 0) setTimeout(() => toastDanach(text), rest + 300); else toast(text);
}
function toast(text, ms = 2600) {
  const t = $('#toast'); if (!t) return;
  toastEnde = Date.now() + ms;
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

function woerterIn(text) { return String(text).match(/[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g) || []; }
function schreibAnalyse(text, auftrag) {
  const out = [];
  const woerter = woerterIn(text);
  const PUNKT = '\u2024'; // Ersatzpunkt für Abkürzungen und Ordnungszahlen
  const roh = String(text).replace(/\n+/g, ' ')
    .replace(/\b(?:z\.\s?B|u\.\s?a|d\.\s?h|usw|bzw|ca|etc|Nr|vgl|evtl|ggf|Std|Min|Hr|Fr|Dr)\.(?=\s+[a-zäöüß0-9])/g, (m) => m.replace(/\./g, PUNKT))
    .replace(/(\d)\.(?=\s+[a-zäöüß0-9])/g, '$1' + PUNKT);
  const saetze = (roh.match(/[^.!?]+[.!?]+["“”»«]?|[^.!?]+$/g) || [])
    .map((s) => s.trim().split(PUNKT).join('.'))
    // „…!“, rief Mia. – der nachgestellte Begleitsatz gehört zum vorigen Satz
    .reduce((alle, s) => { if (alle.length && /^,/.test(s)) alle[alle.length - 1] += ' ' + s; else alle.push(s); return alle; }, [])
    .filter((s) => woerterIn(s).length);
  const erz = /erz[äa]hlung/i.test(auftrag.textsorte);
  const brief = /brief|e-?mail/i.test(auftrag.textsorte);
  const gut = (t) => out.push({ gut: true, t }), tipp = (t) => out.push({ gut: false, t });
  if (woerter.length >= auftrag.minWoerter) gut(`Dein Text hat ${woerter.length} Wörter – lang genug.`);
  else tipp(`Dein Text hat ${woerter.length} Wörter. Ziel: mindestens ${auftrag.minWoerter}. Was könntest du noch genauer beschreiben?`);
  const anf = {};
  for (const s of saetze) { const w = woerterIn(s)[0]; if (w) { const k = w.toLowerCase(); anf[k] = (anf[k] || 0) + 1; } }
  const wieder = Object.entries(anf).filter(([w, n]) => n >= 3 || (['dann', 'und', 'da'].includes(w) && n >= 2)).sort((a, b) => b[1] - a[1]);
  if (saetze.length >= 3) {
    if (wieder.length) tipp(`Satzanfänge: ${wieder.map(([w, n]) => `„${w[0].toUpperCase() + w.slice(1)}“ (${n}×)`).join(', ')}. Probiere andere Anfänge: ${erz ? 'Plötzlich, Kurz darauf, Am Abend, Zum Glück' : 'Zuerst, Danach, Anschließend, Außerdem, Zum Schluss'} …`);
    else gut('Deine Satzanfänge sind abwechslungsreich.');
  }
  const anzahl = {}, schreibung = {};
  for (const w of woerter) { const k = w.toLowerCase(); if (k.length >= 4 && !STOPPWOERTER.has(k)) { anzahl[k] = (anzahl[k] || 0) + 1; if (!schreibung[k] || /^[A-ZÄÖÜ]/.test(w)) schreibung[k] = w; } }
  const oft = Object.entries(anzahl).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]).slice(0, 4);
  if (oft.length) tipp(`Diese Wörter kommen oft vor: ${oft.map(([w, n]) => `„${schreibung[w]}“ (${n}×)`).join(', ')}. Ersetze manche durch ein anderes Wort oder ein Pronomen.`);
  else if (woerter.length > 30) gut('Du wiederholst kaum Wörter.');
  const klein = saetze.filter((s) => /^[„"»“«]?[a-zäöüß]/.test(s)).slice(0, 3);
  if (klein.length) tipp(`Diese Sätze beginnen klein: ${klein.map((s) => `„${s.slice(0, 24)}…“`).join(', ')}. Satzanfänge schreibt man groß.`);
  const lang = saetze.filter((s) => woerterIn(s).length > 25);
  if (lang.length) tipp(`${plural(lang.length, 'Satz ist', 'Sätze sind')} sehr lang (über 25 Wörter). Teile lange Sätze auf.`);
  let ende = text.trim();
  // Im Brief stehen Grußformel und Name am Schluss ohne Satzzeichen.
  if (brief) ende = ende.replace(/\n[^\n]*(?:gr(?:u|ü|ue)(?:ß|ss)|liebe|herzlich|tschüss|bis bald)[^\n]*(?:\n[^\n]*){0,2}\s*$/i, '').trim();
  if (ende && !/[.!?…"“”»«]\s*$/.test(ende)) tipp('Am Ende fehlt ein Satzschlusszeichen (. ! ?).');
  const rede = (text.match(/[„"»“«]/g) || []).length;
  if (erz) { if (rede) gut('Du benutzt wörtliche Rede – das macht die Erzählung lebendig.'); else if (woerter.length > 40) tipp('Probiere wörtliche Rede: Lass deine Figuren sprechen („…“).'); }
  const absaetze = text.split(/\n\s*\n/).filter((x) => x.trim()).length;
  if (woerter.length > 80 && absaetze < 2) tipp('Gliedere deinen Text in Absätze (Leerzeile zwischen Einleitung, Hauptteil und Schluss).');
  else if (absaetze >= 3) gut(`Dein Text hat ${absaetze} Absätze – übersichtlich gegliedert.`);
  return out;
}

async function sicherungAlsDatei() {

/* ---- 07b-effekte.js ---- */
/* ===== Spezialeffekte: Sternenhimmel, Glitzer, Münzflug, Combo, Feiern, Level-up, Töne =====
   Alles läuft über CSS-Animationen (Grafikkarte) – keine Dauerschleife in JavaScript.
   Stufen: voll (alles), sanft (wenig Bewegung), aus (ruhig). Systemeinstellung „Bewegung reduzieren“ = höchstens sanft.
   Die Effekt-Ebene #fx-ebene ist für Bildschirmleser verborgen; wichtige Momente sagt #sr-meldung an. */
function fxStufe() {
  const e = (DB && DB.einstellungen && DB.einstellungen.effekte) || 'voll';
  if (e === 'voll' && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return 'sanft';
  return e;
}
/** Fliegende Teilchen nur, wenn sie auch animiert werden (sonst bleiben sie unsichtbar und kosten nur Zeit). */
const bewegungReduziert = () => fxStufe() === 'aus' || !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const fxEbene = () => document.getElementById('fx-ebene');
function sagAn(text) {
  const sr = document.getElementById('sr-meldung'); if (!sr) return;
  sr.textContent = '';
  setTimeout(() => { sr.textContent = text; }, 60);
}
/** Mittelpunkt eines Elements, eines Rechtecks oder eines {x, y}-Punkts – auf den sichtbaren Bereich begrenzt. */
function fxMitte(ziel) {
  let x = window.innerWidth / 2, y = window.innerHeight / 2;
  if (ziel && ziel.getBoundingClientRect) { const r = ziel.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  else if (ziel && typeof ziel.width === 'number') { x = ziel.left + ziel.width / 2; y = ziel.top + ziel.height / 2; }
  else if (ziel && typeof ziel.x === 'number') { x = ziel.x; y = ziel.y; }
  return { x: Math.min(Math.max(x, 40), window.innerWidth - 40), y: Math.min(Math.max(y, 60), window.innerHeight - 60) };
}

/* ---------- Sternenhimmel: ruhige Sterne auf der Leinwand, funkelnde Sterne und Sternschnuppen per CSS ---------- */
let himmelGebaut = false;
function sternenhimmel() {
  const c = document.getElementById('sterne');
  if (!c || !c.getContext) return;
  const ctx = c.getContext('2d');
  let zuletzt = { w: 0, h: 0 };
  const zeichnen = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = window.innerWidth, h = window.innerHeight;
    // Kleine Höhenänderungen (Safari-Leiste) streckt das CSS – nur bei echten Größenwechseln neu zeichnen.
    if (Math.abs(w - zuletzt.w) < 2 && Math.abs(h - zuletzt.h) < 120) return;
    zuletzt = { w, h };
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // fester Startwert: Beim Drehen des iPads springen die Sterne nicht an neue Plätze
    let s = 0x5eed1234;
    const zz = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const n = Math.round(Math.min(260, (w * h) / 5200));
    const farben = ['#ffffff', '#ffd9f5', '#d9f7ff', '#fff1c2', '#e8dcff'];
    for (let i = 0; i < n; i++) {
      const x = zz() * w, y = zz() * h, r = zz() * 1.3 + 0.25;
      ctx.globalAlpha = 0.35 + zz() * 0.6;
      ctx.fillStyle = farben[i % farben.length];
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
  let t = null;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(zeichnen, 200); });
  zeichnen();
  if (himmelGebaut) return;
  himmelGebaut = true;
  const all = c.parentElement;
  const zufall = (a, b) => a + Math.random() * (b - a);
  let html = '';
  for (let i = 0; i < 26; i++) {
    html += `<i class="funkelstern" style="left:${zufall(2, 98).toFixed(1)}%;top:${zufall(2, 96).toFixed(1)}%;--g:${zufall(6, 14).toFixed(0)}px;--d:${zufall(2.2, 5.5).toFixed(2)}s;--v:${zufall(0, 5).toFixed(2)}s;--f:${['#ffffff', '#ffd36b', '#ff9fe4', '#9ff0ff'][i % 4]}"></i>`;
  }
  html += '<i class="schnuppe s1"></i><i class="schnuppe s2"></i>';
  all.insertAdjacentHTML('beforeend', html);
}
/** Sicherheitsnetz für sehr alte iPads: Ruckelt es schon im Leerlauf, fallen die teuersten Extras weg (Einstellung bleibt). */
function pruefeLeistung() {
  if (fxStufe() !== 'voll' || !window.requestAnimationFrame || !window.performance) return;
  setTimeout(() => {
    let n = 0, lang = 0, last = performance.now();
    const f = (t) => { if (t - last > 34) lang++; last = t; if (++n < 90) requestAnimationFrame(f); else if (lang > 20) document.documentElement.classList.add('fx-leicht'); };
    requestAnimationFrame(f);
  }, 1500);
}

/* ---------- Glitzer-Explosion ---------- */
const GLITZER_ZEICHEN = ['✦', '★', '✧', '•', '✦', '♥'];
const GLITZER_FARBEN = ['#ffd36b', '#ff6fd8', '#4fe3ff', '#ffffff', '#b994ff', '#5ef2b4'];
/** Glitzer aus einem Punkt ({x, y}), einem Rechteck oder der Mitte eines Elements. */
function glitzer(ziel, { anzahl = 26, weite = 150, gross = false } = {}) {
  if (bewegungReduziert()) return;
  const wurzel = fxEbene(); if (!wurzel) return;
  const { x, y } = fxMitte(ziel); // erst lesen, dann schreiben
  const n = fxStufe() === 'sanft' ? Math.min(10, Math.round(anzahl / 3)) : anzahl;
  const box = document.createElement('div');
  box.className = 'glitzer-wolke';
  box.style.left = x + 'px'; box.style.top = y + 'px';
  let html = '', maxDauer = 0;
  for (let i = 0; i < n; i++) {
    const winkel = (Math.PI * 2 * i) / n + Math.random() * 0.6;
    const w = weite * (0.45 + Math.random() * 0.75) * (gross ? 1.6 : 1);
    const dx = Math.cos(winkel) * w, dy = Math.sin(winkel) * w - (gross ? 40 : 20);
    const z = GLITZER_ZEICHEN[i % GLITZER_ZEICHEN.length], f = GLITZER_FARBEN[(i * 7) % GLITZER_FARBEN.length];
    const dauer = 0.8 + Math.random() * 0.6; maxDauer = Math.max(maxDauer, dauer);
    html += `<i style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--rot:${(Math.random() * 540 - 270).toFixed(0)}deg;--f:${f};--s:${(0.7 + Math.random() * 0.9).toFixed(2)};--dauer:${dauer.toFixed(2)}s">${z}</i>`;
  }
  box.innerHTML = html;
  wurzel.appendChild(box);
  setTimeout(() => box.remove(), Math.ceil(maxDauer * 1000) + 100);
}
/** Großer Konfetti-Regen von oben (Ergebnisse, Mission, Level-up). */
function sternenregen(menge = 40) {
  if (bewegungReduziert()) return;
  if (fxStufe() !== 'voll') { glitzer(null, { anzahl: 18, gross: true }); return; }
  const wurzel = fxEbene(); if (!wurzel) return;
  const box = document.createElement('div');
  box.className = 'sternenregen';
  let html = '', maxEnde = 0;
  for (let i = 0; i < menge; i++) {
    const z = GLITZER_ZEICHEN[i % GLITZER_ZEICHEN.length], f = GLITZER_FARBEN[i % GLITZER_FARBEN.length];
    const v = Math.random() * 0.8, d = 1.8 + Math.random() * 1.4; maxEnde = Math.max(maxEnde, v + d);
    html += `<i style="left:${(Math.random() * 100).toFixed(1)}%;--f:${f};--s:${(0.8 + Math.random() * 1.1).toFixed(2)};--v:${v.toFixed(2)}s;--dauer:${d.toFixed(2)}s;--dx:${(Math.random() * 120 - 60).toFixed(0)}px;--rot:${(Math.random() * 720 - 360).toFixed(0)}deg">${z}</i>`;
  }
  box.innerHTML = html;
  wurzel.appendChild(box);
  setTimeout(() => box.remove(), Math.ceil(maxEnde * 1000) + 100);
}

/* ---------- Münzflug zum Punkte-Chip, Combo, Wackeln ---------- */
/** „+10 ✦“ steigt aus `ziel` (Element oder Rechteck) auf und fliegt – wenn `nach` angegeben – in den Punkte-Chip. */
function punkteFlug(ziel, text, nach) {
  if (bewegungReduziert() || !ziel) return;
  const wurzel = fxEbene(); if (!wurzel) return;
  const r = ziel.getBoundingClientRect ? ziel.getBoundingClientRect() : ziel;
  const z = nach && nach.isConnected ? nach.getBoundingClientRect() : null; // alles lesen, bevor geschrieben wird
  const x = Math.min(Math.max(r.left + r.width / 2, 50), window.innerWidth - 50);
  const y = Math.min(Math.max(r.top + 10, 70), window.innerHeight - 50);

/* ---------- Töne (Web Audio, nur wenn eingeschaltet) ---------- */
let audio = null, audioPause = null;
function ton(art) {
  if (!(DB && DB.einstellungen && DB.einstellungen.toene)) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const folgen = { richtig: [[880, 0], [1320, 0.09]], falsch: [[220, 0], [180, 0.12]], levelup: [[660, 0], [880, 0.1], [1100, 0.2], [1320, 0.3]], fanfare: [[523, 0], [659, 0.12], [784, 0.24], [1046, 0.38]], abzeichen: [[988, 0], [1318, 0.1], [1760, 0.2]] };
    const jetzt = audio.currentTime;
    for (const [frequenz, start] of folgen[art] || []) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = art === 'falsch' ? 'triangle' : 'sine';
      o.frequency.value = frequenz;
      g.gain.setValueAtTime(0.0001, jetzt + start);
      g.gain.exponentialRampToValueAtTime(art === 'falsch' ? 0.12 : 0.16, jetzt + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, jetzt + start + 0.28);
      o.connect(g).connect(audio.destination);
      o.start(jetzt + start); o.stop(jetzt + start + 0.3);
    }
    // Audio-Hardware danach schlafen legen (spart auf dem iPad Akku)
    clearTimeout(audioPause);
    audioPause = setTimeout(() => { if (audio && audio.state === 'running') audio.suspend().catch(() => {}); }, 2500);
  } catch (e) { /* kein Ton möglich */ }
}

    case 'training-ids': starteTraining(gruppeSortiert(String(ds.ids).split(',').filter((id) => REG.items[id])), ds.titel || 'Training', 'training', { name: 'start' }); return;
    case 'pruef-intro': { const cfg = pruefConfig(ds.art); if (cfg && cfg.ids.length) zeige('pruefung-start', cfg); else toast('Für diese Prüfung fehlen noch Aufgaben.'); return; }
    case 'pruef-los': {
      const cfg = ANSICHT.param; if (!cfg) return;
      const lauf = P() && P().laufend;
      if (lauf && (lauf.ids || []).some((id) => REG.items[id])) {
        const w = await dialog({ titel: 'Angefangene Prüfung', text: `Du hast „${lauf.titel}“ noch nicht abgegeben. Wenn du eine neue Prüfung startest, wird die alte gelöscht.`, knoepfe: [{ label: 'Abbrechen', wert: null, stil: 'knopf-geist' }, { label: 'Alte weitermachen', wert: 'alt', stil: 'knopf-zweit' }, { label: 'Neu starten', wert: 'neu', stil: 'knopf-signal' }] });
        if (w === 'alt') { sitzungFortsetzen(); return; }
        if (w !== 'neu') return;
        sitzungVerwerfen();
      }
      const box = $('#uhr-zeigen'); if (box) { E().timerZeigen = box.checked; speichern(); }
      starteSitzung({ art: 'pruefung', titel: cfg.titel, ids: cfg.ids, pruefArt: cfg.art, zeitMin: cfg.zeitMin, zurueck: { name: cfg.modul || 'start' } });
      return;
    }
    case 'zurueck-modul': zeige(ds.m && MODUL[ds.m] ? ds.m : 'start'); return;
    case 'pruefung-ansehen': { const e = P().pruefungen[Number(ds.i)]; if (e) zeige('ergebnis', { eintrag: e }); return; }

    /* Tempo */
    case 'tempo-start': tempoStart(); return;
    case 'blitz-start': blitzStart(); return;
    case 'blitz-uebung': blitzUebung(); return;
    case 'blitz-los': blitzLos(); return;
    case 'blitz-wahl': blitzWahl(Number(ds.i)); return;
    case 'blitz-teil2': blitzTeil2(); return;
    case 'blitz-fertig': blitzFertig(); return;
    case 'blitz-abbruch': blitzAbbruch(); return;
    case 'daumen-start': daumenStart(); return;
    case 'daumen-wahl': daumenWahl(Number(ds.w)); return;
    case 'daumen-weiter': daumenWeiter(); return;
    case 'daumen-zurueck': if (DAUMEN && DAUMEN.i > 0) { DAUMEN.i--; render(); fokus('.daumen-satz'); } return;
    case 'tempo-antwort': tempoAntwort(Number(ds.r)); return;
    case 'tempo-los': tempoLos(); return;
    case 'tempo-abbruch': tempoStopp(); TEMPO = null; zeige('tempo'); return;

    /* Diktat */
    case 'diktat': diktatStart(ds.id); return;
    case 'diktat-modus': DIKTAT.modus = ds.modus; DIKTAT.phase = ds.modus === 'hoer' ? 'hoer' : 'bereit'; zeige('diktat'); if (ds.modus === 'hoer') diktatVorlesen(); return;
    case 'diktat-hoeren': diktatVorlesen(); return;
    case 'diktat-satz': diktatVorlesen(true); return;
    case 'diktat-weiter': diktatWeiter(); return;
    case 'diktat-blitz': diktatBlitz(); return;

    /* Schreiben */
    case 'schreibauftrag': zeige('schreibauftrag', ds.id); return;
    case 'wort-einfuegen': {
      const f = $('#schreibfeld'); if (!f) return;
      const s = f.selectionStart != null ? f.selectionStart : f.value.length, e2 = f.selectionEnd != null ? f.selectionEnd : s;
      const vor = f.value.slice(0, s), nach = f.value.slice(e2);
      const einfueg = (vor && !/\s$/.test(vor) ? ' ' : '') + ds.wort + (nach && !/^[\s.,!?]/.test(nach) ? ' ' : '');
      f.value = vor + einfueg + nach;
      const pos = (vor + einfueg).length; f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) { /* egal */ }
      f.dispatchEvent(new Event('input')); return;
    }
    case 'schreib-check': schreibCheck(); return;
    case 'text-kopieren': { const f = $('#schreibfeld'); if (f) { textKopieren(f.value); } return; }
    case 'schreib-fertig': schreibFertig(); return;

    /* Erwachsene */
    case 'stimme-test': if (!sprich(['Hallo! So klingt die Vorlesestimme im Lese-Labor.'])) toast('Auf diesem Gerät gibt es keine Sprachausgabe.'); return;
    case 'datei-waehlen': { const f = $('#import-datei'); if (f) f.click(); return; }
    case 'export-zeigen': { const f = $('#export-feld'), t = $('#export-code'); t.value = exportCode(); f.hidden = false; t.focus(); t.select(); return; }
    case 'export-kopieren': { const t = $('#export-code'); try { await navigator.clipboard.writeText(t.value); toast('Code kopiert. Bewahren Sie ihn gut auf.'); } catch (x) { t.focus(); t.select(); toast('Bitte den markierten Code selbst kopieren.'); } return; }
    case 'export-datei': sicherungAlsDatei(); return;
    case 'import': {
      let geprueft;
      try { geprueft = pruefeCode($('#import-code').value); }
      catch (x) { toast(x && /Code|Lese-Labor/.test(x.message || '') ? x.message : 'Der Code konnte nicht gelesen werden.', 4200); return; }
      const konflikt = Object.keys(geprueft.neu).filter((id) => DB.profile[id]);
      if (konflikt.length) {
        const info = konflikt.map((id) => `${DB.profile[id].name}: auf diesem Gerät ${DB.profile[id].punkte} Punkte${DB.profile[id].laufend ? ' und eine angefangene Prüfung' : ''}, im Code ${geprueft.neu[id].punkte} Punkte`).join(' · ');
        const w = await dialog({ titel: 'Vorhandenes Profil ersetzen?', text: `${info}. Der Stand auf diesem Gerät wird dabei ersetzt.`, knoepfe: [{ label: 'Abbrechen', wert: false, stil: 'knopf-zweit' }, { label: 'Ersetzen', wert: true }] });
        if (!w) return;
      }
      const n = uebernehmeImport(geprueft); wendeEinstellungenAn();
      toast(speicherOk ? `${plural(n, 'Profil', 'Profile')} wiederhergestellt.` : `${plural(n, 'Profil', 'Profile')} geladen, aber dieser Browser kann gerade nicht speichern (Speicher voll oder privater Modus).`, speicherOk ? 2600 : 6000);
      zeige('erwachsene');
      return;
    }
    case 'alles-loeschen': {
      const ok = await dialog({ titel: 'Wirklich alles löschen?', text: 'Alle Profile, Ergebnisse, Texte und Einstellungen werden von diesem Gerät gelöscht.', knoepfe: [{ label: 'Abbrechen', wert: false, stil: 'knopf-zweit' }, { label: 'Alles löschen', wert: true, stil: 'knopf-gefahr' }] });
      if (ok) {
        try { for (const k of Object.keys(window.localStorage)) if (k.startsWith(SPEICHER_KEY + ':')) window.localStorage.removeItem(k); } catch (x) { /* Speicher nicht verfügbar */ }
        speicherWarnung = '';
        DB = leererSpeicher(); speichern(true); erwachseneOffen = false; wendeEinstellungenAn(); zeige('profile');
      }
      return;
    }
    default: return;
  }
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (!(el instanceof Element)) return;
  if (el.matches('select[data-act="lk"]')) { antwortAktion('lk', { g: el.dataset.g, wert: el.value }); return; }
  if (el.matches('[data-einst]')) {
    const k = el.getAttribute('data-einst');
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (['zeitDigital', 'zeitLesen', 'zeitTest', 'zeitGross', 'tempoDauer', 'blitzSek', 'sprechTempo'].includes(k)) v = Number(v);
    E()[k] = v; speichern(); wendeEinstellungenAn();
    return;
  }
  if (el.id === 'import-datei' && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { $('#import-code').value = String(r.result || '').trim(); toast('Datei geladen. Tippe auf „Wiederherstellen“.'); };
    r.readAsText(el.files[0]);
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (!(el instanceof Element)) return;
  if (el.matches('input[data-act="eingabe"]')) { antwortAktion('eingabe', { wert: el.value }); return; }
  if (el.matches('[data-act="profil-name"]')) {
    const p = DB.profile[el.dataset.id], n = el.value.trim().slice(0, 24);
    if (p && n) { p.name = n; speichern(); }
  }
});
document.addEventListener('submit', (ev) => {
  const f = ev.target;
  ev.preventDefault();
  if (f.id === 'profil-form') { neuesProfil($('#profil-name').value, neuProfilAvatar); zeige('start'); return; }
  if (f.id === 'gate-form') {
    const v = Number($('#gate-antwort').value);
    if (gateAufgabe && v === gateAufgabe.a * gateAufgabe.b) { erwachseneOffen = true; gateAufgabe = null; zeige('erwachsene'); }
    else { toast('Das stimmt leider nicht.'); gateAufgabe = null; zeige('erwachsene'); }
    return;
  }
  if (f.id === 'diktat-form') { diktatPruefen($('#diktat-eingabe').value); }
});
document.addEventListener('keydown', (ev) => {
  if (dialogAufloeser) { if (ev.key === 'Escape') dialogAufloeser('Escape'); else if (ev.repeat) ev.preventDefault(); return; }
  if (ANSICHT.name === 'blitz-lauf' && BLITZ && BLITZ.phase === 'wahl' && /^[1-4]$/.test(ev.key)) { ev.preventDefault(); blitzWahl(Number(ev.key) - 1); return; }
  const el = ev.target;
  if (ev.key === 'Enter' && el instanceof Element && el.matches('input[data-act="eingabe"]')) {
    ev.preventDefault();
    if (!SITZ || ANSICHT.name !== 'sitzung') return;
    const ph = SITZ.phase[aktId()];
    if (istPruefung()) weiter();
    else if (ph === 'edit') pruefen();
    else if (ph === 'nochmal') { SITZ.phase[aktId()] = 'edit'; zeichneAufgabe(); const f = $('input.eingabe'); if (f) f.focus(); }
    else weiter();
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && el instanceof Element && el.matches('.zu-gruppe, .zu-pool')) { ev.preventDefault(); antwortAktion(el.dataset.act, el.dataset); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && el instanceof Element && el.matches('a[data-ziel], a[data-extern]')) { ev.preventDefault(); el.click(); return; }
  if (ANSICHT.name === 'tempo-lauf' && TEMPO && TEMPO.phase !== 'start') {
    if (ev.repeat) return;
    if (ev.key === 'ArrowLeft' || ev.key === 'j') tempoAntwort(1);
    if (ev.key === 'ArrowRight' || ev.key === 'n') tempoAntwort(0);
  }
});
document.addEventListener('click', (ev) => {
  const sum = ev.target instanceof Element ? ev.target.closest('details.auftrag[data-gruppe] > summary') : null;
  if (!sum || !SITZ) return;
  const d = sum.parentElement;
  setTimeout(() => { if (SITZ) SITZ.offen[d.getAttribute('data-gruppe')] = d.open; }, 0);
});
window.addEventListener('popstate', async () => {
  if (!verlaufGesetzt) return;
  verlaufGesetzt = false;
  const n = ANSICHT.name;
  const zurueckLegen = () => { try { history.pushState({ lese: n }, '', location.href); verlaufGesetzt = true; } catch (e) { /* egal */ } };
  if (dialogAufloeser) { zurueckLegen(); return; } // Während eines Dialogs (z. B. „Die Zeit ist um!“) zählt die Zurück-Geste nicht
  if (n === 'sitzung' && SITZ) { const ok = await sitzungBeenden(); if (ok === false) zurueckLegen(); return; }
  if (n === 'tempo-lauf') { tempoStopp(); TEMPO = null; zeige('tempo'); return; }
  if (n === 'blitz-lauf') { blitzAbbruch(); return; }
  if (n === 'diktat') { zeige('rechtschreibung'); return; }
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (!HASH_ANSICHTEN.has(h) || h === ANSICHT.name) return;
  if (ANSICHT.name === 'sitzung' || ANSICHT.name === 'tempo-lauf' || ANSICHT.name === 'blitz-lauf') return;
  zeige(h);
});

let appGestartet = false;
function starteApp() {
  if (appGestartet) return; // der Host darf hot.ready mehrfach aufrufen
  appGestartet = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* egal */ }
  try { document.documentElement.lang = 'de'; } catch (e) { /* egal */ }
  baueRegister();
  try { sternenhimmel(); } catch (e) { /* Hintergrund ist nur Schmuck */ }
  wendeEinstellungenAn();
  try { pruefeLeistung(); } catch (e) { /* nur Schmuck */ }
  if (DB.aktivesProfil && !DB.profile[DB.aktivesProfil]) DB.aktivesProfil = Object.keys(DB.profile)[0] || null;
  const h = location.hash.slice(1);
  zeige(P() ? (HASH_ANSICHTEN.has(h) && h !== 'profile' ? h : 'start') : 'profile');
}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(starteApp);
else starteApp();

})();
</script>
