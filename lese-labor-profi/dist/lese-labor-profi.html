erbindung.<\/p><\/div><a class=\"w-knopf\" data-ziel=\"start\">🌦️ Zurück zu Wolkenblick<\/a>"}],"items":[{"id":"d5-1","typ":"single","stufe":2,"kompetenz":"finden","frage":"Die Klasse will am Wandertag um 9 Uhr im Wildpark losgehen. Was sagt die Wetter-App für diese Uhrzeit voraus?","optionen":[{"text":"7 °C und 10 % Regenwahrscheinlichkeit","richtig":true},{"text":"13 °C und 20 % Regenwahrscheinlichkeit","richtig":false},{"text":"10 °C und 80 % Regenwahrscheinlichkeit","richtig":false},{"text":"9 °C und 5 % Regenwahrscheinlichkeit","richtig":false}],"tipp":"Welcher Tag ist heute, welcher Tag ist der Wandertag? Öffne die Stundenwerte für den richtigen Tag und suche genau das Feld für 9 Uhr.","tippSeite":"start","erklaerung":"Heute ist Dienstag, der Wandertag ist am Donnerstag – also übermorgen. Im Reiter „Übermorgen“ stehen für 9 Uhr 7 °C und 10 % Regenwahrscheinlichkeit. Die 13 °C sind der Höchstwert für den ganzen Tag."},{"id":"d5-2","typ":"single","stufe":2,"kompetenz":"navigieren","frage":"Bei manchen Verbindungen am Donnerstag steht „⚠️ Meldung zu RB 12“. Finde diese Meldung in der Fahrplan-App. Was steht darin?","optionen":[{"text":"Wegen Bauarbeiten am Gleis fallen einige Züge aus.","richtig":true},{"text":"Wegen der Sturmwarnung haben alle Züge Verspätung.","richtig":false},{"text":"Wegen des Herbstfests hält der Zug nicht am Wildpark.","richtig":false},{"text":"Wegen einer Baustelle fährt der Zug einen Umweg.","richtig":false}],"tipp":"Lies die kleine Schrift unter den Verbindungen. Dort steht, wo du die Meldung findest. Achte dann genau auf die Linie und auf den Tag.","tippSeite":"fahrplan","erklaerung":"Im Reiter „Störungen“ steht bei der RB 12: Am Donnerstag fahren wegen Bauarbeiten an den Gleisen bis 7:30 Uhr keine Züge. Sturm, Herbstfest und Umleitung stehen auch dort, gehören aber zu einem anderen Tag oder zu einem Bus."},{"id":"d5-3","typ":"multi","stufe":3,"kompetenz":"verknuepfen","frage":"Mit welchen Verbindungen kommt die Klasse am Donnerstag vor 9:00 Uhr am Wildpark an? Beachte alle Hinweise und Meldungen in der Fahrplan-App.","optionen":[{"text":"Abfahrt 7:05 Uhr mit RB 12 und Bus 7","richtig":false},{"text":"Abfahrt 7:15 Uhr mit Bus 34","richtig":true},{"text":"Abfahrt 7:35 Uhr mit RB 12 und Bus 7","richtig":true},{"text":"Abfahrt 7:45 Uhr mit Bus 34","richtig":false},{"text":"Abfahrt 8:05 Uhr mit RB 12 und Bus 7","richtig":false}],"tipp":"Öffne den Reiter „Störungen“ und lies jede Meldung genau: Für welchen Tag und bis zu welcher Uhrzeit gilt sie? Rechne längere Fahrzeiten zur Ankunftszeit dazu.","tippSeite":"stoerungen","erklaerung":"Bus 34 um 7:15 Uhr braucht wegen der Umleitung etwa 12 Minuten länger und ist trotzdem gegen 8:22 Uhr da. Der Zug um 7:35 Uhr fährt nach dem Ende der Bauarbeiten, damit ist die Klasse um 8:40 Uhr da. Der Zug um 7:05 Uhr und Bus 34 um 7:45 Uhr fallen aus, und mit der Verbindung um 8:05 Uhr wäre die Klasse erst um 9:10 Uhr da."},{"id":"d5-4","typ":"multi","stufe":3,"kompetenz":"bewerten","frage":"Schau dir die Startseite der Wetter-App genau an. Welche Aussagen stimmen?","optionen":[{"text":"Der Kasten „Wolkenblick Premium“ ist Werbung: Die App will dir etwas verkaufen.","richtig":true},{"text":"Die Vorhersage für Samstag ist unsicherer als die für Donnerstag.","richtig":true},{"text":"Die Meldung „Goldener Oktober“ ist alt und sagt nichts über den Wandertag.","richtig":true},{"text":"Die 5-Tage-Vorhersage ist veraltet, weil sie schon am 5. Oktober erstellt wurde.","richtig":false},{"text":"Wolkenblick Premium kostet nach der Testzeit 2,99 € im Jahr.","richtig":false},{"text":"Laut Startseite gilt die Warnung vor Sturmböen auch noch am Donnerstag.","richtig":false}],"tipp":"Prüfe jede Aussage einzeln. Achte auf das Wort „Werbung“, auf alle Datumsangaben und auf die kleine Schrift unter der Vorhersage. Lies auch Preise und Warnungen Wort für Wort.","tippSeite":"start","erklaerung":"Der Premium-Kasten ist als Werbung gekennzeichnet, und Premium kostet nach der Testzeit 2,99 € im Monat, nicht im Jahr. Laut der kleinen Schrift ist die Vorhersage für Samstag unsicherer, weil Samstag weiter in der Zukunft liegt. Die Meldung vom 5. Oktober ist veraltet, die Vorhersage selbst ist von heute, 6:50 Uhr, und die Sturmwarnung gilt nur für Mittwoch."}]}],"lesen":[{"id":"l-fledermaus","titel":"Jäger der Nacht","textsorte":"Sachtext","einleitung":"Ein Sachtext darüber, wie Fledermäuse jagen, wo sie wohnen und warum sie unseren Schutz brauchen.","text":{"titel":"Jäger der Nacht","untertitel":"Wie Fledermäuse leben und warum sie Hilfe brauchen","absaetze":["An Sommerabenden huschen in der Dämmerung oft dunkle Schatten lautlos über Gärten. Das sind keine Vögel, sondern Fledermäuse. Sie sind die einzigen Säugetiere, die wirklich fliegen können. Ihre Flügel sind aus dünner Haut, die zwischen den langen Fingern, den Armen und den Beinen gespannt ist. In Deutschland leben etwa 25 Fledermausarten.","## Jagen mit den Ohren","Bei der nächtlichen Jagd verlassen sich Fledermäuse vor allem auf ihre Ohren. Im Flug stoßen sie ständig kurze, sehr hohe Rufe aus. Die meisten dieser Töne sind so hoch, dass Menschen sie nicht hören können. Man nennt sie Ultraschall. Treffen die Rufe auf einen Ast oder eine Mücke, wird der Schall zurückgeworfen. An diesem Echo erkennt die Fledermaus, wo etwas ist, wie groß es ist und ob es sich bewegt. Das nennt man <b>Echoortung<\/b>. Blind sind sie übrigens nicht, doch im Dunkeln helfen ihnen die Augen wenig.","Unsere Fledermäuse fressen vor allem Insekten, etwa Mücken, Nachtfalter und Käfer. Viele schnappen ihre Beute direkt in der Luft. Die Zwergfledermaus wiegt nur etwa fünf Gramm. Trotzdem kann sie in einer Nacht mehrere Hundert Mücken fangen.","## Vom Dachboden in die Höhle","Tagsüber schlafen Fledermäuse in einem Versteck, dem Quartier. Dort hängen sie meist kopfüber und halten sich mit den Fußkrallen fest. Im Sommer wohnen sie gern auf warmen Dachböden, in Baumhöhlen oder in engen Spalten hinter Fensterläden. Die Weibchen bilden dann große Gruppen, die man Wochenstuben nennt. Dort bekommt jedes Weibchen meist nur ein Junges im Jahr.","Im Winter gibt es kaum Insekten. Deshalb fressen sich Fledermäuse im Spätsommer und Herbst ein Fettpolster an. Dann suchen sie ein frostfreies Winterquartier, etwa eine Höhle, einen alten Gang in einem Bergwerk oder einen kühlen Keller. Dort halten sie Winterschlaf. Ihr Körper kühlt stark ab, und das Herz schlägt nur noch ganz langsam. So sparen sie Energie. Jedes Aufwachen kostet sie viel von ihrem Fettvorrat. Wird eine Fledermaus zu oft gestört, reicht der Vorrat nicht bis zum Frühling.","## Fledermäuse brauchen Hilfe","Viele Fledermausarten sind selten geworden. Alte Bäume mit Höhlen werden gefällt. Wenn Häuser repariert werden, verschließt man oft die kleinen Löcher, durch die Fledermäuse auf den Dachboden fliegen. Außerdem gibt es weniger Insekten als früher. Deshalb stehen alle Fledermäuse in Deutschland unter strengem Schutz. Jeder kann helfen: Wer einen Fledermauskasten aufhängt, schenkt den Tieren ein Quartier. Ein Garten mit vielen Blüten lockt Nachtfalter an – und damit Futter für die Jäger der Nacht."]},"items":[{"id":"l-fledermaus-1","typ":"multi","stufe":1,"kompetenz":"entnehmen","frage":"Lies Absatz 2. Was erkennt eine Fledermaus am Echo ihrer Rufe?","optionen":[{"text":"wo sich etwas befindet","richtig":true},{"text":"wie groß es ist","richtig":true},{"text":"ob es sich bewegt","richtig":true},{"text":"welche Farbe es hat","richtig":false},{"text":"wie es riecht","richtig":false},{"text":"wie schwer es ist","richtig":false}],"tipp":"Suche in Absatz 2 den Satz, in dem das Wort „Echo“ vorkommt. Prüfe dann jede Antwort einzeln.","erklaerung":"Im Text steht: „An diesem Echo erkennt die Fledermaus, wo etwas ist, wie groß es ist und ob es sich bewegt.“ Farbe, Geruch und Gewicht werden nicht genannt."},{"id":"l-fledermaus-2","typ":"zuordnen","stufe":2,"kompetenz":"entnehmen","frage":"Wo wohnen Fledermäuse laut Text im Sommer und wo im Winter? Ordne zu.","gruppen":["Sommerquartier","Winterquartier"],"elemente":[{"t":"warmer Dachboden","g":0},{"t":"Baumhöhle","g":0},{"t":"Spalte hinter einem Fensterladen","g":0},{"t":"Höhle","g":1},{"t":"alter Gang in einem Bergwerk","g":1},{"t":"kühler Keller","g":1}],"tipp":"Absatz 4 erzählt vom Sommer, Absatz 5 vom Winter. Lies die Orte dort Wort für Wort.","erklaerung":"Im Sommer wohnen Fledermäuse auf warmen Dachböden, in Baumhöhlen und in Spalten hinter Fensterläden. Für den Winterschlaf suchen sie einen frostfreien Ort: eine Höhle, einen alten Gang in einem Bergwerk oder einen kühlen Keller."},{"id":"l-fledermaus-3","typ":"single","stufe":3,"kompetenz":"schliessen","frage":"In Absatz 1 huschen die Fledermäuse lautlos über die Gärten. Dabei rufen sie im Flug ständig. Wie passt das zusammen?","optionen":[{"text":"Ihre Rufe sind zu hoch für menschliche Ohren.","richtig":true},{"text":"Ihre Rufe sind leiser als das Summen einer Mücke.","richtig":false},{"text":"Ihre Rufe gehen im Rauschen der Bäume unter.","richtig":false},{"text":"Die weiche Flughaut dämpft alle ihre Rufe.","richtig":false}],"tipp":"Lies in Absatz 2 nach, was über die Rufe der Fledermäuse steht. Wer kann sie hören und wer nicht?","erklaerung":"Fledermäuse rufen mit Ultraschall. Die meisten dieser Töne sind so hoch, dass Menschen sie nicht hören können. Für uns wirken die Tiere deshalb lautlos."},{"id":"l-fledermaus-4","typ":"matrix","stufe":3,"kompetenz":"schliessen","frage":"Was kannst du aus dem Text schließen? Entscheide bei jeder Aussage.","spalten":["richtig","falsch"],"aussagen":[{"text":"Eine Wiese mit vielen Blüten kann Fledermäusen helfen, satt zu werden.","richtig":true},{"text":"Wer eine Fledermaus im Winterschlaf weckt, um sie anzuschauen, schadet ihr.","richtig":true},{"text":"Im Winter jagen Fledermäuse in kühlen Kellern nach Mücken.","richtig":false},{"text":"Ein Fledermauskasten ist für die Tiere vor allem ein Futterplatz.","richtig":false}],"tipp":"Diese Sätze stehen so nicht im Text. Überlege bei jedem: Passt er zu dem, was du über Futter, Winterschlaf und Quartiere gelesen hast?","erklaerung":"Blüten locken Nachtfalter an, also gibt es dort Futter, und jedes Aufwachen im Winterschlaf kostet wertvolles Fett. Im Winter jagen Fledermäuse aber nicht, und ein Fledermauskasten ist ein Quartier, kein Futterplatz."},{"id":"l-fledermaus-5","typ":"single","stufe":2,"kompetenz":"reflektieren","frage":"Lies den letzten Absatz. Was soll er bei den Lesern vor allem bewirken?","optionen":[{"text":"Die Leser sollen selbst etwas für Fledermäuse tun.","richtig":true},{"text":"Die Leser sollen erfahren, warum es weniger Insekten gibt.","richtig":false},{"text":"Die Leser sollen lernen, wie man einen Fledermauskasten baut.","richtig":false},{"text":"Die Leser sollen erfahren, wie viele Fledermausarten es gibt.","richtig":false}],"tipp":"Lies die letzten beiden Sätze des Absatzes genau. An wen richten sie sich, und was schlagen sie vor?","erklaerung":"Der Absatz erklärt, warum Fledermäuse selten geworden sind, und zeigt dann, was jeder tun kann: einen Fledermauskasten aufhängen oder einen Garten mit vielen Blüten anlegen. Die Leser sollen also selbst helfen."}]},{"id":"l-schullandheim","titel":"Das Licht zwischen den Bäumen","textsorte":"Erzählung","einleitung":"Paul ist mit seiner Klasse im Schullandheim – und dann steht auch noch eine Nachtwanderung an.","text":{"titel":"Das Licht zwischen den Bäumen","untertitel":"Eine Geschichte aus dem Schullandheim","absaetze":["Am ersten Abend im Schullandheim Moosgrund lag Paul lange wach. Durch das gekippte Fenster hörte er die Tannen rauschen, und irgendwo rief ein Käuzchen. Die anderen Jungen in Zimmer 4 schliefen schon. Paul drückte sein Gesicht ins Kissen. Es roch fremd, gar nicht nach zu Hause. Er dachte an Mama, an seinen Hund Bruno und an sein eigenes Bett. Am liebsten wäre er sofort heimgefahren.","Beim Abendessen am nächsten Tag klopfte Frau Huber an ihr Glas. „Heute machen wir eine Nachtwanderung!“, verkündete sie. „Unser Weg führt durch den Wald und wieder zurück zum Haus. Unterwegs hängen fünf Laternen. An jeder findet ihr einen Buchstaben. Jedes Zweierteam bringt mir am Ende das Lösungswort.“ Die Klasse jubelte. Nur Paul wurde ganz still und schob seinen Teller weg. Im Dunkeln durch den Wald? Schon bei dem Gedanken daran wurde ihm mulmig.","Ausgerechnet mit Aylin sollte er gehen. Aylin kletterte im Sportunterricht immer bis unter die Hallendecke und erzählte gern, dass sie vor nichts Angst habe. „Na los, das wird lustig!“, rief sie und lief voraus. Paul bekam die Taschenlampe. Er knipste sie an und stapfte hinter Aylin her.","Die ersten drei Laternen fanden die beiden schnell. Doch auf dem Weg zur vierten flackerte die Taschenlampe plötzlich und ging aus. Um sie herum war es stockdunkel. Pauls Herz klopfte bis zum Hals, und seine Beine fühlten sich an wie Pudding. Da schob sich eine Hand in seine. Aylins Finger zitterten.","„Paul?“, flüsterte Aylin. „Ich habe Angst im Dunkeln. Das habe ich noch nie jemandem erzählt.“ Paul staunte. Die mutige Aylin fürchtete sich auch? Auf einmal fühlte er sich nicht mehr so allein. Er musste an seinen Opa denken. Der hatte einmal zu ihm gesagt: „Wenn du nicht weiterweißt, bleib stehen, atme tief durch und schau dich in Ruhe um.“","„Wir bleiben erst mal stehen“, sagte Paul leise. Gemeinsam atmeten sie dreimal tief ein und aus. Langsam gewöhnten sich ihre Augen an die Dunkelheit. Zwischen den Stämmen schimmerte ein gelbes Licht. „Da vorne!“, rief Paul. Hand in Hand tasteten sie sich vorwärts. Das Licht war die vierte Laterne! „Gut gemacht, Paul“, flüsterte Aylin erleichtert. Von der Laterne aus sahen sie schon die hellen Fenster des Schullandheims, und am Gartentor leuchtete die fünfte Laterne.","„Richtig!“, lobte Frau Huber, als die beiden ihr das Lösungswort nannten. Es hieß MUTIG. Aylin zwinkerte Paul zu, und Paul spürte, wie er vor Stolz ein bisschen größer wurde. Nur die beiden wussten, wie gut dieses Wort zu ihrem Abend passte. In dieser Nacht schlief Paul sofort ein. An das fremde Kissen dachte er kein einziges Mal."]},"items":[{"id":"l-schullandheim-1","typ":"matrix","stufe":2,"kompetenz":"entnehmen","frage":"Was steht in der Geschichte? Entscheide bei jeder Aussage.","spalten":["richtig","falsch"],"aussagen":[{"text":"An jeder Laterne finden die Kinder einen Buchstaben.","richtig":true},{"text":"Paul und Aylin finden alle fünf Laternen ohne Schwierigkeiten.","richtig":false},{"text":"Das gelbe Licht zwischen den Bäumen ist ein Fenster des Schullandheims.","richtig":false},{"text":"Die fünfte Laterne hängt am Gartentor.","richtig":true}],"tipp":"Suche zu jeder Aussage die passende Stelle. Die Absätze 2, 4 und 6 helfen dir.","erklaerung":"An jeder Laterne gibt es einen Buchstaben, und die fünfte hängt am Gartentor. Das gelbe Licht war aber die vierte Laterne, und als die Taschenlampe ausging, wurde es schwierig."},{"id":"l-schullandheim-2","typ":"reihenfolge","stufe":3,"kompetenz":"entnehmen","frage":"Bringe die Ereignisse in die richtige Reihenfolge.","reihe":["Frau Huber kündigt beim Abendessen die Nachtwanderung an.","Paul und Aylin finden die ersten drei Laternen.","Die Taschenlampe flackert und geht aus.","Aylin gibt zu, dass sie Angst im Dunkeln hat.","Paul denkt an den Rat seines Opas.","Die beiden entdecken die vierte Laterne."],"tipp":"Gehe die Geschichte Absatz für Absatz durch und suche jedes Ereignis im Text.","erklaerung":"Erst kündigt Frau Huber die Wanderung an, dann finden die beiden drei Laternen. Danach geht die Lampe aus, Aylin gesteht ihre Angst, Paul erinnert sich an Opas Rat – und so entdecken sie die vierte Laterne."},{"id":"l-schullandheim-3","typ":"multi","stufe":2,"kompetenz":"schliessen","frage":"Lies Absatz 1. Wie fühlt sich Paul am ersten Abend?","optionen":[{"text":"Er hat Heimweh.","richtig":true},{"text":"Er fühlt sich fremd und unwohl.","richtig":true},{"text":"Er freut sich auf die Nachtwanderung.","richtig":false},{"text":"Er ist stolz auf sich.","richtig":false},{"text":"Er ist wütend auf die anderen Jungen.","richtig":false},{"text":"Er ist so müde, dass er gleich einschläft.","richtig":false}],"tipp":"Das Gefühl wird nicht direkt genannt. Achte darauf, woran Paul denkt und was er sich wünscht.","erklaerung":"Paul denkt an Mama, Bruno und sein Bett und möchte am liebsten heimfahren: Er hat Heimweh. Das Kissen riecht fremd, deshalb fühlt er sich unwohl."},{"id":"l-schullandheim-4","typ":"markieren","stufe":2,"kompetenz":"schliessen","frage":"Lies diese Stelle aus Absatz 4. Tippe die Satzteile an, die zeigen, wie Pauls Körper auf die Angst reagiert.","teile":[{"t":"Um sie herum war es stockdunkel"},{"t":".","fix":true},{"t":"Pauls Herz klopfte bis zum Hals","ziel":true},{"t":",","fix":true},{"t":"und","fix":true},{"t":"seine Beine fühlten sich an wie Pudding","ziel":true},{"t":".","fix":true},{"t":"Da schob sich eine Hand in seine"},{"t":".","fix":true},{"t":"Aylins Finger zitterten"},{"t":".","fix":true}],"tipp":"Achte genau darauf, wessen Körper beschrieben wird.","erklaerung":"Ein Herz, das bis zum Hals klopft, und Beine wie Pudding sind Zeichen für große Angst. Die zitternden Finger gehören Aylin, nicht Paul."},{"id":"l-schullandheim-5","typ":"single","stufe":3,"kompetenz":"reflektieren","frage":"Am Anfang riecht Pauls Kissen fremd. Im letzten Satz kommt das Kissen noch einmal vor. Was will die Geschichte damit zeigen?","optionen":[{"text":"Pauls Heimweh ist verschwunden.","richtig":true},{"text":"Paul ist nach der Wanderung erschöpft.","richtig":false},{"text":"Paul fühlt sich noch immer fremd.","richtig":false},{"text":"Paul hat ein neues Kissen bekommen.","richtig":false}],"tipp":"Überlege, warum Paul am ersten Abend an das Kissen gedacht hat. Was hat sich bis zum Schluss verändert?","erklaerung":"Am Anfang erinnert das fremde Kissen Paul daran, dass er nicht zu Hause ist. Am Ende denkt er gar nicht mehr daran – sein Heimweh ist verschwunden."}]},{"id":"l-gedicht","titel":"Novembernebel","textsorte":"Gedicht","einleitung":"Ein Gedicht über einen nebligen Tag im November – achte auf die sprachlichen Bilder.","text":{"titel":"Novembernebel","autor":"Lese-Labor-Team","strophen":[["Am Morgen schleicht auf leisen Sohlen","der Nebel durch das Dorf, ganz sacht.","Er hat die Farben weggestohlen","und aus dem Tag ein Grau gemacht."],["Die Bäume sind wie graue Riesen,","die stumm am Rand des Weges stehn.","Kein Vogel singt mehr auf den Wiesen,","man kann die eigne Hand kaum sehn."],["Doch mittags scheint die Sonne wieder","ganz schüchtern durch das graue Tuch.","Die Amsel schüttelt ihr Gefieder","und wagt den ersten Liedversuch."],["Am Abend ist der Nebel fort,","die Sterne funkeln hell und klar.","Doch morgen liegt er wieder dort,","wo er auch heute Morgen war."]]},"items":[{"id":"l-gedicht-1","typ":"matrix","stufe":1,"kompetenz":"entnehmen","frage":"Was steht im Gedicht? Entscheide bei jeder Aussage.","spalten":["steht im Gedicht","steht nicht im Gedicht"],"aussagen":[{"text":"Der Nebel schleicht durch das Dorf.","richtig":true},{"text":"Der Nebel hat dem Tag die Farben genommen.","richtig":true},{"text":"Am Mittag ist der Nebel schon ganz verschwunden.","richtig":false},{"text":"Am Abend fängt es an zu regnen.","richtig":false}],"tipp":"Suche zu jeder Aussage den passenden Vers. Manche Aussagen sagen dasselbe mit anderen Worten. Findest du keinen passenden Vers, steht es nicht im Gedicht.","erklaerung":"Der Nebel schleicht durch das Dorf (Vers 1 und 2) und hat die Farben weggestohlen (Vers 3). Dass er schon mittags ganz weg ist, steht nirgends – erst in Vers 13 heißt es: „Am Abend ist der Nebel fort.“ Von Regen ist keine Rede."},{"id":"l-gedicht-2","typ":"multi","stufe":2,"kompetenz":"entnehmen","frage":"Lies Strophe 2. Was erfährst du dort über den Nebeltag?","optionen":[{"text":"Die Bäume sehen aus wie graue Riesen.","richtig":true},{"text":"Auf den Wiesen singt kein Vogel mehr.","richtig":true},{"text":"Im dichten Nebel sieht man kaum etwas.","richtig":true},{"text":"Die Bäume verlieren ihre letzten Blätter.","richtig":false},{"text":"Die Bäume stehen mitten auf dem Weg.","richtig":false},{"text":"Ein kalter Wind pfeift über den Weg.","richtig":false}],"tipp":"Strophe 2 hat vier Verse. Vergleiche jede Antwort genau mit diesen Versen. Manche Antworten sagen es mit anderen Worten.","erklaerung":"In Strophe 2 sehen die Bäume aus wie graue Riesen, kein Vogel singt, und man kann die eigene Hand kaum sehen. Die Bäume stehen aber am Rand des Weges, nicht mitten darauf. Von Blättern oder Wind steht dort nichts."},{"id":"l-gedicht-3","typ":"single","stufe":2,"kompetenz":"schliessen","frage":"In Vers 10 scheint die Sonne „durch das graue Tuch“. Was ist mit dem grauen Tuch gemeint?","optionen":[{"text":"der Nebel, der über dem Dorf liegt","richtig":true},{"text":"ein Vorhang vor dem Fenster","richtig":false},{"text":"das dunkle Gefieder der Amsel","richtig":false},{"text":"ein Tuch, das an der Wäscheleine hängt","richtig":false}],"tipp":"Ein Tuch kann etwas zudecken. Was deckt an diesem Tag alles zu?","erklaerung":"Der Nebel liegt grau über dem Dorf und verdeckt alles wie ein Tuch. Die Sonne scheint also durch den Nebel. So ein sprachliches Bild nennt man Metapher."},{"id":"l-gedicht-4","typ":"zuordnen","stufe":3,"kompetenz":"schliessen","frage":"Das Gedicht beschreibt einen ganzen Tag. Ordne zu: Wann passiert was?","gruppen":["am Morgen","am Mittag","am Abend"],"elemente":[{"t":"Der Nebel schleicht durch das Dorf.","g":0},{"t":"Kein Vogel singt auf den Wiesen.","g":0},{"t":"Die Sonne scheint wieder.","g":1},{"t":"Die Amsel schüttelt ihr Gefieder.","g":1},{"t":"Der Nebel ist fort.","g":2},{"t":"Die Sterne funkeln hell und klar.","g":2}],"tipp":"Suche in den Strophen nach Zeitangaben. Hat eine Strophe keine eigene Zeitangabe, dann überlege: Was passiert davor und was danach?","erklaerung":"Strophe 1 beginnt mit „Am Morgen“, Strophe 3 mit „Doch mittags“ und Strophe 4 mit „Am Abend“. Strophe 2 gehört noch zum Morgen: Da singt kein Vogel – erst mittags wagt die Amsel ihr erstes Lied."},{"id":"l-gedicht-5","typ":"single","stufe":2,"kompetenz":"reflektieren","frage":"Welches Reimschema haben die Strophen dieses Gedichts?","optionen":[{"text":"Kreuzreim (abab)","richtig":true},{"text":"Paarreim (aabb)","richtig":false},{"text":"umarmender Reim (abba)","richtig":false},{"text":"kein festes Reimschema","richtig":false}],"tipp":"Schreibe hinter jeden Vers einer Strophe einen Buchstaben. Verse, die sich reimen, bekommen den gleichen Buchstaben.","erklaerung":"In jeder Strophe reimt sich der erste Vers auf den dritten und der zweite auf den vierten, zum Beispiel „Sohlen – weggestohlen“ und „sacht – gemacht“ in der ersten Strophe. Das ist ein Kreuzreim (abab)."}]},{"id":"l-schulweg","titel":"Unterwegs zur Schule","textsorte":"Sachtext mit Tabelle","einleitung":"Die Klasse 4a hat herausgefunden, wie die Kinder ihrer Schule morgens zum Unterricht kommen – lies den Bericht und schau dir die Tabelle genau an.","text":{"titel":"So kommen wir zur Schule","untertitel":"Eine Umfrage der Klasse 4a","autor":"Aylin und Mateo, Klasse 4a der Grundschule am Lindenbach in Lindenbrunn","absaetze":["Wie kommen die Kinder unserer Schule morgens zum Unterricht? Das wollten wir, die Klasse 4a, im Mai genau wissen. Deshalb haben wir alle 120 Kinder unserer Schule befragt. Jedes Kind durfte nur ein Verkehrsmittel nennen: das, mit dem es meistens kommt. Außerdem hat jedes Kind gesagt, wie viele Minuten sein Schulweg ungefähr dauert. In der Tabelle steht für jedes Verkehrsmittel, wie lange ein Kind damit ungefähr unterwegs ist.","Die größte Gruppe der Kinder geht zu Fuß. Viele von ihnen wohnen nur wenige Straßen von der Schule entfernt. Wer zu Fuß geht, Fahrrad fährt oder Tretroller fährt, bewegt sich schon vor dem Unterricht an der frischen Luft.","Mit dem Fahrrad dürfen an unserer Schule nur Kinder kommen, die die Radfahrprüfung bestanden haben. Diese Prüfung machen bei uns alle Kinder in der 4. Klasse. Die Kinder mit dem Tretroller gehen dagegen fast alle in die 1. oder 2. Klasse.","Die Kinder, die mit dem Schulbus fahren, wohnen in den Dörfern Erlenried und Fuchsbühl. Diese liegen mehrere Kilometer von der Schule entfernt. Auf seinem Weg hält der Schulbus an sieben Haltestellen.","Am schnellsten in der Schule sind die Kinder, die mit dem Auto gebracht werden. Trotzdem ist dieses „Elterntaxi“ ein Problem. Unser Hausmeister, Herr Kofler, hat an einem Morgen gezählt, wie viele Autos zwischen 7:40 Uhr und 8:00 Uhr vor dem Schultor gehalten haben. Es waren 15 Autos. Manche halten auf dem Gehweg oder an der Bushaltestelle. Dann wird es für die Kinder, die zu Fuß kommen, eng und gefährlich.","Deshalb starten wir nach den Pfingstferien unser Projekt „Laufbus“. Dabei gehen Kinder morgens gemeinsam zur Schule, wie bei einem Bus mit festen Haltestellen. Ein Erwachsener begleitet die Gruppe. Unser Ziel: Mindestens die Hälfte der Kinder, die jetzt mit dem Auto kommen, soll bald mit dem Laufbus kommen."],"tabelle":{"titel":"Umfrage der Klasse 4a: So kommen die Kinder zur Schule","kopf":["Verkehrsmittel","Anzahl der Kinder","Ungefähre Dauer des Schulwegs"],"zeilen":[["zu Fuß","52","12 Minuten"],["Fahrrad","16","9 Minuten"],["Tretroller","14","8 Minuten"],["Schulbus","20","18 Minuten"],["Auto („Elterntaxi“)","18","7 Minuten"]]}},"items":[{"id":"l-schulweg-1","typ":"matrix","stufe":3,"kompetenz":"entnehmen","frage":"Stimmen die Aussagen? Nutze den Text und die Tabelle.","spalten":["richtig","falsch"],"aussagen":[{"text":"Mit dem Tretroller kommen mehr Kinder als mit dem Schulbus.","richtig":false},{"text":"Die Fahrradkinder sind laut Tabelle länger unterwegs als die Kinder mit dem Tretroller.","richtig":true},{"text":"Herr Kofler hat an einem Morgen 18 Autos vor dem Schultor gezählt.","richtig":false},{"text":"Mit dem Laufbus sollen bald mindestens 9 Kinder kommen, die jetzt mit dem Auto gebracht werden.","richtig":true}],"tipp":"Für manche Aussagen brauchst du die Tabelle, für andere den Text. Bei einer Aussage musst du Text und Tabelle verbinden und rechnen.","erklaerung":"Mit dem Tretroller kommen 14 Kinder, mit dem Bus 20. Fahrradkinder brauchen ungefähr 9 Minuten, Rollerkinder ungefähr 8. Herr Kofler hat 15 Autos gezählt, nicht 18 – und weil 18 : 2 = 9 ist, sollen mindestens 9 Auto-Kinder mit dem Laufbus kommen."},{"id":"l-schulweg-2","typ":"eingabe","stufe":3,"kompetenz":"entnehmen","frage":"Im Text steht, welche Kinder sich schon vor dem Unterricht an der frischen Luft bewegen. Wie viele Kinder sind das laut Umfrage? Rechne mit der Tabelle.","vorgabe":"Tippe nur die Zahl ein.","loesungen":["82","82 Kinder"],"tipp":"Suche in Absatz 2 die drei Arten, wie sich Kinder auf dem Schulweg selbst bewegen. Zähle dann die passenden Zahlen aus der Tabelle zusammen.","erklaerung":"Laut Absatz 2 bewegen sich die Kinder, die zu Fuß gehen, Fahrrad fahren oder Tretroller fahren. Das sind 52 + 16 + 14 = 82 Kinder."},{"id":"l-schulweg-3","typ":"single","stufe":2,"kompetenz":"schliessen","frage":"In welche Klasse gehen die Kinder, die mit dem Fahrrad zur Schule kommen? Wähle die Antwort mit der passenden Begründung.","optionen":[{"text":"Sie gehen alle in die 4. Klasse, denn erst dort machen die Kinder die Radfahrprüfung.","richtig":true},{"text":"Sie gehen alle in die 4. Klasse, denn diese Kinder wohnen am weitesten von der Schule weg.","richtig":false},{"text":"Sie gehen in die 3. und 4. Klasse, denn die Kinder der 1. und 2. Klasse fahren Tretroller.","richtig":false},{"text":"Das kann man nicht wissen, denn im Text steht nirgends, in welche Klasse sie gehen.","richtig":false}],"tipp":"Lies Absatz 3. Was braucht ein Kind, damit es mit dem Fahrrad kommen darf? Und in welcher Klasse bekommt es das?","erklaerung":"Mit dem Rad dürfen nur Kinder kommen, die die Radfahrprüfung bestanden haben. Diese Prüfung machen die Kinder erst in der 4. Klasse. Also gehen alle Fahrradkinder in die 4. Klasse, auch wenn das nicht wörtlich im Text steht."},{"id":"l-schulweg-4","typ":"multi","stufe":2,"kompetenz":"schliessen","frage":"Die Buskinder fahren mit einem Fahrzeug. Trotzdem brauchen sie laut Tabelle länger als die Kinder, die zu Fuß gehen. Welche Gründe kannst du aus dem Text erschließen?","optionen":[{"text":"Sie wohnen in Dörfern, die mehrere Kilometer entfernt liegen.","richtig":true},{"text":"Der Schulbus hält auf seinem Weg an sieben Haltestellen.","richtig":true},{"text":"Der Schulbus steht jeden Morgen lange im Stau.","richtig":false},{"text":"Sie müssen zu Hause erst weit zur Haltestelle laufen.","richtig":false},{"text":"Der Busfahrer fährt besonders langsam, weil Kinder mitfahren.","richtig":false}],"tipp":"Vergleiche zuerst in der Tabelle die Zeiten. Lies dann Absatz 4 genau: Was erfährst du dort über den Weg der Buskinder?","erklaerung":"In Absatz 4 steht, dass die Buskinder mehrere Kilometer entfernt wohnen und der Bus an sieben Haltestellen hält. Von Stau, langen Fußwegen oder einem langsamen Fahrer steht nichts im Text."},{"id":"l-schulweg-5","typ":"single","stufe":1,"kompetenz":"reflektieren","frage":"Die Klasse hat ihre Ergebnisse zusätzlich in einer Tabelle dargestellt. Wozu ist die Tabelle vor allem gut?","optionen":[{"text":"Man kann die Zahlen schnell finden und gut miteinander vergleichen.","richtig":true},{"text":"Man erfährt, warum die Kinder ihr Verkehrsmittel gewählt haben.","richtig":false},{"text":"Man sieht, wie weit jedes Kind von der Schule entfernt wohnt.","richtig":false},{"text":"Man erfährt, wie gefährlich jedes Verkehrsmittel für Kinder ist.","richtig":false}],"tipp":"Schau dir die Spalten der Tabelle an. Welche Angaben stehen dort – und welche findest du dort gar nicht?","erklaerung":"In der Tabelle stehen zu jedem Verkehrsmittel nur zwei Zahlen: die Anzahl der Kinder und die ungefähre Dauer des Schulwegs. So findest du sie schnell und kannst sie vergleichen. Gründe, Entfernungen oder Gefahren stehen nicht darin."}]},{"id":"l-experiment","titel":"Das schwimmende Ei","textsorte":"Anleitung","einleitung":"Mit dieser Anleitung bringst du ein rohes Ei zum Schwimmen und erfährst, warum das klappt.","text":{"titel":"Kann ein Ei schwimmen?","untertitel":"Ein Experiment für zu Hause oder für die Schule","autor":"Forscherkarte Nr. 7 aus der Forscherecke","absaetze":["Ein Stein geht im Wasser unter, ein Stück Holz schwimmt. Aber was macht ein rohes Ei? Mit diesem Experiment findest du heraus, wie du ein Ei zum Schwimmen bringst. Du brauchst dafür etwa 20 Minuten.","## Material","Du brauchst ein frisches, rohes Ei, ein großes, durchsichtiges Glas (mindestens 500 Milliliter), einen Messbecher, Leitungswasser, Speisesalz, einen Esslöffel und ein Geschirrtuch.","## Sicherheitshinweis","Auf rohen Eiern können Keime sein. Wasche dir deshalb nach dem Experiment gründlich die Hände. Trinke das Salzwasser nicht, denn so viel Salz schadet deinem Körper. Iss das Ei danach nicht.","## So gehst du vor","Schritt 1: Stelle das Glas auf das Geschirrtuch. Miss 250 Milliliter Leitungswasser ab und gieße es ins Glas.","Schritt 2: Lege das Ei mit dem Esslöffel vorsichtig ins Wasser. Beobachte genau, wo das Ei bleibt.","Schritt 3: Hole das Ei mit dem Löffel wieder heraus und lege es auf das Geschirrtuch.","Schritt 4: Gib einen Esslöffel Salz ins Wasser und rühre so lange um, bis sich das Salz aufgelöst hat. Mach das noch dreimal, bis insgesamt vier Löffel Salz im Wasser sind.","Schritt 5: Lege das Ei wieder mit dem Löffel ins Glas. Was passiert jetzt?","Schritt 6 (für Profis): Halte den Esslöffel knapp über das Wasser, und zwar so, dass seine runde Rückseite nach oben zeigt. Gieße langsam Leitungswasser auf den Löffel, bis das Glas fast voll ist.","## Was du beobachtest","Im Leitungswasser sinkt das Ei auf den Boden. Im Salzwasser steigt es nach oben und schwimmt. Nach Schritt 6 schwebt das Ei im Glas, ohne den Boden zu berühren: Unter ihm ist Salzwasser, über ihm Leitungswasser.","## Warum ist das so?","Ob etwas schwimmt oder sinkt, hängt davon ab, ob es schwerer oder leichter ist als die gleiche Menge Wasser. Ein frisches Ei ist etwas schwerer als gleich viel Leitungswasser. Darum sinkt es. Löst sich Salz im Wasser auf, wird das Wasser schwerer, ohne dass es viel mehr wird. Jetzt ist gleich viel Salzwasser schwerer als das Ei. Deshalb trägt das Salzwasser das Ei. Das leichtere Leitungswasser bleibt oben, wenn man es vorsichtig darübergießt. Darum schwebt das Ei genau an der Grenze zwischen dem Salzwasser unten und dem Leitungswasser oben.","Übrigens: Ein altes Ei kann sogar im Leitungswasser schwimmen. In seinem Inneren hat sich mit der Zeit eine größere Luftblase gebildet."]},"items":[{"id":"l-experiment-1","typ":"reihenfolge","stufe":2,"kompetenz":"entnehmen","frage":"Bringe die Arbeitsschritte in die richtige Reihenfolge.","reihe":["Leitungswasser abmessen und ins Glas gießen","Das Ei ins Leitungswasser legen","Das Ei wieder herausholen","Vier Löffel Salz einrühren","Das Ei ins Salzwasser legen","Leitungswasser langsam über den Löffel gießen"],"tipp":"Lies die Schritte 1 bis 6 noch einmal. Achte darauf, wann das Ei im Glas liegt und wann nicht.","erklaerung":"Zuerst kommt Leitungswasser ins Glas, dann wird das Ei getestet und wieder herausgeholt. Erst danach wird das Salz eingerührt und das Ei zurückgelegt. Zum Schluss wird vorsichtig Leitungswasser darübergegossen."},{"id":"l-experiment-2","typ":"matrix","stufe":1,"kompetenz":"entnehmen","frage":"Stimmen die Aussagen? Lies die Anleitung genau.","spalten":["richtig","falsch"],"aussagen":[{"text":"Für das Experiment brauchst du etwa 20 Minuten.","richtig":true},{"text":"Du sollst für das Experiment ein gekochtes Ei verwenden.","richtig":false},{"text":"Du schüttest das ganze Salz auf einmal ins Wasser.","richtig":false},{"text":"Nach dem Experiment sollst du dir die Hände waschen.","richtig":true}],"tipp":"Schau im ersten Absatz, in der Materialliste, im Sicherheitshinweis und in Schritt 4 nach.","erklaerung":"Das Experiment dauert etwa 20 Minuten, und danach sollst du dir die Hände waschen. Das Ei ist roh, nicht gekocht. Das Salz rührst du Löffel für Löffel ein."},{"id":"l-experiment-3","typ":"single","stufe":2,"kompetenz":"schliessen","frage":"Paul nimmt für das Experiment ein sehr altes Ei. Warum klappt sein Experiment nicht richtig?","optionen":[{"text":"Sein Ei schwimmt schon im Leitungswasser. So sieht er nicht, was das Salz bewirkt.","richtig":true},{"text":"Sein Ei ist viel zu schwer. Deshalb sinkt es auch im Salzwasser wieder nach unten.","richtig":false},{"text":"Sein Ei saugt das Salz auf. Deshalb wird das Wasser im Glas gar nicht schwerer.","richtig":false},{"text":"Sein Ei hat gar keine Luftblase. Deshalb kann das Salzwasser es nicht tragen.","richtig":false}],"tipp":"Lies den Absatz, der mit „Übrigens“ beginnt. Überlege dann, was mit Pauls Ei schon in Schritt 2 passiert.","erklaerung":"Ein altes Ei hat eine größere Luftblase und kann schon im Leitungswasser schwimmen. Dann gibt es keinen Unterschied zum Salzwasser, und Paul kann nicht sehen, dass das Salz das Ei zum Schwimmen bringt."},{"id":"l-experiment-4","typ":"multi","stufe":3,"kompetenz":"schliessen","frage":"Was kannst du aus der Anleitung schließen? Nutze vor allem den Abschnitt „Warum ist das so?“.","optionen":[{"text":"Ohne Schritt 4 würde das Ei auch in Schritt 5 am Boden liegen bleiben.","richtig":true},{"text":"Durch das Salz verändert sich das Wasser, nicht das Ei.","richtig":true},{"text":"Je mehr Leitungswasser im Glas ist, desto besser schwimmt das Ei.","richtig":false},{"text":"Das Salz macht das Ei leichter, deshalb steigt es nach oben.","richtig":false},{"text":"Ein frisches Ei sinkt, weil in ihm eine große Luftblase ist.","richtig":false}],"tipp":"Lies den Abschnitt „Warum ist das so?“ und den Absatz mit „Übrigens“ noch einmal. Schau dir auch die Schritte 3 bis 5 an. Prüfe dann jede Aussage einzeln.","erklaerung":"Das Salz macht das Wasser schwerer, das Ei bleibt gleich. Ohne das Salz aus Schritt 4 wäre im Glas nur Leitungswasser, und darin sinkt ein frisches Ei. Wie viel Wasser im Glas ist, spielt keine Rolle, und eine große Luftblase hat nur ein altes Ei."},{"id":"l-experiment-5","typ":"single","stufe":2,"kompetenz":"reflektieren","frage":"In den Schritten beginnen viele Sätze mit „Lege …“, „Gib …“ oder „Gieße …“. Warum sind die Schritte so geschrieben?","optionen":[{"text":"Wer den Text liest, soll die Schritte selbst nacheinander ausführen.","richtig":true},{"text":"Der Text soll erklären, warum ein rohes Ei im Salzwasser schwimmt.","richtig":false},{"text":"Der Text soll erzählen, was ein Kind bei einem Experiment erlebt hat.","richtig":false},{"text":"Der Text soll die Leser warnen, was bei dem Experiment gefährlich ist.","richtig":false}],"tipp":"Lies Schritt 1 noch einmal. Wem sagen die Sätze dort etwas, und was soll diese Person damit machen?","erklaerung":"Der Text ist eine Anleitung: Die Sätze in den Schritten sagen dir, was du tun sollst. So kannst du das Experiment selbst Schritt für Schritt durchführen. Warum das Ei schwimmt und worauf du achten musst, steht in anderen Abschnitten."}]},{"id":"l-meinung","titel":"Bücher für die Pause?","textsorte":"Zeitungsartikel","einleitung":"In der Kinderzeitung „Rabenblatt“ geht es um eine Frage, über die an einer Grundschule gerade heftig diskutiert wird.","text":{"titel":"Ein Bücherschrank für den Pausenhof?","untertitel":"An der Grundschule an der Mühlwiese wird diskutiert – am Freitag fällt die Entscheidung","autor":"Leyla Aksoy, Kinderreporterin","absaetze":["An der Grundschule an der Mühlwiese in Kirchwinkel wird gerade heftig diskutiert: Soll auf dem Pausenhof ein offener Bücherschrank stehen? In so einen Schrank darf jeder Bücher hineinstellen. Wer möchte, darf sich auch Bücher herausnehmen und behalten. Das kostet nichts. Der Elternbeirat hat angeboten, einen Schrank aus Holz zu bezahlen. Der Schrank kostet 450 €. Am Freitag stimmen die Klassensprecherinnen und Klassensprecher aller zwölf Klassen darüber ab.","## Amira sagt: Ja!","Amira (10) aus der Klasse 4b ist für den Bücherschrank. „Viele Kinder wollen in der Pause nicht Fußball oder Fangen spielen“, sagt sie. „Für sie wäre ein spannendes Buch genau das Richtige.“ Außerdem findet Amira, dass Bücher zu schade sind, um zu Hause im Regal zu verstauben. Sie hat schon zehn Bücher gesammelt, die sie verschenken möchte. Amira ist sicher: Mit dem Schrank bekommen mehr Kinder Lust aufs Lesen.","## Jonas sagt: Nein!","Jonas (9) aus der Klasse 4a ist dagegen. „Die Pause ist zum Toben da. Wir lesen doch schon den ganzen Vormittag im Unterricht“, meint er. Außerdem befürchtet Jonas, dass die Bücher bei Regen nass werden und kaputtgehen. „Für 450 € sollten wir lieber neue Bälle und Springseile kaufen. Davon hätten viel mehr Kinder etwas“, sagt er.","## Was man weiß","Die Schulleiterin, Frau Hölzl, möchte sich nicht festlegen. Sie nennt aber ein paar Zahlen: In der Schulbücherei werden pro Woche etwa 40 Bücher ausgeliehen. Die Bücherei ist allerdings nur am Dienstag und am Donnerstag geöffnet. In der Spielekiste für die Pause sind von 20 Bällen nur noch 8 zu gebrauchen.","An der Grundschule im Nachbarort Oberwinkel steht schon seit zwei Jahren ein Bücherschrank mit einem kleinen Dach. Der Hausmeister dort erzählt: „Nasse Bücher hatten wir bisher nur ein einziges Mal. Da hatte jemand die Tür offen gelassen.“ Allerdings räumt er den Schrank jede Woche auf, weil oft Bücher herumliegen.","Welche Seite überzeugt dich mehr? Wie die Abstimmung ausgegangen ist, liest du in der nächsten Ausgabe des „Rabenblatts“."]},"items":[{"id":"l-meinung-1","typ":"single","stufe":1,"kompetenz":"entnehmen","frage":"Wer stimmt am Freitag über den Bücherschrank ab?","optionen":[{"text":"Die Klassensprecherinnen und Klassensprecher aller Klassen","richtig":true},{"text":"Die Schulleiterin Frau Hölzl zusammen mit dem Elternbeirat","richtig":false},{"text":"Alle Kinder der Grundschule an der Mühlwiese","richtig":false},{"text":"Die Leserinnen und Leser der Kinderzeitung","richtig":false}],"tipp":"Die Antwort steht im ersten Absatz. Suche das Wort „Freitag“.","erklaerung":"Im ersten Absatz steht: „Am Freitag stimmen die Klassensprecherinnen und Klassensprecher aller zwölf Klassen darüber ab.“"},{"id":"l-meinung-2","typ":"multi","stufe":2,"kompetenz":"entnehmen","frage":"Welche Gründe nennt Jonas gegen den Bücherschrank?","optionen":[{"text":"In der Pause sollen sich die Kinder austoben können.","richtig":true},{"text":"Die Bücher könnten bei Regen nass werden und kaputtgehen.","richtig":true},{"text":"Mit Bällen und Springseilen hätten mehr Kinder etwas vom Geld.","richtig":true},{"text":"Der Elternbeirat hat zu wenig Geld für den Schrank.","richtig":false},{"text":"In der Schulbücherei gibt es schon genug Bücher für alle.","richtig":false},{"text":"Ein Schrank aus Holz passt nicht auf den Pausenhof.","richtig":false}],"tipp":"Lies nur den Abschnitt „Jonas sagt: Nein!“. Achte auf alles, was Jonas sagt oder befürchtet.","erklaerung":"Jonas meint, die Pause sei zum Toben da. Er befürchtet, dass die Bücher bei Regen nass werden, und er möchte von dem Geld lieber Bälle und Springseile kaufen. Die anderen Gründe nennt er nicht."},{"id":"l-meinung-3","typ":"matrix","stufe":2,"kompetenz":"schliessen","frage":"Ist das eine Tatsache oder eine Meinung? Entscheide bei jeder Aussage.","spalten":["Tatsache","Meinung"],"aussagen":[{"text":"Der Bücherschrank aus Holz kostet 450 €.","richtig":true},{"text":"Bücher sind zu schade, um im Regal zu verstauben.","richtig":false},{"text":"Die Schulbücherei ist nur am Dienstag und am Donnerstag geöffnet.","richtig":true},{"text":"Die Pause ist zum Toben da.","richtig":false}],"tipp":"Eine Tatsache kann man nachprüfen, zum Beispiel durch Nachschauen oder Zählen. Eine Meinung zeigt, was jemand denkt oder findet.","erklaerung":"Den Preis und die Öffnungszeiten kann man nachprüfen, das sind Tatsachen. Ob Bücher zu schade fürs Regal sind und wozu die Pause da ist, sehen nicht alle gleich. Das sind Meinungen von Amira und Jonas."},{"id":"l-meinung-4","typ":"single","stufe":3,"kompetenz":"schliessen","frage":"Jonas befürchtet, dass die Bücher bei Regen nass werden. Welche Information aus dem Text zeigt, dass diese Sorge vielleicht unnötig ist?","optionen":[{"text":"An einer Nachbarschule wurden in zwei Jahren nur einmal Bücher nass.","richtig":true},{"text":"In der Schulbücherei werden pro Woche etwa 40 Bücher ausgeliehen.","richtig":false},{"text":"Von den 20 Bällen in der Spielekiste sind nur noch 8 zu gebrauchen.","richtig":false},{"text":"Der Elternbeirat würde den Bücherschrank aus Holz bezahlen.","richtig":false}],"tipp":"Alle Antworten stehen im Text. Frage dich bei jeder: Hat sie etwas mit Regen und nassen Büchern zu tun?","erklaerung":"In Oberwinkel steht schon seit zwei Jahren ein Bücherschrank. Dort sind nur einmal Bücher nass geworden, weil die Tür offen war. Das spricht gegen die Sorge von Jonas."},{"id":"l-meinung-5","typ":"single","stufe":3,"kompetenz":"reflektieren","frage":"Was will die Kinderreporterin Leyla Aksoy mit ihrem Artikel vor allem erreichen?","optionen":[{"text":"Sie will beide Seiten zeigen, damit sich jeder selbst eine Meinung bildet.","richtig":true},{"text":"Sie will die Leser davon überzeugen, für den Bücherschrank zu stimmen.","richtig":false},{"text":"Sie will allen mitteilen, wie die Abstimmung am Freitag ausgegangen ist.","richtig":false},{"text":"Sie will erreichen, dass die Schule neue Bälle und Springseile kauft.","richtig":false}],"tipp":"Vergleiche, wie viel Platz Amira und Jonas bekommen. Achte auch darauf, ob Leyla ihre eigene Meinung sagt und wie der Artikel endet.","erklaerung":"Leyla stellt beide Meinungen ausführlich vor und nennt Tatsachen. Ihre eigene Meinung verrät sie nicht. Am Ende fragt sie dich, welche Seite dich mehr überzeugt."}]},{"id":"lv-spiegelsee","titel":"Wo der Berg zweimal steht","textsorte":"Geschichte","format":"bylet-v","einleitung":"Eine fantastische Geschichte von einem See in den bayerischen Bergen, einem alten Rätsel und einer ungewöhnlichen Freundschaft.","text":{"titel":"Wo der Berg zweimal steht","abschnitte":[{"bild":"🏞️🐇","absaetze":["„Hier ist es so langweilig!“, stöhnte Elif am dritten Tag der Herbstferien. Sie wohnte eine Woche lang bei Oma Resi. Omas altes Bauernhaus stand direkt am Spiegelsee. Hinter dem See ragte der Hirschkopf in den Himmel. Hier gab es keine anderen Kinder. Elif vermisste ihre Freundinnen in der Stadt.","Oma Resi lächelte. „Weißt du, warum unser See Spiegelsee heißt?“, fragte sie. „Wenn kein Wind weht, wird das Wasser ganz glatt. Dann spiegelt sich der Hirschkopf darin so genau, dass man kaum weiß, welcher Berg der echte ist.“ Elif zuckte mit den Schultern.","Am Nachmittag sollte sie Brennholz aus dem Schuppen holen. Als sie die Tür öffnete, raschelte es hinter dem Holzstapel. Vorsichtig spähte Elif um die Ecke. Dort saß ein Tier, so groß wie ein Hase. Es hatte lange Ohren, ein kleines Geweih und zwei gefiederte Flügel. Neben ihm lag ein Häufchen Haselnüsse.","„Bitte nicht schreien!“, piepste das Tier. „Ich heiße Quirin und bin ein Wolpertinger.“ Elif riss die Augen auf. Wolpertinger kannte sie nur aus Omas Geschichten."]},{"bild":"🌰📜","absaetze":["„Ich wohne im Nebeltal, gleich hinter dem Hirschkopf“, erzählte Quirin. „Gestern wollte ich Haselnüsse für den Winter sammeln. Dabei habe ich mich verlaufen.“ Er seufzte tief. „Aus dem Tal kommt man immer heraus, zurück aber nur durch ein Tor. Es öffnet sich nur in Vollmondnächten. Heute Nacht geht es zum letzten Mal vor dem Winter auf. Wenn ich es nicht finde, muss ich bis zum Frühling allein im Wald bleiben.“","Elif sah, wie seine langen Ohren zitterten. „Weißt du denn nicht, wo das Tor ist?“, fragte sie. Quirin schüttelte den Kopf. „Ich kenne nur einen alten Spruch“, flüsterte er. „<i>Wo der Berg zweimal steht / und kein Wind mehr weht, / da öffnet sich um Mitternacht / das Tor, vom Mondlicht bewacht.<\/i>“","„Ich helfe dir“, versprach Elif. Sie dachte angestrengt nach. Plötzlich hatte sie eine Idee. „Der Zwillingsfelsen oben im Wald hat zwei Spitzen!“, rief sie. „Er sieht aus wie ein Berg, der zweimal dasteht. Komm, ich bringe dich hin!“ Zum ersten Mal in diesen Ferien langweilte sich Elif kein bisschen."]},{"bild":"🏔️🌙","absaetze":["Atemlos kamen die beiden am Zwillingsfelsen an. Dort oben pfiff ein kalter Wind durch die Fichten. Sie suchten jede Spalte im Stein ab, doch nirgends fanden sie einen Hinweis auf ein Tor. Langsam sank die Sonne hinter die Berge. Quirin ließ die Ohren hängen. „Es ist hoffnungslos“, murmelte er.","Enttäuscht setzte sich Elif auf einen Stein. Da legte sich der Wind, und es wurde ganz still. Unten lag der See, glatt wie Glas. Im Wasser stand ein zweiter Hirschkopf, nur kopfüber. Elif sprang auf. „Der Spiegelsee!“, rief sie. „Der Zwillingsfelsen ist ja gar kein Berg. Aber dort unten steht der Hirschkopf zweimal!“","Oma Resi schlief schon tief und fest. Kurz vor Mitternacht schlich Elif mit einer Taschenlampe aus dem Haus. Quirin hüpfte dicht neben ihr her. Im Dunkeln sah Omas Garten ganz fremd aus, und jeder Ast knackte unheimlich. Elifs Knie wurden weich. Am liebsten wäre sie umgekehrt. Doch dann dachte sie an ihr Versprechen und ging weiter bis zum Steg."]},{"bild":"🌕✨","absaetze":["Genau um Mitternacht stand der Vollmond über dem Hirschkopf. Auch im See leuchtete ein Mond, direkt unter der Spitze des gespiegelten Bergs. Plötzlich zog sich eine silberne Lichtspur über das Wasser. Sie führte vom Steg bis zu einem schimmernden Tor aus Mondlicht.","„Du hast das Rätsel gelöst!“, jubelte Quirin. Er legte Elif eine Haselnuss in die Hand. Die Nuss glänzte golden. „Danke, Elif. Du bist eine echte Freundin.“ Dann hüpfte er über die Lichtspur davon. Am Tor winkte er ein letztes Mal mit einem Flügel. Einen Augenblick später waren das Tor und die Lichtspur verschwunden.","Am nächsten Morgen legte Elif die goldene Nuss auf den Frühstückstisch. Oma Resi wurde ganz still. Dann holte sie eine alte Blechdose aus dem Küchenschrank. Darin lag eine Haselnuss, die genauso golden glänzte. „Die habe ich bekommen, als ich so alt war wie du“, sagte Oma und zwinkerte. „Aber nächstes Mal weckst du mich. Dann komme ich mit.“ Elif lachte. Auf einmal freute sie sich schon auf die nächsten Ferien am Spiegelsee."]}]},"items":[{"id":"lv-spiegelsee-1","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":1,"frage":"Wo verbringt Elif ihre Herbstferien?","optionen":[{"text":"bei ihrer Oma am Spiegelsee","richtig":true},{"text":"bei ihren Freundinnen in der Stadt","richtig":false},{"text":"bei ihrer Oma in der Stadt","richtig":false},{"text":"in einem Ferienlager am Spiegelsee","richtig":false}],"tipp":"Lies die ersten Sätze von Abschnitt 1 genau.","erklaerung":"Im Text steht: „Sie wohnte eine Woche lang bei Oma Resi.“ Omas altes Bauernhaus steht direkt am Spiegelsee."},{"id":"lv-spiegelsee-2","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":1,"frage":"Warum heißt der See Spiegelsee?","optionen":[{"text":"Bei Windstille spiegelt sich der Hirschkopf darin.","richtig":true},{"text":"Bei Wind glitzert das Wasser wie ein Spiegel.","richtig":false},{"text":"Bei Vollmond spiegelt sich der Mond darin.","richtig":false},{"text":"Bei Sonne spiegelt sich Omas Haus darin.","richtig":false}],"tipp":"Oma Resi erklärt den Namen selbst. Lies in Abschnitt 1 genau, was sie über das Wasser sagt.","erklaerung":"Oma sagt: Wenn kein Wind weht, wird das Wasser ganz glatt, und der Hirschkopf spiegelt sich darin. Bei Windstille sieht man den Berg also im See."},{"id":"lv-spiegelsee-3","typ":"single","stufe":1,"kompetenz":"schliessen","abschnitt":1,"frage":"Wie fühlt sich Elif am Anfang der Geschichte?","optionen":[{"text":"gelangweilt und ein bisschen einsam","richtig":true},{"text":"neugierig und ein bisschen aufgeregt","richtig":false},{"text":"fröhlich und ein bisschen müde","richtig":false},{"text":"wütend und ein bisschen ängstlich","richtig":false}],"tipp":"Achte darauf, was Elif ganz am Anfang sagt und an wen sie denkt.","erklaerung":"Elif stöhnt, dass es langweilig ist, und sie vermisst ihre Freundinnen in der Stadt. Deshalb fühlt sie sich gelangweilt und ein bisschen einsam."},{"id":"lv-spiegelsee-4","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":1,"frage":"Am Ende von Abschnitt 1 reißt Elif die Augen auf. Warum ist sie so überrascht?","optionen":[{"text":"Sie dachte, dass es Wolpertinger nicht wirklich gibt.","richtig":true},{"text":"Sie hat Angst, dass der Wolpertinger sie gleich beißt.","richtig":false},{"text":"Sie ärgert sich, weil er sich Omas Haselnüsse nimmt.","richtig":false},{"text":"Sie erschrickt, weil das Tier so riesig und wild ist.","richtig":false}],"tipp":"Lies den letzten Satz von Abschnitt 1. Woher kannte Elif Wolpertinger bis dahin?","erklaerung":"Elif kannte Wolpertinger bis dahin nur aus Omas Geschichten. Sie hat also geglaubt, dass es sie gar nicht wirklich gibt – und nun sitzt einer vor ihr und spricht sogar."},{"id":"lv-spiegelsee-5","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":2,"frage":"Warum hat Quirin das Nebeltal verlassen?","optionen":[{"text":"Er wollte Haselnüsse für den Winter sammeln.","richtig":true},{"text":"Er wollte das Tor zum Nebeltal suchen.","richtig":false},{"text":"Er wollte den Spiegelsee einmal sehen.","richtig":false},{"text":"Er wollte Brennholz für den Winter holen.","richtig":false}],"tipp":"Quirin erzählt es gleich am Anfang von Abschnitt 2.","erklaerung":"Quirin sagt: „Gestern wollte ich Haselnüsse für den Winter sammeln.“ Dabei hat er sich verlaufen."},{"id":"lv-spiegelsee-6","typ":"single","stufe":2,"kompetenz":"entnehmen","abschnitt":2,"frage":"Wann öffnet sich das Tor zum Nebeltal?","optionen":[{"text":"in Vollmondnächten um Mitternacht","richtig":true},{"text":"in jeder Nacht um Mitternacht","richtig":false},{"text":"in Vollmondnächten bei Sonnenuntergang","richtig":false},{"text":"in jeder Nacht bei Sonnenuntergang","richtig":false}],"tipp":"Du brauchst zwei Stellen aus Abschnitt 2: was Quirin über das Tor erzählt und was im alten Spruch steht.","erklaerung":"Quirin erzählt, dass sich das Tor nur in Vollmondnächten öffnet. Im Spruch heißt es: „da öffnet sich um Mitternacht / das Tor“."},{"id":"lv-spiegelsee-7","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":2,"frage":"Elif sieht, wie Quirins lange Ohren zittern. Was zeigt das?","optionen":[{"text":"Quirin hat Angst, nicht mehr nach Hause zu kommen.","richtig":true},{"text":"Quirin friert, weil es im Schuppen kalt ist.","richtig":false},{"text":"Quirin ist wütend, weil Elif ihn entdeckt hat.","richtig":false},{"text":"Quirin freut sich, weil er Elif getroffen hat.","richtig":false}],"tipp":"Lies, was Quirin direkt davor erzählt. Was passiert, wenn er das Tor nicht findet?","erklaerung":"Quirin hat gerade erzählt, dass er sonst bis zum Frühling allein im Wald bleiben muss. Seine zitternden Ohren zeigen, dass er große Angst hat, nicht mehr heimzukommen."},{"id":"lv-spiegelsee-8","typ":"single","stufe":2,"kompetenz":"entnehmen","abschnitt":2,"frage":"Warum glaubt Elif, das Tor sei am Zwillingsfelsen?","optionen":[{"text":"Der Felsen hat zwei Spitzen wie zwei Berge.","richtig":true},{"text":"Dort hat Quirin die Haselnüsse gesammelt.","richtig":false},{"text":"Dort oben weht niemals ein Wind.","richtig":false},{"text":"Oma hat ihr dort einmal ein Tor gezeigt.","richtig":false}],"tipp":"Vergleiche, was Elif über den Zwillingsfelsen sagt, mit der ersten Zeile des Spruchs.","erklaerung":"Im Spruch heißt es: „Wo der Berg zweimal steht“. Elif denkt, damit sei der Zwillingsfelsen gemeint, weil er zwei Spitzen hat und aussieht wie ein Berg, der zweimal dasteht."},{"id":"lv-spiegelsee-9","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":3,"frage":"Am Zwillingsfelsen murmelt Quirin: „Es ist hoffnungslos.“ Warum denkt er das?","optionen":[{"text":"Sie finden keinen Hinweis auf das Tor, und die Sonne geht schon unter.","richtig":true},{"text":"Sie finden keinen Hinweis auf das Tor, und Elif will nach Hause gehen.","richtig":false},{"text":"Sie haben sich im Wald verlaufen, und es wird schon dunkel.","richtig":false},{"text":"Der Wind ist zu kalt, und Quirin kann nicht mehr fliegen.","richtig":false}],"tipp":"Lies den Anfang von Abschnitt 3 genau. Denk daran, bis wann sie das Tor finden müssen.","erklaerung":"Die beiden suchen jede Spalte im Felsen ab, finden aber keinen Hinweis auf das Tor. Dabei sinkt schon die Sonne – und das Tor öffnet sich nur noch heute Nacht."},{"id":"lv-spiegelsee-10","typ":"single","stufe":3,"kompetenz":"schliessen","abschnitt":3,"frage":"Warum ist es so wichtig, dass sich der Wind legt?","optionen":[{"text":"Nur ohne Wind spiegelt sich der Berg im Wasser.","richtig":true},{"text":"Nur ohne Wind kann Quirin seine Flügel benutzen.","richtig":false},{"text":"Nur ohne Wind finden sie den Weg nach Hause.","richtig":false},{"text":"Nur ohne Wind kann Elif den Mond sehen.","richtig":false}],"tipp":"Denk an das, was Oma Resi in Abschnitt 1 über den See erzählt hat.","erklaerung":"Oma hat erklärt: Nur wenn kein Wind weht, wird das Wasser glatt, und der Hirschkopf spiegelt sich darin. Erst als sich der Wind legt, sieht Elif den Berg zweimal – und versteht den Spruch."},{"id":"lv-spiegelsee-11","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":3,"frage":"Kurz vor Mitternacht <i>schlich<\/i> Elif aus dem Haus. Was bedeutet das?","optionen":[{"text":"Sie ging ganz leise, damit niemand sie hörte.","richtig":true},{"text":"Sie rannte schnell, weil es schon spät war.","richtig":false},{"text":"Sie ging langsam, weil sie sehr müde war.","richtig":false},{"text":"Sie hüpfte fröhlich, weil sie sich freute.","richtig":false}],"tipp":"Denk daran, zu welcher Uhrzeit Elif das Haus verlässt und wer dort schläft.","erklaerung":"„Schleichen“ heißt, ganz leise und vorsichtig zu gehen, damit man nicht bemerkt wird. Oma Resi schläft schon tief und fest, und Elif will sie nicht wecken."},{"id":"lv-spiegelsee-12","typ":"single","stufe":3,"kompetenz":"reflektieren","abschnitt":3,"frage":"Am Ende von Abschnitt 3 knackt jeder Ast unheimlich, und Elifs Knie werden weich. Warum erzählt die Geschichte das so genau?","optionen":[{"text":"Man soll spüren, wie viel Mut Elif jetzt braucht.","richtig":true},{"text":"Man soll erfahren, wie groß Omas Garten ist.","richtig":false},{"text":"Man soll merken, dass Elif keine Lust mehr hat.","richtig":false},{"text":"Man soll ahnen, dass Elif gleich umkehren wird.","richtig":false}],"tipp":"Überlege, wie es dir beim Lesen dieser Stelle geht – und was Elif danach trotzdem tut.","erklaerung":"Die unheimlichen Geräusche und die weichen Knie zeigen, wie viel Angst Elif hat. So merkt man, wie mutig es ist, dass sie trotzdem bis zum Steg weitergeht."},{"id":"lv-spiegelsee-13","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":4,"frage":"Plötzlich zieht sich eine Lichtspur über das Wasser. Warum gerade in diesem Augenblick?","optionen":[{"text":"Jetzt ist es Mitternacht, und der Vollmond steht über dem Hirschkopf.","richtig":true},{"text":"Jetzt leuchtet Elif mit ihrer Taschenlampe auf das Wasser.","richtig":false},{"text":"Jetzt sagt Quirin den alten Spruch noch einmal laut auf.","richtig":false},{"text":"Jetzt winkt Quirin Elif zum Abschied mit einem Flügel zu.","richtig":false}],"tipp":"Lies den ersten Satz von Abschnitt 4. Vergleiche ihn mit dem alten Spruch aus Abschnitt 2.","erklaerung":"Im Text steht: „Genau um Mitternacht stand der Vollmond über dem Hirschkopf.“ Im alten Spruch heißt es: „da öffnet sich um Mitternacht / das Tor“. Darum erscheint gerade jetzt die Lichtspur."},{"id":"lv-spiegelsee-14","typ":"single","stufe":2,"kompetenz":"entnehmen","abschnitt":4,"frage":"Wo erscheint das Tor zum Nebeltal?","optionen":[{"text":"am Ende einer Lichtspur auf dem See","richtig":true},{"text":"am Anfang einer Lichtspur direkt am Steg","richtig":false},{"text":"oben auf der Spitze des Hirschkopfs","richtig":false},{"text":"zwischen den Spitzen des Zwillingsfelsens","richtig":false}],"tipp":"Lies den Anfang von Abschnitt 4 Satz für Satz. Achte darauf, wo das Tor beschrieben wird.","erklaerung":"Eine silberne Lichtspur führt vom Steg über das Wasser bis zu einem schimmernden Tor aus Mondlicht. Das Tor liegt also am Ende der Lichtspur auf dem See."},{"id":"lv-spiegelsee-15","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":4,"frage":"Was schenkt Quirin Elif zum Abschied?","optionen":[{"text":"eine goldene Haselnuss","richtig":true},{"text":"eine silberne Haselnuss","richtig":false},{"text":"eine goldene Feder","richtig":false},{"text":"eine silberne Feder","richtig":false}],"tipp":"Lies in Abschnitt 4, was Quirin Elif in die Hand legt.","erklaerung":"Quirin legt Elif eine Haselnuss in die Hand. Die Nuss glänzt golden."},{"id":"lv-spiegelsee-16","typ":"single","stufe":3,"kompetenz":"schliessen","abschnitt":4,"frage":"Oma Resi zeigt Elif, was in ihrer alten Blechdose liegt, und zwinkert. Was verrät sie Elif damit?","optionen":[{"text":"Sie hat als Kind auch einem Wolpertinger geholfen.","richtig":true},{"text":"Sie hat als Kind auch Haselnüsse für den Winter gesammelt.","richtig":false},{"text":"Sie hat die Nuss für Elif heimlich im Schuppen versteckt.","richtig":false},{"text":"Sie will Elifs Nuss in ihrer Blechdose aufheben.","richtig":false}],"tipp":"Lies genau, was Oma über ihre eigene Nuss sagt. Überlege dann, wofür Elif ihre Nuss bekommen hat.","erklaerung":"Oma hat ihre Nuss bekommen, als sie so alt war wie Elif. Elif hat ihre Nuss von Quirin als Dank für ihre Hilfe bekommen. Mit dem Zwinkern verrät Oma, dass sie als Kind dasselbe erlebt hat."},{"id":"lv-spiegelsee-17","typ":"single","stufe":2,"kompetenz":"reflektieren","abschnitt":0,"frage":"Welche andere Überschrift würde auch gut zur ganzen Geschichte passen?","optionen":[{"text":"Das Rätsel vom Spiegelsee","richtig":true},{"text":"Langeweile bei Oma Resi","richtig":false},{"text":"Der Wind am Zwillingsfelsen","richtig":false},{"text":"Haselnüsse für den Winter","richtig":false}],"tipp":"Eine gute Überschrift passt zur ganzen Geschichte, nicht nur zu einem Teil davon.","erklaerung":"In der ganzen Geschichte geht es darum, das Rätsel des alten Spruchs zu lösen – und die Lösung liegt im Spiegelsee. Die anderen Überschriften passen nur zu einzelnen Stellen."},{"id":"lv-spiegelsee-18","typ":"single","stufe":3,"kompetenz":"schliessen","abschnitt":0,"frage":"Wie verändert sich Elif im Lauf der Geschichte?","optionen":[{"text":"Erst langweilt sie sich, am Ende freut sie sich auf die nächsten Ferien.","richtig":true},{"text":"Erst langweilt sie sich, am Ende ist sie traurig, weil Quirin fort ist.","richtig":false},{"text":"Erst ist sie ängstlich, am Ende freut sie sich auf die nächsten Ferien.","richtig":false},{"text":"Erst ist sie ängstlich, am Ende ist sie traurig, weil Quirin fort ist.","richtig":false}],"tipp":"Vergleiche den ersten Satz von Abschnitt 1 mit den letzten Sätzen von Abschnitt 4. Prüfe bei jeder Antwort beide Hälften.","erklaerung":"Am Anfang stöhnt Elif, dass es am See langweilig ist. Am Ende lacht sie und freut sich schon auf die nächsten Ferien am Spiegelsee."},{"id":"lv-spiegelsee-19","typ":"single","stufe":3,"kompetenz":"reflektieren","abschnitt":0,"frage":"Wer erzählt diese Geschichte?","optionen":[{"text":"Ein Erzähler berichtet, was Elif erlebt.","richtig":true},{"text":"Elif erzählt selbst, was sie erlebt hat.","richtig":false},{"text":"Quirin erzählt, was er mit Elif erlebt.","richtig":false},{"text":"Oma Resi erzählt, was sie als Kind erlebt hat.","richtig":false}],"tipp":"Lies einen Absatz und lass die wörtliche Rede weg. Mit welchem Wort ist dort von Elif die Rede?","erklaerung":"Außerhalb der wörtlichen Rede steht für Elif immer „Elif“ oder „sie“, nie „ich“. Ein Erzähler berichtet also, was Elif erlebt. Er verrät auch ihre Gefühle, etwa wenn ihre Knie weich werden."},{"id":"lv-spiegelsee-20","typ":"single","stufe":3,"kompetenz":"reflektieren","abschnitt":0,"frage":"Welche Botschaft passt am besten zu der Geschichte?","optionen":[{"text":"Mut und Freundschaft helfen, schwierige Probleme zu lösen.","richtig":true},{"text":"Alte Sprüche verraten immer sofort, wo man suchen muss.","richtig":false},{"text":"Ein schwieriges Rätsel löst man am besten ganz allein.","richtig":false},{"text":"Wer genau hinschaut, findet die Lösung schon beim ersten Versuch.","richtig":false}],"tipp":"Überlege, was Elif und Quirin am Ende ans Ziel gebracht hat.","erklaerung":"Elif hilft Quirin, obwohl sie ihn gerade erst kennt. Nach dem Irrtum am Zwillingsfelsen gibt sie nicht auf und überwindet später ihre Angst im Dunkeln. Erst mit Mut und Freundschaft finden die beiden das Tor – nicht allein und nicht beim ersten Versuch."}]},{"id":"lv-staffellauf","titel":"Die halbe Wahrheit","textsorte":"Geschichte","format":"bylet-v","einleitung":"Zeynep freut sich riesig auf den Staffellauf beim Sommerfest – doch dann kommt alles ganz anders.","text":{"titel":"Die halbe Wahrheit","abschnitte":[{"bild":"🏅🩹","absaetze":["Noch zwei Wochen bis zum Sommerfest! Zeynep hatte den Tag im Kalender rot umkringelt. Beim Fest der Grundschule am Lindenanger gab es jedes Jahr einen Staffellauf. Aus den vierten Klassen liefen je vier Kinder nacheinander eine Runde um den Sportplatz. Zeynep sollte für die 4b die letzte Runde laufen. Darauf war sie mächtig stolz.","Seit Wochen übte sie mit ihrer besten Freundin Ronja auf der Wiese hinter dem Feuerwehrhaus. Am wichtigsten war der Wechsel, bei dem Ronja ihr den Staffelstab übergab. Dabei durfte keine von beiden langsamer werden. „Nicht zurückschauen!“, erklärte Zeynep. „Man streckt die Hand nach hinten und vertraut darauf, dass der Stab kommt.“","Doch am Montag knickte Zeynep auf der Schultreppe um. Die Ärztin legte ihr eine Schiene um den Knöchel und sagte: „Drei Wochen kein Sport.“ Zeynep schluckte. Drei Wochen – das hieß: kein Staffellauf.","Am nächsten Morgen bestimmte Frau Lindner, dass Valentin die letzte Runde laufen sollte. Zeynep starrte auf ihre Krücken. Ronja drückte Zeynep unter dem Tisch die Hand. „Wir finden eine Lösung“, flüsterte sie."]},{"bild":"🤫👂","absaetze":["In den nächsten Tagen benahm sich Ronja seltsam. Nach der Schule hatte sie es plötzlich immer eilig. Am Dienstag musste sie angeblich zum Zahnarzt. Am Mittwoch wollte sie ihrer Tante beim Umzug helfen. Am Donnerstag hatte sie grüne Farbe an den Fingern. „Kunst-Hausaufgabe“, murmelte sie. Dabei hatte Frau Lindner in Kunst gar keine Hausaufgabe gegeben.","Auch in der Pause war etwas anders. Ronja stand oft mit Valentin am Klettergerüst. Die beiden steckten die Köpfe zusammen und tuschelten. Sobald Zeynep auf ihren Krücken herankam, verstummten sie. Valentin wurde rot und lief weg.","Am Freitag holte Zeynep ihre Jacke von der Garderobe im Flur. Durch die halb offene Tür des Klassenzimmers sah sie Ronja und Valentin. „Zeynep darf auf keinen Fall etwas merken“, sagte Ronja gerade. „Sonst …“ In diesem Moment schrillte die Schulglocke, und der Rest ging im Lärm unter.","Zeynep stand wie angewurzelt da. Ihr wurde heiß und kalt. Ronja hatte ein Geheimnis mit Valentin, und ausgerechnet Zeynep durfte nichts davon wissen. Wollte Ronja jetzt lieber mit ihm befreundet sein?"]},{"bild":"👵🍵","absaetze":["In der nächsten Woche ging Zeynep ihrer Freundin aus dem Weg. In der Pause setzte sie sich allein auf die Bank am Schulgarten. Ihre Brotzeit rührte sie kaum an. Als Ronja sich zu ihr setzen wollte, drehte Zeynep den Kopf weg. „Geh doch zu Valentin!“, sagte sie spitz. Ronja öffnete den Mund, dann ging sie wortlos davon. Ihre Augen glänzten.","Am Abend saß Zeynep bei Oma Gül in der Küche und erzählte alles. Oma hörte zu und nippte an ihrem Tee. „Weißt du“, sagte sie schließlich, „wer nur den Anfang eines Satzes hört, kennt höchstens die halbe Wahrheit. Frag Ronja doch einfach!“","Zeynep verschränkte die Arme. Fragen? Dann würde Ronja ja merken, dass sie gelauscht hatte! Außerdem war Ronja schuld, fand Zeynep. Ronja sollte sich zuerst entschuldigen!","Dann kam der Samstag des Sommerfests. Zeynep wäre am liebsten zu Hause geblieben. Aber Mama meinte, die Klasse zähle auf sie. Also humpelte Zeynep zum Sportplatz und setzte sich an den Rand der Zuschauerbank. Von Ronja und Valentin war nichts zu sehen."]},{"bild":"🏁🎉","absaetze":["Vor dem Start klopfte Frau Lindner ans Mikrofon. „Die 4b hat eine Überraschung“, sagte sie. Ronja und Valentin rollten ein riesiges Plakat aus. Darauf stand in grünen Buchstaben: „Zeynep – unsere beste Trainerin!“","„Du hast mir den Wechsel beigebracht, ich habe ihn Valentin gezeigt“, rief Ronja. „Deshalb darfst du heute das Startsignal geben.“ Valentin reichte Zeynep eine rote Fahne. „Das Plakat haben wir in Papas Garage gemalt“, verriet er grinsend.","Zeyneps Gesicht glühte. Auf einmal passte alles zusammen: die grüne Farbe, das Tuscheln, der halbe Satz an der Tür. Sie schwenkte die Fahne, und die Läufer stürmten los. Beim letzten Wechsel streckte Valentin die Hand nach hinten, ohne zurückzuschauen. Ronja drückte ihm den Stab in die Hand. Die 4b gewann knapp.","Danach humpelte Zeynep zu Ronja. „Es tut mir leid“, flüsterte sie. „Ich habe dich an der Tür gehört und gedacht, du willst nicht mehr meine Freundin sein.“ Ronja staunte und lachte. „Ich habe gesagt: ‚Sonst ist die Überraschung kaputt!‘“ Die beiden umarmten sich so fest, dass eine Krücke umfiel."]}]},"items":[{"id":"lv-staffellauf-1","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":1,"frage":"Welche Runde sollte Zeynep eigentlich für die 4b laufen?","optionen":[{"text":"die letzte Runde","richtig":true},{"text":"die erste Runde","richtig":false},{"text":"die zweite Runde","richtig":false},{"text":"die dritte Runde","richtig":false}],"tipp":"Lies den Anfang von Abschnitt 1. Dort steht, worauf Zeynep so stolz ist.","erklaerung":"Im Text steht: „Zeynep sollte für die 4b die letzte Runde laufen.“ Darauf ist sie mächtig stolz."},{"id":"lv-staffellauf-2","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":1,"frage":"Was ist beim Training von Zeynep und Ronja am wichtigsten?","optionen":[{"text":"der Wechsel mit dem Staffelstab","richtig":true},{"text":"der schnelle Start am Feuerwehrhaus","richtig":false},{"text":"das Laufen in der letzten Runde","richtig":false},{"text":"das Tempo auf der ganzen Runde","richtig":false}],"tipp":"Suche in Abschnitt 1 das Wort „wichtigsten“.","erklaerung":"Im Text steht: „Am wichtigsten war der Wechsel, bei dem Ronja ihr den Staffelstab übergab.“"},{"id":"lv-staffellauf-3","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":1,"frage":"Warum schluckt Zeynep, nachdem die Ärztin mit ihr gesprochen hat?","optionen":[{"text":"Sie begreift, dass der Staffellauf für sie ausfällt.","richtig":true},{"text":"Die Schiene an ihrem Knöchel drückt beim Anlegen.","richtig":false},{"text":"Sie hat Angst, wieder auf der Schultreppe umzuknicken.","richtig":false},{"text":"Sie ist erleichtert, dass es nur drei Wochen sind.","richtig":false}],"tipp":"Denke an den Anfang von Abschnitt 1: Wie lange dauert es noch bis zum Sommerfest? Vergleiche das mit dem, was die Ärztin sagt.","erklaerung":"Gleich danach steht: „Drei Wochen – das hieß: kein Staffellauf.“ Das Sommerfest findet statt, bevor die drei Wochen um sind. Darum darf Zeynep nicht mitlaufen und ist enttäuscht."},{"id":"lv-staffellauf-4","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":1,"frage":"Ronja flüstert: „Wir finden eine Lösung.“ Was will sie Zeynep damit zeigen?","optionen":[{"text":"Sie hält zu Zeynep und will ihr helfen.","richtig":true},{"text":"Sie glaubt, dass Zeyneps Fuß bis zum Fest heilt.","richtig":false},{"text":"Sie findet, dass Valentin ein guter Ersatz ist.","richtig":false},{"text":"Sie möchte selbst die letzte Runde laufen.","richtig":false}],"tipp":"Lies das Ende von Abschnitt 1. Wie geht es Zeynep gerade, und was tut Ronja, bevor sie flüstert?","erklaerung":"Zeynep starrt traurig auf ihre Krücken. Ronja drückt ihr die Hand und macht ihr Mut: Sie steht ihrer Freundin bei und will mit ihr einen Ausweg suchen. Dass Zeynep doch laufen kann, glaubt Ronja nicht – die Ärztin hat ja drei Wochen Sport verboten."},{"id":"lv-staffellauf-5","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":2,"frage":"Was hat Ronja am Donnerstag an den Fingern?","optionen":[{"text":"grüne Farbe","richtig":true},{"text":"rote Farbe","richtig":false},{"text":"rote Kreide","richtig":false},{"text":"grüne Kreide","richtig":false}],"tipp":"Lies den ersten Teil von Abschnitt 2. Dort werden die Tage nacheinander genannt.","erklaerung":"Im Text steht: „Am Donnerstag hatte sie grüne Farbe an den Fingern.“"},{"id":"lv-staffellauf-6","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":2,"frage":"Ronja murmelt: „Kunst-Hausaufgabe.“ Was zeigt dir der nächste Satz im Text?","optionen":[{"text":"Ronjas Erklärung mit der Hausaufgabe stimmt nicht.","richtig":true},{"text":"Ronja hat die Hausaufgabe in Kunst vergessen.","richtig":false},{"text":"In Kunst sollten alle mit grüner Farbe malen.","richtig":false},{"text":"Frau Lindner hat die Hausaufgabe schon eingesammelt.","richtig":false}],"tipp":"Suche in Abschnitt 2 die Stelle mit der grünen Farbe. Was erfährst du im Satz nach „murmelte sie“ über Hausaufgaben in Kunst?","erklaerung":"Im nächsten Satz steht, dass Frau Lindner in Kunst gar keine Hausaufgabe gegeben hat. Also kann die Farbe nicht von einer Hausaufgabe kommen – Ronjas Erklärung stimmt nicht, sie verschweigt etwas."},{"id":"lv-staffellauf-7","typ":"single","stufe":2,"kompetenz":"entnehmen","abschnitt":2,"frage":"Was passiert in der Pause, wenn Zeynep zu Ronja und Valentin kommt?","optionen":[{"text":"Die beiden hören auf zu reden.","richtig":true},{"text":"Valentin hilft ihr mit den Krücken.","richtig":false},{"text":"Ronja winkt sie zum Klettergerüst.","richtig":false},{"text":"Die beiden laufen zusammen weg.","richtig":false}],"tipp":"In Abschnitt 2 geht es in einem Teil um die Pause. Lies dort genau, was die beiden tun, sobald Zeynep herankommt.","erklaerung":"Im Text steht: „Sobald Zeynep auf ihren Krücken herankam, verstummten sie.“ Verstummen heißt: aufhören zu reden. Nur Valentin läuft danach weg, Ronja nicht."},{"id":"lv-staffellauf-8","typ":"single","stufe":3,"kompetenz":"schliessen","abschnitt":2,"frage":"Zeynep steht „wie angewurzelt“ da, und ihr wird „heiß und kalt“. Was bedeutet das?","optionen":[{"text":"Sie ist so erschrocken, dass sie sich nicht rühren kann.","richtig":true},{"text":"Sie friert, weil sie ihre Jacke noch nicht angezogen hat.","richtig":false},{"text":"Sie hat sich an ihrem Knöchel wieder wehgetan.","richtig":false},{"text":"Sie ärgert sich, weil die Schulglocke so laut ist.","richtig":false}],"tipp":"Die Wörter sind nicht wörtlich gemeint. Überlege, was Zeynep am Ende von Abschnitt 2 gerade gehört hat.","erklaerung":"Zeynep hat gehört, dass sie von Ronjas Geheimnis nichts merken darf. Sie erschrickt so sehr, dass sie sich nicht bewegen kann. Dass ihr heiß und kalt wird, zeigt, wie aufgewühlt sie ist – mit Frieren hat das nichts zu tun."},{"id":"lv-staffellauf-9","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":3,"frage":"Wo verbringt Zeynep in der nächsten Woche die Pause?","optionen":[{"text":"allein auf der Bank am Schulgarten","richtig":true},{"text":"mit Ronja auf der Bank am Schulgarten","richtig":false},{"text":"allein am Klettergerüst","richtig":false},{"text":"mit Valentin am Klettergerüst","richtig":false}],"tipp":"Lies den Anfang von Abschnitt 3.","erklaerung":"Im Text steht: „In der Pause setzte sie sich allein auf die Bank am Schulgarten.“ Als Ronja sich dazusetzen will, dreht Zeynep den Kopf weg."},{"id":"lv-staffellauf-10","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":3,"frage":"Warum sagt Zeynep spitz zu Ronja: „Geh doch zu Valentin!“?","optionen":[{"text":"Sie ist gekränkt wegen Ronjas Geheimnis.","richtig":true},{"text":"Sie möchte, dass Ronja mit Valentin trainiert.","richtig":false},{"text":"Sie will in Ruhe ihre Brotzeit essen.","richtig":false},{"text":"Sie hat gesehen, dass Valentin Ronja sucht.","richtig":false}],"tipp":"Denke an das Ende von Abschnitt 2. Was glaubt Zeynep seitdem über Ronja und Valentin?","erklaerung":"Zeynep glaubt, dass Ronja lieber mit Valentin befreundet sein will. Darum ist sie verletzt und schickt Ronja mit spitzen Worten weg."},{"id":"lv-staffellauf-11","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":3,"frage":"Ronja geht wortlos davon, und ihre Augen glänzen. Wie fühlt sie sich?","optionen":[{"text":"Sie ist traurig über Zeyneps harte Worte.","richtig":true},{"text":"Sie ist erleichtert, weil Zeynep nichts gemerkt hat.","richtig":false},{"text":"Sie ist wütend, weil Zeynep gelauscht hat.","richtig":false},{"text":"Sie freut sich, weil sie jetzt zu Valentin gehen kann.","richtig":false}],"tipp":"Lies den ersten Teil von Abschnitt 3. Überlege, was gerade passiert ist und was glänzende Augen hier bedeuten.","erklaerung":"Zeynep hat Ronja spitz weggeschickt. Ronja geht ohne ein Wort, und ihre Augen glänzen, weil sie mit den Tränen kämpft. Dass Zeynep gelauscht hat, weiß Ronja gar nicht."},{"id":"lv-staffellauf-12","typ":"single","stufe":3,"kompetenz":"reflektieren","abschnitt":3,"frage":"Zeynep findet, Ronja solle sich zuerst entschuldigen. Welche Meinung dazu kannst du mit dem Text am besten begründen?","optionen":[{"text":"Das ist ungerecht, denn Zeynep weiß nicht, ob Ronja etwas falsch gemacht hat.","richtig":true},{"text":"Das ist gerecht, denn Ronja hat zugegeben, dass sie Valentin lieber mag.","richtig":false},{"text":"Das ist gerecht, denn Ronja wollte sich nicht mehr zu Zeynep auf die Bank setzen.","richtig":false},{"text":"Das ist ungerecht, denn Ronja hat sich schon bei Zeynep entschuldigt.","richtig":false}],"tipp":"Prüfe bei jeder Antwort, ob die Begründung wirklich in Abschnitt 2 oder 3 steht. Was weiß Zeynep sicher, und was vermutet sie nur?","erklaerung":"Zeynep hat nur den Anfang von Ronjas Satz gehört und vermutet bloß, dass Ronja sie nicht mehr mag. Sie weiß also gar nicht, ob Ronja etwas falsch gemacht hat. Ronja hat nichts zugegeben und wollte sich sogar zu Zeynep setzen – entschuldigt hat sie sich aber nicht, sie ging wortlos davon."},{"id":"lv-staffellauf-13","typ":"single","stufe":1,"kompetenz":"entnehmen","abschnitt":4,"frage":"Welche Aufgabe bekommt Zeynep beim Staffellauf?","optionen":[{"text":"Sie gibt mit einer Fahne das Startsignal.","richtig":true},{"text":"Sie läuft trotz Schiene die letzte Runde.","richtig":false},{"text":"Sie hält am Ziel das große Plakat hoch.","richtig":false},{"text":"Sie sagt die Läufer am Mikrofon an.","richtig":false}],"tipp":"Lies in Abschnitt 4, was Ronja und Valentin zu Zeynep sagen und was Valentin ihr reicht.","erklaerung":"Ronja sagt: „Deshalb darfst du heute das Startsignal geben.“ Valentin reicht Zeynep dafür eine rote Fahne, und sie schwenkt sie zum Start."},{"id":"lv-staffellauf-14","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":4,"frage":"Woher hatte Ronja die grüne Farbe an den Fingern?","optionen":[{"text":"Sie hatte mit Valentin das Plakat gemalt.","richtig":true},{"text":"Sie hatte ihrer Tante beim Umzug geholfen.","richtig":false},{"text":"Sie hatte eine Kunst-Hausaufgabe gemacht.","richtig":false},{"text":"Sie hatte die Fahne für den Start bemalt.","richtig":false}],"tipp":"Vergleiche Abschnitt 2 mit Abschnitt 4. Achte in Abschnitt 4 darauf, welche Farben vorkommen und wozu sie gehören.","erklaerung":"Auf dem Plakat stehen grüne Buchstaben, und Valentin verrät, dass sie es in der Garage gemalt haben. Die Fahne ist rot, und eine Kunst-Hausaufgabe gab es gar nicht."},{"id":"lv-staffellauf-15","typ":"single","stufe":2,"kompetenz":"schliessen","abschnitt":4,"frage":"Als Zeynep von der Überraschung erfährt, glüht ihr Gesicht. Wie fühlt sie sich?","optionen":[{"text":"Sie ist gerührt und schämt sich für ihren Verdacht.","richtig":true},{"text":"Sie ist wütend und fühlt sich von Ronja ausgeschlossen.","richtig":false},{"text":"Sie ist enttäuscht und wäre lieber selbst gelaufen.","richtig":false},{"text":"Sie ist erschöpft und hat vom Humpeln Schmerzen.","richtig":false}],"tipp":"Lies in Abschnitt 4, was Zeynep „auf einmal“ versteht. Achte auch darauf, was sie nach dem Lauf zu Ronja sagt.","erklaerung":"Zeynep merkt, dass ihre Freunde heimlich etwas Schönes für sie vorbereitet haben. Das rührt sie, und gleichzeitig schämt sie sich für ihren Verdacht – darum entschuldigt sie sich später bei Ronja. Mit Wut, Enttäuschung oder Schmerzen hat das Glühen nichts zu tun."},{"id":"lv-staffellauf-16","typ":"single","stufe":3,"kompetenz":"reflektieren","abschnitt":4,"frage":"Beim letzten Wechsel streckt Valentin die Hand nach hinten, ohne zurückzuschauen. Warum wird diese Einzelheit erzählt?","optionen":[{"text":"Sie zeigt, dass Zeyneps Tipp beim Sieg der 4b hilft.","richtig":true},{"text":"Sie zeigt, dass Valentin Ronja beim Wechsel nicht vertraut.","richtig":false},{"text":"Sie erklärt, warum die 4b beinahe verloren hätte.","richtig":false},{"text":"Sie zeigt, dass Valentin lieber allein trainiert hat.","richtig":false}],"tipp":"Erinnere dich an das Training in Abschnitt 1. Was hat Zeynep Ronja dort erklärt?","erklaerung":"In Abschnitt 1 erklärt Zeynep: „Nicht zurückschauen!“ Ronja hat das an Valentin weitergegeben. So wird klar, dass Zeynep als Trainerin zum Sieg beigetragen hat, obwohl sie nicht mitlaufen konnte."},{"id":"lv-staffellauf-17","typ":"single","stufe":3,"kompetenz":"reflektieren","abschnitt":0,"frage":"Warum passt der Titel „Die halbe Wahrheit“ am besten zu dieser Geschichte?","optionen":[{"text":"Zeynep hört nur einen halben Satz, doch dahinter steckt eine Überraschung für sie.","richtig":true},{"text":"Zeynep hört nur einen halben Satz, und dahinter steckt, dass Ronja sie nicht mehr mag.","richtig":false},{"text":"Zeynep erzählt Oma Gül nur die Hälfte von dem, was in der Schule passiert ist.","richtig":false},{"text":"Valentin hat den Wechsel für den Staffellauf nur zur Hälfte gelernt.","richtig":false}],"tipp":"Denke an den Satz, den Zeynep in Abschnitt 2 an der Tür hört, und daran, wie e
